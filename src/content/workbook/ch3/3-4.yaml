      adapted: true

  - id: W-3.4-c2
    stars: 1
    objectives: [OBJ-3.4-1, OBJ-3.4-2, OBJ-3.4-3]
    prompt: >-
      תהי $h:(-2,2)\to[0,\infty)$ מסדר $C^2$, ו-$$U(x,y)=\big(x,\ h(x)\cos y,\ h(x)\sin y\big)$$ על $(-2,2)\times\mathbb R$: משטח הסיבוב של
      הגרף של $h$ סביב ציר $x$.

      (א) חשבו את התבנית הראשונה של $U$, וקבעו באילו נקודות $U$ רגולרית.

      (ב) עבור $h(x)=x^2$, חשבו את אורכי המסילות $U(\phi(t))$, $0\le t\le1$, כש-$\phi(t)=(t,0)$ וכש-$\phi(t)=(0,t)$.

      (ג) הסבירו למה התוצאה השנייה ב-(ב) אינה סותרת את משפט 3.4.5.
    answer: >-
      (א) $E=1+h'^2$, $F=0$, $G=h^2$; רגולרית בדיוק כש-$h(x)>0$. (ב) $$\frac{\sqrt5}2+\frac14\operatorname{arcsinh}2\approx1.4789$$ ו-$0$.
      (ג) $c(t)=(0,t)$ היא מסילה מסדר $C^1$ בתחום, והנוסחה נותנת $\int\sqrt{G(0,t)}\,dt=0$: התמונה נקודה אחת.
    solution:
      - kind: computation
        text: >-
          (א) $U_x=(1,\ h'\cos y,\ h'\sin y)$ ו-$U_y=(0,\ -h\sin y,\ h\cos y)$. לכן $E=1+h'^2$, $$F=-hh'\sin y\cos y+hh'\sin y\cos y=0$$,
          $G=h^2$.
      - kind: step
        text: >-
          $EG-F^2=(1+h'^2)h^2$, וזה חיובי אם ורק אם $h(x)\ne0$, כלומר $h(x)>0$. לפי טענה 3.4.2(ב) ולמה 3.1.2, $U$ רגולרית
          בדיוק בנקודות שבהן $h(x)>0$.
      - kind: computation
        text: >-
          (ב) $\phi(t)=(t,0)$: $x'=1$, $y'=0$, $\|\gamma'\|=\sqrt{E}=\sqrt{1+4t^2}$, ו-
          $$L=\int_0^1\sqrt{1+4t^2}\,dt=\Big[\tfrac t2\sqrt{1+4t^2}+\tfrac14\operatorname{arcsinh}(2t)\Big]_0^1=\tfrac{\sqrt5}2+\tfrac14\operatorname{arcsinh}2\approx1.4789.$$
      - kind: computation
        text: >-
          $\phi(t)=(0,t)$: $x'=0$, $y'=1$, $\|\gamma'\|=\sqrt{G(0,t)}=h(0)=0$, ולכן $L=0$. ישירות: $U(0,t)=(0,0,0)$ לכל $t$.
      - kind: step
        text: >-
          (ג) משפט 3.4.5(א) דורש רק ש-$U$ ו-$c$ יהיו מסדר $C^1$, לא רגולריות; לכן הנוסחה תקפה גם כאן ונותנת $0$. ה"מסילה"
          היא נקודה, כי לאורך $x=0$ הפרמטריזציה מכווצת קו שלם לנקודה, כמו קוטב הספרה: זה מה ש-$G=0$ מבטא. האורך $1$ של
          הקטע בתחום הפרמטרים אינו אומר כלום על המשטח.
      - kind: check
        text: >-
          (ב) ישירות: $U(t,0)=(t,\ t^2,\ 0)$, הפרבולה, ואורכה מ-$0$ עד $1$ הוא $1.47894$ גם בסימפסון. ובנקודה $x=0.6$:
          $E=1+4\cdot0.36=2.44$, $G=0.6^4=0.1296$, כמו החישוב המספרי.
      - kind: result
        text: >-
          $Q_1=(1+h'^2)\,dx^2+h^2\,dy^2$, רגולרית בדיוק כש-$h>0$; האורכים $\approx1.4789$ ו-$0$.
