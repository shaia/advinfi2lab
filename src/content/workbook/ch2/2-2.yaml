# Workbook of lesson 2.2 — torsion.
# Objectives (src/course.ts):
#   OBJ-2.2-1  define torsion by b' = −τn (the course's sign) and compute it for the helix
#   OBJ-2.2-2  compute torsion in a general parameter with the triple product
#   OBJ-2.2-3  κ > 0 on an interval: planar ⇔ τ ≡ 0
# Every number recomputed on 2026-11-10 with src/math/spacecurves.ts (tau, kappa, frame, offOsculatingPlane) and
# src/math/geometry.ts (torsion, curvature by finite differences) against the closed forms below.
lesson: '2.2'
practice:
  - id: W-2.2-01
    level: basic
    objectives: [OBJ-2.2-1]
    prompt: >-
      המסילה $\gamma(s)=\big(3\cos\frac s5,\ 3\sin\frac s5,\ \frac{4s}5\big)$ נתונה בפרמטר אורך הקשת. חשבו ישירות מההגדרה
      $\mathbf b'=-\tau\mathbf n$ את $\mathbf t,\mathbf n,\mathbf b$, את $\kappa$ ואת $\tau$.
    answer: >-
      $\kappa=\frac{3}{25}$, $\tau=\frac{4}{25}$; $\mathbf n=(-\cos\frac s5,-\sin\frac s5,0)$,
      $\mathbf b=\frac15\big(4\sin\frac s5,\ -4\cos\frac s5,\ 3\big)$.
    solution:
      - kind: computation
        text: >-
          $\|\gamma'\|^2=\frac{9}{25}+\frac{16}{25}=1$, ולכן זה אכן פרמטר אורך הקשת.
          $$\mathbf t=\tfrac15\big(-3\sin\tfrac s5,\ 3\cos\tfrac s5,\ 4\big),\qquad \mathbf t'=-\tfrac{3}{25}\big(\cos\tfrac s5,\ \sin\tfrac s5,\ 0\big).$$
      - kind: step
        text: >-
          $\kappa=\|\mathbf t'\|=\frac3{25}>0$ ו-$\mathbf n=\frac{\mathbf t'}{\kappa}=\big(-\cos\frac s5,\ -\sin\frac s5,\ 0\big)$.
      - kind: computation
        text: >-
          רכיב אחר רכיב:
          $$\mathbf b=\mathbf t\times\mathbf n=\tfrac15\big(4\sin\tfrac s5,\ -4\cos\tfrac s5,\ 3\big),\qquad \mathbf b'=\tfrac{4}{25}\big(\cos\tfrac s5,\ \sin\tfrac s5,\ 0\big)=-\tfrac{4}{25}\,\mathbf n.$$
      - kind: check
        text: >-
          לפי נוסחת הסליל $a=3$, $b=4$: $\kappa=\frac{3}{25}$, $\tau=\frac{4}{25}=0.16>0$, סליל ימני. $\mathbf b\cdot\mathbf t=0$ ו-$\|\mathbf b\|=1$.
      - kind: result
        text: >-
          $\kappa=\frac3{25}$, $\tau=\frac4{25}$.

  - id: W-2.2-02
    level: basic
    objectives: [OBJ-2.2-2]
    prompt: >-
      חשבו את הפיתול ואת העקמומיות של $\gamma(t)=\big(t,\ \frac{t^2}2,\ \frac{t^3}6\big)$ בכל $t$, ואת $\tau(2)$.
    answer: >-
      $\kappa(t)=\tau(t)=\dfrac{1}{(1+t^2/2)^2}$; $\tau(2)=\frac19$.
    solution:
      - kind: computation
        text: >-
          $\gamma'=(1,\ t,\ \frac{t^2}2)$, $\gamma''=(0,\ 1,\ t)$, $\gamma'''=(0,\ 0,\ 1)$. רכיב אחר רכיב
          $$\gamma'\times\gamma''=\big(\tfrac{t^2}2,\ -t,\ 1\big),\qquad \|\gamma'\times\gamma''\|^2=\tfrac{t^4}4+t^2+1=\big(1+\tfrac{t^2}2\big)^2.$$
      - kind: theorem
        text: >-
          לפי טענה 2.2.4, המונה $(\gamma'\times\gamma'')\cdot\gamma'''=1$, ולכן $\tau=\frac{1}{(1+t^2/2)^2}$.
      - kind: computation
        text: >-
          $v^2=1+t^2+\frac{t^4}4=\big(1+\frac{t^2}2\big)^2$, ולכן $\kappa=\frac{\|\gamma'\times\gamma''\|}{v^3}=\frac{1+t^2/2}{(1+t^2/2)^3}$.
      - kind: check
        text: >-
          ב-$t=2$: $1+2=3$, $\tau(2)=\frac19\approx0.1111$, וגם חישוב בהפרשים סופיים נותן $0.11111$. ב-$t=0$, $\tau=\kappa=1$.
      - kind: result
        text: >-
          $\kappa=\tau=\frac{1}{(1+t^2/2)^2}$, ו-$\tau(2)=\frac19$.

  - id: W-2.2-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.2-1]
    prompt: >-
      תחת ההנחות של השיעור (פרמטר אורך הקשת, $C^3$, $\kappa>0$), הוכיחו **בלי** להשתמש בלמה 2.2.3 ש-$\tau=\mathbf n'\cdot\mathbf b$, ש-$|\tau|=\|\mathbf b'\|$,
      ושלכן $\tau(s_0)=0$ אם ורק אם $\mathbf b'(s_0)=0$.
    answer: >-
      גוזרים את $\mathbf n\cdot\mathbf b=0$; $\mathbf b'=-\tau\mathbf n$ עם $\|\mathbf n\|=1$.
    solution:
      - kind: idea
        text: >-
          כל שוויון של מכפלה פנימית קבועה נותן, בגזירה, קשר בין הנגזרות.
      - kind: step
        text: >-
          $\mathbf n\cdot\mathbf b\equiv0$ על הקטע, ושניהם גזירים, ולכן $\mathbf n'\cdot\mathbf b+\mathbf n\cdot\mathbf b'=0$.
      - kind: definition
        text: >-
          לפי הגדרה 2.2.2, $\mathbf n\cdot\mathbf b'=-\tau$. לכן $\mathbf n'\cdot\mathbf b=\tau$.
      - kind: step
        text: >-
          לפי למה 2.2.1, $\mathbf b'=-\tau\mathbf n$, ולכן $\|\mathbf b'\|=|\tau|\,\|\mathbf n\|=|\tau|$. בפרט $\mathbf b'(s_0)=0$ אם ורק אם $\tau(s_0)=0$.
      - kind: check
        text: >-
          בסליל של W-2.2-01: $\|\mathbf b'\|=\frac4{25}=\tau$. הנוסחה $\tau=\mathbf n'\cdot\mathbf b$ מתאימה גם ללמה 2.2.3: $(-\kappa\mathbf t+\tau\mathbf b)\cdot\mathbf b=\tau$.
      - kind: result
        text: >-
          $\tau=\mathbf n'\cdot\mathbf b=-\mathbf b'\cdot\mathbf n$, $|\tau|=\|\mathbf b'\|$, ו-$\tau(s_0)=0\iff\mathbf b'(s_0)=0$.

  - id: W-2.2-04
    level: mid
    objectives: [OBJ-2.2-2]
    prompt: >-
      יהיו $a,b,c>0$ ו-$\gamma(t)=(at,\ bt^2,\ ct^3)$.

      (א) חשבו את $\tau(t)$.

      (ב) הוכיחו ש-$0<\tau(t)\le\frac{3c}{ab}$ לכל $t$, עם שוויון רק ב-$t=0$.

      (ג) ב-$a=b=c=\lambda$ קבלו $\tau(0)=\frac3\lambda$, והסבירו את התוצאה בעזרת טענה 2.2.5(ג).
    answer: >-
      $\tau(t)=\dfrac{3abc}{9b^2c^2t^4+9a^2c^2t^2+a^2b^2}$; המקסימום $\frac{3c}{ab}$ ב-$t=0$.
    solution:
      - kind: computation
        text: >-
          $\gamma'=(a,\ 2bt,\ 3ct^2)$, $\gamma''=(0,\ 2b,\ 6ct)$, $\gamma'''=(0,\ 0,\ 6c)$, ורכיב אחר רכיב
          $$\gamma'\times\gamma''=\big(6bct^2,\ -6act,\ 2ab\big).$$
          $\kappa>0$ בכל נקודה כי הרכיב השלישי $2ab\ne0$.
      - kind: theorem
        text: >-
          לפי טענה 2.2.4, המונה $12abc$ והמכנה $36b^2c^2t^4+36a^2c^2t^2+4a^2b^2$; מצמצמים ב-4.
      - kind: step
        text: >-
          (ב) המונה $3abc>0$. המכנה $\ge a^2b^2$, עם שוויון אם ורק אם $t=0$ (שני האיברים האחרים אי-שליליים ומתאפסים רק ב-$t=0$).
          לכן $0<\tau(t)\le\frac{3abc}{a^2b^2}=\frac{3c}{ab}$.
      - kind: step
        text: >-
          (ג) $a=b=c=\lambda$ נותן $\frac{3\lambda}{\lambda^2}=\frac3\lambda$. ואכן $(\lambda t,\lambda t^2,\lambda t^3)=\lambda\cdot(t,t^2,t^3)$, ולפי טענה 2.2.5(ג) הפיתול של
          המסילה המעוקבת, $3$ ב-$t=0$, מתחלק ב-$\lambda$.
      - kind: check
        text: >-
          $a=1,b=2,c=3$: $\tau(0)=4.5$ ו-$\tau(\frac12)=\frac{18}{44.5}\approx0.40449$, כמו חישוב בהפרשים סופיים. $a=b=c=1$ נותן את $\frac{3}{9t^4+9t^2+1}$ של השיעור.
      - kind: result
        text: >-
          $\tau(t)=\frac{3abc}{9b^2c^2t^4+9a^2c^2t^2+a^2b^2}$, חיובי ומקסימלי ($\frac{3c}{ab}$) רק ב-$t=0$.

  - id: W-2.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      תהי $\gamma(t)=(t,\ t^3,\ t^4)$.

      (א) הוכיחו ש-$\kappa(0)=0$ ו-$\kappa(t)>0$ לכל $t\ne0$, וחשבו את $\tau(t)$ ל-$t\ne0$.

      (ב) הוכיחו ש-$\lim_{t\to0}\tau(t)$ קיים, ומצאו אותו.

      (ג) הוכיחו או הפריכו: מכאן ש-$\mathbf b$ מתרחב ברציפות ל-$t=0$.
    answer: >-
      $\tau(t)=\dfrac{2}{1+4t^2+4t^6}\to2$; אבל $\mathbf b(t)\to(0,0,\operatorname{sign}t)$, ולכן $\mathbf b$ קופץ: הטענה שקרית.
    solution:
      - kind: computation
        text: >-
          $\gamma'=(1,\ 3t^2,\ 4t^3)$, $\gamma''=(0,\ 6t,\ 12t^2)$, $\gamma'''=(0,\ 6,\ 24t)$. רכיב אחר רכיב
          $$\gamma'\times\gamma''=\big(12t^4,\ -12t^2,\ 6t\big)=6t\,\big(2t^3,\ -2t,\ 1\big).$$
      - kind: step
        text: >-
          (א) הווקטור מתאפס רק ב-$t=0$, ולכן לפי טענה 2.1.3 ונוסחת $\kappa$, $\kappa(0)=0$ ו-$\kappa>0$ אחרת. ל-$t\ne0$:
          $$\tau=\frac{-72t^2+144t^2}{36t^2(4t^6+4t^2+1)}=\frac{2}{1+4t^2+4t^6}.$$
      - kind: step
        text: >-
          (ב) הביטוי האחרון רציף על כל $\mathbb R$, ולכן הגבול ב-$0$ הוא ערכו שם: $2$.
      - kind: step
        text: >-
          (ג) $\mathbf b=\frac{\gamma'\times\gamma''}{\|\gamma'\times\gamma''\|}=\operatorname{sign}(t)\,\frac{(2t^3,\ -2t,\ 1)}{\sqrt{4t^6+4t^2+1}}$, ולכן
          $\mathbf b\to(0,0,1)$ כש-$t\to0^+$ ו-$\mathbf b\to(0,0,-1)$ כש-$t\to0^-$. אין הרחבה רציפה.
      - kind: check
        text: >-
          מספרית $\tau(\pm0.05)\approx1.98020$ ו-$\tau(0.3)\approx1.46744$, כמו הנוסחה. המישור המנשק ($\perp\mathbf b$) כן מתרחב: הוא $z=0$
          משני הצדדים, כי $\pm(0,0,1)$ נורמלים לאותו מישור.
      - kind: result
        text: >-
          $\tau\to2$, אבל $\mathbf b$ קופץ מ-$(0,0,-1)$ ל-$(0,0,1)$: גבול של $\tau$ לא מבטיח המשך רציף של השלשה. הטענה שקרית.

  - id: W-2.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-3]
    prompt: >-
      תהי $\gamma:I\to\mathbb R^3$ רגולרית מסדר $C^3$ על קטע, עם $\kappa>0$, ונניח שכל המישורים המנשקים שלה מקבילים למישור קבוע $\Pi_0$.
      הוכיחו ש-$\gamma$ מישורית, ושהמישור מקביל ל-$\Pi_0$.
    answer: >-
      $\mathbf b=\pm\mathbf e$ לנורמל היחידה $\mathbf e$ של $\Pi_0$; רציפות על קטע נותנת סימן קבוע, ולכן $\tau\equiv0$.
    solution:
      - kind: idea
        text: >-
          מישורים מקבילים פירושם נורמלים מקבילים. כמו בהוכחת משפט 2.2.6 ($\Rightarrow$), רציפות על קטע מונעת קפיצה בין $\mathbf e$ ל-$-\mathbf e$.
      - kind: step
        text: >-
          המישור המנשק ב-$s$ ניצב ל-$\mathbf b(s)$ (הגדרה 2.1.6, טענה 2.1.10), והוא מקביל ל-$\Pi_0$, ולכן $\mathbf b(s)=\varepsilon(s)\mathbf e$ עם $\varepsilon(s)\in\{\pm1\}$.
      - kind: step
        text: >-
          $\varepsilon(s)=\mathbf b(s)\cdot\mathbf e$ רציפה על הקטע $I$ ומקבלת רק את הערכים $\pm1$; לפי משפט ערך הביניים היא קבועה. לכן $\mathbf b$ קבוע ו-$\mathbf b'\equiv0$.
      - kind: theorem
        text: >-
          $\tau=-\mathbf b'\cdot\mathbf n\equiv0$, ולפי משפט 2.2.6 ($\Leftarrow$) $\gamma$ מישורית, במישור הניצב ל-$\mathbf b\equiv\pm\mathbf e$, כלומר מקביל ל-$\Pi_0$.
      - kind: check
        text: >-
          בניגוד למשפט 2.2.6, כאן אפשר לוותר על $\kappa>0$, אם דורשים שהמישור המנשק מקביל ל-$\Pi_0$ בכל נקודה שבה הוא מוגדר. בפרמטר אורך
          הקשת: היכן ש-$\kappa>0$, $(\mathbf t\cdot\mathbf e)'=\kappa\,\mathbf n\cdot\mathbf e=0$, כי $\mathbf n\perp\mathbf b=\pm\mathbf e$; והיכן ש-$\kappa=0$,
          $\mathbf t'=0$. לכן $(\mathbf t\cdot\mathbf e)'\equiv0$ על הקטע, ו-$\mathbf t\cdot\mathbf e$ קבוע. אם $\kappa>0$ באיזו נקודה, הקבוע הוא $0$
          ו-$\gamma\cdot\mathbf e$ קבוע; ואם $\kappa\equiv0$, $\gamma$ ישר. המסילה המודבקת של 2.2.7 אינה סותרת: שם המישורים המנשקים
          מקבילים לשני מישורים שונים.
      - kind: result
        text: >-
          $\gamma$ מישורית, במישור מקביל ל-$\Pi_0$.

  - id: W-2.2-07
    level: mid
    objectives: [OBJ-2.2-2]
    prompt: >-
      תהי $\gamma(t)=\big(\cos t^3,\ \sin t^3,\ t^3\big)$, $t>0$. מצאו את $\tau(1)$ **בלי** לגזור את $\gamma$ שלוש פעמים, ונמקו לפי איזו טענה.
      אחר כך בדקו בנוסחה של טענה 2.2.4.
    answer: >-
      $\tau(1)=\frac12$.
    solution:
      - kind: idea
        text: >-
          $\gamma=\delta\circ\varphi$ עם הסליל $\delta(u)=(\cos u,\ \sin u,\ u)$ ו-$\varphi(t)=t^3$: החלפת פרמטר, והפיתול לא תלוי בה.
      - kind: step
        text: >-
          $\varphi:(0,\infty)\to(0,\infty)$ מסדר $C^\infty$, על, עם $\varphi'(t)=3t^2>0$. לכן לפי טענה 2.2.5(א), $\tau_\gamma(t)=\tau_\delta(t^3)$.
      - kind: computation
        text: >-
          לסליל $(a\cos u,a\sin u,bu)$ עם $a=b=1$: $\tau_\delta\equiv\frac{1}{1+1}=\frac12$. לכן $\tau_\gamma(1)=\frac12$, וגם $\tau_\gamma\equiv\frac12$.
      - kind: check
        text: >-
          בנוסחה של טענה 2.2.4 ב-$t=1$, עם $\gamma'=3t^2\,\delta'(t^3)$ וכו', מתקבל המונה $3^6\cdot1$ והמכנה $3^6\cdot2$; חישוב מספרי בהפרשים סופיים נותן $0.500001$.
          טעות נפוצה: לחשוב שהקצב $3t^2$ משנה את $\tau$.
      - kind: result
        text: >-
          $\tau(1)=\frac12$.

  - id: W-2.2-08
    level: exam
    objectives: [OBJ-2.2-1, OBJ-2.2-3]
    prompt: >-
      (א) תהי $\gamma$ מסדר $C^3$ בפרמטר אורך הקשת, $\kappa(s_0)>0$, ו-$d(h)$ המרחק המסומן של $\gamma(s_0+h)$ מהמישור המנשק ב-$s_0$.
      הוכיחו ש-
      $$\tau(s_0)=\lim_{h\to0}\frac{6\,d(h)}{\kappa(s_0)\,h^3}.$$

      (ב) השתמשו ב-(א) כדי לחשב את $\tau(0)$ של המסילה המעוקבת $(u,\ u^2,\ u^3)$ **בלי** הנוסחה של טענה 2.2.4. (שימו לב: $u$ אינו פרמטר אורך הקשת.)
    answer: >-
      (א) מטענה 2.2.8. (ב) המישור המנשק ב-$0$ הוא $z=0$, $d=u^3$, $s=u+O(u^3)$, ו-$\tau(0)=\frac{6}{2}=3$.
    solution:
      - kind: theorem
        text: >-
          (א) לפי טענה 2.2.8, $d(h)=\frac{\kappa\tau}6h^3+o(h^3)$. מחלקים ב-$\frac{\kappa h^3}{6}$ (מותר: $\kappa(s_0)>0$) ומקבלים $\tau(s_0)+o(1)$.
      - kind: step
        text: >-
          (ב) ב-$u=0$: $\gamma'=(1,0,0)$, $\gamma''=(0,2,0)$, ולכן $\mathbf b(0)=(0,0,1)$ (טענה 2.1.3), המישור המנשק $z=0$, ו-$\kappa(0)=\frac{\|(0,0,2)\|}{1}=2$.
          הנקודה עם פרמטר $u$ נמצאת במרחק המסומן $d=u^3$.
      - kind: step
        text: >-
          אורך הקשת מ-$0$ ל-$u$: $s(u)=\int_0^u\sqrt{1+4w^2+9w^4}\,dw$. האינטגרנד בין $1$ ל-$1+2w^2+\frac92w^4$ (כי $\sqrt{1+x}\le1+\frac x2$),
          ולכן $u\le s(u)\le u+\frac23u^3+\frac9{10}u^5$ ל-$u>0$, כלומר $\frac{s}{u}\to1$; וכך גם ל-$u<0$. $s$ הפיכה, ו-$h=s(u)\to0$ כש-$u\to0$.
      - kind: computation
        text: >-
          לפי (א), עם $h=s(u)$:
          $$\tau(0)=\lim_{u\to0}\frac{6u^3}{2\,s(u)^3}=3\lim_{u\to0}\Big(\frac{u}{s(u)}\Big)^3=3.$$
      - kind: check
        text: >-
          טענה 2.2.4 נותנת $\tau(0)=\frac{12}{4}=3$. מספרית, $\frac{6d}{\kappa s^3}$ ב-$u=0.01$ ו-$0.005$ הוא $2.9994$ ו-$2.99985$.
      - kind: result
        text: >-
          (א) $\tau=\lim\frac{6d}{\kappa h^3}$; (ב) $\tau(0)=3$.

  - id: W-2.2-09
    level: exam
    qualitative: true
    objectives: [OBJ-2.2-3]
    prompt: >-
      תהי $\gamma:I\to\mathbb R^3$ רגולרית מסדר $C^3$ בפרמטר אורך הקשת על קטע פתוח $I$, $s_0\in I$, כך ש-$\kappa(s_0)=0$, $\kappa>0$ בכל נקודה אחרת,
      ו-$\tau\equiv0$ על $I\setminus\{s_0\}$.

      (א) הוכיחו: אם לבינורמל יש גבולות חד-צדדיים $\mathbf b_\pm=\lim_{s\to s_0^\pm}\mathbf b(s)$ ו-$\mathbf b_-=\pm\mathbf b_+$, אז $\gamma$ מישורית.

      (ב) הראו שהמסילה $(t,t^4,0)$ / $(t,0,t^4)$ של שיעור 2.2 מקיימת את כל ההנחות פרט להנחה על $\mathbf b_\pm$.
    answer: >-
      על כל צד $\gamma$ במישור עם נורמל קבוע $\mathbf b_\mp$, ושני המישורים מכילים את $\gamma(s_0)$ ומקבילים, ולכן מתלכדים.
    solution:
      - kind: idea
        text: >-
          משפט 2.2.6 על כל חצי קטע בנפרד; את החצאים "מדביקים" ב-$\gamma(s_0)$, שקיים בשני המישורים מרציפות.
      - kind: theorem
        text: >-
          $I_-=I\cap(-\infty,s_0)$ קטע, ועליו $\kappa>0$ ו-$\tau\equiv0$. לפי הוכחת משפט 2.2.6 ($\Leftarrow$), $\mathbf b\equiv\mathbf e_-$ קבוע על $I_-$, ו-$\gamma(I_-)$
          מוכלת במישור $\Pi_-$ דרך $\gamma(s_1)$, $s_1\in I_-$, עם הנורמל $\mathbf e_-$. כי $\mathbf b$ קבוע, $\mathbf b_-=\mathbf e_-$. באותו אופן $\gamma(I_+)\subseteq\Pi_+$ עם הנורמל $\mathbf b_+$.
      - kind: step
        text: >-
          $\Pi_-$ קבוצה סגורה ו-$\gamma$ רציפה, ולכן $\gamma(s_0)=\lim_{s\to s_0^-}\gamma(s)\in\Pi_-$; וכך גם $\gamma(s_0)\in\Pi_+$.
      - kind: step
        text: >-
          $\mathbf b_-=\pm\mathbf b_+$: לשני המישורים נורמלים מקבילים, ולשניהם הנקודה $\gamma(s_0)$. מישור נקבע מנקודה ונורמל, ולכן $\Pi_-=\Pi_+$,
          ו-$\gamma(I)=\gamma(I_-)\cup\{\gamma(s_0)\}\cup\gamma(I_+)$ מוכלת בו.
      - kind: step
        text: >-
          (ב) לפי 2.2.7 בשיעור: $C^3$, רגולרית, $\kappa(0)=0$ בלבד, $\tau=0$ בשאר הנקודות; אבל $\mathbf b_-=(0,0,1)$ ו-$\mathbf b_+=(0,-1,0)$, שאינם מקבילים. (המסילה
          נתונה בפרמטר $t$; לפי טענה 1.2.10 עוברים לאורך הקשת, וההנחות והגבולות לא משתנים.)
      - kind: check
        text: >-
          המסילה $(t,\ t^3,\ 0)$: $\kappa(0)=0$, $\mathbf b_\pm=(0,0,\pm1)$ (הנורמל הראשי מתהפך), כלומר $\mathbf b_-=-\mathbf b_+$, והיא אכן מישורית. ההנחה ההפוכה,
          $\mathbf b_-\ne\pm\mathbf b_+$, היא בדיוק מה שמאפשר את הדוגמה הנגדית.
      - kind: result
        text: >-
          (א) $\gamma$ מישורית; (ב) בדוגמה הנגדית הגבולות $(0,0,1)$ ו-$(0,-1,0)$ אינם מקבילים.

  - id: W-2.2-10
    level: exam
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      תהי $\gamma$ רגולרית מסדר $C^3$ עם $\kappa>0$, $\lambda\ne0$, $A$ מטריצה אורתוגונלית ו-$\mathbf c\in\mathbb R^3$. נגדיר $\tilde\gamma=\lambda A\gamma+\mathbf c$.

      (א) הוכיחו ש-$\tilde\kappa=\frac{\kappa}{|\lambda|}$ ו-$\tilde\tau=\frac{\det A}{\lambda}\,\tau$ (בנקודות המתאימות; גם $\lambda<0$ מותר).

      (ב) הסיקו מה עושה השיקוף בנקודה $\mathbf x\mapsto-\mathbf x$ ל-$\kappa$ ול-$\tau$, בשתי דרכים: $A=-I,\lambda=1$, ו-$A=I,\lambda=-1$.

      (ג) עבור הסליל $(\cos t,\ \sin t,\ \frac t2)$: מצאו את כל ה-$\lambda$ וה-$A$ שעבורם ל-$\tilde\gamma$ אותם $\kappa=0.8$ ו-$\tau=0.4$, והראו שבכולם $\lambda A$ היא סיבוב.
    answer: >-
      (א) המונה מוכפל ב-$\lambda^3\det A$ והמכנה ב-$\lambda^4$. (ב) $\kappa$ נשמר, $\tau\mapsto-\tau$. (ג) $|\lambda|=1$ ו-$\det A=\lambda$, ולכן $\det(\lambda A)=\lambda^3\det A=1$.
    solution:
      - kind: computation
        text: >-
          $\tilde\gamma^{(k)}=\lambda A\gamma^{(k)}$. לפי למה 2.1.5א, $(A\mathbf u)\times(A\mathbf v)=(\det A)A(\mathbf u\times\mathbf v)$, ולכן
          $$\tilde\gamma'\times\tilde\gamma''=\lambda^2(\det A)\,A(\gamma'\times\gamma'').$$
      - kind: step
        text: >-
          (א) $A$ שומרת אורכים ומכפלות פנימיות: $\|\tilde\gamma'\|=|\lambda|v$, $\|\tilde\gamma'\times\tilde\gamma''\|=\lambda^2\|\gamma'\times\gamma''\|$, ולכן
          $\tilde\kappa=\frac{\lambda^2}{|\lambda|^3}\kappa=\frac{\kappa}{|\lambda|}>0$. המונה בטענה 2.2.4 הוא $\lambda^3(\det A)(\gamma'\times\gamma'')\cdot\gamma'''$ והמכנה
          $\lambda^4\|\gamma'\times\gamma''\|^2$; המנה $\frac{\det A}{\lambda}\tau$.
      - kind: step
        text: >-
          (ב) $A=-I$ ($\det=-1$), $\lambda=1$: $\tilde\tau=-\tau$. $A=I$, $\lambda=-1$: $\tilde\tau=\frac{1}{-1}\tau=-\tau$. אותה תוצאה, כמו שחייב
          (אותה העתקה). בשתיהן $\tilde\kappa=\kappa$.
      - kind: step
        text: >-
          (ג) $\tilde\kappa=\frac{0.8}{|\lambda|}=0.8$ גורר $|\lambda|=1$; $\tilde\tau=\frac{\det A}{\lambda}0.4=0.4$ גורר $\det A=\lambda$. לכן $\lambda=1,\det A=1$, או
          $\lambda=-1,\det A=-1$. בשני המקרים $\lambda A$ אורתוגונלית עם $\det(\lambda A)=\lambda^3\det A=\lambda^4=1$: סיבוב.
      - kind: check
        text: >-
          מקרה פרטי של (א): $A=I$, $\lambda>0$ הוא טענה 2.2.5(ג), ו-$\lambda=1$ הוא טענה 2.2.5(ב). דוגמה למקרה השני של (ג): $\lambda=-1$
          עם $A=\operatorname{diag}(1,1,-1)$, שבו $\det A=-1=\lambda$, ו-$\lambda A=\operatorname{diag}(-1,-1,1)$ הוא סיבוב ב-$\pi$ סביב ציר $z$.
      - kind: result
        text: >-
          $\tilde\kappa=\frac{\kappa}{|\lambda|}$, $\tilde\tau=\frac{\det A}{\lambda}\tau$; השיקוף בנקודה הופך את $\tau$; ובסליל רק סיבובים (עם הזזה) שומרים את $\kappa$ ו-$\tau$.

challenge:
  - id: W-2.2-c1
    stars: 1
    objectives: [OBJ-2.2-3]
    prompt: >-
      תהי $\gamma:I\to\mathbb R^3$ רגולרית מסדר $C^3$ על קטע, עם $\kappa>0$, ונניח שכל המישורים המנשקים של $\gamma$ עוברים דרך נקודה קבועה $\mathbf p$.
      הוכיחו ש-$\gamma$ מישורית.
    answer: >-
      $(\gamma-\mathbf p)\cdot\mathbf b\equiv0$; גזירה נותנת $\tau\,(\gamma-\mathbf p)\cdot\mathbf n=0$. בקטע שבו $\tau\ne0$ מקבלים $\gamma\equiv\mathbf p$, סתירה לרגולריות;
      לכן $\tau\equiv0$, ולפי משפט 2.2.6 $\gamma$ מישורית.
    solution:
      - kind: given
        text: >-
          בפרמטר אורך הקשת (מותר לפי טענות 1.2.10 ו-2.2.5(א); מישוריות היא תכונה של התמונה): $(\gamma(s)-\mathbf p)\cdot\mathbf b(s)=0$ לכל $s$, כי
          המישור המנשק ב-$s$ הוא $\{\mathbf x:(\mathbf x-\gamma(s))\cdot\mathbf b(s)=0\}$ (טענה 2.1.10).
      - kind: step
        text: >-
          גוזרים: $\mathbf t\cdot\mathbf b+(\gamma-\mathbf p)\cdot\mathbf b'=0$, ו-$\mathbf t\cdot\mathbf b=0$, $\mathbf b'=-\tau\mathbf n$. לכן $\tau\,(\gamma-\mathbf p)\cdot\mathbf n\equiv0$.
      - kind: step
        text: >-
          נניח בשלילה ש-$\tau(s_1)\ne0$. $\tau$ רציפה, ולכן יש קטע פתוח $J\ni s_1$ שעליו $\tau\ne0$, ועליו $(\gamma-\mathbf p)\cdot\mathbf n\equiv0$.
      - kind: step
        text: >-
          על $J$, $\gamma-\mathbf p$ ניצב ל-$\mathbf n$ ול-$\mathbf b$, ולכן $\gamma-\mathbf p=\mu\,\mathbf t$ עם $\mu=(\gamma-\mathbf p)\cdot\mathbf t$. גוזרים את
          $(\gamma-\mathbf p)\cdot\mathbf n=0$ ומשתמשים בלמה 2.2.3:
          $$0=\mathbf t\cdot\mathbf n+(\gamma-\mathbf p)\cdot\mathbf n'=\mu\,\mathbf t\cdot(-\kappa\mathbf t+\tau\mathbf b)=-\kappa\mu .$$
      - kind: step
        text: >-
          $\kappa>0$, ולכן $\mu\equiv0$ על $J$, כלומר $\gamma\equiv\mathbf p$ על $J$ ו-$\gamma'=0$ שם: סתירה לרגולריות. לכן $\tau\equiv0$ על $I$.
      - kind: theorem
        text: >-
          לפי משפט 2.2.6 ($\Leftarrow$; $\kappa>0$, קטע) $\gamma$ מישורית, והמישור הוא המישור המנשק בכל נקודה; לפי ההנחה הוא עובר דרך $\mathbf p$.
      - kind: check
        text: >-
          מעגל במישור $z=0$ ו-$\mathbf p=(0,0,0)$: כל המישורים המנשקים הם $z=0$ ועוברים דרך $\mathbf p$. בסליל, לעומת זאת, המישור המנשק ב-$t$ הוא
          $(\mathbf x-\gamma(t))\cdot(b\sin t,-b\cos t,a)=0$, ואין נקודה שבכולם (ב-$t$ ו-$t+2\pi$ אלה מישורים מקבילים שונים כש-$b\ne0$).
      - kind: result
        text: >-
          $\gamma$ מישורית, במישור דרך $\mathbf p$.
    source:
      name: 'אינפי מתקדם 2 (80316), האוניברסיטה העברית, רות לורנס-נוימרק: דף תרגיל 3'
      year: 2002
      problem: 'תרגיל 5'
      url: http://www.ma.huji.ac.il/~ruthel/courses/infimb02/infimb02-ex03.html
      verified: '2026-11-10'
      adapted: true

  - id: W-2.2-c2
    stars: 1
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      העתקה לינארית $\rho:\mathbb R^3\to\mathbb R^3$ היא אורתוגונלית אם $\rho\mathbf u\cdot\rho\mathbf v=\mathbf u\cdot\mathbf v$ לכל $\mathbf u,\mathbf v$.

      (א) הוכיחו ש-$\rho$ אורתוגונלית שומרת אורכים וזוויות.

      (ב) הוכיחו ש-$(\rho\mathbf u)\times(\rho\mathbf v)=(\det\rho)\,\rho(\mathbf u\times\mathbf v)$. האם $(\rho\mathbf u)\times(\rho\mathbf v)=\rho(\mathbf u\times\mathbf v)$ גם בלי $\det\rho=1$?

      (ג) הוכיחו שאורך הקשת, העקמומיות והפיתול של מסילה (במקום שבו הם מוגדרים) לא משתנים ב-$\mathbf x\mapsto\rho\mathbf x+\mathbf c$ כש-$\det\rho=1$.

      (ד) מה קורה להם כש-$\det\rho=-1$? הדגימו על הסליל $(\cos t,\ \sin t,\ \frac t2)$.
    answer: >-
      (ב) $\det(\rho\mathbf u,\rho\mathbf v,\mathbf w)=\det\rho\,\det(\mathbf u,\mathbf v,\rho^{-1}\mathbf w)$; בלי $\det\rho=1$ לא ($\rho=-I$). (ג) נשמרים. (ד) אורך הקשת ו-$\kappa$ נשמרים, $\tau\mapsto-\tau$:
      הסליל עם $\tau=0.4$ עובר לסליל עם $\tau=-0.4$.
    solution:
      - kind: step
        text: >-
          (א) $\|\rho\mathbf u\|^2=\rho\mathbf u\cdot\rho\mathbf u=\|\mathbf u\|^2$, והזווית $\theta\in[0,\pi]$ נקבעת מ-$\cos\theta=\frac{\mathbf u\cdot\mathbf v}{\|\mathbf u\|\|\mathbf v\|}$, שנשמר.
      - kind: step
        text: >-
          (ב) לכל $\mathbf w$, לפי $\mathbf x\cdot(\mathbf y\times\mathbf z)$ = דטרמיננטה וכפליות הדטרמיננטה:
          $$(\rho\mathbf u\times\rho\mathbf v)\cdot\mathbf w=\det(\rho\mathbf u,\rho\mathbf v,\rho\rho^{-1}\mathbf w)=\det\rho\,(\mathbf u\times\mathbf v)\cdot\rho^{-1}\mathbf w.$$
          $\rho^{-1}=\rho^T$ (מהגדרת אורתוגונליות), ולכן $(\mathbf u\times\mathbf v)\cdot\rho^{T}\mathbf w=\rho(\mathbf u\times\mathbf v)\cdot\mathbf w$. השוויון לכל $\mathbf w$ נותן את הנוסחה.
          בלי $\det\rho=1$ לא: $\rho=-I$ נותן $(-\mathbf u)\times(-\mathbf v)=\mathbf u\times\mathbf v\ne-(\mathbf u\times\mathbf v)$ כש-$\mathbf u\times\mathbf v\ne0$.
      - kind: step
        text: >-
          (ג) $\tilde\gamma'=\rho\gamma'$, ולכן $\|\tilde\gamma'\|=\|\gamma'\|$ ואורך הקשת $\int\|\tilde\gamma'\|$ שווה. בפרמטר אורך הקשת $\tilde\kappa=\|\rho\gamma''\|=\kappa$. לפיתול, לפי
          טענה 2.2.4 ו-(ב): המונה $(\rho\gamma'\times\rho\gamma'')\cdot\rho\gamma'''=\det\rho\,(\gamma'\times\gamma'')\cdot\gamma'''$, המכנה לא משתנה. עם $\det\rho=1$, $\tilde\tau=\tau$.
      - kind: step
        text: >-
          (ד) אותו חישוב עם $\det\rho=-1$: אורך הקשת ו-$\kappa$ נשמרים, $\tilde\tau=-\tau$. השיקוף $\rho=\operatorname{diag}(1,1,-1)$ מעביר את הסליל הימני
          $(\cos t,\sin t,\frac t2)$, עם $\kappa=0.8$ ו-$\tau=0.4$, לסליל השמאלי $(\cos t,\sin t,-\frac t2)$, עם $\kappa=0.8$ ו-$\tau=-0.4$.
      - kind: check
        text: >-
          המקור (do Carmo) מגדיר את הפיתול בסימן הפוך, $\mathbf b'=\tau\mathbf n$, ולכן נוסחת הפיתול שם היא מינוס שלנו; לאינווריאנטיות זה לא משנה, ובסימן של (ד)
          הסליל הימני מקבל אצלו $\tau<0$. כאן התשובות בסימן של הקורס. בדיקה מספרית: $\tau$ של תמונת המראה של הסליל היא $-0.4$.
      - kind: result
        text: >-
          (ב) $\rho\mathbf u\times\rho\mathbf v=(\det\rho)\rho(\mathbf u\times\mathbf v)$; (ג) אורך, $\kappa$ ו-$\tau$ אינווריאנטים בתנועה קשיחה; (ד) בשיקוף $\tau$ מחליף סימן.
    source:
      name: 'do Carmo, Differential Geometry of Curves and Surfaces, §1-5 (as quoted in "Solutions to Exercises in Do Carmo", Introduction to Geometry, Fall 2025)'
      year: 1976
      problem: '1-5, exercise 6 (numbered Exercise 8 in the notes)'
      url: https://jonathan-huang.github.io/files/geometry/chap1.pdf
      verified: '2026-11-10'
      adapted: true
