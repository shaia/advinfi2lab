  - id: W-1.6-c2
    stars: 1
    objectives: [OBJ-1.6-1]
    prompt: >-
      מצאו במפורש את המסילה המישורית בפרמטר אורך הקשת עם $k(s)=\frac{1}{1+s^2}$, $s\in\mathbb R$, $\gamma(0)=(0,0)$ ו-$\theta(0)=0$, וזהו את
      התמונה שלה כגרף של פונקציה מוכרת.
    answer: >-
      $$\gamma(s)=\big(\operatorname{arsinh}s,\ \sqrt{1+s^2}-1\big)$$ השרשרת $y=\cosh x-1$.
    solution:
      - kind: computation
        text: >-
          $\theta(s)=\arctan s$, ו-$|\theta|<\frac\pi2$, ולכן $\cos\theta=\frac{1}{\sqrt{1+s^2}}$ ו-$\sin\theta=\frac{s}{\sqrt{1+s^2}}$.
      - kind: computation
        text: >-
          $$x(s)=\int_0^s\frac{du}{\sqrt{1+u^2}}=\operatorname{arsinh}s,$$ $$y(s)=\int_0^s\frac{u\,du}{\sqrt{1+u^2}}=\sqrt{1+s^2}-1.$$
      - kind: step
        text: >-
          $s=\sinh x$, ולכן $$y=\sqrt{1+\sinh^2x}-1=\cosh x-1$$: השרשרת, הצורה של שרשרת תלויה, מוזזת כך שתעבור בראשית.
      - kind: check
        text: >-
          ב-$s=2$ האינטגרציה המספרית נותנת $(1.4436,\ 1.2361)$, ו-$(\operatorname{arsinh}2,\ \sqrt5-1)$ אותו דבר. ובכיוון ההפוך: אורך הקשת של
          $y=\cosh x-1$ מ-$0$ עד $x$ הוא $\int_0^x\cosh=\sinh x=s$, ועקמומיותו $\frac{\cosh x}{\cosh^3x}=\frac{1}{1+s^2}$.
      - kind: result
        text: >-
          השרשרת $y=\cosh x-1$, עם $s=\sinh x$.
