# Workbook of lesson 1.2 — arc length and the arc-length parameter.
# Objectives (src/course.ts):
#   OBJ-1.2-1  length as the sup of inscribed polygons; the formula L = ∫‖γ′‖
#   OBJ-1.2-2  length does not depend on the parametrization (monotone change of parameter)
#   OBJ-1.2-3  pass to the arc-length parameter of a regular curve; there ‖γ′‖ = 1
# Every number recomputed with src/math/geometry.ts (arcLength) and multivar.ts (simpson) on 2026-11-09/10 (W-09, W-10 rewritten for rigor).
lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    objectives: [OBJ-1.2-1]
    prompt: >-
      חשבו את האורך של $\gamma(t)=(t^2,\ 2t,\ \ln t)$, $1\le t\le e$.
    answer: >-
      $L=e^2\approx7.389$.
    solution:
      - kind: computation
        text: >-
          $\gamma'(t)=\big(2t,\ 2,\ \frac1t\big)$, ולכן
          $$\|\gamma'(t)\|^2=4t^2+4+\frac{1}{t^2}=\Big(2t+\frac1t\Big)^2.$$
      - kind: step
        text: >-
          על $[1,e]$, $2t+\frac1t>0$, ולכן $\|\gamma'(t)\|=2t+\frac1t$.
      - kind: computation
        text: >-
          $$L=\int_1^e\Big(2t+\frac1t\Big)\,dt=\Big[t^2+\ln t\Big]_1^e=e^2+1-1=e^2.$$
      - kind: check
        text: >-
          חישוב מספרי של $\int_1^e\|\gamma'\|$ נותן $7.389056$. והמיתר בין הקצוות קצר ממנו, כמו שצריך.
      - kind: result
        text: >-
          $L=e^2$.

  - id: W-1.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      רבע המעגל $\gamma(t)=(\cos t,\ \sin t)$, $0\le t\le\frac\pi2$.

      (א) חשבו את $\ell(P)$ לחלוקה $P=\{0,\ \frac\pi2\}$ ולחלוקה $P'=\{0,\ \frac\pi4,\ \frac\pi2\}$.

      (ב) הוכיחו, בלי לחשב את $L(\gamma)$, ש-$\ell(P)\le\ell(P')\le L(\gamma)$, וציינו בכל אי-שוויון על איזו טענה הוא נשען. אחר כך חשבו את $L(\gamma)$ ובדקו.
    answer: >-
      (א) $\ell(P)=\sqrt2\approx1.4142$, $\ell(P')=4\sin\frac\pi8\approx1.5307$. (ב) למה 1.2.2 ולמה 1.2.3; $L=\frac\pi2\approx1.5708$.
    solution:
      - kind: computation
        text: >-
          (א) $\ell(P)=\|(0,1)-(1,0)\|=\sqrt2$. ב-$P'$ שני מיתרים שווים, כל אחד מול זווית $\frac\pi4$ במעגל היחידה, באורך $2\sin\frac\pi8$. לכן
          $\ell(P')=4\sin\frac\pi8\approx1.5307$.
      - kind: theorem
        text: >-
          למה 1.2.2: אם $P\subseteq P'$ אז $\ell(P)\le\ell(P')$. למה 1.2.3: $\ell(Q)\le L(\gamma)$ לכל חלוקה $Q$.
      - kind: step
        text: >-
          (ב) $P\subseteq P'$, ולכן לפי למה 1.2.2 $\ell(P)\le\ell(P')$; ההוכחה שם היא אי-שוויון המשולש למיתר מ-$\gamma(0)$ ל-$\gamma(\frac\pi2)$ דרך $\gamma(\frac\pi4)$.
      - kind: step
        text: >-
          לפי למה 1.2.3 (כלומר כי $L$ הוא חסם מלעיל של כל הקווים השבורים) $\ell(P')\le L(\gamma)$.
      - kind: computation
        text: >-
          $\gamma$ גזירה ברציפות עם $\|\gamma'\|\equiv1$, ולכן לפי משפט 1.2.7 $L=\int_0^{\pi/2}1\,dt=\frac\pi2\approx1.5708$.
      - kind: result
        text: >-
          $1.4142\le1.5307\le1.5708$, כפי שהלמות מבטיחות.

  - id: W-1.2-03
    level: basic
    objectives: [OBJ-1.2-3]
    prompt: >-
      מצאו $c>0$ כך שהמסילה $\gamma(s)=(\cos cs,\ \sin cs,\ 2cs)$ תהיה בפרמטר אורך הקשת.
    answer: >-
      $c=\frac{1}{\sqrt5}$.
    solution:
      - kind: theorem
        text: >-
          $s$ הוא פרמטר אורך הקשת אם ורק אם $\|\gamma'(s)\|=1$ לכל $s$.
      - kind: computation
        text: >-
          $\gamma'(s)=c\,(-\sin cs,\ \cos cs,\ 2)$, ו-$\|\gamma'(s)\|=c\sqrt{1+4}=c\sqrt5$.
      - kind: step
        text: >-
          $c\sqrt5=1$ נותן $c=\frac{1}{\sqrt5}$.
      - kind: check
        text: >-
          חישוב מספרי של האורך על $[0,1]$ עם $c=\frac{1}{\sqrt5}$ נותן $1$. בלי הרכיב השלישי היינו מקבלים $c=1$: הסליל מטפס, וזה מאט את הפרמטר.
      - kind: result
        text: >-
          $c=\frac{1}{\sqrt5}$.

  - id: W-1.2-04
    level: mid
    objectives: [OBJ-1.2-1]
    prompt: >-
      האסטרואידה היא הקבוצה $x^{2/3}+y^{2/3}=a^{2/3}$, $a>0$. היא תמונת המסילה $\gamma(t)=(a\cos^3t,\ a\sin^3t)$,
      $0\le t\le2\pi$. חשבו את אורכה.
    answer: >-
      $L=6a$.
    solution:
      - kind: computation
        text: >-
          גוזרים: $$\gamma'(t)=3a\sin t\cos t\,(-\cos t,\ \sin t),$$ ולכן $\|\gamma'(t)\|=3a|\sin t\cos t|$.
      - kind: idea
        text: >-
          הערך המוחלט חשוב: $\sin t\cos t$ מחליף סימן ברבעים. $\|\gamma'(t)\|=\frac{3a}2|\sin2t|$ מחזורית עם מחזור $\frac\pi2$, ולכן
          האינטגרל על $[0,2\pi]$ הוא ארבע פעמים האינטגרל על $[0,\frac\pi2]$, שם $\sin t\cos t\ge0$ והערך המוחלט מתבטל.
      - kind: computation
        text: >-
          $$\int_0^{\pi/2}3a\sin t\cos t\,dt=\frac{3a}{2}\Big[\sin^2t\Big]_0^{\pi/2}=\frac{3a}2.$$
      - kind: step
        text: >-
          לכן $L=4\cdot\frac{3a}2=6a$. הנוסחה חלה אף שהמסילה אינה רגולרית בארבעת החודים: $\|\gamma'\|$ רציפה.
      - kind: check
        text: >-
          חישוב מספרי עם $a=2$ נותן $12$. בלי ערך מוחלט, $\int_0^{2\pi}3a\sin t\cos t\,dt=0$: האורך היה יוצא אפס.
      - kind: result
        text: >-
          $L=6a$.

  - id: W-1.2-05
    level: mid
    objectives: [OBJ-1.2-1]
    prompt: >-
      (א) הוכיחו שאם $f:[a,b]\to\mathbb R$ גזירה ברציפות, אורך הגרף שלה הוא $\int_a^b\sqrt{1+f'(x)^2}\,dx$.

      (ב) חשבו את אורך הגרף של $f(x)=x^{3/2}$ על $[0,4]$.
    answer: >-
      (א) הגרף הוא המסילה $(x,f(x))$. (ב) $\frac{8}{27}\big(10\sqrt{10}-1\big)\approx9.0734$.
    solution:
      - kind: step
        text: >-
          (א) הגרף הוא התמונה של $\gamma(x)=(x,\ f(x))$, שעוברת עליו פעם אחת. $\gamma'(x)=(1,\ f'(x))$, ולכן $\|\gamma'\|=\sqrt{1+f'^2}$, רציפה. $\gamma$ גזירה ברציפות על הקטע הסגור, ולפי משפט 1.2.7 $L=\int_a^b\sqrt{1+f'^2}$.
      - kind: computation
        text: >-
          (ב) $f'(x)=\frac32x^{1/2}$, $1+f'^2=1+\frac94x$. בהצבה $w=1+\frac94x$, $dw=\frac94dx$:
          $$\int_0^4\sqrt{1+\tfrac94x}\,dx=\frac49\cdot\frac23\Big[w^{3/2}\Big]_1^{10}=\frac{8}{27}\big(10^{3/2}-1\big).$$
      - kind: check
        text: >-
          $\frac{8}{27}(31.623-1)\approx9.0734$, וחישוב מספרי של האינטגרל נותן אותו ערך. המיתר מ-$(0,0)$ ל-$(4,8)$ באורך $\sqrt{80}\approx8.944$, קצר יותר.
      - kind: result
        text: >-
          $\frac{8}{27}\big(10\sqrt{10}-1\big)\approx9.0734$.

  - id: W-1.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-2]
    prompt: >-
      $\gamma(t)=(\cos t,\ \sin t)$, $0\le t\le2\pi$, באורך $2\pi$.

      (א) בלי לחשב אינטגרל של $\|\delta_1'\|$, מצאו את האורך של $\delta_1(u)=\big(\cos u^3,\ \sin u^3\big)$, $0\le u\le(2\pi)^{1/3}$.

      (ב) הוכיחו או הפריכו: לכל $\varphi:[0,\pi]\to[0,2\pi]$ גזירה ברציפות ועל, $L(\gamma\circ\varphi)=L(\gamma)$. (רמז: $\varphi(u)=2\pi\sin^2u$.)
    answer: >-
      (א) $2\pi$. (ב) לא נכון: עם $\varphi(u)=2\pi\sin^2u$ האורך $4\pi\ne2\pi$.
    solution:
      - kind: idea
        text: >-
          $\delta_i=\gamma\circ\varphi_i$. בודקים אם $\varphi_i$ מונוטונית ועל $[0,2\pi]$; אם היא הולכת וחוזרת, מפצלים לקטעי מונוטוניות.
      - kind: step
        text: >-
          (א) $\varphi_1(u)=u^3$ גזירה ברציפות, $\varphi_1'=3u^2\ge0$, ו-$\varphi_1$ על $[0,2\pi]$. לפי משפט 1.2.9, $L(\delta_1)=2\pi$. (המשפט מתיר $\varphi_1'(0)=0$.)
      - kind: step
        text: >-
          (ב) **הפרכה.** $\varphi_2(u)=2\pi\sin^2u$ גזירה ברציפות, ועל $[0,2\pi]$: היא עולה מ-$0$ ל-$2\pi$ על $[0,\frac\pi2]$
          ($\varphi_2'=2\pi\sin2u\ge0$ שם) ויורדת חזרה ל-$0$ על $[\frac\pi2,\pi]$ ($\varphi_2'\le0$). נסמן $\delta_2=\gamma\circ\varphi_2$.
      - kind: step
        text: >-
          לפי טענה 1.2.4 (חיבוריות), $L(\delta_2)=L(\delta_2|_{[0,\pi/2]})+L(\delta_2|_{[\pi/2,\pi]})$. על כל חצי $\varphi_2$ גזירה
          ברציפות, מונוטונית ועל $[0,2\pi]$, ולכן לפי משפט 1.2.9 כל חצי תורם $L(\gamma)=2\pi$. לכן $L(\delta_2)=4\pi\ne2\pi$, והטענה שגויה.
      - kind: check
        text: >-
          חישוב מספרי נותן $6.283185$ ו-$12.566371$. ב-(ב) התמונה היא מעגל היחידה, אבל $\delta_2$ מקיפה אותו הלוך וחזור: בלי
          מונוטוניות משפט 1.2.9 לא חל, וזו ההנחה שנכשלת.
      - kind: result
        text: >-
          (א) $2\pi$. (ב) הטענה שגויה: $L(\gamma\circ\varphi_2)=4\pi$.

  - id: W-1.2-07
    level: mid
    objectives: [OBJ-1.2-3]
    prompt: >-
      (א) תהי $\beta:J\to\mathbb R^n$ בפרמטר אורך הקשת על קטע $J$. הוכיחו שלכל $\sigma_1,\sigma_2\in J$
      $$\|\beta(\sigma_2)-\beta(\sigma_1)\|\le|\sigma_2-\sigma_1|,$$
      ושיש שוויון לכל $\sigma_1,\sigma_2$ אם ורק אם $\beta(\sigma)=\mathbf p+\sigma\mathbf u$ עם $\|\mathbf u\|=1$.

      (ב) כתבו את הספירלה על החרוט $\gamma(t)=e^t(\cos t,\ \sin t,\ 1)$, $t\ge0$, בפרמטר אורך הקשת מ-$t=0$, ובדקו שהמהירות 1.
    answer: >-
      (א) למה 1.2.3 וטענה 1.2.12; שוויון בכל מקום מאלץ את המסילה להיות על ישר (שוויון במשולש). (ב) $s=\sqrt3(e^t-1)$ ו-$t(s)=\ln\big(1+\frac{s}{\sqrt3}\big)$, ולכן $$\tilde\gamma(s)=\Big(1+\frac{s}{\sqrt3}\Big)\big(\cos t(s),\ \sin t(s),\ 1\big).$$
    solution:
      - kind: step
        text: >-
          (א) אי-השוויון: נניח $\sigma_1<\sigma_2$. לפי למה 1.2.3 על הקטע $[\sigma_1,\sigma_2]$,
          $\|\beta(\sigma_2)-\beta(\sigma_1)\|\le L(\beta|_{[\sigma_1,\sigma_2]})$, ולפי טענה 1.2.12 האורך הזה הוא $\sigma_2-\sigma_1$.
      - kind: step
        text: >-
          ($\Leftarrow$) אם $\beta(\sigma)=\mathbf p+\sigma\mathbf u$, אז $\|\beta'\|=\|\mathbf u\|=1$ ו-$\|\beta(\sigma_2)-\beta(\sigma_1)\|=|\sigma_2-\sigma_1|$.
      - kind: step
        text: >-
          ($\Rightarrow$) נקבע $a<b$ ב-$J$, ונסמן $\mathbf u=\frac{\beta(b)-\beta(a)}{b-a}$, וקטור יחידה לפי ההנחה. יהי $\sigma\in J$, ונסדר
          את שלוש הנקודות $x<y<z$ מבין $a,b,\sigma$. לפי ההנחה
          $$\|\beta(y)-\beta(x)\|+\|\beta(z)-\beta(y)\|=(y-x)+(z-y)=\|\beta(z)-\beta(x)\|.$$
      - kind: step
        text: >-
          שוויון באי-שוויון המשולש בנורמה האוקלידית קורה רק כששני הווקטורים כפולות אי-שליליות של אותו וקטור (מקרה השוויון
          בקושי-שוורץ, שיעור 0.2). לכן $\beta(y)$ על הקטע מ-$\beta(x)$ ל-$\beta(z)$, במרחק $y-x$ מ-$\beta(x)$: שלוש הנקודות על
          ישר, ועליו $\beta$ מתקדמת במרחק השווה להפרש הפרמטרים.
      - kind: step
        text: >-
          בשלושת הסידורים האפשריים של $\sigma$ ביחס ל-$a<b$ זה נותן $\beta(\sigma)=\beta(a)+(\sigma-a)\mathbf u$: הכיוון מ-$\beta(a)$ ל-$\beta(b)$
          הוא $\mathbf u$, ו-$\beta(\sigma)$ על אותו ישר, בצד הנכון ובמרחק $|\sigma-a|$. זו הצורה $\mathbf p+\sigma\mathbf u$ עם $\mathbf p=\beta(a)-a\mathbf u$.
      - kind: computation
        text: >-
          (ב) גוזרים בכלל המכפלה: $$\gamma'(t)=e^t(\cos t-\sin t,\ \sin t+\cos t,\ 1),$$ ו-$\|\gamma'(t)\|^2=e^{2t}(2+1)$, ולכן $\|\gamma'(t)\|=\sqrt3e^t$.
      - kind: computation
        text: >-
          $$s(t)=\int_0^t\sqrt3e^\tau d\tau=\sqrt3(e^t-1).$$ ההפכית: $e^t=1+\frac{s}{\sqrt3}$, כלומר $t(s)=\ln\big(1+\frac{s}{\sqrt3}\big)$.
      - kind: step
        text: >-
          $e^{t(s)}=1+\frac{s}{\sqrt3}$, ולכן
          $$\tilde\gamma(s)=\Big(1+\frac{s}{\sqrt3}\Big)\big(\cos t(s),\ \sin t(s),\ 1\big).$$
      - kind: check
        text: >-
          $t'(s)=\frac{1}{\sqrt3+s}$ ו-$\|\gamma'(t(s))\|=\sqrt3+s$: המכפלה $1$. חישוב מספרי של האורך של $\tilde\gamma$ על $[0,2]$ נותן $2$.
      - kind: result
        text: >-
          (א) $\beta$ היא 1-ליפשיצית, ושוויון בכל מקום רק בתנועה במהירות $1$ על ישר. (ב)
          $$\tilde\gamma(s)=\Big(1+\frac{s}{\sqrt3}\Big)\big(\cos t(s),\ \sin t(s),\ 1\big),$$ עם $t(s)=\ln\big(1+\frac{s}{\sqrt3}\big)$.

  - id: W-1.2-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.2-2]
    prompt: >-
      ההוכחה בשיעור שהאורך לא תלוי בפרמטריזציה השתמשה בנגזרות. הוכיחו אותה מההגדרה בעזרת קווים שבורים, בלי נגזרות:
      אם $\gamma:[a,b]\to\mathbb R^n$ רציפה ו-$\varphi:[c,d]\to[a,b]$ רציפה, עולה ממש ועל, אז $L(\gamma\circ\varphi)=L(\gamma)$.
    answer: >-
      $\varphi$ מעבירה חלוקות של $[c,d]$ בהתאמה חד-חד-ערכית ועל לחלוקות של $[a,b]$, עם אותו קו שבור; לכן קבוצות ה-$\ell$ שוות, וגם הסופרמומים.
    solution:
      - kind: idea
        text: >-
          לחלוקה של $[c,d]$ ולתמונה שלה תחת $\varphi$ יש אותן נקודות על המסילה, ולכן אותו קו שבור. אם כל חלוקה מתקבלת כך, הסופרמום על אותה קבוצה של מספרים.
      - kind: step
        text: >-
          $\varphi$ רציפה, עולה ממש ועל, ולכן הפיכה עם הפכית עולה ממש. לחלוקה $Q:\ c=u_0<\dots<u_m=d$ נתאים
          $$\varphi(Q):\ a=\varphi(u_0)<\dots<\varphi(u_m)=b$$, חלוקה של $[a,b]$; וכל חלוקה $P$ של $[a,b]$ היא $\varphi(Q)$ עם $Q=\varphi^{-1}(P)$.
      - kind: step
        text: >-
          הנקודות $(\gamma\circ\varphi)(u_i)=\gamma(\varphi(u_i))$ זהות, ולכן $\ell_{\gamma\circ\varphi}(Q)=\ell_\gamma(\varphi(Q))$.
      - kind: step
        text: >-
          לכן $\{\ell_{\gamma\circ\varphi}(Q)\}_Q=\{\ell_\gamma(P)\}_P$, אותה קבוצה של מספרים, ולשתי הקבוצות אותו סופרמום (גם אם הוא $\infty$).
      - kind: check
        text: >-
          לא השתמשנו בגזירות כלל, ולכן הטענה נכונה גם למסילות רציפות בלבד. אם $\varphi$ יורדת ממש, אותו טיעון עם החלוקה בסדר הפוך. אם $\varphi$ אינה מונוטונית, הנקודות $\varphi(u_i)$ אינן בסדר עולה, ולכן $\ell_{\gamma\circ\varphi}(Q)$ אינו $\ell_\gamma$ של שום חלוקה, וההתאמה נשברת.
      - kind: result
        text: >-
          $L(\gamma\circ\varphi)=L(\gamma)$ לכל $\varphi$ רציפה, מונוטונית ממש ועל.

  - id: W-1.2-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      מסילות $\gamma_k,\gamma:[a,b]\to\mathbb R^n$ רציפות, ו-$\gamma_k(t)\to\gamma(t)$ לכל $t\in[a,b]$.

      (א) הוכיחו ש-$L(\gamma)\le\liminf_{k\to\infty}L(\gamma_k)$ (חצי-רציפות מלרע של האורך).

      (ב) הראו שאי-השוויון יכול להיות חזק. "מדרגות": $\gamma_k:[0,1]\to\mathbb R^2$ עוברת על כל קטע $[\frac jk,\frac{j+1}k]$
      ($0\le j<k$) קודם אופקית מ-$(\frac jk,\frac jk)$ ל-$(\frac{j+1}k,\frac jk)$ ואחר כך אנכית ל-$(\frac{j+1}k,\frac{j+1}k)$, כל צלע
      במהירות קבועה בחצי הקטע שלה. הוכיחו ש-$L(\gamma_k)=2$, ש-$\gamma_k$ מתכנסות במידה שווה לאלכסון $\gamma(t)=(t,t)$,
      וש-$L(\gamma)=\sqrt2$.
    answer: >-
      (א) לכל חלוקה $P$, $$\ell_\gamma(P)=\lim_k\ell_{\gamma_k}(P)\le\liminf_kL(\gamma_k),$$ ואז סופרמום על $P$.
      (ב) $L(\gamma_k)=2$, $\sup_t\|\gamma_k(t)-\gamma(t)\|=\frac{1}{\sqrt2\,k}\to0$, ו-$\sqrt2<2$.
    solution:
      - kind: idea
        text: >-
          לחלוקה קבועה, $\ell(P)$ תלוי רק במספר סופי של נקודות, ולכן מתכנס כשהמסילות מתכנסות נקודתית. האורך הוא סופרמום של
          גדלים כאלה, וסופרמום של גבולות לא יכול לעלות על הגבול התחתון של הסופרמומים. בכיוון ההפוך אין ערובה: מסילה
          קרובה מאוד יכולה להתפתל.
      - kind: step
        text: >-
          (א) תהי $P:\ a=t_0<\dots<t_m=b$ חלוקה קבועה. $\ell_{\gamma_k}(P)$ הוא סכום של $m$ מחוברים
          $\|\gamma_k(t_i)-\gamma_k(t_{i-1})\|$, והנורמה רציפה, ולכן $\ell_{\gamma_k}(P)\to\ell_\gamma(P)$ כש-$k\to\infty$.
      - kind: step
        text: >-
          לפי למה 1.2.3, $\ell_{\gamma_k}(P)\le L(\gamma_k)$ לכל $k$. גבול תחתון שומר על אי-שוויון חלש, ולכן
          $$\ell_\gamma(P)=\lim_{k}\ell_{\gamma_k}(P)\le\liminf_{k}L(\gamma_k).$$
      - kind: step
        text: >-
          הצד הימני לא תלוי ב-$P$. לוקחים סופרמום על כל החלוקות: $L(\gamma)\le\liminf_kL(\gamma_k)$ (נכון גם כשהצד הימני
          $\infty$).
      - kind: computation
        text: >-
          (ב) במפורש, ל-$t\in[\frac jk,\frac{j+1/2}k]$ ול-$t\in[\frac{j+1/2}k,\frac{j+1}k]$ בהתאמה:
          $$\gamma_k(t)=\Big(\tfrac jk+2\big(t-\tfrac jk\big),\ \tfrac jk\Big),\qquad \gamma_k(t)=\Big(\tfrac{j+1}k,\ \tfrac jk+2\big(t-\tfrac{j+1/2}k\big)\Big).$$
          בנקודות המעבר שני הביטויים נותנים את אותה נקודה, ולכן $\gamma_k$ רציפה.
      - kind: step
        text: >-
          כל צלע היא מסילה גזירה ברציפות במהירות קבועה $2$ על קטע באורך $\frac{1}{2k}$, ולכן לפי משפט 1.2.7 אורכה $\frac1k$.
          לפי החיבוריות (טענה 1.2.4) על $2k$ הצלעות, $L(\gamma_k)=2k\cdot\frac1k=2$.
      - kind: computation
        text: >-
          על הצלע האופקית ועל האנכית, בהתאמה,
          $$\gamma_k(t)-(t,t)=\big(t-\tfrac jk\big)(1,-1),\qquad \gamma_k(t)-(t,t)=\big(\tfrac{j+1}k-t\big)(1,-1).$$
          בשני המקרים המקדם בין $0$ ל-$\frac{1}{2k}$, ולכן
          $$\sup_{t}\|\gamma_k(t)-(t,t)\|=\frac{\sqrt2}{2k}=\frac{1}{\sqrt2\,k}\to0:$$
          התכנסות במידה שווה, ובפרט נקודתית.
      - kind: step
        text: >-
          $\gamma(t)=(t,t)$ גזירה ברציפות עם $\|\gamma'\|=\sqrt2$, ולכן $L(\gamma)=\sqrt2$. אבל $\liminf_kL(\gamma_k)=2>\sqrt2$:
          אי-השוויון של (א) חזק. האורך אינו רציף ביחס להתכנסות במידה שווה.
      - kind: check
        text: >-
          חישוב מספרי: $L(\gamma_k)=2$, והמרחק המקסימלי מהאלכסון $0.7071,\ 0.1768,\ 0.0707$ ל-$k=1,\ 4,\ 10$, בדיוק
          $\frac{1}{\sqrt2\,k}$. זה גם הפתרון ל"הוכחה" הידועה ש-$\sqrt2=2$: היא מניחה בשקט שאורך רציף.
      - kind: result
        text: >-
          (א) $L(\gamma)\le\liminf_kL(\gamma_k)$. (ב) המדרגות באורך $2$ מתכנסות במידה שווה לאלכסון באורך $\sqrt2$.

  - id: W-1.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      תהי $\gamma:[0,\infty)\to\mathbb R^n$ גזירה ברציפות, ונניח שהאינטגרל הלא אמיתי $\int_0^\infty\|\gamma'(t)\|\,dt$ מתכנס: המסילה
      "באורך סופי".

      (א) הוכיחו שהגבול $\lim_{t\to\infty}\gamma(t)$ קיים.

      (ב) הוכיחו שהכיוון ההפוך שגוי: $\gamma(t)=\frac{1}{t+1}(\cos t,\ \sin t)$ שואפת ל-$0$, אבל $\int_0^\infty\|\gamma'\|=\infty$.
    answer: >-
      (א) $\|\gamma(t)-\gamma(u)\|\le\int_u^t\|\gamma'\|$, ותנאי קושי באינסוף. (ב) $\|\gamma'(t)\|\ge\frac{1}{t+1}$, שהאינטגרל שלה מתבדר.
    solution:
      - kind: idea
        text: >-
          המרחק בין שתי נקודות על המסילה קטן מאורך הקשת ביניהן (למה 1.2.6). אם "הזנב" של האורך קטן, גם התזוזה בזנב
          קטנה: זה תנאי קושי.
      - kind: step
        text: >-
          (א) נסמן $S(t)=\int_0^t\|\gamma'\|$. ל-$0\le u<t$, לפי המשפט היסודי ברכיבים ולפי למה 1.2.6,
          $$\|\gamma(t)-\gamma(u)\|=\Big\|\int_u^t\gamma'\Big\|\le\int_u^t\|\gamma'\|=S(t)-S(u).$$
      - kind: step
        text: >-
          לפי ההנחה ל-$S$ יש גבול סופי כש-$t\to\infty$, ולכן היא מקיימת את תנאי קושי באינסוף (אינפי 1): לכל $\varepsilon>0$
          יש $T$ כך ש-$|S(t)-S(u)|<\varepsilon$ לכל $t,u>T$.
      - kind: step
        text: >-
          לכן $\|\gamma(t)-\gamma(u)\|<\varepsilon$ לכל $t,u>T$. ההפרש בכל רכיב חסום בנורמה:
          $$|\gamma_j(t)-\gamma_j(u)|\le\|\gamma(t)-\gamma(u)\|,$$
          ולפי תנאי קושי לפונקציה ממשית באינסוף לכל רכיב יש גבול. לכן $\lim_{t\to\infty}\gamma(t)$ קיים.
      - kind: computation
        text: >-
          (ב) $\|\gamma(t)\|=\frac{1}{t+1}\to0$. בכלל המכפלה
          $$\gamma'(t)=-\frac{1}{(t+1)^2}(\cos t,\ \sin t)+\frac{1}{t+1}(-\sin t,\ \cos t).$$
          שני הווקטורים ניצבים זה לזה, ולכן
          $$\|\gamma'(t)\|^2=\frac{1}{(t+1)^4}+\frac{1}{(t+1)^2}\ge\frac{1}{(t+1)^2}.$$
      - kind: step
        text: >-
          לכן, כש-$T\to\infty$,
          $$\int_0^T\|\gamma'\|\ge\int_0^T\frac{dt}{t+1}=\ln(T+1)\to\infty:$$
          האינטגרל הלא אמיתי מתבדר.
      - kind: check
        text: >-
          חישוב מספרי: האורך על $[0,10]$ הוא $2.622$, מעל $\ln11\approx2.398$; על $[0,100]$ הוא $4.841$, מעל
          $\ln101\approx4.615$. והספירלה של דוגמה 6 בשיעור, עם $\int_0^\infty\|\gamma'\|=\sqrt{26}$, אכן מתכנסת לראשית.
      - kind: result
        text: >-
          (א) אורך סופי גורר שהגבול באינסוף קיים. (ב) קיום הגבול אינו גורר אורך סופי.

challenge:
  - id: W-1.2-c1
    stars: 1
    objectives: [OBJ-1.2-1]
    prompt: >-
      הפונקציות $x,y:[a,b]\to\mathbb R$ מקיימות תנאי ליפשיץ: יש $M$ כך ש-$|x(t)-x(u)|\le M|t-u|$ ו-$|y(t)-y(u)|\le M|t-u|$
      לכל $t,u$. הוכיחו שלמסילה $\Gamma(t)=(x(t),\ y(t))$ יש אורך סופי, ותנו חסם עליו. האם החסם נכון גם כש-$x,y$ אינן גזירות?
    answer: >-
      $L(\Gamma)\le\sqrt2\,M(b-a)$; כן, ההוכחה לא משתמשת בנגזרות.
    solution:
      - kind: idea
        text: >-
          כל מיתר קצר מ-$\sqrt2M$ כפול אורך קטע הפרמטר שלו. סכום אורכי הקטעים הוא $b-a$, לכל חלוקה.
      - kind: step
        text: >-
          לחלוקה $P$ ולכל $i$:
          $$\|\Gamma(t_i)-\Gamma(t_{i-1})\|=\sqrt{(x(t_i)-x(t_{i-1}))^2+(y(t_i)-y(t_{i-1}))^2}\le\sqrt2\,M\Delta_i.$$
      - kind: step
        text: >-
          מסכמים: $$\ell(P)\le\sqrt2M\sum_i\Delta_i=\sqrt2M(b-a)$$. החסם לא תלוי ב-$P$, ולכן $L(\Gamma)\le\sqrt2M(b-a)<\infty$.
      - kind: check
        text: >-
          לא השתמשנו בגזירות: $x(t)=|t|$, $y(t)=0$ על $[-1,1]$ ליפשיץית עם $M=1$ ואינה גזירה ב-$0$, ואורכה $2\le2\sqrt2$. והחסם מושג: הישר $(t,t)$, עם $M=1$, באורך בדיוק $\sqrt2(b-a)$.
      - kind: result
        text: >-
          $L(\Gamma)\le\sqrt2\,M(b-a)$.
    source:
      name: 'אינפי מתקדם 2 (80316), האוניברסיטה העברית, רות לורנס-נוימרק: דף תרגיל 2'
      year: 2002
      problem: 'תרגיל 2'
      url: http://www.ma.huji.ac.il/~ruthel/courses/infimb02/infimb02-ex02.html
      verified: '2026-11-09'
