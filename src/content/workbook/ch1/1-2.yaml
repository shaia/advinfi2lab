  - id: W-1.2-c2
    stars: 1
    objectives: [OBJ-1.2-1]
    prompt: >-
      תהי $\gamma:[0,1]\to\mathbb R^2$ רציפה עם $\gamma([0,1])=[0,1]^2$, מסילה שממלאת ריבוע (מסילות כאלה קיימות: מסילת פאנו).
      הוכיחו שאין לה אורך.

      (רמז: אם $L=L(\gamma)<\infty$, הראו קודם שהפונקציה $s(t)=L(\gamma|_{[0,t]})$ רציפה ועולה, ואז חלקו את $[0,1]$ ל-$n$ חלקים שבכל אחד מהם האורך $\frac Ln$.)
    answer: >-
      אם $L<\infty$, הריבוע מכוסה ב-$n$ עיגולים ברדיוס $\frac Ln$, שסכום שטחיהם $\frac{\pi L^2}{n}\to0$, בסתירה לשטח $1$.
    solution:
      - kind: idea
        text: >-
          קשת באורך $\ell$ לא מתרחקת מנקודת ההתחלה שלה יותר מ-$\ell$, ולכן נמצאת בעיגול ברדיוס $\ell$. אם כל המסילה באורך סופי, אפשר לכסות אותה בהרבה עיגולים קטנים ששטחם הכולל זניח, ואז היא לא יכולה למלא ריבוע.
      - kind: step
        text: >-
          **אורך מתחבר.** ל-$0\le u\le v\le1$ מתקיים $$L(\gamma|_{[0,v]})=L(\gamma|_{[0,u]})+L(\gamma|_{[u,v]}):$$ כל חלוקה של $[0,v]$ אפשר לעדן כך שתכיל את $u$ (וזה רק מאריך), ואז היא איחוד של חלוקה של $[0,u]$ וחלוקה של $[u,v]$; ולהפך.
      - kind: step
        text: >-
          **$s$ רציפה מימין.** $s$ לא יורדת (החיבוריות). יהיו $t_0<1$ ו-$\varepsilon>0$. יש חלוקה $t_0<t_1<\dots<t_m=1$ של $[t_0,1]$ עם
          אורך $\ell>L(\gamma|_{[t_0,1]})-\varepsilon$, ומרציפות $\gamma$ יש $t^*\in(t_0,t_1)$ עם $\|\gamma(t^*)-\gamma(t_0)\|<\varepsilon$. החלוקה
          $t^*<t_1<\dots<t_m$ של $[t^*,1]$ ארוכה, לפי אי-שוויון המשולש, לפחות $\ell-\|\gamma(t^*)-\gamma(t_0)\|$. לכן
          $$L(\gamma|_{[t^*,1]})>\ell-\varepsilon>L(\gamma|_{[t_0,1]})-2\varepsilon,$$
          ולפי החיבוריות $s(t^*)-s(t_0)=L(\gamma|_{[t_0,t^*]})<2\varepsilon$; ו-$s$ לא יורדת, ולכן גם $0\le s(t)-s(t_0)<2\varepsilon$ לכל $t\in(t_0,t^*)$.
      - kind: step
        text: >-
          **$s$ רציפה משמאל.** יהיו $t_0>0$ ו-$\varepsilon>0$. יש חלוקה $0=t_0'<\dots<t_{m-1}'<t_m'=t_0$ של $[0,t_0]$ עם אורך
          $\ell'>s(t_0)-\varepsilon$, ומרציפות $\gamma$ יש $t^*\in(t'_{m-1},t_0)$ עם $\|\gamma(t_0)-\gamma(t^*)\|<\varepsilon$. החלוקה
          $t_0'<\dots<t'_{m-1}<t^*$ של $[0,t^*]$ ארוכה לפחות $\ell'-\|\gamma(t_0)-\gamma(t^*)\|>s(t_0)-2\varepsilon$, ולכן
          $s(t^*)>s(t_0)-2\varepsilon$, וכך גם לכל $t\in(t^*,t_0)$, כי $s$ לא יורדת.
      - kind: step
        text: >-
          **חלוקה לחלקים שווים.** $L>0$: התמונה היא הריבוע, ולכן $\gamma$ אינה קבועה, ויש $t$ עם $0<\|\gamma(t)-\gamma(0)\|\le L$.
          $s$ רציפה ולא יורדת מ-$s(0)=0$ ל-$s(1)=L$, ולפי משפט ערך הביניים יש $0=u_0\le u_1\le\dots\le u_n=1$ עם $s(u_j)=\frac{jL}{n}$;
          הערכים $\frac{jL}n$ שונים זה מזה, ולכן $u_0<u_1<\dots<u_n$, וכל קשת $\gamma|_{[u_{j-1},u_j]}$ באורך $\frac Ln$ (חיבוריות).
      - kind: step
        text: >-
          **כיסוי.** לכל $t\in[u_{j-1},u_j]$, החלוקה $\{u_{j-1},t,u_j\}$ נותנת $\|\gamma(t)-\gamma(u_{j-1})\|\le\frac Ln$. לכן התמונה של הקשת ה-$j$ בתוך העיגול הסגור ברדיוס $\frac Ln$ סביב $\gamma(u_{j-1})$, והריבוע כולו בתוך איחוד של $n$ עיגולים כאלה.
      - kind: step
        text: >-
          **סתירה.** שטח (תכולת ז׳ורדן, פרק 0.5) מונוטוני ותת-אדיטיבי. שטח הריבוע הוא $1$, ושטח כל עיגול הוא $\pi\frac{L^2}{n^2}$, ולכן $$1\le n\cdot\pi\frac{L^2}{n^2}=\frac{\pi L^2}{n}$$ לכל $n$. עבור $n>\pi L^2$ זו סתירה.
      - kind: check
        text: >-
          איפה נשען על "ממלאת ריבוע"? רק בשטח $1$ של התמונה. אותו טיעון מראה שתמונה של כל מסילה בעלת אורך היא קבוצה בעלת שטח $0$: מסילה עם אורך היא "דקה".
      - kind: result
        text: >-
          למסילה שממלאת ריבוע אין אורך.
