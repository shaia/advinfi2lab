# Workbook of lesson 1.5 — signed curvature of a plane curve.
# Objectives (src/course.ts):
#   OBJ-1.5-1  signed curvature via the rotated normal; its sign by the turning direction
#   OBJ-1.5-2  signed curvature is the rate of change of the tangent angle in arc length
#   OBJ-1.5-3  reversal and reflection flip it; translation and rotation keep it
# Every number recomputed with src/math/planecurves.ts and geometry.ts (signedK, signedCurvature,
# totalSignedCurvature, rotatedNormal) on 2026-11-09.
lesson: '1.5'
practice:
  - id: W-1.5-01
    level: basic
    objectives: [OBJ-1.5-1, OBJ-1.5-3]
    prompt: >-
      (א) חשבו את העקמומיות המסומנת של $\gamma(t)=(t,\ e^t)$ ב-$t=0$. לאן המסילה פונה שם?

      (ב) $\delta(t)=(-t,\ e^{-t})$ עוברת על אותו גרף מימין לשמאל, וגם היא ב-$(0,1)$ ב-$t=0$. מהי $k_\delta(0)$?
    answer: >-
      (א) $k=\frac{1}{2\sqrt2}\approx0.3536$, שמאלה. (ב) $-\frac{1}{2\sqrt2}$.
    solution:
      - kind: theorem
        text: >-
          לגרף שנעבר משמאל לימין $k=\frac{f''}{(1+f'^2)^{3/2}}$; בכל פרמטר
          $$k=\frac{x'y''-y'x''}{(x'^2+y'^2)^{3/2}}.$$
      - kind: computation
        text: >-
          (א) $f=e^x$, ב-$x=0$: $f'=f''=1$, ולכן $k=\frac{1}{2^{3/2}}$. $k>0$: הגרף קעור כלפי מעלה, והמסילה פונה שמאלה.
      - kind: computation
        text: >-
          (ב) $x'=-1$, $y'=-e^{-t}$, $x''=0$, $y''=e^{-t}$. ב-$t=0$: $x'y''-y'x''=-1$ ו-$x'^2+y'^2=2$, ולכן $k_\delta(0)=-\frac{1}{2^{3/2}}$.
      - kind: check
        text: >-
          זה היפוך כיוון: $k_\delta=-k_\gamma$ באותה נקודה, כמו בשיעור. $|k|$ זהה בשני הכיוונים, כי $\kappa$ לא מרגישה בכיוון.
      - kind: result
        text: >-
          (א) $\frac{1}{2\sqrt2}$, פנייה שמאלה. (ב) $-\frac{1}{2\sqrt2}$, פנייה ימינה.

  - id: W-1.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.5-1]
    prompt: >-
      מסילה בפרמטר אורך הקשת עוברת בנקודה $P$ ונעה שם כלפי מעלה: $\mathbf t=(0,1)$.

      (א) מהו $\mathbf n_s$ ב-$P$?

      (ב) נתון $\mathbf t'=(3,\ 0)$ ב-$P$. מהם $k$ ו-$\kappa$, ולאן המסילה פונה?
    answer: >-
      (א) $\mathbf n_s=(-1,0)$. (ב) $k=-3$, $\kappa=3$, ימינה.
    solution:
      - kind: definition
        text: >-
          $\mathbf n_s=J\mathbf t$ עם $J(a,b)=(-b,a)$, ו-$\mathbf t'=k\,\mathbf n_s$.
      - kind: computation
        text: >-
          (א) $J(0,1)=(-1,0)$: שמאלה, מנקודת המבט של מי שנע כלפי מעלה.
      - kind: computation
        text: >-
          (ב) $(3,0)=-3\cdot(-1,0)=-3\,\mathbf n_s$, ולכן $k=-3$ ו-$\kappa=|k|=3$.
      - kind: check
        text: >-
          המשיק מתחיל להצביע ימינה (רכיב $x$ חיובי נוסף לו), ומי שנוסע למעלה ופונה לכיוון $+x$ פונה ימינה: הסימן השלילי מתאים.
      - kind: result
        text: >-
          (א) $(-1,0)$. (ב) $k=-3$, $\kappa=3$; המסילה פונה ימינה, ו-$\mathbf n=-\mathbf n_s=(1,0)$.

  - id: W-1.5-03
    level: basic
    objectives: [OBJ-1.5-2]
    prompt: >-
      (א) הוכיחו: אם $f\in C^2[a,b]$ והגרף $(x,\ f(x))$ נעבר משמאל לימין, אז $\int k\,ds=\arctan f'(b)-\arctan f'(a)$.

      (ב) חשבו בעזרת (א) את $\int k\,ds$ לאורך הפרבולה $y=-x^2$ מ-$(-1,-1)$ עד $(1,-1)$, בלי לחשב אינטגרל.
    answer: >-
      (א) $\theta=\arctan f'$ היא זווית משיק. (ב) $-2\arctan2\approx-2.2143$.
    solution:
      - kind: idea
        text: >-
          $\int k\,ds$ הוא זווית המשיק בסוף פחות זווית המשיק בהתחלה (מסקנה 1.5.13), וצריך רק למצוא זווית משיק רציפה של הגרף.
      - kind: step
        text: >-
          (א) $\gamma'=(1,\ f')$, ולכן $\mathbf t=\frac{(1,\ f')}{\sqrt{1+f'^2}}$. עם $\theta=\arctan f'$, שערכיה ב-$(-\frac\pi2,\frac\pi2)$:
          $\cos\theta=\frac{1}{\sqrt{1+f'^2}}$ ו-$\sin\theta=\frac{f'}{\sqrt{1+f'^2}}$, כלומר $\mathbf t=(\cos\theta,\ \sin\theta)$. $\theta$ רציפה (הרכבה של
          רציפות), ולכן היא זווית משיק (הגדרה 1.5.11), ולפי מסקנה 1.5.13 $\int k\,ds=\theta(b)-\theta(a)$.
      - kind: computation
        text: >-
          (ב) $f'(x)=-2x$, ולכן $\theta(-1)=\arctan2$ ו-$\theta(1)=-\arctan2$.
      - kind: step
        text: >-
          $$\int k\,ds=-\arctan2-\arctan2=-2\arctan2$$.
      - kind: check
        text: >-
          הפרבולה קעורה כלפי מטה ונעברת משמאל לימין, ולכן פונה ימינה כל הזמן: הסימן שלילי. וחישוב מספרי של האינטגרל נותן $-2.2143$.
      - kind: result
        text: >-
          (א) הוכח: $\theta=\arctan f'$ היא זווית משיק. (ב) $-2\arctan2\approx-2.2143$.

  - id: W-1.5-04
    level: mid
    objectives: [OBJ-1.5-2]
    prompt: >-
      הפורשת של מעגל היחידה: $$\gamma(t)=(\cos t+t\sin t,\ \ \sin t-t\cos t)$$, $t>0$ (קצה של חוט שנפרש מגליל).

      (א) חשבו את $\gamma'(t)$ ומצאו זווית משיק רציפה $\theta(t)$.

      (ב) הסיקו את $k(t)$ מתוך $\theta$.
    answer: >-
      (א) $\gamma'=t(\cos t,\ \sin t)$, $\theta(t)=t$. (ב) $k(t)=\frac1t$.
    solution:
      - kind: computation
        text: >-
          (א) בכלל המכפלה: $$x'=-\sin t+\sin t+t\cos t=t\cos t$$ ו-$y'=\cos t-\cos t+t\sin t=t\sin t$. לכן $\gamma'=t(\cos t,\ \sin t)$.
      - kind: step
        text: >-
          $t>0$, ולכן $\mathbf t=(\cos t,\ \sin t)$, ו-$\theta(t)=t$ היא זווית משיק רציפה.
      - kind: computation
        text: >-
          (ב) $\frac{ds}{dt}=\|\gamma'\|=t$ ו-$\frac{d\theta}{dt}=1$. לכן $k=\frac{d\theta/dt}{ds/dt}=\frac1t$.
      - kind: check
        text: >-
          בנוסחת הדטרמיננטה: $$\gamma''=(\cos t-t\sin t,\ \sin t+t\cos t)$$, ו-$x'y''-y'x''=t^2$, ולכן $k=\frac{t^2}{t^3}=\frac1t$. חישוב מספרי ב-$t=2$ נותן $0.5$.
      - kind: result
        text: >-
          $\theta(t)=t$, $k(t)=\frac1t$: ככל שהחוט נפרש, הפורשת מתיישרת.

  - id: W-1.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-3]
    prompt: >-
      $\gamma$ מסילה מישורית רגולרית מסדר $C^2$ ו-$A$ מטריצה הפיכה $2\times2$. הוכיחו או הפריכו, לפי הטענות של השיעור או
      בדוגמה נגדית.

      (א) $|k_{A\gamma}(t)|=|k_\gamma(t)|$ לכל $A$ הפיכה ולכל $t$.

      (ב) עם $A=2I$: $k_{A\gamma}=\frac12k_\gamma$.

      (ג) עם $A=-I$: $k_{A\gamma}=k_\gamma$.

      (ד) עם $A(x,y)=(y,x)$: $k_{A\gamma}=k_\gamma$.
    answer: >-
      (א) לא נכון: $(x,y)\mapsto(x,2y)$ על מעגל היחידה נותנת $k(0)=\frac14\ne1$. (ב) נכון. (ג) נכון. (ד) לא נכון: $k\mapsto-k$.
    solution:
      - kind: idea
        text: >-
          למטריצה אורתוגונלית $k_{Q\gamma}=(\det Q)\,k_\gamma$ (טענה 1.5.17), ולהגדלה $k_{\lambda\gamma}=\frac{k_\gamma}{|\lambda|}$ (טענה 1.5.18). מטריצה שאינה מהסוגים האלה
          לא מקבלת שום הבטחה, ולכן מחפשים לה דוגמה נגדית.
      - kind: computation
        text: >-
          (א) $A(x,y)=(x,2y)$ ו-$\gamma=(\cos t,\ \sin t)$ עם $k_\gamma\equiv1$. אז $A\gamma=(\cos t,\ 2\sin t)$, וב-$t=0$ הנגזרות הן $(0,2)$ ו-$(-1,0)$:
          $$k_{A\gamma}(0)=\frac{0\cdot0-2\cdot(-1)}{2^3}=\frac14\ne1.$$
          הטענה לא נכונה.
      - kind: step
        text: >-
          (ב) לפי טענה 1.5.18 עם $\lambda=2$: $k_{2\gamma}=\frac{k_\gamma}{2}$. נכון.
      - kind: step
        text: >-
          (ג) $-I$ אורתוגונלית עם $\det(-I)=1$, ולפי טענה 1.5.17 (שעוברת לפרמטר כללי דרך הגדרה 1.5.6, כי $-I$ שומרת אורכים): $k_{-\gamma}=k_\gamma$. נכון.
      - kind: step
        text: >-
          (ד) $\begin{pmatrix}0&1\\1&0\end{pmatrix}$ אורתוגונלית עם דטרמיננטה $-1$, ולכן $k_{A\gamma}=-k_\gamma$. זה שווה ל-$k_\gamma$ רק איפה ש-$k_\gamma=0$;
          במעגל היחידה $k_\gamma=1$ ו-$k_{A\gamma}=-1$. הטענה לא נכונה.
      - kind: check
        text: >-
          (א) ב-$t=\frac\pi2$ אותה אליפסה נותנת $k=2$: העתקה לינארית שאינה אורתוגונלית משנה את העקמומיות בצורה שונה בנקודות שונות, ולא רק בגורם קבוע.
      - kind: result
        text: >-
          (א) לא נכון; (ב) נכון; (ג) נכון; (ד) לא נכון.

  - id: W-1.5-06
    level: mid
    objectives: [OBJ-1.5-1]
    prompt: >-
      הציקלואידה $\gamma(t)=(t-\sin t,\ 1-\cos t)$, $0<t<2\pi$.

      (א) חשבו את העקמומיות המסומנת $k(t)$.

      (ב) הסבירו את הסימן בלי חישוב, מתוך התנועה.
    answer: >-
      (א) $k(t)=-\frac{1}{4\sin(t/2)}$. (ב) הנקודה עולה וחוזרת לציר כשהיא נעה ימינה: פנייה ימינה.
    solution:
      - kind: computation
        text: >-
          $x'=1-\cos t$, $y'=\sin t$, $x''=\sin t$, $y''=\cos t$. לכן
          $$x'y''-y'x''=\cos t-1=-2\sin^2\tfrac t2,$$
          ו-$x'^2+y'^2=4\sin^2\frac t2$.
      - kind: step
        text: >-
          (א) ב-$0<t<2\pi$, $\sin\frac t2>0$, ולכן
          $$k(t)=\frac{-2\sin^2\frac t2}{8\sin^3\frac t2}=-\frac{1}{4\sin\frac t2}.$$
      - kind: step
        text: >-
          (ב) הקשת עולה מהציר, עוברת מעליו ויורדת חזרה, כשהיא מתקדמת ימינה: קעורה כלפי מטה. מי שנע ימינה על קשת כזו מסובב את ההגה ימינה.
      - kind: check
        text: >-
          חישוב מספרי: $k(\pi)=-0.25$ ו-$k(\frac\pi2)\approx-0.3536$. ו-$|k|$ הוא $\kappa$ שחושבה בשיעור 1.3, דוגמה 2.
      - kind: result
        text: >-
          $k(t)=-\frac{1}{4\sin(t/2)}<0$: הציקלואידה פונה ימינה לאורך כל הקשת.

  - id: W-1.5-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      $\gamma:\mathbb R\to\mathbb R^2$ מסילה סגורה בפרמטר אורך הקשת: $\gamma(s+L)=\gamma(s)$ לכל $s$, מסדר $C^2$.

      (א) האם ייתכן ש-$\int_0^Lk\,ds=\pi$?

      (ב) נניח $k\ge0$ בכל מקום. הוכיחו ש-$\int_0^Lk\,ds\ge2\pi$.
    answer: >-
      (א) לא: זו כפולה של $2\pi$. (ב) היא כפולה אי-שלילית של $2\pi$, ואם היא $0$ אז $k\equiv0$ והמסילה ישרה, ולא סגורה.
    solution:
      - kind: step
        text: >-
          המסילה מחזורית, ולכן גם $\mathbf t=\gamma'$: $\mathbf t(L)=\mathbf t(0)$. לפי משפט 1.5.14, $\int_0^Lk\,ds$ הוא כפולה של $2\pi$.
      - kind: step
        text: >-
          (א) $\pi$ אינו כפולה של $2\pi$, ולכן לא ייתכן.
      - kind: step
        text: >-
          (ב) $k\ge0$, ולכן $\int_0^Lk\,ds\ge0$, כלומר זו כפולה אי-שלילית של $2\pi$. נניח שהיא $0$: אינטגרל של פונקציה רציפה אי-שלילית
          שווה $0$ רק כשהפונקציה אפס, ולכן $k\equiv0$ על $[0,L]$.
      - kind: step
        text: >-
          אז $\mathbf t$ קבוע, $\mathbf t\equiv\mathbf t_0$, ו-$\gamma(s)=\gamma(0)+s\,\mathbf t_0$. לכן $\gamma(L)\ne\gamma(0)$, כי $L>0$: סתירה לסגירות.
      - kind: check
        text: >-
          עם $k$ שמחליפה סימן אין חסם כזה: לשמינייה פנייה כוללת $0$. ולמעגל, $k>0$, הפנייה היא בדיוק $2\pi$: החסם הדוק.
      - kind: result
        text: >-
          (א) לא. (ב) $\int_0^Lk\,ds\ge2\pi$.

  - id: W-1.5-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      $\gamma:[0,L]\to\mathbb R^2$ בפרמטר אורך הקשת, רגולרית, מסדר $C^2$ וסגורה: $\gamma(0)=\gamma(L)$.

      (א) הוכיחו שלכל וקטור יחידה $\mathbf u$ יש $s$ עם $\mathbf t(s)\perp\mathbf u$.

      (ב) נניח גם $\mathbf t(0)=\mathbf t(L)$, ושאינדקס הסיבוב $m\ne0$. הוכיחו שלכל וקטור יחידה $\mathbf w$ יש $s$ עם $\mathbf t(s)=\mathbf w$.

      (ג) הראו שהמסקנה של (ב) לא נכונה לשמינייה $(\sin t,\ \sin t\cos t)$: המשיק שלה אף פעם אינו $(0,1)$.
    answer: >-
      (א) $\int_0^L\mathbf t\cdot\mathbf u\,ds=0$ ומשפט ערך הביניים. (ב) $\theta$ עוברת על קטע באורך $2\pi|m|\ge2\pi$. (ג) $\mathbf t=(0,1)$ דורש $\cos t=0$, ואז $\cos2t=-1<0$.
    solution:
      - kind: idea
        text: >-
          (א) הממוצע של $\mathbf t$ על מסילה סגורה הוא אפס, ולכן $\mathbf t\cdot\mathbf u$ לא יכולה להיות חיובית בכל מקום. (ב) זווית משיק רציפה שמשתנה ב-$2\pi m$
          עוברת, לפי משפט ערך הביניים, על כל הזוויות בקטע באורך $2\pi$.
      - kind: step
        text: >-
          (א) $g(s)=\mathbf t(s)\cdot\mathbf u$ רציפה, ולפי המשפט היסודי
          $$\int_0^Lg\,ds=\big(\gamma(L)-\gamma(0)\big)\cdot\mathbf u=0.$$
          אם $g$ לא מתאפסת, לפי משפט ערך הביניים יש לה סימן קבוע, ואז האינטגרל של פונקציה רציפה שאינה אפס ושומרת סימן אינו $0$: סתירה. לכן יש $s$ עם $g(s)=0$.
      - kind: step
        text: >-
          (ב) תהי $\theta$ זווית משיק (הגדרה 1.5.11). לפי משפט 1.5.14, $\theta(L)-\theta(0)=2\pi m$, ו-$|2\pi m|\ge2\pi$. נניח $m>0$ (המקרה $m<0$ סימטרי).
          יהי $\psi$ הזווית של $\mathbf w$, נבחרת ב-$[\theta(0),\ \theta(0)+2\pi)$.
      - kind: step
        text: >-
          $\theta(0)\le\psi<\theta(0)+2\pi\le\theta(L)$, ולפי משפט ערך הביניים יש $s$ עם $\theta(s)=\psi$. אז
          $$\mathbf t(s)=(\cos\psi,\ \sin\psi)=\mathbf w.$$
      - kind: step
        text: >-
          (ג) $\gamma'(t)=(\cos t,\ \cos2t)$, ו-$\mathbf t$ הוא כפולה חיובית שלו. $\mathbf t=(0,1)$ דורש $\cos t=0$ ו-$\cos2t>0$. אבל $\cos t=0$ פירושו
          $t=\frac\pi2$ או $\frac{3\pi}2$, ושם $\cos2t=-1<0$. לכן $\mathbf t\ne(0,1)$ בכל $t$; ואינדקס הסיבוב של השמינייה הוא $0$ (דוגמה 6).
      - kind: check
        text: >-
          (ג) מספרית: על השמינייה הזווית של $\mathbf t$ אף פעם לא בקטע $(\frac\pi4,\frac{3\pi}4)$, והמרחק המינימלי של $\mathbf t$ מ-$(0,1)$ הוא
          $2\sin\frac\pi8\approx0.7654$, בראשית. ו-(א) עדיין נכון לה: $\mathbf t\perp(1,0)$ ב-$t=\frac\pi2$, שם $\mathbf t=(0,-1)$.
      - kind: result
        text: >-
          (א) כל מסילה סגורה ניצבת בנקודה כלשהי לכל כיוון. (ב) עם אינדקס סיבוב שונה מאפס, המשיק עובר על כל כיוון. (ג) בשמינייה לא: הכיוון $(0,1)$ חסר.

  - id: W-1.5-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.5-3]
    prompt: >-
      $\gamma:[-a,a]\to\mathbb R^2$ בפרמטר אורך הקשת, מסדר $C^2$, ו-$S(x,y)=(-x,y)$ השיקוף בציר $y$. נניח
      $\gamma(-s)=S\gamma(s)$ לכל $s$: המסילה סימטרית לציר $y$, והפרמטר "סימטרי" גם הוא.

      (א) הוכיחו ש-$k(-s)=k(s)$ לכל $s$.

      (ב) בדקו על הפרבולה $(t,\ t^2)$.
    answer: >-
      (א) היפוך כיוון ושיקוף הופכים כל אחד את הסימן, ולכן $k$ זוגית. (ב) $k(t)=\frac{2}{(1+4t^2)^{3/2}}$, זוגית.
    solution:
      - kind: idea
        text: >-
          את אותה מסילה, $\delta(s)=\gamma(-s)$, אפשר לתאר בשתי דרכים: כהיפוך כיוון של $\gamma$, וכשיקוף $S\circ\gamma$. כל דרך נותנת נוסחה ל-$k_\delta$.
      - kind: step
        text: >-
          כהיפוך כיוון: $k_\delta(s)=-k_\gamma(-s)$.
      - kind: step
        text: >-
          כשיקוף: $\delta=S\circ\gamma$, ו-$\det S=-1$, ולכן $k_\delta(s)=-k_\gamma(s)$.
      - kind: step
        text: >-
          משווים: $-k_\gamma(-s)=-k_\gamma(s)$, כלומר $k_\gamma(-s)=k_\gamma(s)$.
      - kind: computation
        text: >-
          (ב) $(t,\ t^2)$ מקיימת $\gamma(-t)=(-t,\ t^2)=S\gamma(t)$. (כאן $t$ אינו אורך הקשת, אבל $\|\gamma'(-t)\|=\|\gamma'(t)\|$, ולכן אורך הקשת מ-$0$ אי-זוגי, $s(-t)=-s(t)$, והפרמטריזציה לפי אורך הקשת מקיימת אותה סימטריה.)
          $k(t)=\frac{2}{(1+4t^2)^{3/2}}$, ואכן $k(-t)=k(t)$; חישוב מספרי ב-$t=\pm0.7$ נותן $0.39273$ פעמיים.
      - kind: result
        text: >-
          $k$ זוגית. מסילה סימטרית למראה פונה לאותו צד, באותה מידה, בשתי הנקודות הסימטריות.

  - id: W-1.5-10
    level: exam
    objectives: [OBJ-1.5-2]
    prompt: >-
      האליפסה $\gamma(t)=(a\cos t,\ b\sin t)$, $a,b>0$.

      (א) הוכיחו שלכל מסילה רגולרית $\int k\,ds=\int\frac{x'y''-y'x''}{x'^2+y'^2}\,dt$.

      (ב) קבעו את $\int_0^{\pi/2}k\,ds$ לאליפסה מתוך זווית המשיק, והסיקו את ערך האינטגרל
      $$\int_0^{\pi/2}\frac{ab\,dt}{a^2\sin^2t+b^2\cos^2t}.$$
    answer: >-
      (ב) $\frac\pi2$, ולכן גם האינטגרל שווה ל-$\frac\pi2$, לכל $a,b>0$.
    solution:
      - kind: step
        text: >-
          (א) $ds=\|\gamma'\|\,dt$ ו-$k=\frac{x'y''-y'x''}{\|\gamma'\|^3}$, ולכן $k\,ds=\frac{x'y''-y'x''}{\|\gamma'\|^2}\,dt$.
      - kind: computation
        text: >-
          לאליפסה: $x'=-a\sin t$, $y'=b\cos t$, $x''=-a\cos t$, $y''=-b\sin t$. המונה $x'y''-y'x''=ab$, והמכנה $a^2\sin^2t+b^2\cos^2t$.
      - kind: step
        text: >-
          (ב) על $[0,\frac\pi2]$, $\gamma'=(-a\sin t,\ b\cos t)$, ולכן $t_x\le0$ ו-$t_y\ge0$. נגדיר $\tilde\theta=\arccos(t_x)$: רציפה, עם ערכים
          ב-$[\frac\pi2,\pi]$, ו-$\sin\tilde\theta=\sqrt{1-t_x^2}=t_y$ (כי $t_y\ge0$). לכן $\mathbf t=(\cos\tilde\theta,\ \sin\tilde\theta)$, ו-$\tilde\theta$ זווית
          משיק. ב-$t=0$, $\mathbf t=(0,1)$ ו-$\tilde\theta=\frac\pi2$; ב-$t=\frac\pi2$, $\mathbf t=(-1,0)$ ו-$\tilde\theta=\pi$. לפי מסקנה 1.5.13,
          $\int_0^{\pi/2}k\,ds=\pi-\frac\pi2=\frac\pi2$.
      - kind: step
        text: >-
          לפי (א), האינטגרל המבוקש שווה ל-$\int_0^{\pi/2}k\,ds=\frac\pi2$.
      - kind: check
        text: >-
          עם $a=b$ המכנה הוא $a^2$ והאינטגרנד הוא $1$, ואכן האינטגרל $\frac\pi2$. עם $a=2$, $b=1$ חישוב מספרי (סימפסון) נותן $1.5708$.
      - kind: result
        text: >-
          $\int_0^{\pi/2}\frac{ab\,dt}{a^2\sin^2t+b^2\cos^2t}=\frac\pi2$ לכל $a,b>0$: אינטגרל שחישבנו רק מזווית המשיק.
challenge:
  - id: W-1.5-c1
    stars: 1
    objectives: [OBJ-1.5-2, OBJ-1.5-1]
    prompt: >-
      $\gamma:[0,L]\to\mathbb R^2$ בפרמטר אורך הקשת, רגולרית ומסדר $C^2$, סגורה עם משיק שחוזר לכיוונו: $\gamma(0)=\gamma(L)$ ו-$\mathbf t(0)=\mathbf t(L)$.
      נניח $|k(s)|\le\frac1R$ לכל $s$. הוכיחו ש-$L\ge2\pi R$, ושיש שוויון אם ורק אם $\gamma$ מקיפה פעם אחת מעגל ברדיוס $R$.
    answer: >-
      $\int|k|\,ds\ge2\pi$ תמיד (אם $m\ne0$ מהפנייה הכוללת, ואם $m=0$ כי טווח זווית המשיק באורך $\pi$ לפחות), ו-$\int|k|\,ds\le\frac LR$.
      בשוויון $k\equiv\pm\frac1R$, ומרכז העקמומיות קבוע: מעגל.
    solution:
      - kind: idea
        text: >-
          מראים ש-$\int_0^L|k|\,ds\ge2\pi$ לכל מסילה כזו, ואז $\frac LR\ge\int|k|\ge2\pi$. כשאינדקס הסיבוב $m\ne0$ זה מיידי. כש-$m=0$ הזווית חוזרת
          לערכה, אבל לפי תרגיל 8(א) המשיק חייב להיות ניצב לכל כיוון, ולכן הזווית מכסה טווח באורך $\pi$ לפחות, הלוך וחזור.
      - kind: step
        text: >-
          תהי $\theta$ זווית משיק (הגדרה 1.5.11). לפי משפט 1.5.12, $|k|=|\theta'|$, ולפי משפט 1.5.14 $\theta(L)-\theta(0)=2\pi m$ עם $m$ שלם.
          לכל $a<b$ ב-$[0,L]$, לפי אי-שוויון המשולש לאינטגרלים, $\int_a^b|\theta'|\ge|\theta(b)-\theta(a)|$.
      - kind: step
        text: >-
          אם $m\ne0$: $$\int_0^L|k|\,ds\ge|\theta(L)-\theta(0)|=2\pi|m|\ge2\pi.$$
      - kind: step
        text: >-
          אם $m=0$: $\theta$ רציפה על $[0,L]$ ומקבלת מינימום $\theta(s_2)$ ומקסימום $\theta(s_1)$ (ויירשטראס). נטען ש-$\theta(s_1)-\theta(s_2)\ge\pi$.
          אחרת, עם $\varphi=\frac{\theta(s_1)+\theta(s_2)}2$ ו-$\mathbf u=(\cos\varphi,\ \sin\varphi)$, $|\theta(s)-\varphi|<\frac\pi2$ לכל $s$, ולכן
          $\mathbf t\cdot\mathbf u=\cos(\theta-\varphi)>0$ בכל נקודה, בסתירה לתרגיל 8(א), שלפיו $\mathbf t(s)\perp\mathbf u$ לאיזה $s$ (שם הנחנו רק
          $\gamma(0)=\gamma(L)$).
      - kind: step
        text: >-
          נניח $s_1<s_2$ (המקרה ההפוך זהה). מחלקים את $[0,L]$ ב-$s_1,s_2$ ומשתמשים ב-$\theta(L)=\theta(0)$:
          $$\int_0^L|\theta'|\ge\big(\theta(s_1)-\theta(0)\big)+\big(\theta(s_1)-\theta(s_2)\big)+\big(\theta(L)-\theta(s_2)\big)=2\big(\theta(s_1)-\theta(s_2)\big)\ge2\pi.$$
      - kind: step
        text: >-
          בשני המקרים, לפי ההנחה $|k|\le\frac1R$:
          $$2\pi\le\int_0^L|k|\,ds\le\frac LR,$$
          ולכן $L\ge2\pi R$.
      - kind: step
        text: >-
          נניח $L=2\pi R$. אז
          $$\int_0^L\Big(\frac1R-|k|\Big)ds=\frac LR-\int_0^L|k|\,ds\le0,$$
          והאינטגרנד רציף ואי-שלילי, ולכן $|k|\equiv\frac1R$.
          $k$ רציפה ו-$|k|$ קבועה שונה מאפס, ולכן, לפי משפט ערך הביניים, $k\equiv\frac\varepsilon R$ עם $\varepsilon=\pm1$ קבוע.
      - kind: step
        text: >-
          $\mathbf n_s'=J\mathbf t'=kJ\mathbf n_s=kJ^2\mathbf t=-k\,\mathbf t$. נגדיר $\mathbf c(s)=\gamma(s)+\frac1k\mathbf n_s(s)$, עם $\frac1k=\varepsilon R$ קבוע. אז
          $$\mathbf c'=\mathbf t+\frac1k(-k\,\mathbf t)=0,$$
          כלומר $\mathbf c$ קבוע, ו-$\|\gamma(s)-\mathbf c\|=\big\|\frac1k\mathbf n_s\big\|=R$: התמונה על המעגל ברדיוס $R$ סביב $\mathbf c$.
      - kind: step
        text: >-
          באורך $2\pi R$ ובפרמטר אורך הקשת על מעגל ברדיוס $R$, $\int_0^Lk\,ds=\frac\varepsilon R\cdot2\pi R=2\pi\varepsilon$, כלומר $|m|=1$: המעגל
          מוקף פעם אחת. ולהפך, מעגל ברדיוס $R$ שמוקף פעם אחת מקיים $|k|=\frac1R$ ו-$L=2\pi R$.
      - kind: check
        text: >-
          מעגל שמקיפים פעמיים: $L=4\pi R$ ו-$m=2$, אי-שוויון חזק. בשמינייה $(\sin t,\ \sin t\cos t)$, שבה $m=0$: חישוב מספרי נותן טווח זווית
          $\frac{3\pi}2\ge\pi$, $\int|k|\,ds=3\pi\ge2\pi$, ו-$L\approx6.097\ge\frac{2\pi}{\max|k|}\approx1.312$. הגרסה במרחב, $\int|k|\,ds\ge2\pi$
          לכל מסילה סגורה ב-$\mathbb R^3$, היא משפט פנשל: תרגיל 4 באותו דף תרגיל של 2002.
      - kind: result
        text: >-
          $L\ge2\pi R$, ושוויון בדיוק כש-$\gamma$ מקיפה פעם אחת מעגל ברדיוס $R$.
    source:
      name: 'אינפי מתקדם 2 (80316), האוניברסיטה העברית, רות לורנס-נוימרק: דף תרגיל 2'
      year: 2002
      problem: 'תרגיל 3'
      url: http://www.ma.huji.ac.il/~ruthel/courses/infimb02/infimb02-ex02.html
      verified: '2026-11-09'
      adapted: true

  - id: W-1.5-c2
    stars: 1
    objectives: [OBJ-1.5-1]
    prompt: >-
      $\gamma$ מסילה מישורית רגולרית מסדר $C^3$ בפרמטר אורך הקשת $s$, עם עקמומיות מסומנת $k$, ו-$\lambda$ קבוע. **המסילה המקבילה** היא
      $\gamma_\lambda(s)=\gamma(s)+\lambda\,\mathbf n_s(s)$: מזיזים כל נקודה למרחק $\lambda$ לאורך הנורמל המסובב.

      (א) הוכיחו ש-$\mathbf n_s'=-k\,\mathbf t$.

      (ב) הוכיחו ש-$\gamma_\lambda$ רגולרית בכל נקודה שבה $\lambda k\ne1$, ושהעקמומיות המסומנת שלה שם היא
      $$k_\lambda=\frac{k}{|1-\lambda k|}.$$
    answer: >-
      (א) $\mathbf n_s'=J\mathbf t'=kJ^2\mathbf t=-k\mathbf t$. (ב) $\gamma_\lambda'=(1-\lambda k)\mathbf t$, ו-$k_\lambda=\frac{k}{|1-\lambda k|}$.
    solution:
      - kind: step
        text: >-
          (א) $J$ לינארית וקבועה, ולכן
          $$\mathbf n_s'=(J\mathbf t)'=J\mathbf t'=J(k\,\mathbf n_s)=k\,J^2\mathbf t.$$
          סיבוב פעמיים ברבע הוא $-I$, ולכן $\mathbf n_s'=-k\,\mathbf t$.
      - kind: computation
        text: >-
          (ב) גוזרים:
          $$\gamma_\lambda'=\mathbf t+\lambda\,\mathbf n_s'=(1-\lambda k)\,\mathbf t.$$
          כש-$\lambda k\ne1$ זה אינו אפס: $\gamma_\lambda$ רגולרית, והמהירות שלה
          $\frac{ds_\lambda}{ds}=|1-\lambda k|$.
      - kind: step
        text: >-
          נסמן $\varepsilon=\operatorname{sign}(1-\lambda k)$. אז $\mathbf t_\lambda=\varepsilon\,\mathbf t$ ו-$\mathbf n_{s,\lambda}=J\mathbf t_\lambda=\varepsilon\,\mathbf n_s$.
      - kind: computation
        text: >-
          גוזרים לפי אורך הקשת של $\gamma_\lambda$, בכלל השרשרת:
          $$\frac{d\mathbf t_\lambda}{ds_\lambda}=\frac{\varepsilon\,k\,\mathbf n_s}{|1-\lambda k|}=\frac{k}{|1-\lambda k|}\,\mathbf n_{s,\lambda}.$$
          לכן $k_\lambda=\frac{k}{|1-\lambda k|}$.
      - kind: check
        text: >-
          מעגל ברדיוס $r$ נגד כיוון השעון ($k=\frac1r$, $\mathbf n_s$ פנימה) ו-$\lambda<r$: המקבילה היא מעגל ברדיוס $r-\lambda$, ו-$\frac{1/r}{1-\lambda/r}=\frac{1}{r-\lambda}$.
          ומספרית, לאליפסה $(2\cos t,\ \sin t)$ עם $\lambda=0.3$ ב-$t=1$: $k\approx0.3622$ ו-$k_\lambda\approx0.4063$, כמו בנוסחה.
      - kind: result
        text: >-
          $\mathbf n_s'=-k\,\mathbf t$; $\gamma_\lambda$ רגולרית כש-$\lambda k\ne1$, ו-$k_\lambda=\frac{k}{|1-\lambda k|}$. בנקודות שבהן $\lambda k=1$ (מרכזי העקמומיות) המסילה המקבילה נעצרת, ושם בדרך כלל נוצרים חודים (במעגל ברדיוס $r$ עם $\lambda=r$ היא מתכווצת כולה לנקודה, המרכז).
    source:
      name: 'Pressley, Elementary Differential Geometry, 2nd ed. (as worked in the Math 120A Homework 3 solutions, Rutgers)'
      year: 2010
      problem: 'Exercise 2.2.5'
      url: https://sites.math.rutgers.edu/~kh754/Math120A/Math%20120A%20Homework%203%20Solutions.pdf
      verified: '2026-11-09'
      adapted: true
