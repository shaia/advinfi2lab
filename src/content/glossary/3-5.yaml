# Terms first defined in lesson 3.5.
- id: local-isometry
  term: איזומטריה מקומית
  en: local isometry
  definition: >-
    העתקה חלקה $f:S_1\to S_2$ שמעבירה כל מסילה במשטח $S_1$ למסילה באותו אורך. שקול לכך: יש פרמטריזציות $\sigma_1$
    ו-$\sigma_2=f\circ\sigma_1$ על אותו תחום עם אותם $E,F,G$. איזומטריה מקומית אינה חייבת להיות חד-חד-ערכית.
  lesson: '3.5'
- id: intrinsic-distance
  term: מרחק פנימי
  en: intrinsic distance
  definition: >-
    המרחק בין שתי נקודות של משטח כפי שנמדד בתוכו: האינפימום של אורכי המסילות במשטח שמחברות אותן. הוא אינו קטן
    מהמרחק בקו ישר במרחב, ואיזומטריה שומרת אותו.
  lesson: '3.5'
- id: intrinsic-property
  term: תכונה פנימית
  en: intrinsic property
  definition: >-
    תכונה של משטח שנקבעת מהתבנית הראשונה בלבד, ולכן נשמרת בכל איזומטריה מקומית: אורכים של מסילות, זוויות ביניהן,
    מרחק פנימי (באיזומטריה הפיכה; הלפפת המישור על הגליל יכולה לקצר אותו), גודל השטח $\sqrt{EG-F^2}$ של מקבילית משיקה.
  lesson: '3.5'
- id: extrinsic-property
  term: תכונה חיצונית
  en: extrinsic property
  definition: >-
    תכונה של משטח שתלויה באופן שבו הוא מונח במרחב, ולא נשמרת באיזומטריה: הנורמל $\hat{\mathbf N}$, המרחק בקו ישר במרחב
    בין שתי נקודות, העקמומיות של מסילה על המשטח כמסילה במרחב.
  lesson: '3.5'
