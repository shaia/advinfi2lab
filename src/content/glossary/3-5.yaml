# Terms first defined in lesson 3.5.
- id: local-isometry
  term: איזומטריה מקומית
  en: local isometry
  definition: >-
    העתקה חלקה $f:S_1\to S_2$ שמעבירה כל מסילה במשטח $S_1$ למסילה באותו אורך. שקול לכך: יש פרמטריזציות $\sigma_1$
    ו-$\sigma_2=f\circ\sigma_1$ על אותו תחום עם אותם $E,F,G$. איזומטריה מקומית אינה חייבת להיות חד-חד-ערכית.
  lesson: '3.5'
- id: intrinsic-distance
  term: מרחק פנימי
  en: intrinsic distance
  definition: >-
    המרחק בין שתי נקודות של משטח כפי שנמדד בתוכו: האינפימום של אורכי המסילות במשטח שמחברות אותן ($+\infty$ אם אין
    מסילה כזו). הוא אינו קטן מהמרחק בקו ישר במרחב. איזומטריה (הפיכה) שומרת אותו; איזומטריה מקומית שאינה חד-חד-ערכית
    יכולה לקצר אותו, ולכן הוא פנימי רק במובן חלש.
  lesson: '3.5'
- id: intrinsic-property
  term: תכונה פנימית
  en: intrinsic property
  definition: >-
    גודל של משטח שמחושב מ-$E,F,G$ של פרמטריזציות מקומיות בלבד, בנקודה או לאורך מסילה, ולכן נשמר בכל איזומטריה
    מקומית: אורכים של מסילות, זוויות ביניהן, גודל השטח $\sqrt{EG-F^2}$ של מקבילית משיקה. המרחק הפנימי פנימי במובן
    חלש יותר: הוא נשמר באיזומטריה הפיכה, ולא בהכרח באיזומטריה מקומית.
  lesson: '3.5'
- id: extrinsic-property
  term: תכונה חיצונית
  en: extrinsic property
  definition: >-
    תכונה של משטח שתלויה באופן שבו הוא מונח במרחב, ולא נשמרת באיזומטריה: הנורמל $\hat{\mathbf N}$, המרחק בקו ישר במרחב
    בין שתי נקודות, העקמומיות של מסילה על המשטח כמסילה במרחב.
  lesson: '3.5'
- id: smooth-map-of-surfaces
  term: העתקה חלקה בין משטחים
  en: smooth map between surfaces
  definition: >-
    העתקה $f:S_1\to S_2$ בין משטחים חלקים כך שלכל פרמטריזציה מקומית $\sigma$ של $S_1$ ההרכבה $f\circ\sigma$ חלקה
    ($C^\infty$). אז $f$ מעבירה כל מסילה גזירה ברציפות ב-$S_1$ למסילה גזירה ברציפות ב-$S_2$.
  lesson: '3.5'
- id: surface-differential
  term: הדיפרנציאל של העתקה בין משטחים
  en: differential of a map between surfaces
  symbol: 'df_p:T_pS_1\to T_{f(p)}S_2'
  definition: >-
    ההעתקה הלינארית ששולחת את וקטור המהירות $\gamma'(0)$ של מסילה ב-$S_1$ דרך $p$ לוקטור המהירות $(f\circ\gamma)'(0)$.
    בפרמטריזציה מקומית: $df_p(a\sigma_u+b\sigma_v)=a(f\circ\sigma)_u+b(f\circ\sigma)_v$.
  lesson: '3.5'
- id: isometry-of-surfaces
  term: איזומטריה
  en: isometry
  definition: >-
    איזומטריה מקומית $f:S_1\to S_2$ שהיא חד-חד-ערכית ועל, ושההופכית שלה חלקה. גם ההופכית איזומטריה, ואיזומטריה שומרת
    את המרחק הפנימי.
  lesson: '3.5'
