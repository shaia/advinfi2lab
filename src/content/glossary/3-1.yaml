# Terms first defined in lesson 3.1.
- id: smooth-surface
  term: משטח חלק
  en: smooth (regular) surface
  definition: >-
    קבוצה $S\subset\mathbb R^3$ שלכל נקודה שלה יש סביבה ב-$S$ שהיא התמונה של פרמטריזציה רגולרית חלקה
    $\sigma:D\to\mathbb R^3$, $D\subset\mathbb R^2$ פתוחה, חד-חד-ערכית ורציפה בהפיכה. בשיעור 3.1 עובדים בעיקר עם המשטח
    $\sigma(D)$ של פרמטריזציה אחת.
  lesson: '3.1'
- id: regular-surface-parametrization
  term: פרמטריזציה רגולרית של משטח
  en: regular parametrization of a surface
  symbol: '\sigma_u\times\sigma_v\ne0'
  definition: >-
    העתקה חלקה $\sigma:D\to\mathbb R^3$ שבכל נקודה של $D$ הנגזרות החלקיות $\sigma_u,\sigma_v$ בלתי תלויות לינארית, כלומר
    $\sigma_u\times\sigma_v\ne0$, כלומר מטריצת יעקובי $3\times2$ מדרגה 2.
  lesson: '3.1'
- id: parameter-curves
  term: קווים פרמטריים
  en: parameter curves (coordinate curves)
  definition: >-
    המסילות $u\mapsto\sigma(u,v_0)$ ו-$v\mapsto\sigma(u_0,v)$ על המשטח. וקטורי המהירות שלהן הם $\sigma_u$ ו-$\sigma_v$,
    והן יוצרות על המשטח רשת (בספרה: קווי אורך וקווי רוחב).
  lesson: '3.1'
- id: surface-of-revolution
  term: משטח סיבוב
  en: surface of revolution
  symbol: '\sigma(u,v)=(f(v)\cos u,\ f(v)\sin u,\ g(v))'
  definition: >-
    המשטח שמתקבל מסיבוב מסילת פרופיל $(f(v),0,g(v))$, $f>0$, סביב ציר $z$. הוא רגולרי כשהפרופיל רגולרי ואינו פוגע
    בציר: $\|\sigma_u\times\sigma_v\|=|f|\sqrt{f'^2+g'^2}$.
  lesson: '3.1'
- id: torus
  term: טורוס
  en: torus
  symbol: '((R+r\cos v)\cos u,\ (R+r\cos v)\sin u,\ r\sin v)'
  definition: >-
    משטח הסיבוב של מעגל ברדיוס $r$ שמרכזו במרחק $R$ מהציר. כש-$0<r<R$ הפרמטריזציה רגולרית בכל מקום, כי
    $\|\sigma_u\times\sigma_v\|=r(R+r\cos v)>0$.
  lesson: '3.1'
- id: singular-point-of-surface
  term: נקודה סינגולרית של משטח
  en: singular point of a surface
  definition: >-
    נקודה של קבוצה ב-$\mathbb R^3$ שאין לה **אף** פרמטריזציה רגולרית בסביבתה, כמו קודקוד החרוט. נקודה שבה רק
    פרמטריזציה מסוימת אינה רגולרית, כמו קוטב הספרה בקואורדינטות כדוריות, אינה סינגולרית.
  lesson: '3.1'
