# Terms first defined in lesson 2.2 (torsion).
- id: torsion
  term: פיתול
  en: torsion
  symbol: '\tau'
  definition: >-
    במסילה בפרמטר אורך הקשת עם $\kappa>0$, הפיתול $\tau(s)$ מוגדר על ידי $\mathbf b'(s)=-\tau(s)\,\mathbf n(s)$ (הסימן של הקורס).
    בפרמטר כללי $\tau=\frac{(\gamma'\times\gamma'')\cdot\gamma'''}{\|\gamma'\times\gamma''\|^2}$. הוא מסומן: חיובי בסליל ימני,
    שלילי בסליל שמאלי, ואפס זהותית בדיוק במסילות מישוריות.
  lesson: '2.2'
- id: right-handed-helix
  term: סליל ימני
  en: right-handed helix
  definition: >-
    הסליל $(a\cos t,a\sin t,ht)$ עם $a>0$ ו-$h>0$: הוא עולה בכיוון הציר כשמסתובבים נגד כיוון השעון במבט מלמעלה (מ-$+z$), כמו בורג רגיל, ו-$\tau=\frac{h}{a^2+h^2}>0$.
    כש-$h<0$ הסליל שמאלי ו-$\tau<0$; כל אחד מהם הוא תמונת המראה של השני.
  lesson: '2.2'
- id: left-handed-helix
  term: סליל שמאלי
  en: left-handed helix
  definition: >-
    הסליל $(a\cos t,a\sin t,ht)$ עם $a>0$ ו-$h<0$: תמונת המראה של סליל ימני, עם $\tau=\frac{h}{a^2+h^2}<0$. אין תנועה קשיחה
    ששומרת כיוון (סיבוב והזזה) שמעבירה אותו לסליל ימני.
  lesson: '2.2'
- id: planar-curve
  term: מסילה מישורית
  en: planar curve
  definition: >-
    מסילה $\gamma:I\to\mathbb R^3$ שכל התמונה שלה מוכלת במישור אחד: יש נקודה $\mathbf p$ ווקטור יחידה $\mathbf e$ כך
    ש-$(\gamma(t)-\mathbf p)\cdot\mathbf e=0$ לכל $t\in I$. המישור אינו חייב להיות מישור קואורדינטות.
  lesson: '2.2'
