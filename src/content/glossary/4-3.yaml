# Terms first defined in lesson 4.3.
- id: geodesic
  term: גאודזית
  en: geodesic
  definition: >-
    מסילה במשטח שהעקמומיות הגאודזית שלה מתאפסת בכל נקודה, $\kappa_g\equiv0$. בפרמטריזציה במהירות קבועה זה שקול לכך
    שהתאוצה $\gamma''$ ניצבת למשטח בכל נקודה. על המישור: ישרים; על הספרה: מעגלים גדולים; על הגליל: ישרים, מעגלים
    אופקיים וסלילים.
  reject: [גיאודזית, גיאודזיה]
  lesson: '4.3'
