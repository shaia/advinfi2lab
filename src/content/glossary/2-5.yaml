# Terms first defined in lesson 2.5 (enrichment: Lancret's theorem and spherical curves).
- id: generalized-helix
  term: סליל מוכלל
  en: generalized helix (curve of constant slope)
  definition: >-
    מסילה עם $\kappa>0$ שהמשיק שלה יוצר זווית קבועה עם כיוון קבוע: יש וקטור יחידה קבוע $\mathbf u$ עם $\mathbf t\cdot\mathbf u$
    קבוע. הסליל המעגלי הוא מקרה פרטי.
  lesson: '2.5'
- id: lancret-theorem
  term: משפט לנקרה
  en: Lancret's theorem
  definition: >-
    מסילה עם $\kappa>0$ היא סליל מוכלל אם ורק אם היחס $\frac\tau\kappa$ קבוע. אז $\frac\tau\kappa=\cot\theta$, כאשר $\theta$
    הזווית בין המשיק לציר.
  lesson: '2.5'
- id: spherical-curve
  term: מסילה כדורית
  en: spherical curve
  definition: >-
    מסילה שמונחת על ספרה $\|\gamma-\mathbf c\|=R$. היא מקיימת $\kappa\ge\frac1R$, וכש-$\tau\ne0$ גם
    $R^2=\rho^2+(\rho'\sigma)^2$, כאשר $\rho=\frac1\kappa$, $\sigma=\frac1\tau$ והנגזרת לפי אורך הקשת.
  lesson: '2.5'
- id: viviani-curve
  term: המסילה של ויויאני
  en: Viviani's curve
  definition: >-
    $(1+\cos t,\ \sin t,\ 2\sin\frac t2)$: מסילה בחיתוך של הספרה ברדיוס 2 סביב הראשית עם הגליל $(x-1)^2+y^2=1$. מסילה כדורית
    שבה $\kappa\ge\frac12$, עם שוויון רק בנקודה $(2,0,0)$.
  lesson: '2.5'
- id: great-circle
  term: מעגל גדול
  en: great circle
  definition: >-
    החיתוך של ספרה עם מישור שעובר דרך המרכז שלה: מעגל שמרכזו מרכז הספרה ורדיוסו רדיוס הספרה $R$. עקמומיותו $\frac1R$, הקטנה
    ביותר האפשרית למסילה על הספרה.
  lesson: '2.5'
- id: osculating-sphere
  term: ספרה מנשקת
  en: osculating sphere
  definition: >-
    במסילה עם $\kappa>0$ ו-$\tau\ne0$: הספרה שמרכזה $\gamma+\rho\,\mathbf n+\rho'\sigma\,\mathbf b$ ורדיוסה
    $\sqrt{\rho^2+(\rho'\sigma)^2}$ ($\rho=\frac1\kappa$, $\sigma=\frac1\tau$, נגזרת לפי אורך הקשת). היא הספרה היחידה שהמרחק הריבועי ממרכזה קבוע
    עד סדר שלישי לאורך המסילה.
  lesson: '2.5'
