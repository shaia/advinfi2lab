      - label: א
        points: 4
        type: open
        objectives: [OBJ-7.4-1]
        qualitative: true
        prompt: >-
          נסחו את משפט סטוקס, כולל ההנחות והקשר בין כיוון השפה לנורמל.
        solution:
          - kind: theorem
            text: >-
              יהי $S$ משטח קומפקטי, מכוון וחלק למקוטעין, עם נורמל יחידה רציף $\hat{\mathbf N}$, שהשפה שלו $\partial S$ מסילה
              סגורה (או כמה) חלקה למקוטעין, ויהי $\mathbf F$ מסדר $C^1$ בקבוצה פתוחה שמכילה את $S\cup\partial S$.
          - kind: definition
            text: >-
              הכיוון של $\partial S$ מתואם עם $\hat{\mathbf N}$ (כלל יד ימין): בכל נקודה של השפה, בכיוון ההתקדמות $\mathbf t$,
              הווקטור $\hat{\mathbf N}\times\mathbf t$ מצביע אל תוך $S$ (מי שהולך על השפה כשראשו בכיוון $\hat{\mathbf N}$ רואה את
              $S$ משמאלו).
          - kind: result
            text: 'אז $\iint_S(\nabla\times\mathbf F)\cdot d\mathbf S=\oint_{\partial S}\mathbf F\cdot d\mathbf s$.'
        rubric:
          - text: 'השוויון: שטף של רוטור = אינטגרל קווי על השפה'
            weight: 2
          - text: 'כלל יד ימין בין $\hat{\mathbf N}$ לכיוון השפה'
            weight: 1
          - text: 'ההנחות: משטח מכוון חלק, שפה חלקה למקוטעין, $\mathbf F\in C^1$'
            weight: 1
      - label: ב
        points: 8
        type: open
        objectives: [OBJ-7.4-2]
        prompt: >-
          הוכיחו את המשפט עבור $S$ שהוא גרף של $f\in C^2$ מעל תחום $D$ שגרין חל עליו, עם הנורמל כלפי מעלה, ועבור שדה מהצורה
          $(P,0,0)$. (שאר הרכיבים באותו אופן.)
        solution:
          - kind: idea
            text: 'מורידים את שני הצדדים ל-$D$ דרך הפרמטריזציה $\sigma(x,y)=(x,y,f(x,y))$, ומפעילים את גרין על $D$; כלל השרשרת מתאים את המחוברים.'
          - kind: computation
            text: >-
              $\sigma_x\times\sigma_y=(-f_x,-f_y,1)$ (כלפי מעלה), ו-$\nabla\times(P,0,0)=(0,P_z,-P_y)$. לכן
              $\iint_S(\nabla\times\mathbf F)\cdot d\mathbf S=\iint_D\big(-P_z f_y-P_y\big)\,dx\,dy$, כש-$P$ ונגזרותיו ב-$(x,y,f(x,y))$.
          - kind: step
            text: >-
              עם נורמל כלפי מעלה, הכיוון המתואם של $\partial S$ הוא התמונה של $\partial D$ בכיוון החיובי: לנורמל
              $(-f_x,-f_y,1)$ רכיב שלישי חיובי, ולכן ההטלה למישור $xy$ שומרת על "המשטח משמאל" במבט מלמעלה. אם $(x(t),y(t))$ מתאר
              את $\partial D$, אז $\partial S$ היא $(x(t),y(t),f(x(t),y(t)))$, ו-$\oint_{\partial S}P\,dx=\oint_{\partial D}\tilde P\,dx$
              עם $\tilde P(x,y)=P(x,y,f(x,y))$.
          - kind: theorem
            text: 'גרין על $D$ ל-$\tilde P\in C^1$: $\oint_{\partial D}\tilde P\,dx=-\iint_D\tilde P_y\,dx\,dy$.'
          - kind: computation
            text: 'כלל השרשרת: $\tilde P_y=P_y+P_z f_y$.'
          - kind: result
            text: '$\oint_{\partial S}P\,dx=\iint_D(-P_y-P_z f_y)\,dx\,dy=\iint_S\nabla\times(P,0,0)\cdot d\mathbf S$.'
        rubric:
          - text: 'הנורמל $(-f_x,-f_y,1)$ והרוטור $(0,P_z,-P_y)$, וצד השטף כאינטגרל על $D$'
            weight: 2
          - text: 'הורדת האינטגרל הקווי ל-$\partial D$, עם הנימוק לכיוון החיובי'
            weight: 2
          - text: 'הפעלת גרין על $\tilde P$'
            weight: 2
          - text: 'כלל השרשרת עם המחובר $P_z f_y$, והשוואה מסכמת'
            weight: 2
