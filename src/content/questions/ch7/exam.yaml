        solution:
          - kind: theorem
            text: >-
              יהי $R\subset\mathbb R^3$ תחום חסום שהשפה שלו $\partial R$ משטח סגור חלק למקוטעין, ויהי $\mathbf F$ מסדר $C^1$ בקבוצה
              פתוחה שמכילה את $R\cup\partial R$.
          - kind: result
            text: 'אז $\oiint_{\partial R}\mathbf F\cdot d\mathbf S=\iiint_R\nabla\cdot\mathbf F\,dV$, עם הנורמל החיצוני ל-$R$.'
        rubric:
          - text: 'השוויון: שטף דרך השפה = אינטגרל משולש של הדיברגנץ'
            weight: 2
          - text: 'הנורמל החיצוני'
            weight: 1
          - text: 'ההנחות: תחום חסום, שפה חלקה למקוטעין, שדה מסדר $C^1$ על התחום כולו'
            weight: 1
      - label: ב
        points: 8
        type: open
        objectives: [OBJ-7.6-2, OBJ-7.5-3]
        prompt: >-
          הוכיחו ש-$\oiint_E\mathbf F\cdot d\mathbf S=4\pi$.
        solution:
          - kind: idea
            text: >-
              גאוס לא חל על הפנים של $E$, כי הראשית שם. מוציאים כדור קטן סביב הראשית, מפעילים גאוס על מה שנשאר, ומחשבים את הספרה
              הקטנה ישירות.
          - kind: computation
            text: >-
              מחוץ לראשית, לפי כלל המכפלה, $\nabla\cdot\frac{\mathbf x}{\|\mathbf x\|^3}=\frac{3}{\|\mathbf x\|^3}+\mathbf x\cdot\left(-3\frac{\mathbf x}{\|\mathbf x\|^5}\right)=0$.
          - kind: step
            text: >-
              כל נקודה של $E$ במרחק $1$ לפחות מהראשית ($\frac{x^2}4+\frac{y^2}9+z^2\le x^2+y^2+z^2$). נבחר $\varepsilon=\frac12$
              ואת $R$: הפנים של $E$ בלי הכדור $\|\mathbf x\|<\varepsilon$. הראשית אינה ב-$R$, ו-$\mathbf F\in C^1$ סביבו.
          - kind: theorem
            text: >-
              גאוס על $R$: $\partial R=E\cup S_\varepsilon$, עם הנורמל החיצוני ל-$R$: על $E$ החוצה, על $S_\varepsilon$ **לכיוון הראשית**.
              לכן $\oiint_E\mathbf F\cdot d\mathbf S-\oiint_{S_\varepsilon}\mathbf F\cdot d\mathbf S=\iiint_R0=0$, כששני השטפים החוצה מהראשית.
          - kind: computation
            text: >-
              על $S_\varepsilon$: $\hat{\mathbf N}=\frac{\mathbf x}{\varepsilon}$ ו-$\mathbf F\cdot\hat{\mathbf N}=\frac{\varepsilon^2}{\varepsilon^3\cdot\varepsilon}=\frac1{\varepsilon^2}$,
              ולכן השטף $\frac{1}{\varepsilon^2}\cdot4\pi\varepsilon^2=4\pi$.
          - kind: result
            text: '$\oiint_E\mathbf F\cdot d\mathbf S=4\pi$.'
        rubric:
          - text: 'הנימוק למה אי אפשר להפעיל גאוס ישירות על הפנים של $E$'
            weight: 1
          - text: 'חישוב $\nabla\cdot\mathbf F=0$ מחוץ לראשית'
            weight: 2
          - text: 'גאוס על התחום שבין $E$ לספרה קטנה, עם הנורמל של הספרה הקטנה לכיוון הראשית'
            weight: 3
          - text: 'חישוב ישיר של השטף דרך הספרה הקטנה, $4\pi$, והמסקנה'
            weight: 2
      - label: ג
        points: 3
        type: numeric
        objectives: [OBJ-7.6-2]
