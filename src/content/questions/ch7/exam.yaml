  - id: Q-7-exam-6
    type: exam
    title: משפט סטוקס על חתך משופע של גליל
    prompt: >-
      $C$ היא החיתוך של הגליל $x^2+y^2=4$ עם המישור $z=3-x$, נגד כיוון השעון כשמסתכלים מלמעלה, ו-$\mathbf F=(z,\ 2x-z,\ y^2)$.
