  - id: Q-7-exam-7
    type: exam
    title: משפט גאוס ושדה ריבוע-הפוך
    prompt: >-
      $\mathbf F(\mathbf x)=\frac{\mathbf x}{\|\mathbf x\|^3}$ ב-$\mathbb R^3\setminus\{0\}$, ו-$E$ האליפסואיד $\frac{x^2}4+\frac{y^2}9+z^2=1$.
