  - id: Q-8.4-hemisphere
    type: numeric
    objectives: [OBJ-8.4-2, OBJ-8.4-1, OBJ-8.4-3]
    level: exam
    prompt: >-
      $S$ חצי ספרת היחידה העליון ($z\ge0$), **מכוון בנורמל החיצוני**, ו-$\eta=x\,dy\wedge dz+y\,dz\wedge dx$. נתונה
      הפרמטריזציה $\sigma(\theta,\psi)=(\sin\psi\cos\theta,\ \sin\psi\sin\theta,\ \cos\psi)$ על
      $[0,2\pi]\times[0,\frac\pi2]$, בסדר $\theta$ ואחריו $\psi$. פרמטריזציה מכוונת את $S$ בכיוון של
      $\sigma_\theta\times\sigma_\psi$, וכשהכיוון הזה הפוך לנדרש $\int_S\eta=-\int_D\sigma^*\eta$. חשבו $\int_S\eta$.
    answer: 4.1887902
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{4\pi}3$. $\sigma^*(dy\wedge dz)=(y_\theta z_\psi-y_\psi z_\theta)\,d\theta\wedge d\psi=-\sin^2\psi\cos\theta\,d\theta\wedge d\psi$
      ו-$\sigma^*(dz\wedge dx)=(z_\theta x_\psi-z_\psi x_\theta)\,d\theta\wedge d\psi=-\sin^2\psi\sin\theta\,d\theta\wedge d\psi$,
      ולכן $\sigma^*\eta=-\sin^3\psi\,(\cos^2\theta+\sin^2\theta)\,d\theta\wedge d\psi=-\sin^3\psi\,d\theta\wedge d\psi$
      ו-$\int_D\sigma^*\eta=-2\pi\cdot\frac23=-\frac{4\pi}3$. אבל $\sigma_\theta\times\sigma_\psi=-\sin\psi\,\sigma$ מצביע
      **פנימה**, ולכן עם הנורמל החיצוני מחליפים סימן. בדיקה דרך ההתאמה לשדות: זה השטף של $(x,y,0)$ החוצה,
      $\iint_S(x^2+y^2)\,dS=\iint_S\sin^2\psi\,dS>0$.
