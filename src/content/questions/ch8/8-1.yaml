    answer: 1.5707963
    tolerance: 0.0005
    correctFeedback: >-
      נכון. $\omega=d(x^2y+yz)$: $f_x=2xy$, $f_y=x^2+z$, $f_z=y$. לכן $\int_\gamma\omega=f(0,1,\tfrac\pi2)-f(1,0,0)=\frac\pi2-0=\frac\pi2\approx1.5708$.
    wrongFeedback: >-
      חפשו $f$ עם $f_x=2xy$, $f_y=x^2+z$, $f_z=y$. אם יש כזו, האינטגרל הוא הפרש הערכים בקצוות: $\gamma(0)=(1,0,0)$,
      $\gamma(\frac\pi2)=(0,1,\frac\pi2)$.
    commonWrong:
