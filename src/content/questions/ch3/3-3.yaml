# Lesson 3.3 — tangent plane, unit normal and orientability. Understanding questions, basic → mid → exam.
# Objectives (src/course.ts):
#   OBJ-3.3-1  compute the tangent plane and the unit normal at a point of a parametrized surface and of a level surface
#   OBJ-3.3-2  show that the tangent plane is the set of velocity vectors of curves in the surface
#   OBJ-3.3-3  tell an orientable surface from a non-orientable one, and explain why the Möbius band is not orientable
# The unit normal of a parametrization is always N̂ (with its hat): N (no hat) is a coefficient of the second form
# (chapter 4). An orientation (a continuous unit normal field on the points of S) is written ν, as in lesson 3.3.
# Keys recomputed on 2026-11-12 with src/math/surfaces.ts and finite differences (scratchpad q33.ts).
chapter: 3
questions:
  - id: Q-3.3-normal-saddle
    type: numeric
    objectives: [OBJ-3.3-1]
    level: basic
    prompt: >-
      $\sigma(x,y)=(x,\ y,\ x^2-y^2)$. חשבו את הרכיב השלישי של נורמל היחידה
      $\hat{\mathbf N}=\frac{\sigma_x\times\sigma_y}{\|\sigma_x\times\sigma_y\|}$ בנקודה $(x,y)=(1,1)$. (שימו לב: הנורמל
      נכתב תמיד עם כובע, $\hat{\mathbf N}$; האות $N$ בלי כובע תשמש בפרק 4 למקדם של התבנית השנייה.)
    answer: 0.3333333
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\sigma_x\times\sigma_y=(-2x,\,2y,\,1)=(-2,2,1)$, שאורכו $\sqrt{4+4+1}=3$, ולכן
      $\hat{\mathbf N}=\frac13(-2,2,1)$ והרכיב השלישי $\frac13$. הוא חיובי: בגרף $\sigma_x\times\sigma_y$ מצביע תמיד "למעלה".
    wrongFeedback: >-
      חשבו את $\sigma_x\times\sigma_y=(-f_x,-f_y,1)$ בנקודה, ואז חלקו באורך (לא בריבוע האורך).
    commonWrong:
      - value: -0.3333333
        feedback: >-
          הסימן הפוך: זה הנורמל של $\sigma_y\times\sigma_x$. בקורס $\hat{\mathbf N}$ מוגדר לפי סדר הפרמטרים, $\sigma_x\times\sigma_y$.
        misconception: MC-c3-normal-order-irrelevant
      - value: 0.1111111
        feedback: >-
          זה $\frac19$: חילקתם בריבוע האורך. וקטור יחידה מקבלים בחלוקה ב-$\|w\|=3$.
        misconception: MC-c3-norm-vs-square
      - value: 1
        feedback: >-
          זה הרכיב השלישי של $\sigma_x\times\sigma_y$ לפני הנרמול. אורכו $3\ne1$, ולכן הוא אינו נורמל **יחידה**.
        misconception: MC-c3-normal-not-normalized

  - id: Q-3.3-plane-level
    type: mc
    objectives: [OBJ-3.3-1]
    level: basic
    prompt: >-
      מהו המישור המשיק הגאומטרי להיפרבולואיד $x^2+y^2-z^2=1$ בנקודה $p=(1,-1,1)$?
    choices:
      - text: '$x-y-z=1$'
        correct: true
        feedback: >-
          נכון. $\nabla F(p)=(2x,\,2y,\,-2z)=(2,-2,-2)$ ניצב למשטח, והמישור $\nabla F(p)\cdot(\mathbf x-p)=0$ הוא
          $2(x-1)-2(y+1)-2(z-1)=0$, כלומר $x-y-z=1$. בדיקה: $p$ מקיימת $1+1-1=1$.
      - text: '$x-y-z=0$'
        feedback: >-
          זה מישור מקביל שעובר בראשית, ו-$p$ אינה עליו ($1+1-1\ne0$). $\nabla F(p)^{\perp}$ הוא המרחב הווקטורי של וקטורי
          המהירות; המישור המשיק הגאומטרי עובר ב-$p$.
        misconception: MC-c3-tangent-plane-through-origin
      - text: '$x-y+z=3$'
        feedback: >-
          זה המישור דרך $p$ שניצב ל-$p=(1,-1,1)$ עצמו. וקטור המקום ניצב למשטח רק בספרה שמרכזה בראשית; כאן הנורמל הוא
          $\nabla F(p)=(2,-2,-2)$, עם סימן הפוך ברכיב השלישי בגלל $-z^2$.
        misconception: MC-c3-normal-is-position

  - id: Q-3.3-velocity
    type: mc
    objectives: [OBJ-3.3-2]
    qualitative: true
    level: basic
    prompt: >-
      $S$ משטח חלק ו-$p\in S$. איזו טענה מתארת נכון את הקשר בין המישור המשיק $T_pS$ לבין מסילות $C^1$ ב-$S$ דרך $p$?
    choices:
      - text: '$T_pS$ שווה בדיוק לקבוצת המהירויות $\gamma''(0)$ של מסילות $\gamma$ ב-$S$ עם $\gamma(0)=p$'
        correct: true
        feedback: >-
          נכון (משפט 3.3.2). כל מהירות ב-$T_pS$, לפי כלל השרשרת, $\gamma'=u'\sigma_u+v'\sigma_v$; וכל $a\sigma_u+b\sigma_v$
          הוא המהירות של $\sigma(u_0+at,\,v_0+bt)$.
      - text: 'המהירויות הן בדיוק הכפולות של $\sigma_u$ ושל $\sigma_v$; צירוף כמו $\sigma_u+\sigma_v$ אינו מהירות של מסילה ב-$S$'
        feedback: >-
          מסילה במשטח יכולה לעבור ב-$p$ בכל כיוון משיק: $\sigma(u_0+t,\,v_0+t)$ מהירותה $\sigma_u+\sigma_v$, שאינה כפולה של
          אף אחד מהם בדרך כלל.
        misconception: MC-c3-tangent-only-coordinate-directions
      - text: 'קבוצת המהירויות גדולה מ-$T_pS$: למסילה שמתעקלת בתוך $S$ יש מהירות עם רכיב לאורך $\hat{\mathbf N}$'
        feedback: >-
          המהירות תמיד משיקה. מה שיכול לצאת מהמישור הוא **התאוצה**: במעגל הגדול $(\cos t,\sin t,0)$ על ספרת היחידה המהירות
          משיקה, והתאוצה $-(\cos t,\sin t,0)$ ניצבת לספרה.
        misconception: MC-c3-velocity-leaves-plane

  - id: Q-3.3-saddle-curve
    type: mc
    objectives: [OBJ-3.3-2]
    level: basic
    prompt: >-
      המסילה $\gamma(t)=(t,\ t^2,\ t^3)$ נמצאת על המשטח $z=xy$, עם הפרמטריזציה $\sigma(x,y)=(x,y,xy)$. כתבו את $\gamma'(1)$
      בעזרת $\sigma_x,\sigma_y$ בנקודה $(1,1)$.
    choices:
      - text: '$\gamma''(1)=\sigma_x+2\sigma_y$'
        correct: true
        feedback: >-
          נכון. $\gamma(t)=\sigma(t,t^2)$, ולפי כלל השרשרת $\gamma'=1\cdot\sigma_x+2t\,\sigma_y$. בדיקה:
          $\sigma_x=(1,0,y)=(1,0,1)$, $\sigma_y=(0,1,x)=(0,1,1)$, ו-$\sigma_x+2\sigma_y=(1,2,3)=\gamma'(1)$.
      - text: 'אי אפשר: $\gamma''(1)=(1,2,3)$ אינו במישור הנפרש על ידי $\sigma_x,\sigma_y$, כי המסילה מתעקלת'
        feedback: >-
          $(1,2,3)=\sigma_x+2\sigma_y$, כפי שהחישוב מראה. מהירות של מסילה במשטח תמיד במישור המשיק, גם כשהמסילה מתעקלת.
        misconception: MC-c3-velocity-leaves-plane
      - text: '$\gamma''(1)=\sigma_x+2\sigma_y+3\hat{\mathbf N}$'
        feedback: >-
          הרכיב השלישי 3 של $\gamma'(1)$ כבר מתקבל מ-$\sigma_x+2\sigma_y=(1,2,3)$, ואין רכיב נורמלי. $(1,2,3)\cdot(-1,-1,1)=0$,
          כש-$(-y,-x,1)=(-1,-1,1)$ הוא $\sigma_x\times\sigma_y$.
        misconception: MC-c3-velocity-leaves-plane

  - id: Q-3.3-hyperboloid-velocity
    type: mc
    objectives: [OBJ-3.3-2]
    level: mid
    prompt: >-
      המסילה $\gamma(t)=(\cos t-t\sin t,\ \ \sin t+t\cos t,\ \ t)$ נמצאת על ההיפרבולואיד $x^2+y^2-z^2=1$, ו-$\gamma(0)=(1,0,0)$.
      עם הפרמטריזציה $\sigma(u,v)=(\cosh v\cos u,\ \cosh v\sin u,\ \sinh v)$ מתקיים $\sigma(0,0)=(1,0,0)$. כתבו את $\gamma'(0)$
      כצירוף של $\sigma_u(0,0)$ ו-$\sigma_v(0,0)$.
    choices:
      - text: '$\gamma''(0)=2\sigma_u+\sigma_v$'
        correct: true
        feedback: >-
          נכון. $\gamma'(t)=(-2\sin t-t\cos t,\ 2\cos t-t\sin t,\ 1)$, ולכן $\gamma'(0)=(0,2,1)$. ב-$(0,0)$: $\sigma_u=(0,1,0)$,
          $\sigma_v=(0,0,1)$, ו-$(0,2,1)=2\sigma_u+\sigma_v$. ולפי משפט 3.3.2 זה לא מקרה: מהירות של מסילה במשטח תמיד
          ב-$T_pS$; בדיקה: $(0,2,1)\cdot\nabla F(p)=(0,2,1)\cdot(2,0,0)=0$.
      - text: 'אי אפשר: $\gamma$ אינה קו פרמטרי של $\sigma$, ולכן $\gamma''(0)$ אינו צירוף של $\sigma_u,\sigma_v$'
        feedback: >-
          כל וקטור ב-$T_pS$ הוא צירוף של $\sigma_u,\sigma_v$, ומהירות של **כל** מסילה ב-$S$ (לא רק של קו פרמטרי) נמצאת
          ב-$T_pS$ (משפט 3.3.2). כאן $(0,2,1)=2\sigma_u+\sigma_v$.
        misconception: MC-c3-tangent-only-coordinate-directions
      - text: 'אי אפשר: המסילה מסתלסלת סביב הציר, ולכן ל-$\gamma''(0)$ יש רכיב לאורך $\nabla F(p)$'
        feedback: >-
          $\gamma'(0)=(0,2,1)$ ו-$\nabla F(p)=(2,0,0)$: המכפלה הפנימית אפס. מהירות של מסילה ב-$S$ נמצאת תמיד ב-$T_pS$
          (משפט 3.3.2); מה שמשקף את ההסתלסלות הוא התאוצה, לא המהירות.
        misconception: MC-c3-velocity-leaves-plane

  - id: Q-3.3-orientable-def
    type: mc
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: basic
    prompt: >-
      מתי משטח חלק $S$ נקרא **מכוון**?
    choices:
      - text: 'כשקיימת פונקציה רציפה $\boldsymbol\nu:S\to\mathbb R^3$ כך ש-$\boldsymbol\nu(p)$ נורמל יחידה ל-$T_pS$ בכל $p\in S$'
        correct: true
        feedback: >-
          נכון (הגדרה 3.3.6). בכל נקודה יש שתי אפשרויות, $\pm\hat{\mathbf N}$; משטח מכוון אם אפשר לבחור ביניהן ברציפות על כל
          המשטח בבת אחת. $\boldsymbol\nu$ היא פונקציה של **נקודות** $S$, לא של פרמטרים.
      - text: 'כשבכל נקודה $p\in S$ קיים וקטור יחידה שניצב ל-$T_pS$, בלי שום דרישה נוספת'
        feedback: >-
          זה נכון לכל משטח חלק, גם לרצועת מביוס: בכל נקודה יש בדיוק שני נורמלי יחידה. הדרישה היא שהבחירה תהיה **רציפה**.
        misconception: MC-c3-orientable-pointwise
      - text: 'בדיוק כשפרמטריזציה מקומית אחת (רגולרית והומאומורפיזם) מכסה את כל $S$'
        feedback: >-
          פרמטריזציה מקומית אחת שמכסה את $S$ אכן נותנת כיוון (טענה 3.3.8(א)), אבל ההפך לא נכון: את הספרה אי אפשר לכסות
          בפרמטריזציה מקומית אחת (טענה 3.3.8(ה)), והיא מכוונת עם $\boldsymbol\nu(p)=p$. לכן "בדיוק כש" שגוי.
        misconception: MC-c3-orientable-one-chart

  - id: Q-3.3-sphere-two
    type: twotier
    objectives: [OBJ-3.3-1, OBJ-3.3-3]
    qualitative: true
    level: mid
    prompt: >-
      בפרמטריזציה של הקורס לספרת היחידה, $\sigma(u,v)=(\cos u\cos v,\ \sin u\cos v,\ \sin v)$ עם $|v|<\frac\pi2$, מתקיים
      $\hat{\mathbf N}=\sigma$: החוצה. עכשיו
      $$\tilde\sigma(s,t)=(\cos s\cos t,\ -\sin s\cos t,\ \sin t),\qquad |t|<\tfrac\pi2.$$
      לאן מצביע $\hat{\mathbf N}$ של $\tilde\sigma$?
    choices:
      - text: פנימה, למרכז הספרה
        correct: true
        feedback: >-
          נכון. אותה ספרה, אותה נקודה, נורמל יחידה הפוך: $\hat{\mathbf N}$ של $\tilde\sigma$ הוא $-\tilde\sigma$.
      - text: החוצה, כי הנורמל של ספרה מצביע תמיד החוצה
        feedback: >-
          "החוצה" הוא תוצאה של סדר הפרמטרים, לא חלק מההגדרה של $\hat{\mathbf N}$. כאן ההחלפה הופכת אותו.
        misconception: MC-c3-reparam-keeps-normal-direction
    reasons:
      - text: '$\tilde\sigma=\sigma\circ\varphi$ עם $\varphi(s,t)=(-s,t)$ ו-$\det D\varphi=-1$, וטענה 3.3.5 נותנת סימן $-1$'
        correct: true
        feedback: >-
          בדיוק: $\cos(-s)=\cos s$ ו-$\sin(-s)=-\sin s$, ולכן $\tilde\sigma(s,t)=\sigma(-s,t)$. $D\varphi=\operatorname{diag}(-1,1)$,
          ו-$\tilde{\hat{\mathbf N}}=\operatorname{sgn}(\det D\varphi)\,\hat{\mathbf N}\circ\varphi=-\hat{\mathbf N}\circ\varphi$.
      - text: '$\tilde\sigma$ שונה מ-$\sigma$ רק בשם ובסימן של פרמטר, ושינוי כזה אינו משנה את $\sigma_u\times\sigma_v$'
        feedback: >-
          שינוי הסימן של $s$ הופך את $\tilde\sigma_s$ ל-$-\sigma_u$, ולכן המכפלה הווקטורית מתהפכת. לסימן ולסדר של
          הפרמטרים יש משמעות במכפלה הווקטורית.
        misconception: MC-c3-normal-order-irrelevant
      - text: 'לשתי הפרמטריזציות אותו מישור משיק בכל נקודה, ולכן גם אותו נורמל יחידה'
        feedback: >-
          אותו מישור משיק נותן אותו **ישר** נורמלי, ועליו שני וקטורי יחידה. איזה מהם מתקבל תלוי בסימן של $\det(D\varphi)$.
        misconception: MC-c3-reparam-keeps-normal-direction

  - id: Q-3.3-level-velocity
    type: twotier
    objectives: [OBJ-3.3-2, OBJ-3.3-1]
    qualitative: true
    level: mid
    prompt: >-
      $S=F^{-1}(c)$ משטח רמה של ערך רגולרי ו-$p\in S$. האם $T_pS=\nabla F(p)^{\perp}$ (כל הווקטורים הניצבים
      ל-$\nabla F(p)$)?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. ולכן המישור המשיק הגאומטרי הוא $\nabla F(p)\cdot(\mathbf x-p)=0$, ו-$\hat{\mathbf N}=\pm\frac{\nabla F}{\|\nabla F\|}$.
      - text: 'לא, $\nabla F(p)$ הוא עצמו כיוון במישור המשיק'
        feedback: >-
          הגרדיאנט ניצב לקבוצות רמה: על ספרת היחידה $F=x^2+y^2+z^2$ נותן $\nabla F(p)=2p$, הווקטור הרדיאלי, שניצב לספרה.
        misconception: MC-c3-gradient-in-plane
    reasons:
      - text: '$F\circ\gamma$ קבועה לכל מסילה $\gamma$ ב-$S$ דרך $p$, ולכן $T_pS\subseteq\nabla F(p)^{\perp}$; ושניהם ממימד 2'
        correct: true
        feedback: >-
          בדיוק. ההכלה באה מכלל השרשרת ומאפיון $T_pS$ כאוסף המהירויות (משפט 3.3.2); $\nabla F(p)\ne0$ (ערך רגולרי), ולכן
          $\nabla F(p)^{\perp}$ ממימד 2, והכלה בין מרחבים ממימד 2 היא שוויון.
      - text: 'על $S$ הפונקציה $F$ קבועה, ולכן $\nabla F=0$ בכל נקודה של $S$, וכל וקטור ניצב לו'
        feedback: >-
          אז היה מתקבל $\nabla F(p)^{\perp}=\mathbb R^3$, לא מישור. $F$ קבועה רק **לאורך** $S$; ו-$\nabla F(p)\ne0$ כי $c$ ערך
          רגולרי.
        misconception: MC-c3-constant-on-set-zero-gradient
      - text: 'הווקטורים $\nabla F(p)$ ו-$p$ פורשים מישור, וזה המישור המשיק $T_pS$'
        feedback: >-
          $\nabla F(p)$ ניצב למשטח, ו-$p$ הוא נקודה, לא כיוון משיק. במשטח רמה כללי אין קשר בין $p$ לבין $T_pS$.
        misconception: MC-c3-gradient-in-plane

  - id: Q-3.3-mobius
    type: twotier
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: mid
    prompt: >-
      רצועת מביוס:
      $$\sigma(u,v)=\Big(\big(2+v\cos\tfrac u2\big)\cos u,\ \big(2+v\cos\tfrac u2\big)\sin u,\ v\sin\tfrac u2\Big),\qquad u\in\mathbb R,\ |v|<1.$$
      $\sigma$ רגולרית בכל נקודה ו-$\sigma(u+2\pi,-v)=\sigma(u,v)$. האם הרצועה מכוונת?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. לאורך המעגל האמצעי $v=0$ כל בחירה רציפה של נורמל יחידה חוזרת לנקודת ההתחלה עם סימן הפוך.
      - text: כן, כי $\sigma$ רגולרית בכל נקודה
        feedback: >-
          רגולריות היא תנאי מקומי; כיווניות היא תנאי גלובלי. הנוסחה $\frac{\sigma_u\times\sigma_v}{\|\sigma_u\times\sigma_v\|}$
          מגדירה וקטור לכל $(u,v)$, אבל לנקודה אחת של הרצועה יש שני זוגות פרמטרים, $(u,v)$ ו-$(u+2\pi,-v)$, והם נותנים
          נורמלים מנוגדים.
        misconception: MC-c3-orientable-pointwise
    reasons:
      - text: '$\hat{\mathbf N}(2\pi,0)=-\hat{\mathbf N}(0,0)$ באותה נקודה, ושדה רציף לאורך $v=0$ הוא $\pm\hat{\mathbf N}(u,0)$ עם סימן קבוע'
        correct: true
        feedback: >-
          בדיוק. אם $\boldsymbol\nu$ כיוון של הרצועה, אז $\varepsilon(u)=\boldsymbol\nu(\sigma(u,0))\cdot\hat{\mathbf N}(u,0)$
          רציפה ומקבלת רק $\pm1$, ולכן קבועה; אבל $\sigma(2\pi,0)=\sigma(0,0)$ ו-$\hat{\mathbf N}(2\pi,0)=-\hat{\mathbf N}(0,0)$
          נותנים $\varepsilon(2\pi)=-\varepsilon(0)$. סתירה.
      - text: 'יש ברצועה נקודות, על המעגל האמצעי, שבהן הפרמטריזציה $\sigma$ אינה רגולרית, ושם הנורמל נשבר'
        feedback: >-
          אין: $\|\sigma_u\times\sigma_v\|>1$ בכל נקודה עם $|v|<1$. אי-כיווניות אינה סינגולריות.
        misconception: MC-c3-nonorientable-means-singular
      - text: 'לרצועה יש רק צד אחד, ולכן אין לה בכלל נורמל יחידה באף נקודה'
        feedback: >-
          בכל נקודה של הרצועה יש נורמל יחידה (שניים, למעשה). "צד אחד" הוא תיאור אינטואיטיבי של מה שצריך להוכיח, לא נימוק:
          ההוכחה מראה שבחירה **רציפה** של נורמל אינה קיימת.
        misconception: MC-c3-orientable-pointwise

  - id: Q-3.3-mobius-dot
    type: numeric
    objectives: [OBJ-3.3-3]
    level: mid
    prompt: >-
      רצועת מביוס
      $$\sigma(u,v)=\Big(\big(2+v\cos\tfrac u2\big)\cos u,\ \big(2+v\cos\tfrac u2\big)\sin u,\ v\sin\tfrac u2\Big),\qquad |v|<1,$$
      עם $\hat{\mathbf N}=\frac{\sigma_u\times\sigma_v}{\|\sigma_u\times\sigma_v\|}$. חשבו את
      $\hat{\mathbf N}\big(\frac\pi2,0\big)\cdot\hat{\mathbf N}\big(\frac{5\pi}2,0\big)$. (שתי הנקודות הן אותה נקודה $(0,2,0)$.)
    answer: -1
    tolerance: 0.001
    correctFeedback: >-
      נכון. ב-$v=0$: $\sigma_u=(-2\sin u,\,2\cos u,\,0)$ ו-$\sigma_v=(\cos\frac u2\cos u,\ \cos\frac u2\sin u,\ \sin\frac u2)$.
      ב-$u=\frac\pi2$: $\sigma_u=(-2,0,0)$, $\sigma_v=(0,\frac{\sqrt2}2,\frac{\sqrt2}2)$, $\sigma_u\times\sigma_v=(0,\sqrt2,-\sqrt2)$.
      ב-$u=\frac{5\pi}2$: $\sigma_u=(-2,0,0)$ שוב, אבל $\cos\frac{5\pi}4=\sin\frac{5\pi}4=-\frac{\sqrt2}2$, ולכן $\sigma_v$ והמכפלה
      מתהפכים. הנורמלים $\pm\frac1{\sqrt2}(0,1,-1)$, והמכפלה $-1$.
    wrongFeedback: >-
      הציבו $v=0$ בנגזרות, ושימו לב ש-$\cos\frac u2$ ו-$\sin\frac u2$ מחליפים סימן כש-$u$ גדל ב-$2\pi$.
    commonWrong:
      - value: 1
        feedback: >-
          כאן הנחתם שבנקודה שחוזרים אליה הנורמל חוזר לערכו. אבל $\cos\frac u2$ ו-$\sin\frac u2$ מחליפים סימן בין
          $u=\frac\pi2$ ל-$u=\frac{5\pi}2$, ולכן $\sigma_v$ מתהפך, וגם $\hat{\mathbf N}$.
        misconception: MC-c3-closed-loop-normal-returns
      - value: 0
        feedback: >-
          הקטע מסתובב בחצי סיבוב, ולכן הנורמל, שניצב לו, מסתובב גם הוא ב-$180^\circ$, לא ב-$90^\circ$: הוא חוזר הפוך,
          לא ניצב.
        misconception: MC-c3-mobius-quarter-turn

  - id: Q-3.3-orientable-which
    type: multi
    objectives: [OBJ-3.3-3, OBJ-3.3-1]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהקבוצות הבאות הן משטחים חלקים **מכוונים**? סמנו את כולן.
    choices:
      - text: 'הגליל $x^2+y^2=1$, שאין פרמטריזציה מקומית אחת שמכסה את כולו'
        correct: true
        feedback: >-
          נכון. הוא משטח רמה של ערך רגולרי ($\nabla F=2(x,y,0)\ne0$ עליו), ולכן מכוון עם $\boldsymbol\nu=(x,y,0)$ (טענה 3.3.8(ג)).
          כיווניות אינה דורשת פרמטריזציה אחת.
      - text: 'כל גרף $z=f(x,y)$ של פונקציה חלקה על קבוצה פתוחה'
        correct: true
        feedback: >-
          נכון. $\boldsymbol\nu=\frac{(-f_x,-f_y,1)}{\sqrt{1+f_x^2+f_y^2}}$ רציף על כל הגרף (טענה 3.3.8(ב)).
      - text: 'רצועת מביוס של משפט 3.3.9'
        feedback: >-
          לאורך המעגל האמצעי הנורמל הרציף חוזר הפוך: $\hat{\mathbf N}(0,0)=-\hat{\mathbf N}(2\pi,0)$ באותה נקודה.
        misconception: MC-c3-closed-loop-normal-returns
      - text: 'החרוט הכפול $x^2+y^2=z^2$, כולל הקודקוד'
        feedback: >-
          הוא אינו משטח חלק בכלל: קודקוד החרוט הכפול הוא נקודה סינגולרית (משפט 3.1.10), וכיווניות מוגדרת רק למשטחים
          חלקים. (בלי הקודקוד הוא כן משטח חלק מכוון.)
        misconception: MC-c3-level-set-always-surface

  - id: Q-3.3-converse-rank
    type: rank
    objectives: [OBJ-3.3-2]
    level: mid
    help: >-
      סדרו את שלבי ההוכחה מהשלב הראשון לאחרון.
    prompt: >-
      $\sigma:D\to\mathbb R^3$ פרמטריזציה רגולרית, $D$ פתוחה, ו-$p=\sigma(u_0,v_0)$. הוכיחו שכל וקטור
      $w\in\operatorname{span}\{\sigma_u,\sigma_v\}$ הוא וקטור המהירות של מסילה ב-$\sigma(D)$ שעוברת ב-$p$.
    items:
      - id: write
        label: 'כותבים $w=a\sigma_u(u_0,v_0)+b\sigma_v(u_0,v_0)$ עם $a,b\in\mathbb R$'
      - id: domain
        label: 'בוחרים $\delta>0$ כך ש-$(u_0+at,\ v_0+bt)\in D$ לכל $|t|<\delta$, וזה אפשרי כי $D$ פתוחה'
      - id: curve
        label: 'מגדירים $\gamma(t)=\sigma(u_0+at,\ v_0+bt)$ ל-$|t|<\delta$, מסילה ב-$\sigma(D)$ עם $\gamma(0)=p$'
      - id: chain
        label: 'לפי כלל השרשרת $\gamma''(0)=a\sigma_u+b\sigma_v=w$, עם הנגזרות ב-$(u_0,v_0)$'
    order: [write, domain, curve, chain]
    correctFeedback: >-
      נכון. הרעיון: מסילה ישרה במישור הפרמטרים, בכיוון $(a,b)$, נשלחת למסילה במשטח שמהירותה $w$. הפתיחות של $D$ נחוצה
      כדי שהמסילה תהיה מוגדרת בסביבה של $t=0$.
    wrongFeedback: >-
      את $\delta$ אפשר לבחור רק אחרי שיודעים את $a,b$, ואת $\gamma$ אפשר להגדיר רק אחרי שיודעים על איזה קטע היא בתוך $D$;
      הגזירה באה בסוף.

  - id: Q-3.3-mobius-level
    type: twotier
    objectives: [OBJ-3.3-3, OBJ-3.3-1]
    qualitative: true
    level: mid
    prompt: >-
      האם ייתכן שרצועת מביוס $\mathcal M$ היא קבוצת רמה $F^{-1}(0)$ של פונקציה חלקה $F:U\to\mathbb R$, כש-$U\subset\mathbb R^3$
      פתוחה ומכילה את $\mathcal M$, ו-0 ערך רגולרי של $F$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון (מסקנה 3.3.10(א)). כל משטח רמה של ערך רגולרי מכוון, ורצועת מביוס אינה מכוונת.
      - text: כן, כי כל משטח חלק הוא מקומית קבוצת רמה של ערך רגולרי
        feedback: >-
          "מקומית" זה נכון: כל חתיכה קטנה של הרצועה היא קבוצת רמה כזו. אבל השאלה היא על **פונקציה אחת** על סביבה של כל
          $\mathcal M$, ואז $\frac{\nabla F}{\|\nabla F\|}$ מוגדר ברציפות על כל $\mathcal M$.
        misconception: MC-c3-orientable-pointwise
    reasons:
      - text: 'אז $\frac{\nabla F}{\|\nabla F\|}$ היה כיוון של $\mathcal M$, ו-$\mathcal M$ הייתה מכוונת'
        correct: true
        feedback: >-
          בדיוק. $\nabla F\ne0$ על $\mathcal M$ (ערך רגולרי), $\nabla F$ רציף, ו-$\nabla F(p)\perp T_p\mathcal M$ (טענה 3.3.3).
          זה סותר את משפט 3.3.9.
      - text: 'ברצועת מביוס יש נקודות סינגולריות, ושם $\nabla F$ היה חייב להתאפס'
        feedback: >-
          לרצועה אין נקודות סינגולריות: הפרמטריזציה שלה רגולרית בכל נקודה, והיא משטח חלק. הסתירה באה מהכיווניות.
        misconception: MC-c3-nonorientable-means-singular
      - text: 'הנורמל $\frac{\nabla F}{\|\nabla F\|}$ היה חוזר לערכו אחרי הקפה, וזה קורה לכל נורמל רציף'
        feedback: >-
          זה לא "קורה לכל נורמל רציף לאורך פרמטר": ברצועת מביוס $\hat{\mathbf N}(u,0)$ של הפרמטריזציה **לא** חוזר לערכו.
          מה שמיוחד ב-$\frac{\nabla F}{\|\nabla F\|}$ הוא שהוא פונקציה של הנקודה ב-$\mathbb R^3$, ולכן מוגדר היטב ורציף על כל
          $\mathcal M$.
        misconception: MC-c3-closed-loop-normal-returns

  - id: Q-3.3-three-half-twists
    type: twotier
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: exam
    prompt: >-
      רצועה עם **שלושה** חצאי סיבובים:
      $$\sigma_3(u,v)=\Big(\big(2+v\cos\tfrac{3u}2\big)\cos u,\ \big(2+v\cos\tfrac{3u}2\big)\sin u,\ v\sin\tfrac{3u}2\Big),\qquad u\in\mathbb R,\ |v|<1.$$
      נתון ש-$\sigma_3$ רגולרית בכל נקודה, ש-$\sigma_3(u+2\pi,-v)=\sigma_3(u,v)$, ושהתמונה $B_3$ משטח חלק (באותה דרך
      כמו במשפט 3.3.9(ב)). האם $B_3$ מכוון?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. ההוכחה של משפט 3.3.9(ד) עוברת מילה במילה, ברגע שמחשבים את $\hat{\mathbf N}$ על המעגל האמצעי.
      - text: כן
        feedback: >-
          שלושה חצאי סיבובים הם מספר אי-זוגי של חצאים. חשבו את $\hat{\mathbf N}(0,0)$ ואת $\hat{\mathbf N}(2\pi,0)$ ותראו.
        misconception: MC-c3-twists-cancel
    reasons:
      - text: 'על $v=0$, $\hat{\mathbf N}(u,0)=\sin\frac{3u}2\,e_r-\cos\frac{3u}2\,e_z$, ולכן $\hat{\mathbf N}(2\pi,0)=-\hat{\mathbf N}(0,0)$'
        correct: true
        feedback: >-
          בדיוק. ב-$v=0$: $\sigma_u=2e_\theta$ ו-$\sigma_v=\cos\frac{3u}2\,e_r+\sin\frac{3u}2\,e_z$, ובבסיס הימני
          $e_\theta\times e_r=-e_z$, $e_\theta\times e_z=e_r$; לכן $\sigma_u\times\sigma_v=2\sin\frac{3u}2\,e_r-2\cos\frac{3u}2\,e_z$.
          ב-$u=0$: $(0,0,-1)$; ב-$u=2\pi$: $\cos3\pi=-1$, $\sin3\pi=0$, ולכן $(0,0,1)$, באותה נקודה $(2,0,0)$. אם $\boldsymbol\nu$
          כיוון, $\boldsymbol\nu(\sigma_3(u,0))\cdot\hat{\mathbf N}(u,0)$ רציפה עם ערכים $\pm1$ על $[0,2\pi]$, ולכן קבועה, בסתירה
          להתהפכות. באופן כללי, עם $k$ חצאי סיבובים $\hat{\mathbf N}(2\pi,0)=(-1)^k\hat{\mathbf N}(0,0)$.
      - text: 'שלושה חצאי סיבובים הם מביוס ועוד סיבוב שלם, והסיבוב השלם מבטל את החצי, כמו ברצועה של דוגמה 6'
        feedback: >-
          סיבוב שלם אינו "מבטל" חצי סיבוב: הוא מוסיף $-1$ בחזקה זוגית. מה שקובע הוא הזוגיות של מספר החצאים, $(-1)^3=-1$.
        misconception: MC-c3-twists-cancel
      - text: '$\sigma_3$ רגולרית בכל נקודה, ולכן $\hat{\mathbf N}\circ\sigma_3^{-1}$ הוא שדה נורמלי רציף על $B_3$'
        feedback: >-
          $\sigma_3$ אינה חד-חד-ערכית ($\sigma_3(u+2\pi,-v)=\sigma_3(u,v)$), ולכן $\sigma_3^{-1}$ אינה מוגדרת; ולנקודה אחת שני
          זוגות פרמטרים עם $\hat{\mathbf N}$ מנוגדים. רגולריות היא תנאי מקומי, וכיווניות גלובלית.
        misconception: MC-c3-orientable-pointwise
