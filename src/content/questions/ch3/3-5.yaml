# Lesson 3.5 — local isometries and intrinsic geometry. Understanding questions, basic → mid → exam.
# Objectives (src/course.ts):
#   OBJ-3.5-1  define a local isometry and show that it preserves the first form
#   OBJ-3.5-2  show that the cylinder and the cone are locally isometric to the plane (rolling a sheet without stretching)
#   OBJ-3.5-3  tell an intrinsic property (depends only on the first form) from an extrinsic one (depends on the embedding)
# No Gauss curvature here (chapter 4): the sphere is told from the plane by the lengths of intrinsic circles.
# Letters follow the lesson: μ for a parametrization of the plane (τ is torsion), ζ for a graph function, h for a helix rise.
chapter: 3
questions:
  - id: Q-3.5-def
    type: mc
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: basic
    prompt: >-
      מתי העתקה חלקה $f:S_1\to S_2$ בין משטחים נקראת **איזומטריה מקומית**?
    choices:
      - text: 'כשהיא מעבירה כל מסילה ב-$S_1$ למסילה ב-$S_2$ באותו אורך'
        correct: true
        feedback: >-
          נכון. שקול לכך (משפט 3.5.3): אם $\sigma_1$ פרמטריזציה מקומית של $S_1$ ו-$\sigma_2=f\circ\sigma_1$, אז ל-$\sigma_1$
          ול-$\sigma_2$ אותם $E,F,G$.
      - text: 'כש-$\|f(p)-f(q)\|=\|p-q\|$ לכל $p,q\in S_1$'
        feedback: >-
          זו שמירת מרחקים **בקו ישר במרחב**, כמו בתנועה קשיחה. גלגול דף לגליל אינו שומר אותם (שני קצות הדף מתקרבים), אבל
          שומר כל אורך של מסילה על הדף.
        misconception: MC-c3-isometry-is-rigid-motion
      - text: 'כשהיא שומרת את גודל השטח $\sqrt{EG-F^2}$ של כל מקבילית משיקה'
        feedback: >-
          זה חלש מדי: $(x,y)\mapsto(2x,\frac y2)$ במישור שומרת שטחים, ומכפילה את אורך הקטע מ-$(0,0)$ ל-$(1,0)$.
        misconception: MC-c3-isometry-area-only
      - text: 'כשהיא מעבירה את הנורמל $\hat{\mathbf N}$ של $S_1$ לנורמל של $S_2$'
        feedback: >-
          הנורמל אינו חלק מההגדרה, והוא תכונה חיצונית: הלפפת המישור על הגליל שומרת כל אורך, והנורמל של המישור קבוע
          בעוד שהנורמל של הגליל מסתובב.
        misconception: MC-c3-isometry-needs-normal

  - id: Q-3.5-cylinder-path
    type: numeric
    objectives: [OBJ-3.5-2]
    level: basic
    prompt: >-
      ההעתקה $f(x,y)=(\cos x,\ \sin x,\ y)$ מלפפת את המישור על גליל היחידה. מה אורך המסילה על הגליל שהיא התמונה של
      הקטע מ-$(0,0)$ ל-$(\pi,\pi)$ במישור?
    answer: 4.4428829
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\pi\sqrt2$. ל-$\sigma(x,y)=(\cos x,\sin x,y)$ יש $E=1$, $F=0$, $G=1$, כמו למישור, ולכן $f$ שומרת אורכים: אורך
      הסליל $(\cos t,\sin t,t)$, $0\le t\le\pi$, שווה לאורך הקטע, $\sqrt{\pi^2+\pi^2}$.
    wrongFeedback: >-
      חשבו את $E,F,G$ של $(\cos x,\sin x,y)$ והשוו למישור; אחר כך מספיק למדוד את הקטע במישור.
    commonWrong:
      - value: 3.7241917
        feedback: >-
          זה $\sqrt{4+\pi^2}$, המרחק **בקו ישר במרחב** בין $(1,0,0)$ ל-$(-1,0,\pi)$. המסילה על הגליל ארוכה ממנו: איזומטריה
          שומרת אורכים של מסילות על המשטח, לא מרחקים במרחב.
        misconception: MC-c3-isometry-is-rigid-motion

  - id: Q-3.5-intrinsic
    type: multi
    objectives: [OBJ-3.5-3]
    qualitative: true
    level: basic
    prompt: >-
      אילו מהגדלים הבאים הם **תכונות פנימיות** של משטח (מחושבים מ-$E,F,G$ בלבד, ולכן נשמרים בכל איזומטריה
      מקומית)? סמנו את כולם.
    choices:
      - text: 'האורך של מסילה על המשטח'
        correct: true
        feedback: 'נכון: $L=\int\sqrt{Eu''^2+2Fu''v''+Gv''^2}\,dt$.'
      - text: 'הזווית בין שתי מסילות שנחתכות'
        correct: true
        feedback: 'נכון: $\cos\theta$ מחושב מ-$E,F,G$ ומרכיבי המהירויות.'
      - text: 'גודל השטח $\sqrt{EG-F^2}$ של המקבילית שנפרשת על ידי $\sigma_u,\sigma_v$ בנקודה'
        correct: true
        feedback: 'נכון: הוא בנוי מ-$E,F,G$ בלבד.'
      - text: 'הנורמל היחידה $\hat{\mathbf N}$'
        feedback: >-
          למישור ולגליל יש פרמטריזציות עם $E=1$, $F=0$, $G=1$; הנורמל של המישור קבוע, ושל הגליל מסתובב. $\hat{\mathbf N}$
          תלוי בשיכון.
        misconception: MC-c3-normal-is-intrinsic
      - text: 'המרחק בקו ישר במרחב בין שתי נקודות של המשטח'
        feedback: >-
          גלגול דף לגליל משנה אותו. מה שנמדד בתוך המשטח הוא **המרחק הפנימי** (האינפימום של אורכי מסילות במשטח), וגם הוא
          פנימי רק במובן חלש: איזומטריה הפיכה שומרת אותו, ואיזומטריה מקומית יכולה לקצר אותו (הגדרה 3.5.6 (ג)).
        misconception: MC-c3-isometry-is-rigid-motion
      - text: 'העקמומיות $\kappa$ של מסילה על המשטח, כמסילה במרחב'
        feedback: >-
          הלפפת המישור על הגליל מעבירה ישר ($\kappa=0$) לסליל או למעגל ($\kappa>0$). זו תכונה חיצונית.
        misconception: MC-c3-curvature-of-curve-intrinsic

  - id: Q-3.5-graph-chart
    type: mc
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: basic
    prompt: >-
      $S$ הגרף $z=\zeta(x,y)$ של פונקציה חלקה. מתי ההטלה $(x,y,\zeta(x,y))\mapsto(x,y)$ מ-$S$ למישור היא איזומטריה מקומית?
    choices:
      - text: 'רק כש-$\zeta_x=\zeta_y=0$ בכל מקום, כלומר $\zeta$ קבועה מקומית'
        correct: true
        feedback: >-
          נכון. לגרף $E=1+\zeta_x^2$, $F=\zeta_x\zeta_y$, $G=1+\zeta_y^2$, ולמישור $(1,0,1)$. השוויון דורש $\zeta_x=\zeta_y=0$.
          אחרת ההטלה מקצרת כל מסילה שעולה או יורדת.
      - text: 'תמיד, כי ההטלה חד-חד-ערכית ועל והפרמטריזציה של הגרף רגולרית'
        feedback: >-
          הטלה הפיכה ורגולרית היא החלפת קואורדינטות, לא איזומטריה. בגרף $z=x$ הקטע מ-$(0,0,0)$ ל-$(1,0,1)$ אורכו $\sqrt2$,
          והטלתו אורכה 1.
        misconception: MC-c3-chart-is-isometry
      - text: 'כש-$F=0$, כלומר כשהקווים הפרמטריים של הגרף ניצבים'
        feedback: >-
          $F=0$ מתאר רק את הזווית בין $\sigma_x$ ל-$\sigma_y$. בגרף $z=x$ יש $F=0$ ו-$E=2\ne1$.
        misconception: MC-c3-chart-is-isometry

  - id: Q-3.5-intrinsic-circle
    type: numeric
    objectives: [OBJ-3.5-3]
    level: basic
    prompt: >-
      **המרחק הפנימי** בין שתי נקודות של משטח הוא האינפימום של אורכי המסילות במשטח שמחברות ביניהן. על ספרת היחידה, קבוצת
      הנקודות שהמרחק הפנימי שלהן מהקוטב הצפוני הוא $\frac\pi3$ היא קו הרוחב שבו הקולטיטודה
      (הזווית מהקוטב) היא $\frac\pi3$ (משפט 3.5.7). מה אורכו? (השוו לאורך של מעגל ברדיוס $\frac\pi3$ במישור.)
    answer: 5.441398
    tolerance: 0.001
    correctFeedback: >-
      נכון, $2\pi\sin\frac\pi3=\pi\sqrt3\approx5.441$, קצר מ-$2\pi\cdot\frac\pi3\approx6.580$. איזומטריה (העתקה הפיכה ששומרת אורכים)
      שומרת גם מרחקים פנימיים, ולכן מעבירה "מעגל פנימי" ברדיוס $\rho$ למעגל פנימי ברדיוס $\rho$ באותו אורך.
    wrongFeedback: >-
      קו הרוחב בקולטיטודה $\rho$ הוא מעגל ברדיוס $\sin\rho$ (המרחק מציר $z$).
    commonWrong:
      - value: 6.5797363
        feedback: >-
          זה $2\pi\cdot\frac\pi3$, אורך מעגל ברדיוס $\frac\pi3$ **במישור**. על הספרה המעגל קצר יותר: רדיוסו במרחב הוא
          $\sin\frac\pi3<\frac\pi3$. בדיוק הפער הזה מבדיל את הספרה מהמישור.
        misconception: MC-c3-every-surface-locally-flat
      - value: 3.1415927
        feedback: >-
          זה $2\pi\cos\frac\pi3$: לקחתם את רדיוס קו הרוחב כ-$\cos\rho$, המרחק מהמישור $xy$ ולא מציר $z$. נקודה בקולטיטודה
          $\rho$ היא $(\sin\rho\cos t,\ \sin\rho\sin t,\ \cos\rho)$, ולכן רדיוס המעגל $\sin\rho$.
        misconception: MC-c3-every-surface-locally-flat

  - id: Q-3.5-cone-angle
    type: numeric
    objectives: [OBJ-3.5-2]
    level: mid
    prompt: >-
      החרוט $z=\sqrt{x^2+y^2}$, $z>0$, בפרמטריזציה $\sigma(u,v)=(v\cos u,\ v\sin u,\ v)$, $v>0$, מקיים $E=v^2$, $F=0$, $G=2$.
      חותכים אותו לאורך ישר יוצר ופורשים אותו על מישור בלי למתוח. מהי הזווית (ברדיאנים) של הגזרה שמתקבלת?
    answer: 4.4428829
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{2\pi}{\sqrt2}=\pi\sqrt2$. המרחק מהקודקוד לאורך החרוט הוא $\sqrt2\,v$, ומעגל בגובה $v$ אורכו $2\pi v$.
      בגזרה בזווית $\alpha$ הקשת ברדיוס $\sqrt2\,v$ אורכה $\alpha\sqrt2\,v$, ולכן $\alpha=\frac{2\pi}{\sqrt2}\approx4.443$, פחות מ-$2\pi$.
    wrongFeedback: >-
      השוו את אורך מעגל הרוחב בגובה $v_0$, $2\pi v_0$, למרחק שלו מהקודקוד לאורך ישר יוצר, $\int_0^{v_0}\sqrt G\,dv$.
    commonWrong:
      - value: 6.2831853
        feedback: >-
          זה $2\pi$, מישור שלם. אילו החרוט היה נפרש למישור שלם, מעגל הרוחב היה באורך $2\pi\cdot\sqrt2\,v$, אבל אורכו $2\pi v$.
        misconception: MC-c3-cone-full-angle
      - value: 8.8857659
        feedback: >-
          זה $2\pi\sqrt2$: היחס הפוך. המרחק לאורך החרוט, $\sqrt2\,v$, **גדול** מרדיוס המעגל $v$, ולכן הזווית קטנה מ-$2\pi$.
        misconception: MC-c3-cone-full-angle

  - id: Q-3.5-cone-map
    type: mc
    objectives: [OBJ-3.5-2, OBJ-3.5-1]
    level: mid
    prompt: >-
      החרוט $z=\sqrt3\,\sqrt{x^2+y^2}$ בפרמטריזציה $\sigma(u,v)=(v\cos u,\ v\sin u,\ \sqrt3\,v)$, $0<u<2\pi$, $v>0$. איזו
      פרמטריזציה $\mu(u,v)$ של חתיכה של המישור $z=0$ נותנת אותם $E,F,G$ כמו $\sigma$, כך ש-$\mu\circ\sigma^{-1}$ איזומטריה?
    choices:
      - text: '$$\mu(u,v)=\big(2v\cos\tfrac u2,\ 2v\sin\tfrac u2,\ 0\big)$$'
        correct: true
        feedback: >-
          נכון. ל-$\sigma$: $\sigma_v=(\cos u,\ \sin u,\ \sqrt3)$, ולכן $E=v^2$, $F=0$, $G=4$. ל-$\mu$: $\mu_u=(-v\sin\frac u2,\ v\cos\frac u2,\ 0)$
          נותן $E=v^2$, ו-$\mu_v=2(\cos\frac u2,\ \sin\frac u2,\ 0)$ נותן $G=4$, $F=0$. התמונה היא גזרה בזווית $\pi$: החרוט הזה
          נפרש לחצי עיגול בדיוק.
      - text: '$$\mu(u,v)=\big(v\cos u,\ v\sin u,\ 0\big)$$'
        feedback: >-
          זו ההטלה האנכית של החרוט על המישור. כאן $G=1\ne4$: ההטלה מקצרת כל ישר יוצר פי $2$. הטלה על מישור אינה איזומטריה.
        misconception: MC-c3-chart-is-isometry
      - text: '$$\mu(u,v)=\big(2v\cos u,\ 2v\sin u,\ 0\big)$$'
        feedback: >-
          $G=4$ נכון, אבל $E=4v^2\ne v^2$: הזווית רצה עד $2\pi$, וכל מעגל נמתח פי $2$. החרוט נפרש לגזרה, לא למישור שלם.
        misconception: MC-c3-cone-full-angle
      - text: '$$\mu(u,v)=\big(\sqrt3\,v\cos\tfrac u{\sqrt3},\ \sqrt3\,v\sin\tfrac u{\sqrt3},\ 0\big)$$'
        feedback: >-
          כאן $E=v^2$, אבל $G=3\ne4$: המרחק מהקודקוד לאורך החרוט הוא $\|\sigma_v\|\,v=2v$, לא $\sqrt3\,v$ (הגובה כפול $\sqrt3$).
        misconception: MC-c3-cone-full-angle

  - id: Q-3.5-wrap
    type: twotier
    objectives: [OBJ-3.5-2, OBJ-3.5-1]
    qualitative: true
    level: mid
    prompt: >-
      $f(x,y)=(\cos x,\ \sin x,\ y)$ מהמישור לגליל היחידה. היא אינה חד-חד-ערכית, כי $f(x+2\pi,y)=f(x,y)$. האם $f$ היא
      איזומטריה מקומית?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. מקומית, בכל רצועה $a<x<a+2\pi$, ההעתקה הפיכה ושומרת אורכים: זה "גלגול דף בלי למתוח".
      - text: לא
        feedback: >-
          "מקומית" פירושו שאורך כל מסילה נשמר; חד-חד-ערכיות אינה חלק מההגדרה, ואורכים נשמרים בכל מקום.
        misconception: MC-c3-local-isometry-injective
    reasons:
      - text: 'ל-$(x,y)\mapsto(x,y,0)$ ול-$f$ אותם מקדמים, $E=1$, $F=0$, $G=1$'
        correct: true
        feedback: >-
          בדיוק: $f_x=(-\sin x,\cos x,0)$ ו-$f_y=(0,0,1)$ הם וקטורי יחידה ניצבים, כמו $(1,0,0)$ ו-$(0,1,0)$, ולפי משפט 3.5.3
          זה שקול לשמירת כל האורכים.
      - text: 'איזומטריה מקומית חייבת להיות חד-חד-ערכית'
        feedback: >-
          זו טענה שגויה: $f$ מלפפת את המישור על הגליל אינסוף פעמים, ובכל רצועה ברוחב פחות מ-$2\pi$ היא הפיכה ושומרת
          אורכים. רק **איזומטריה** (בלי "מקומית") חייבת להיות הפיכה.
        misconception: MC-c3-local-isometry-injective
      - text: 'איזומטריה מקומית שולחת נורמל לנורמל, והנורמל של הגליל מסתובב'
        feedback: >-
          החלק הראשון שגוי: ההגדרה מדברת רק על אורכים של מסילות, והנורמל הוא תכונה חיצונית שאיזומטריה מקומית לא חייבת
          לשמור.
        misconception: MC-c3-isometry-needs-normal

  - id: Q-3.5-same-forms
    type: twotier
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: mid
    prompt: >-
      $\sigma_1,\sigma_2:D\to\mathbb R^3$ **פרמטריזציות מקומיות** (רגולריות, חד-חד-ערכיות, והומאומורפיזמים על התמונה) של שני
      משטחים $S_1=\sigma_1(D)$, $S_2=\sigma_2(D)$, ובכל נקודה של $D$ יש להן אותם $E,F,G$. האם
      $f=\sigma_2\circ\sigma_1^{-1}:S_1\to S_2$ איזומטריה?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון (מסקנה 3.5.4). ההנחה שהן **מקומיות** נחוצה כדי ש-$f$ ו-$f^{-1}$ יהיו חלקות (משפט 3.2.8).
      - text: 'לא בהכרח, צריך גם שהמשטחים יהיו מונחים באותו אופן במרחב'
        feedback: >-
          ההגדרה מדברת רק על אורכים של מסילות. המישור והגליל מונחים במרחב אחרת לגמרי, ועדיין יש ביניהם איזומטריה מקומית.
        misconception: MC-c3-isometry-needs-normal
    reasons:
      - text: 'האורך של $\sigma_i\circ c$ הוא אותו אינטגרל של $\sqrt{Eu''^2+2Fu''v''+Gv''^2}$ לשתיהן'
        correct: true
        feedback: >-
          בדיוק. מסילה $\sigma_1\circ c$ עוברת ל-$\sigma_2\circ c$, והאורך נקבע רק מהמקדמים לאורך $c$ (משפט 3.4.5), ואלה זהים.
      - text: 'אותם $E,F,G$ גוררים ש-$f$ צמצום של תנועה קשיחה של המרחב'
        feedback: >-
          לא: ל-$(x,y,0)$ ול-$(\cos x,\sin x,y)$ על $0<x<\pi$ אותם מקדמים, ולפי משפט 3.5.9 אין תנועה קשיחה ביניהם. $f$ שומרת
          אורכים על המשטח, לא מרחקים במרחב.
        misconception: MC-c3-isometry-is-rigid-motion
      - text: 'אותם $E,F,G$ גוררים אותו נורמל יחידה בנקודות מתאימות'
        feedback: >-
          $\hat{\mathbf N}$ אינו נקבע מ-$E,F,G$: למישור ולגליל אותם מקדמים ונורמלים שונים. הנימוק צריך להיות על אורכים.
        misconception: MC-c3-normal-is-intrinsic

  - id: Q-3.5-helix-curvature
    type: twotier
    objectives: [OBJ-3.5-3]
    qualitative: true
    level: mid
    prompt: >-
      ההעתקה $f(x,y)=(\cos x,\sin x,y)$ היא איזומטריה מקומית מהמישור לגליל היחידה. היא מעבירה את הישר $\ell(t)=(t,t)$
      לסליל $(\cos t,\ \sin t,\ t)$. האם העקמומיות $\kappa$ של מסילה (כמסילה במרחב) היא תכונה פנימית של המשטח?
    choices:
      - text: לא, היא תכונה חיצונית
        correct: true
        feedback: >-
          נכון. איזומטריה מקומית שומרת אורכים וזוויות, אבל לא את $\kappa$.
      - text: כן, כי איזומטריה שומרת אורכים, ועקמומיות מחושבת מאורך הקשת
        feedback: >-
          העקמומיות היא $\|\frac{d\mathbf t}{ds}\|$, ו-$\mathbf t$ הוא וקטור **במרחב**: הוא תלוי באופן שבו המסילה יושבת
          במרחב, לא רק באורך הקשת שלה.
        misconception: MC-c3-curvature-of-curve-intrinsic
    reasons:
      - text: 'לישר $\kappa=0$, ולסליל $\kappa=\frac{a}{a^2+h^2}=\frac12$ ($a=h=1$)'
        correct: true
        feedback: >-
          בדיוק: לסליל $(a\cos t,\ a\sin t,\ ht)$ עקמומיות $\frac a{a^2+h^2}$ (דוגמה 1 של שיעור 2.1). אורך הקשת נשמר, $\sqrt2$
          ליחידת $t$ בשניהם, והעקמומיות לא.
      - text: 'לסליל $\kappa=0$, כמו לישר, כי הדף לא נמתח'
        feedback: >-
          הסליל אינו ישר במרחב: $\kappa=\frac{a}{a^2+h^2}=\frac12$. "בלי למתוח" פירושו שאורכים נשמרים, לא עקמומיות.
        misconception: MC-c3-curvature-of-curve-intrinsic
      - text: 'כל גודל על הגליל שונה מבמישור, כי הנורמל מסתובב'
        feedback: >-
          זה מוכיח יותר מדי: אורכים וזוויות על הגליל שווים לאלה שבמישור. צריך דוגמה של גודל מסוים שמשתנה.
        misconception: MC-c3-normal-is-intrinsic

  - id: Q-3.5-differential
    type: numeric
    objectives: [OBJ-3.5-1]
    level: mid
    prompt: >-
      $f(x,y,0)=(\cos x,\ \sin x,\ 2y)$, מהמישור $z=0$ לגליל היחידה. חשבו את $\|df_p(w)\|$ ב-$p=(0,0,0)$ עבור הווקטור המשיק
      $w=(1,1,0)$. (בדקו: האם $f$ איזומטריה מקומית?)
    answer: 2.2360680
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\sqrt5$. עם $\sigma_1(x,y)=(x,y,0)$, $w=\sigma_{1,x}+\sigma_{1,y}$, ולפי טענה 3.5.11
      $$df_p(w)=(f\circ\sigma_1)_x+(f\circ\sigma_1)_y=(0,1,0)+(0,0,2)=(0,1,2).$$ אורכו $\sqrt5\ne\sqrt2=\|w\|$, ולכן לפי
      משפט 3.5.3 $f$ **אינה** איזומטריה מקומית: ל-$f\circ\sigma_1$ יש $G=4$, והיא מותחת פי 2 בכיוון $y$, אף שהתמונה היא גליל.
    wrongFeedback: >-
      כתבו $w=a\sigma_{1,x}+b\sigma_{1,y}$ ו-$df_p(w)=a(f\circ\sigma_1)_x+b(f\circ\sigma_1)_y$, ואז חשבו אורך.
    commonWrong:
      - value: 1.4142136
        feedback: >-
          זה $\|w\|=\sqrt2$: הנחתם ש-$f$ שומרת אורכים כי היא מלפפת את המישור על גליל. אבל הרכיב השלישי $2y$ מותח:
          $(f\circ\sigma_1)_y=(0,0,2)$ באורך $2$. התמונה גליל, וההעתקה עצמה אינה איזומטריה מקומית.
        misconception: MC-c3-image-determines-isometry
      - value: 5
        feedback: >-
          זה $\|df_p(w)\|^2=Q_1(1,1)=E+2F+G=1+0+4$. האורך הוא השורש: $\sqrt5$.
        misconception: MC-c3-norm-vs-square
      - value: 3
        feedback: >-
          זה $\|(f\circ\sigma_1)_x\|+\|(f\circ\sigma_1)_y\|=1+2$: חיברתם אורכים במקום וקטורים. $df_p(w)$ הוא סכום הווקטורים,
          $(0,1,2)$, ואורכו $\sqrt5$ (הם ניצבים, ולכן פיתגורס).
        misconception: MC-c3-norm-vs-square

  - id: Q-3.5-proof-rank
    type: rank
    objectives: [OBJ-3.5-1]
    level: mid
    help: >-
      סדרו את שלבי ההוכחה מהשלב הראשון לאחרון.
    prompt: >-
      $f:S_1\to S_2$ איזומטריה מקומית, $\sigma_1:D\to S_1$ פרמטריזציה מקומית, ו-$\sigma_2=f\circ\sigma_1$.
      הוכיחו ש-$E_1=E_2$, $F_1=F_2$, $G_1=G_2$ בכל נקודה $(u_0,v_0)\in D$.
    items:
      - id: curves
        label: 'לכל $(a,b)$ ולכל $\eta>0$ קטן, מסתכלים על המסילות $\gamma_1(t)=\sigma_1(u_0+at,\ v_0+bt)$ ו-$\gamma_2=f\circ\gamma_1=\sigma_2(u_0+at,\ v_0+bt)$, $0\le t\le\eta$'
      - id: equal-length
        label: 'מההגדרה של איזומטריה מקומית: $\int_0^\eta\sqrt{Q_1^{(1)}}\,dt=\int_0^\eta\sqrt{Q_1^{(2)}}\,dt$ לכל $\eta$, כש-$Q_1^{(i)}=E_ia^2+2F_iab+G_ib^2$ בנקודה $(u_0+at,v_0+bt)$'
      - id: differentiate
        label: 'גוזרים לפי $\eta$ ב-$\eta=0$ (המשפט היסודי): $Q_1^{(1)}(a,b)=Q_1^{(2)}(a,b)$ ב-$(u_0,v_0)$, לכל $(a,b)$'
      - id: polarize
        label: '$(a,b)=(1,0)$ נותן $E_1=E_2$, $(0,1)$ נותן $G_1=G_2$, ו-$(1,1)$ נותן $E_1+2F_1+G_1=E_2+2F_2+G_2$, ולכן $F_1=F_2$'
    order: [curves, equal-length, differentiate, polarize]
    correctFeedback: >-
      נכון. הרעיון: שוויון אורכים לכל קטע קצר, בכל כיוון, נותן אחרי גזירה שוויון של התבנית הריבועית בנקודה, ותבנית
      ריבועית נקבעת מערכיה על שלושה כיוונים.
    wrongFeedback: >-
      התחילו ממסילות ישרות קצרות במישור הפרמטרים, השוו אורכים, גזרו כדי לעבור מאינטגרל לערך בנקודה, ובסוף הציבו כיוונים.

  - id: Q-3.5-plane-cylinder
    type: twotier
    objectives: [OBJ-3.5-3, OBJ-3.5-2]
    qualitative: true
    level: mid
    prompt: >-
      האם ייתכן שלשני משטחים $S_1,S_2$ יש פרמטריזציות על אותו תחום עם אותם $E,F,G$ בכל נקודה, אבל אין תנועה קשיחה של
      המרחב שמעבירה את $S_1$ ל-$S_2$?
    choices:
      - text: כן, ייתכן
        correct: true
        feedback: >-
          נכון (משפט 3.5.9). התבנית הראשונה קובעת רק את הגאומטריה הפנימית, לא את הצורה במרחב.
      - text: לא, אותם $E,F,G$ פירושם אותו משטח עד כדי תנועה קשיחה
        feedback: >-
          זה מה שקורה למסילות (עקמומיות ופיתול קובעים מסילה, שיעור 2.4), אבל למשטחים $E,F,G$ לבדם לא מספיקים.
        misconception: MC-c3-q1-determines-shape
    reasons:
      - text: 'רצועת מישור וחצי גליל: אותם $E,F,G$, אבל רק ברצועה עוברים קטעים ישרים בשני כיוונים'
        correct: true
        feedback: >-
          בדיוק. $(x,y,0)$ ו-$(\cos x,\sin x,y)$ על $0<x<\pi$: לשתיהן $E=1,F=0,G=1$. תנועה קשיחה מעבירה קטע לקטע, ובחצי
          הגליל הקטעים הישרים היחידים אנכיים. ההבדל חיצוני: הוא נמדד במרחב, לא במשטח.
      - text: 'הספרה והמישור, כי לשניהם יש פרמטריזציות עם $F=0$'
        feedback: >-
          $F=0$ לבד אינו "אותם $E,F,G$". לספרה ולמישור אין פרמטריזציות עם אותה תבנית ראשונה: אורך המעגל הפנימי ברדיוס $\rho$
          הוא $2\pi\sin\rho$ בספרה ו-$2\pi\rho$ במישור.
        misconception: MC-c3-every-surface-locally-flat
      - text: 'כל שני משטחים עם נורמלים שונים, כי הנורמל נקבע מ-$E,F,G$'
        feedback: >-
          הנורמל דווקא **אינו** נקבע מ-$E,F,G$, וזו כל הנקודה: אותה תבנית ראשונה, שיכונים שונים.
        misconception: MC-c3-normal-is-intrinsic

  - id: Q-3.5-sphere-plane
    type: twotier
    objectives: [OBJ-3.5-3, OBJ-3.5-2]
    qualitative: true
    level: exam
    prompt: >-
      $C=\{z=\sqrt{x^2+y^2},\ z>0\}$ החרוט בלי הקודקוד, ו-$P=(0,0,1)$ הקוטב הצפוני של ספרת היחידה. האם ייתכן שיש קבוצה $U$
      פתוחה בספרה עם $P\in U$, קבוצה $W$ פתוחה ב-$C$, ואיזומטריה $g:U\to W$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. החרוט "שטוח" מקומית, והספרה לא.
      - text: כן, כי שני המשטחים מעוקלים במרחב
        feedback: >-
          ההתעקמות במרחב היא תכונה חיצונית, ואינה מכריעה דבר על איזומטריות: גם החרוט "מעוקל", ובכל זאת נפרש על מישור.
        misconception: MC-c3-normal-is-intrinsic
    reasons:
      - text: 'הרכבה של $g$ עם פריסה מקומית של החרוט נותנת איזומטריה מכיפה סביב $P$ על קבוצה פתוחה במישור'
        correct: true
        feedback: >-
          בדיוק. ליד $g(P)$ יש איזומטריה $k$ מחלק פתוח של $C$ על גזרה פתוחה במישור (טענה 3.5.5 (ב), אחרי סיבוב סביב ציר $z$
          כך ש-$g(P)$ לא יהיה על הישר היוצר החתוך). $g^{-1}$ של התחום של $k$ פתוח ב-$U$ ומכיל את $P$, ו-$k\circ g$ שם היא
          איזומטריה על קבוצה פתוחה במישור, בסתירה למשפט 3.5.8.
      - text: 'לחרוט יש קודקוד סינגולרי, והקוטב של הספרה אינו סינגולרי'
        feedback: >-
          הקודקוד אינו ב-$C$, ו-$W$ יכולה להיות רחוקה ממנו. שאלה מקומית מוכרעת בתכונה של סביבה, לא בנקודה שאינה בה.
        misconception: MC-c3-global-argument-for-local-claim
      - text: 'החרוט מכיל ישרים יוצרים, ועל הספרה אין אף קטע ישר'
        feedback: >-
          קטעים ישרים במרחב הם תכונה חיצונית (משפט 3.5.9): איזומטריה לא חייבת להעביר ישר לישר. ההלפפה של המישור על הגליל
          מעבירה ישרים לסלילים.
        misconception: MC-c3-normal-is-intrinsic

  - id: Q-3.5-twist
    type: twotier
    objectives: [OBJ-3.5-1, OBJ-3.5-3]
    qualitative: true
    level: exam
    prompt: >-
      $S$ ספרת היחידה ו-$P=(0,0,1)$. האם ייתכן ש-$f:S\to S$ חלקה, עם $f(P)=P$, שולחת כל קו רוחב לעצמו, שומרת את המרחק הפנימי
      מ-$P$ של כל נקודה ($d_S(P,f(p))=d_S(P,p)$), ובכל זאת אינה איזומטריה מקומית?
    choices:
      - text: כן, ייתכן
        correct: true
        feedback: >-
          נכון. שמירת המרחק מנקודה אחת היא מידע על כיוון אחד בלבד; אורך בכיוונים אחרים יכול להשתנות.
      - text: לא, זה לא ייתכן
        feedback: >-
          הנתונים קובעים אורכים רק לאורך קווי הרוחב ואת המרחק מ-$P$, לא את האורך של כל מסילה. ראו את הדוגמה בנימוק הנכון.
        misconception: MC-c3-distance-from-point-enough
    reasons:
      - text: 'סיבוב סביב ציר $z$ בזווית $1-z$, שתלויה בגובה: הוא מעביר קווי אורך למסילות שאינן ניצבות לקווי הרוחב'
        correct: true
        feedback: >-
          בדיוק. $f(x,y,z)$ מסובבת את $(x,y)$ בזווית $1-z$ ומשאירה את $z$: חלקה, $f(P)=P$, כל קו רוחב (גובה $z$ קבוע) עובר
          לעצמו, והקולטיטודה, שהיא המרחק הפנימי מ-$P$ (משפט 3.5.7), נשמרת. בקואורדינטות
          $$\sigma(u,v)=(\sin u\cos v,\ \sin u\sin v,\ \cos u),\qquad f\circ\sigma(u,v)=\sigma(u,\ v+1-\cos u),$$ ולה $F=\sin^3u\ne0$ בעוד ש-$F=0$ ל-$\sigma$. ב-$u=\frac\pi3$ התמונה של קו
          האורך חוצה את קו הרוחב בזווית שה-$\cos$ שלה $0.6$, לא $0$. זוויות הן תכונה פנימית, ולכן $f$ אינה איזומטריה מקומית.
      - text: 'שמירת המרחק הפנימי מ-$P$ ושל קווי הרוחב קובעת את $E,F,G$ בכל נקודה'
        feedback: >-
          היא קובעת את $E$ ואת $G$ בקואורדינטות $(u,v)$ שמסביב ל-$P$, אבל לא את $F$: חסר האורך באלכסון. כמו בדוגמה 2 של
          השיעור, צריך את שלושת המקדמים.
        misconception: MC-c3-distance-from-point-enough
      - text: 'כל העתקה חלקה של הספרה לעצמה ששומרת את $P$ היא סיבוב'
        feedback: >-
          זה שגוי: ההעתקה של הנימוק הנכון חלקה, שומרת את $P$, ואינה סיבוב (היא "מפתלת" את הספרה בזוויות שונות בגבהים שונים).
        misconception: MC-c3-isometry-is-rigid-motion
