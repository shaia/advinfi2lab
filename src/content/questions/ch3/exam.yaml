      - label: ג
        points: 6
        type: open
        objectives: [OBJ-3.3-1, OBJ-3.3-3, OBJ-3.1-2]
        prompt: >-
          הראו ש-$$\sigma(u,v)=(\cosh v\cos u,\ \cosh v\sin u,\ \sinh v)$$ היא פרמטריזציה רגולרית של $S_1$, וש-$\hat{\mathbf N}$
          שלה שווה ל-$\frac{\nabla F}{\|\nabla F\|}$ בכל נקודה.
        solution:
          - kind: check
            text: '$\cosh^2v(\cos^2u+\sin^2u)-\sinh^2v=1$, ולכן $\sigma(u,v)\in S_1$.'
          - kind: computation
            text: >-
              $\sigma_u=(-\cosh v\sin u,\ \cosh v\cos u,\ 0)$, $$\sigma_v=(\sinh v\cos u,\ \sinh v\sin u,\ \cosh v)$$, ולכן
              $$\sigma_u\times\sigma_v=\big(\cosh^2v\cos u,\ \cosh^2v\sin u,\ -\cosh v\sinh v\big)=\cosh v\,(x,\ y,\ -z).$$
          - kind: step
            text: >-
              $\nabla F=(2x,2y,-2z)$, ולכן $\sigma_u\times\sigma_v=\frac{\cosh v}{2}\nabla F$. הכפולה $\frac{\cosh v}2$ חיובית,
              ו-$\nabla F\ne0$ על $S_1$, ולכן $\sigma_u\times\sigma_v\ne0$: $\sigma$ רגולרית.
          - kind: step
            text: 'מנרמלים: כפולה חיובית של וקטור נותנת אחרי נרמול אותו וקטור יחידה.'
          - kind: result
            text: >-
              $\sigma$ רגולרית, ו-$\hat{\mathbf N}=\frac{\sigma_u\times\sigma_v}{\|\sigma_u\times\sigma_v\|}=\frac{(x,y,-z)}{\sqrt{x^2+y^2+z^2}}=\frac{\nabla F}{\|\nabla F\|}$.
              זה נורמל יחידה רציף על כל $S_1$, ולכן $S_1$ מכוון.
        rubric:
          - text: 'בדיקה ש-$\sigma$ מקיימת את המשוואה'
            weight: 1
          - text: 'מכפלה וקטורית נכונה, בסימנים הנכונים'
            weight: 2
          - text: 'זיהוי $\sigma_u\times\sigma_v$ ככפולה **חיובית** של $\nabla F$, ומכאן גם רגולריות'
            weight: 2
          - text: 'מסקנה נכונה על $\hat{\mathbf N}$'
            weight: 1
      - label: ד
