        prompt: >-
          הוכיחו באופן כללי: אם $c$ ערך רגולרי של פונקציה חלקה $G:\mathbb R^3\to\mathbb R$ ו-$p\in G^{-1}(c)$, אז
          $T_p\big(G^{-1}(c)\big)=\nabla G(p)^{\perp}$. מותר להשתמש בכך ש-$G^{-1}(c)$ הוא משטח חלק ושהמישור המשיק הוא אוסף
          וקטורי המהירות של מסילות במשטח.
        solution:
          - kind: given
            text: '$S=G^{-1}(c)$ ו-$\nabla G(p)\ne0$. $T_pS$ הוא אוסף הווקטורים $\gamma''(0)$ של מסילות חלקות $\gamma$ ב-$S$ עם $\gamma(0)=p$, והוא מרחב ממימד 2.'
          - kind: goal
            text: '$T_pS=\nabla G(p)^{\perp}$.'
          - kind: idea
            text: >-
              $G$ קבועה לאורך כל מסילה במשטח, ולכן הנגזרת שלה לאורך המסילה מתאפסת; זה נותן הכלה. השוויון בא ממימדים.
