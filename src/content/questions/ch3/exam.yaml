          - text: 'רק ל-$c>0$'
            feedback: >-
              ל-$c<0$ גם אין אפסים של $\nabla F$ על $S_c$; העובדה ש-$S_c$ בנוי משתי יריעות לא משנה.
            misconception: MC-c3-surface-must-be-connected
      - label: ב
        points: 4
        type: numeric
        objectives: [OBJ-3.3-1]
        prompt: >-
          הנקודה $p=(2,1,2)$ על $S_1$. המישור המשיק ל-$S_1$ ב-$p$ הוא $2x+y-2z=d$. מהו $d$?
        answer: 1
        tolerance: 0.001
