      - label: ג
        points: 7
        type: open
        objectives: [OBJ-3.5-3, OBJ-3.3-2]
        prompt: >-
          הוכיחו שכל מסילה חלקה $\gamma:[a,b]\to S$ עם $\gamma(a)=P$ ו-$\gamma(b)\in C_\rho$ אורכה לפחות $\rho$, ושיש מסילה
          כזו באורך $\rho$ בדיוק. (כלומר: המרחק הפנימי מ-$P$ לכל נקודה של $C_\rho$ הוא $\rho$.)
        solution:
          - kind: idea
            text: >-
              נעקוב אחרי הקולטיטודה $h(t)=\arccos\gamma_z(t)$ לאורך המסילה. היא צריכה לעלות מ-0 ל-$\rho$, והמהירות של
              $\gamma$ חוסמת מלמעלה את קצב השינוי שלה.
          - kind: step
            text: >-
              כי $\gamma\cdot\gamma=1$, גזירה נותנת $\gamma'\cdot\gamma=0$: המהירות משיקה לספרה. לכן
              $\gamma_z'=\gamma'\cdot e_3=\gamma'\cdot(e_3-\gamma_z\gamma)$, ו-$\|e_3-\gamma_z\gamma\|^2=1-2\gamma_z^2+\gamma_z^2=1-\gamma_z^2$.
              לפי קושי-שוורץ $|\gamma_z'|\le\|\gamma'\|\sqrt{1-\gamma_z^2}$.
          - kind: step
            text: >-
              $h$ רציפה על $[a,b]$, $h(a)=0$ ו-$h(b)=\rho$. נבחר $t_1=\min\{t:\ h(t)=\rho\}$ ו-$t_0=\max\{t\le t_1:\ h(t)=0\}$.
              על $(t_0,t_1)$ מתקיים $0<h<\rho<\pi$, ולכן $|\gamma_z|<1$, $h$ גזירה, ו-$|h'|=\frac{|\gamma_z'|}{\sqrt{1-\gamma_z^2}}\le\|\gamma'\|$.
          - kind: computation
            text: >-
              $$L(\gamma)\ge\int_{t_0}^{t_1}\|\gamma'\|\,dt\ge\int_{t_0}^{t_1}|h'|\,dt\ge h(t_1)-h(t_0)=\rho.$$
          - kind: step
            text: >-
              הקשת של קו האורך $\mu(t)=(\sin t\cos v_0,\ \sin t\sin v_0,\ \cos t)$, $0\le t\le\rho$, מחברת את $P$ לנקודה של
              $C_\rho$, עם $\|\mu'\|=1$, ולכן אורכה $\rho$.
          - kind: result
            text: >-
              כל מסילה מ-$P$ ל-$C_\rho$ אורכה לפחות $\rho$, וקשת קו האורך משיגה $\rho$: המרחק הפנימי מ-$P$ לכל נקודה של $C_\rho$
              הוא $\rho$.
        rubric:
          - text: 'האי-שוויון $|\gamma_z''|\le\|\gamma''\|\sqrt{1-\gamma_z^2}$, מנומק (משיקות ו-קושי-שוורץ, או $Q_1=du^2+\sin^2u\,dv^2\ge du^2$)'
            weight: 3
          - text: 'טיפול בנקודות הקצה: בחירת קטע שבו $0<h<\rho$, כך שהגזירה מוצדקת'
            weight: 1
          - text: 'חסימת האורך מלמטה ב-$\rho$ בעזרת אינטגרל של $|h''|$'
            weight: 2
          - text: 'מסילה מפורשת באורך $\rho$ בדיוק'
            weight: 1
      - label: ד
        points: 4
        type: open
        standalone: false
        objectives: [OBJ-3.5-3, OBJ-3.5-1]
        prompt: >-
          נניח שקיימת איזומטריה $f$ מסביבה $U$ של $P$ ב-$S$ לקבוצה פתוחה $V$ במישור. ל-$\rho$ קטן מספיק, $C_\rho$ והכיפה
          שמעליו מוכלים ב-$U$, והעיגול ברדיוס $\rho$ סביב $f(P)$ מוכל ב-$V$. קבלו בלי הוכחה שאז $f$ מעבירה את $C_\rho$,
          באופן חד-חד-ערכי ועל, למעגל ברדיוס $\rho$ סביב $f(P)$. (רמז למה זה נכון: $f$ שומרת אורכים של מסילות, ולכן גם
          מרחקים פנימיים; לפי סעיף ג המרחק הפנימי מ-$P$ לכל נקודה של $C_\rho$ הוא $\rho$; ובמישור הקטע הישר הוא המסילה
          הקצרה ביותר בין שתי נקודות, ולכן בתוך העיגול המרחק הפנימי הוא המרחק הרגיל.) הסיקו סתירה, ל-$\rho$ קטן מספיק כזה.
        solution:
          - kind: idea
            text: 'איזומטריה שומרת אורכים של מסילות, ולכן אורך המעגל $C_\rho$ חייב להיות שווה לאורך תמונתו.'
          - kind: given
            text: >-
              $\rho$ קטן מספיק כמו בניסוח, ו-$\gamma(v)=\sigma(\rho,v)$, $0\le v\le2\pi$, מסילה שעוברת פעם אחת על
              $C_\rho\subseteq U$.
          - kind: computation
            text: 'לפי סעיף ב, $L(\gamma)=\int_0^{2\pi}\sqrt G\,dv=2\pi\sin\rho$.'
          - kind: step
            text: >-
              $f$ איזומטריה, ולכן שומרת אורכים של מסילות: $L(f\circ\gamma)=L(\gamma)=2\pi\sin\rho$.
          - kind: step
            text: >-
              מצד שני, לפי העובדה שקיבלנו, התמונה של $f\circ\gamma$ היא כל המעגל ברדיוס $\rho$ סביב $f(P)$. מסילה על המעגל
              הזה שעוברת בכל נקודה שלו אורכה לפחות היקפו (כתבו אותה בזווית $\theta(v)$: האורך $\rho\int|\theta'|\,dv$ לפחות
              $\rho$ כפול אורך קבוצת הזוויות שהיא מכסה, $2\pi$). לכן $L(f\circ\gamma)\ge2\pi\rho$.
          - kind: theorem
            text: '$\sin\rho<\rho$ לכל $\rho>0$ (הנגזרת של $\rho-\sin\rho$ היא $1-\cos\rho\ge0$, ואפס רק בנקודות בודדות).'
          - kind: result
            text: >-
              $2\pi\rho\le L(f\circ\gamma)=2\pi\sin\rho<2\pi\rho$, סתירה. לכן אין סביבה של $P$ בספרה שאיזומטרית לקבוצה פתוחה
