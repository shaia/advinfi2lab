        rubric:
          - text: 'שימוש במסילה כלשהי במשטח ובכלל השרשרת כדי לקבל $\nabla G(p)\cdot\gamma''(0)=0$'
            weight: 3
          - text: 'ניסוח ההכלה $T_pS\subseteq\nabla G(p)^{\perp}$'
            weight: 1
          - text: 'נימוק מימדים: $\nabla G(p)\ne0$ נותן מימד 2, ו-$T_pS$ ממימד 2'
            weight: 2
          - text: 'המסקנה שההכלה היא שוויון'
