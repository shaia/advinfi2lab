            weight: 2
          - text: 'אורך התמונה לפחות $2\pi\rho$, והשוואה מול $2\pi\sin\rho$ עם הנימוק $\sin\rho<\rho$'
            weight: 1
          - text: 'מסקנה מנוסחת, כולל המעבר מ-$P$ לכל נקודה'
            weight: 1
