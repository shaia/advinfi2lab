          - kind: step
            text: >-
              $\nabla G(p)\ne0$, ולכן $\nabla G(p)^{\perp}$ הוא מרחב ממימד 2. גם $T_pS$ ממימד 2.
          - kind: step
            text: 'תת-מרחב ממימד 2 של מרחב ממימד 2 הוא המרחב כולו.'
          - kind: result
