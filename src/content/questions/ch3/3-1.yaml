# Lesson 3.1 — a smooth parametrized surface. Understanding questions, basic → mid → exam.
# Objectives (src/course.ts):
#   OBJ-3.1-1  define a smooth parametrized surface and check regularity: the partials are linearly independent
#   OBJ-3.1-2  parametrize the sphere, cylinder, cone, torus and a surface of revolution, and find their non-regular points
#   OBJ-3.1-3  tell a singular point of the surface from a non-regular point of the parametrization (the sphere's pole)
chapter: 3
questions:
  - id: Q-3.1-regular-def
    type: mc
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: basic
    prompt: >-
      $\sigma:D\to\mathbb R^3$ חלקה, $D\subset\mathbb R^2$ פתוחה. מהו התנאי לכך ש-$\sigma$ **רגולרית** בנקודה $(u_0,v_0)$?
    choices:
      - text: '$\sigma_u(u_0,v_0)\times\sigma_v(u_0,v_0)\ne0$'
        correct: true
        feedback: >-
          נכון. המכפלה הווקטורית שונה מאפס בדיוק כששני הווקטורים בלתי תלויים לינארית, כלומר כשמטריצת יעקובי
          $D\sigma$, מסדר $3\times2$, היא מדרגה 2. אז $\sigma_u,\sigma_v$ פורשים מישור.
      - text: '$\sigma_u(u_0,v_0)\ne0$ וגם $\sigma_v(u_0,v_0)\ne0$'
        feedback: >-
          לא מספיק: שני וקטורים שונים מאפס יכולים להיות מקבילים. ב-$\sigma(u,v)=(u+v,\,(u+v)^2,\,0)$ מתקבל
          $\sigma_u=\sigma_v=(1,\,2(u+v),\,0)$, והתמונה היא פרבולה, לא משטח.
        misconception: MC-c3-nonzero-partials-enough
      - text: '$\sigma_u(u_0,v_0)\cdot\sigma_v(u_0,v_0)=0$'
        feedback: >-
          ניצבות אינה נדרשת. $\sigma(u,v)=(u+v,\,v,\,0)$ רגולרית בכל מקום (התמונה היא המישור $z=0$), ובה
          $\sigma_u\cdot\sigma_v=(1,0,0)\cdot(1,1,0)=1$.
        misconception: MC-c3-regular-means-orthogonal
      - text: '$\sigma$ חד-חד-ערכית בסביבה של $(u_0,v_0)$'
        feedback: >-
          חד-חד-ערכיות היא תנאי אחר. $\sigma(u,v)=(u^3,v,0)$ חד-חד-ערכית על כל המישור, ובכל זאת
          $\sigma_u=(3u^2,0,0)$ מתאפס ב-$u=0$, ולכן היא אינה רגולרית שם.
        misconception: MC-c3-regular-means-injective
    explanation: >-
      שלוש דרכים לומר אותו דבר: $\sigma_u,\sigma_v$ בלתי תלויים; $\sigma_u\times\sigma_v\ne0$; אחד המינורים $2\times2$
      של $D\sigma$ שונה מאפס (הרכיבים של $\sigma_u\times\sigma_v$ הם בדיוק המינורים האלה).

  - id: Q-3.1-cross
    type: numeric
    objectives: [OBJ-3.1-1]
    level: basic
    prompt: >-
      $\sigma(u,v)=(u+v,\ u-v,\ uv)$. חשבו את $\|\sigma_u\times\sigma_v\|^2$ בנקודה $(u,v)=(1,2)$.
    answer: 14
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\sigma_u=(1,1,v)=(1,1,2)$ ו-$\sigma_v=(1,-1,u)=(1,-1,1)$, ולכן
      $\sigma_u\times\sigma_v=(1\cdot1-2\cdot(-1),\ 2\cdot1-1\cdot1,\ 1\cdot(-1)-1\cdot1)=(3,1,-2)$ ואורכו בריבוע
      $9+1+4=14$. באופן כללי $\sigma_u\times\sigma_v=(u+v,\,v-u,\,-2)$, שאינו מתאפס לעולם: $\sigma$ רגולרית בכל מקום.
    wrongFeedback: >-
      חשבו את $\sigma_u$ ואת $\sigma_v$ בנקודה, ואחר כך כל רכיב של המכפלה הווקטורית כהפרש של שתי מכפלות.
    commonWrong:
      - value: 10
        feedback: >-
          זה מה שמתקבל כשמחברים את שתי המכפלות בכל רכיב במקום לחסר: $(-1,3,0)$. כל רכיב הוא הפרש, למשל
          $(\sigma_u\times\sigma_v)_3=1\cdot(-1)-1\cdot1=-2$. בדיקה: $(3,1,-2)$ ניצב גם ל-$(1,1,2)$ וגם ל-$(1,-1,1)$.
        misconception: MC-c3-cross-minor-sign

  - id: Q-3.1-sphere-singular
    type: mc
    objectives: [OBJ-3.1-2]
    level: basic
    prompt: >-
      $\sigma(u,v)=(r\cos u\cos v,\ r\sin u\cos v,\ r\sin v)$ על $\mathbb R^2$ ($u$ זווית האורך, $v$ זווית הרוחב). חישוב נותן
      $\|\sigma_u\times\sigma_v\|=r^2|\cos v|$. באילו נקודות של הפס $-\frac\pi2\le v\le\frac\pi2$ (שבו כבר מתקבלת כל נקודה של
      הספרה) $\sigma$ **אינה** רגולרית?
    choices:
      - text: 'על הישרים $v=\pm\frac\pi2$, שנשלחים לקטבים'
        correct: true
        feedback: >-
          נכון. ב-$v=\pm\frac\pi2$ מתקבל $\sigma_u=(-r\sin u\cos v,\ r\cos u\cos v,\ 0)=0$: כל קו הרוחב מתכווץ לנקודה אחת,
          הקוטב. (מחוץ לפס, על כל $\mathbb R^2$, אלה הישרים $v\in\frac\pi2+\pi\mathbb Z$.)
      - text: בשום מקום, כי הספרה היא משטח חלק
        feedback: >-
          הספרה אכן משטח חלק, אבל הפרמטריזציה הזו אינה רגולרית בקטבים: הגורם $|\cos v|$ מתאפס שם. רגולריות בודקים
          לפרמטריזציה, בנוסחה, בכל הנקודות.
        misconception: MC-c3-param-singular-is-surface-singular
      - text: 'בקו המשווה $v=0$, כי שם $\sin v=0$'
        feedback: >-
          ב-$v=0$ מתקבל $\|\sigma_u\times\sigma_v\|=r^2|\cos0|=r^2>0$. הגורם שקובע הוא $\cos v$, לא $\sin v$: בדקו מתי כל
          גורם בנוסחה מתאפס.
        misconception: MC-c3-regularity-only-generic-point
      - text: 'בקו $u=0$, שבו הפרמטריזציה "נסגרת" ($\sigma(0,v)=\sigma(2\pi,v)$)'
        feedback: >-
          זה כשל של חד-חד-ערכיות, לא של רגולריות: ב-$u=0$ הנגזרות בלתי תלויות כרגיל (כל עוד $v\ne\pm\frac\pi2$).
        misconception: MC-c3-regular-means-injective

  - id: Q-3.1-revolution
    type: mc
    objectives: [OBJ-3.1-2]
    level: basic
    prompt: >-
      מסובבים את מסילת הפרופיל $v\mapsto(f(v),\,0,\,g(v))$ במישור $xz$, עם $f>0$, סביב ציר $z$. איזו פרמטריזציה נותנת את
      משטח הסיבוב?
    choices:
      - text: '$$\sigma(u,v)=(f(v)\cos u,\ f(v)\sin u,\ g(v))$$'
        correct: true
        feedback: >-
          נכון. נקודת הפרופיל בגובה $g(v)$ ובמרחק $f(v)$ מהציר מסתובבת על מעגל ברדיוס $f(v)$ בגובה קבוע. ב-$u=0$ חוזרים
          לפרופיל עצמו.
      - text: '$$\sigma(u,v)=(f(v),\ g(v)\cos u,\ g(v)\sin u)$$'
        feedback: >-
          זה סיבוב סביב ציר $x$: כאן $x=f(v)$ נשמר והרכיב $g$ מסתובב. בסיבוב סביב ציר $z$ הגובה נשמר.
        misconception: MC-c3-revolution-axis
      - text: '$$\sigma(u,v)=(\cos u,\ \sin u,\ g(v))$$'
        feedback: >-
          זה גליל היחידה (אם $g$ מונוטונית): הרדיוס של מעגל הסיבוב צריך להיות המרחק $f(v)$ של נקודת הפרופיל מהציר, לא 1.
        misconception: MC-c3-revolution-axis

  - id: Q-3.1-rev-regular
    type: mc
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: basic
    prompt: >-
      למשטח הסיבוב $$\sigma(u,v)=(f(v)\cos u,\ f(v)\sin u,\ g(v))$$ מתקבל $\|\sigma_u\times\sigma_v\|=|f(v)|\sqrt{f'(v)^2+g'(v)^2}$.
      מתי $\sigma$ רגולרית ב-$(u,v)$?
    choices:
      - text: 'כש-$f(v)\ne0$ וגם $(f''(v),g''(v))\ne(0,0)$'
        correct: true
        feedback: >-
          נכון. התנאי השני הוא רגולריות של הפרופיל, והראשון אומר שהפרופיל אינו נמצא על ציר הסיבוב. כש-$f(v)=0$ מעגל
          הסיבוב הוא נקודה ו-$\sigma_u=(-f\sin u,\,f\cos u,\,0)=0$.
      - text: 'כשמסילת הפרופיל רגולרית, $(f'',g'')\ne(0,0)$; זה מספיק'
        feedback: >-
          הגורם $|f(v)|$ חסר. הפרופיל $(v^2-1,\,0,\,v)$ רגולרי בכל מקום, אבל ב-$v=\pm1$ הוא חוצה את הציר, ושם
          $\|\sigma_u\times\sigma_v\|=0$: מתקבלים שני קודקודים של חרוט.
        misconception: MC-c3-revolution-axis-point
      - text: 'תמיד, כי משטח סיבוב סימטרי ולכן חלק'
        feedback: >-
          סימטריה אינה חלקות. החרוט $(v\cos u,\,v\sin u,\,v)$ הוא משטח סיבוב של הישר $(v,0,v)$, ואינו רגולרי בקודקוד
          $v=0$.
        misconception: MC-c3-regularity-only-generic-point

  - id: Q-3.1-torus
    type: mc
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: basic
    prompt: >-
      $$\sigma(u,v)=((R+r\cos v)\cos u,\ (R+r\cos v)\sin u,\ r\sin v)$$ עם $R,r>0$. חישוב נותן
      $\|\sigma_u\times\sigma_v\|=r\,|R+r\cos v|$. לאילו ערכים של $R,r$ הפרמטריזציה רגולרית **בכל** נקודה?
    choices:
      - text: 'בדיוק כש-$r<R$'
        correct: true
        feedback: >-
          נכון. $R+r\cos v\ge R-r$, וכש-$r<R$ זה חיובי לכל $v$. כש-$r\ge R$ יש $v$ עם $\cos v=-\frac Rr$, ושם המעגל
          הפנימי פוגע בציר ומתכווץ לנקודה.
      - text: 'לכל $R,r>0$: זה טורוס'
        feedback: >-
          ב-$R=r=1$ (טורוס "צופר") ובנקודה $v=\pi$ מתקבל $R+r\cos v=0$: כל המעגל $v=\pi$ נשלח לראשית ו-$\sigma_u=0$. בדקו
          את כל האפסים של הנוסחה.
        misconception: MC-c3-regularity-only-generic-point
      - text: 'בדיוק כש-$r\le R$'
        feedback: >-
          המקרה $r=R$ נכשל: ב-$v=\pi$ מתקבל $R+r\cos\pi=R-r=0$. אי-השוויון צריך להיות חזק.
        misconception: MC-c3-revolution-axis-point

  - id: Q-3.1-rev-points
    type: numeric
    objectives: [OBJ-3.1-2]
    level: mid
    prompt: >-
      $$\sigma(u,v)=\big((v^3-4v)\cos u,\ (v^3-4v)\sin u,\ v^2\big)$$ על $\mathbb R^2$. בכמה **נקודות של התמונה** ב-$\mathbb R^3$
      נמצאות התמונות של הנקודות $(u,v)$ שבהן $\sigma$ אינה רגולרית?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. זה משטח סיבוב עם $f(v)=v^3-4v$, $g(v)=v^2$, ולפי טענה 3.1.4
      $$\|\sigma_u\times\sigma_v\|=|v^3-4v|\sqrt{(3v^2-4)^2+4v^2}.$$
      השורש אינו מתאפס ($2v=0$ רק ב-$v=0$, ושם $3v^2-4=-4$), ולכן $\sigma$ אינה רגולרית בדיוק על שלושת הישרים
      $v\in\{0,\ 2,\ -2\}$. אבל $v=\pm2$ נשלחים **לאותה** נקודה $(0,0,4)$, כי $g(2)=g(-2)=4$; ו-$v=0$ נשלח ל-$(0,0,0)$. שתי
      נקודות.
    wrongFeedback: >-
      חשבו $\|\sigma_u\times\sigma_v\|=|f(v)|\sqrt{f'(v)^2+g'(v)^2}$, מצאו את כל האפסים, ובדקו לאן נשלח כל ישר של אפסים:
      ישרים שונים יכולים להישלח לאותה נקודה.
    commonWrong:
      - value: 3
        feedback: >-
          ספרתם ישרים בתחום הפרמטרים, לא נקודות בתמונה: $\sigma(u,2)=\sigma(u,-2)=(0,0,4)$, כי הגובה $g(v)=v^2$ זהה ב-$v=\pm2$.
        misconception: MC-c3-count-domain-not-image
      - value: 1
        feedback: >-
          מצאתם רק את $v=0$. $v^3-4v=v(v^2-4)$ מתאפס גם ב-$v=\pm2$: בדקו את כל האפסים של הגורם.
        misconception: MC-c3-regularity-only-generic-point
      - value: 0
        feedback: >-
          הפרופיל $(v^3-4v,\ 0,\ v^2)$ רגולרי בכל מקום, אבל משטח הסיבוב אינו רגולרי איפה שהפרופיל פוגע בציר: $f(v)=0$.
        misconception: MC-c3-revolution-axis-point

  - id: Q-3.1-parallel
    type: twotier
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: mid
    prompt: >-
      $\sigma:\mathbb R^2\to\mathbb R^3$ חלקה, ובכל נקודה $\sigma_u\ne0$ וגם $\sigma_v\ne0$. האם בהכרח $\sigma$ רגולרית?
    choices:
      - text: לא בהכרח
        correct: true
        feedback: נכון. רגולריות דורשת אי-תלות של שני הווקטורים, לא רק ששניהם שונים מאפס.
      - text: כן
        feedback: >-
          שני וקטורים שונים מאפס יכולים להיות מקבילים, ואז הם פורשים ישר ולא מישור. ראו את הדוגמה בנימוק הנכון.
        misconception: MC-c3-nonzero-partials-enough
    reasons:
      - text: 'הדוגמה $\sigma(u,v)=(u+v,\ (u+v)^2,\ u+v)$'
        correct: true
        feedback: >-
          בדיוק. $\sigma_u=\sigma_v=(1,\,2(u+v),\,1)\ne0$, אבל $\sigma_u\times\sigma_v=0$ בכל נקודה: $\sigma$ תלויה רק ב-$u+v$,
          והתמונה היא מסילה. שתי הנגזרות שוות, לא אפס, ואינן פורשות מישור.
      - text: '$u$ ו-$v$ משתנים בלתי תלויים, ולכן גם $\sigma_u$ ו-$\sigma_v$ בלתי תלויים'
        feedback: >-
          אי-תלות של המשתנים אינה אומרת דבר על הנגזרות: ב-$(u+v,\ (u+v)^2,\ u+v)$ מתקבל $\sigma_u=\sigma_v$ בכל נקודה.
        misconception: MC-c3-independent-variables
      - text: 'הקווים הפרמטריים רגולריים, וזה כל מה שרגולריות דורשת'
        feedback: >-
          הקווים הפרמטריים אכן רגולריים, אבל זה תנאי חלש יותר: שני הקווים יכולים להיות משיקים זה לזה בכל נקודה, כמו
          ב-$(u+v,\ (u+v)^2,\ u+v)$.
        misconception: MC-c3-nonzero-partials-enough

  - id: Q-3.1-pole
    type: twotier
    objectives: [OBJ-3.1-3]
    qualitative: true
    level: mid
    prompt: >-
      הפרמטריזציה של ספרת היחידה בקואורדינטות כדוריות, $(\cos u\cos v,\ \sin u\cos v,\ \sin v)$, אינה רגולרית בקוטב
      הצפוני $(0,0,1)$. נקודה של קבוצה ב-$\mathbb R^3$ נקראת **סינגולרית** אם אין לה **אף** פרמטריזציה רגולרית (חד-חד-ערכית
      ורציפה בהפיכה) של סביבה שלה בקבוצה. האם הקוטב הצפוני הוא נקודה סינגולרית של הספרה?
    choices:
      - text: לא, הקוטב הוא נקודה חלקה של הספרה
        correct: true
        feedback: >-
          נכון. הכשל שייך לפרמטריזציה: כל קו הרוחב $v=\frac\pi2$ נשלח לנקודה אחת. פרמטריזציה אחרת מתנהגת יפה שם.
      - text: כן, הקוטב הוא נקודה סינגולרית של הספרה
        feedback: >-
          ספרה נראית אותו דבר בכל נקודה: סיבוב של המרחב מעביר את הקוטב לנקודה על קו המשווה, שבה הפרמטריזציה רגולרית.
          רגולריות היא תכונה של פרמטריזציה, ולכל נקודה מחפשים פרמטריזציה **כלשהי** שרגולרית בה.
        misconception: MC-c3-param-singular-is-surface-singular
    reasons:
      - text: 'יש לו פרמטריזציה מקומית רגולרית אחרת: גרף מעל המישור $xy$'
        correct: true
        feedback: >-
          בדיוק. $\chi(x,y)=(x,\,y,\,h(x,y))$ עם $h=\sqrt{1-x^2-y^2}$ על $x^2+y^2<1$: $\chi_x\times\chi_y=(-h_x,-h_y,1)\ne0$ תמיד,
          $\chi$ חד-חד-ערכית וההופכית $(x,y,z)\mapsto(x,y)$ רציפה. היא פרמטריזציה מקומית, והקוטב $\chi(0,0)$ בתוכה (טענה 3.1.9).
      - text: 'ב-$v=\frac\pi2$ מתקבל $\sigma_u=0$, ולכן אף פרמטריזציה לא תהיה רגולרית שם'
        feedback: >-
          $\sigma_u=0$ שם, אבל זה אומר רק שהפרמטריזציה **הזו** נכשלת. מכשל של פרמטריזציה אחת אי אפשר להסיק על כל
          הפרמטריזציות: הגרף מעל המישור $xy$ רגולרי בקוטב.
        misconception: MC-c3-param-singular-is-surface-singular
      - text: 'כל קו הרוחב $v=\frac\pi2$ נשלח לנקודה אחת, ולכן לסביבה של הקוטב אין פרמטריזציה חד-חד-ערכית'
        feedback: >-
          המסקנה שגויה: מכך שפרמטריזציה **אחת** אינה חד-חד-ערכית ליד הקוטב לא נובע שאין אחרת. הגרף מעל המישור $xy$
          חד-חד-ערכי, רגולרי, ומכסה את כל חצי הספרה העליון.
        misconception: MC-c3-regular-means-injective

  - id: Q-3.1-cone
    type: twotier
    objectives: [OBJ-3.1-3, OBJ-3.1-2]
    qualitative: true
    level: mid
    prompt: >-
      החרוט הכפול $\sigma(u,v)=(v\cos u,\ v\sin u,\ v)$, $v\in\mathbb R$, אינו רגולרי ב-$v=0$, כלומר בקודקוד $(0,0,0)$. האם
      הקודקוד, כמו קוטב הספרה, הוא רק בעיה של הפרמטריזציה?
    choices:
      - text: לא, הקודקוד הוא נקודה סינגולרית של החרוט הכפול עצמו
        correct: true
        feedback: >-
          נכון. כאן אין פרמטריזציה אחרת שתציל: הקבוצה $x^2+y^2=z^2$ עצמה אינה משטח חלק ליד הקודקוד.
      - text: כן, פרמטריזציה טובה יותר תהיה רגולרית בקודקוד
        feedback: >-
          בקוטב הספרה הקבוצה נראית כמו דיסק, ורק הפרמטריזציה הכדורית קורסת. בקודקוד הקבוצה עצמה שונה מדיסק: ראו את הנימוק
          הנכון.
        misconception: MC-c3-vertex-removable
    reasons:
      - text: 'בלי הקודקוד, סביבה קטנה שלו בחרוט מתפרקת לשני חלקים, ודיסק בלי נקודה לא'
        correct: true
        feedback: >-
          בדיוק (משפט 3.1.10). החלקים הם $z>0$ ו-$z<0$. הומאומורפיזם היה מעביר דיסק קטן בלי מרכזו, קבוצה קשירה, לסביבה של
          הקודקוד בלי הקודקוד, שאינה קשירה; וזה בלתי אפשרי, כי תמונה רציפה של קבוצה קשירה קשירה.
      - text: '$\|\sigma_u\times\sigma_v\|=\sqrt2\,|v|$ מתאפס ב-$v=0$, ולכן כל פרמטריזציה תיכשל בקודקוד'
        feedback: >-
          ההסקה שגויה: האפס מראה רק שהפרמטריזציה **הזו** אינה רגולרית שם, בדיוק כמו בקוטב הספרה. כדי להראות שהנקודה
          סינגולרית צריך טיעון על הקבוצה, שלא תלוי בפרמטריזציה.
        misconception: MC-c3-param-singular-is-surface-singular
      - text: 'בקודקוד $\sigma_u=0$, ולכן אין שם שני כיוונים בלתי תלויים'
        feedback: >-
          גם בקוטב הספרה $\sigma_u=0$, והקוטב נקודה חלקה. נגזרת של פרמטריזציה אחת אינה טיעון על המשטח.
        misconception: MC-c3-param-singular-is-surface-singular

  - id: Q-3.1-which-singular
    type: multi
    objectives: [OBJ-3.1-3, OBJ-3.1-1]
    qualitative: true
    level: exam
    prompt: >-
      שלוש פרמטריזציות על $\mathbb R^2$. בכל אחת $\sigma$ אינה רגולרית על ישר שלם, שנשלח לנקודה $p$ או לקו במרחב. סמנו את
      כל הסעיפים שבהם יש נקודה של **התמונה** שהיא נקודה סינגולרית של התמונה (אין לה אף פרמטריזציה מקומית).
    choices:
      - text: '$(u^3,\ v,\ u^6)$; לא רגולרית על הישר $u=0$'
        feedback: >-
          לא סינגולרית. $u\mapsto u^3$ חד-חד-ערכית ועל $\mathbb R$, ו-$u^6=(u^3)^2$, ולכן התמונה היא כל הגרף $z=x^2$, והגרף
          $(x,y)\mapsto(x,\ y,\ x^2)$ הוא פרמטריזציה מקומית רגולרית שלו ליד כל נקודה. ($\sigma_u=(3u^2,0,6u^5)$ מתאפס ב-$u=0$:
          הכשל של הפרמטריזציה בלבד.)
        misconception: MC-c3-param-singular-is-surface-singular
      - text: '$(v\cos u,\ v\sin u,\ v^4)$; לא רגולרית על הישר $v=0$'
        feedback: >-
          לא סינגולרית. משטח סיבוב עם $f(v)=v$, $g(v)=v^4$, ולכן $f(0)=0$ והפרמטריזציה נכשלת ב-$v=0$. אבל התמונה היא כל
          הגרף $z=(x^2+y^2)^2$, של פונקציה חלקה (פולינום), וגרף של פונקציה חלקה הוא פרמטריזציה מקומית רגולרית.
        misconception: MC-c3-param-singular-is-surface-singular
      - text: '$(v^2\cos u,\ v^2\sin u,\ v)$; לא רגולרית על הישר $v=0$'
        correct: true
        feedback: >-
          נכון: הראשית סינגולרית. התמונה היא $\{x^2+y^2=z^4\}$ (כי $\sqrt{x^2+y^2}=v^2=z^2$). בה $z=0$ רק בראשית, ו-$(v^2,0,v)$
          עם $v=\pm t$ נותן נקודות עם $z>0$ ועם $z<0$ קרובות לראשית כרצוננו. לכן הטיעון של משפט 3.1.10 עובד מילה במילה:
          סביבה קטנה של הראשית בלי הראשית מתפרקת לשני חלקים, ודיסק בלי נקודה לא.
    explanation: >-
      הלקח: אי-רגולריות של פרמטריזציה היא רק **סימן אזהרה**. כדי להכריע שהנקודה חלקה מספיקה פרמטריזציה מקומית אחת שרגולרית
      בה (בשני הראשונים: גרף של פונקציה חלקה); כדי להכריע שהיא סינגולרית צריך טיעון על הקבוצה עצמה (בשלישי: קשירות).
      שלושתם משטחי סיבוב או קרובים לכך, והפרופיל של כולם פוגע בציר: ההבדל הוא בקבוצה, לא בנוסחה של $\|\sigma_u\times\sigma_v\|$.

  - id: Q-3.1-injective-not-regular
    type: twotier
    objectives: [OBJ-3.1-1, OBJ-3.1-3]
    qualitative: true
    level: mid
    prompt: >-
      האם ייתכן ש-$\sigma:\mathbb R^2\to\mathbb R^3$ חלקה וחד-חד-ערכית, התמונה שלה היא כל המישור $z=0$, ובכל זאת $\sigma$
      אינה רגולרית בנקודה $(0,0)$?
    choices:
      - text: כן, ייתכן
        correct: true
        feedback: >-
          נכון. התמונה חלקה, ההעתקה חד-חד-ערכית, והכשל הוא רק של הנגזרת בנקודה אחת.
      - text: לא, זה לא ייתכן
        feedback: >-
          חד-חד-ערכיות וחלקות התמונה אינן מבטיחות שהנגזרת מדרגה 2. ראו את הדוגמה בנימוק הנכון.
        misconception: MC-c3-regular-means-injective
    reasons:
      - text: 'הדוגמה $\sigma(u,v)=(u^3,\ v,\ 0)$'
        correct: true
        feedback: >-
          בדיוק. היא חד-חד-ערכית ועל המישור, ו-$\sigma_u=(3u^2,0,0)$ מתאפס ב-$u=0$. $u\mapsto u^3$ הפיכה, אבל ההופכית
          $x\mapsto x^{1/3}$ אינה גזירה ב-0. זו גם הסיבה שבהחלפת פרמטרים דורשים הופכית חלקה (שיעור 3.2).
      - text: 'המישור $z=0$ הוא משטח חלק, ולכן כל פרמטריזציה חלקה וחד-חד-ערכית שלו רגולרית'
        feedback: >-
          זה מה שצריך לבדוק, והוא לא נכון: הדוגמה $(u^3,v,0)$ סותרת אותו. חלקות של הקבוצה אומרת שיש **איזושהי**
          פרמטריזציה רגולרית, לא שכל פרמטריזציה רגולרית.
        misconception: MC-c3-param-singular-is-surface-singular
      - text: 'רגולריות וחד-חד-ערכיות הן אותו תנאי, ולכן התשובה תלויה רק בחד-חד-ערכיות'
        feedback: >-
          אלה תנאים שונים: הגליל $(\cos u,\sin u,v)$ רגולרי בכל מקום ואינו חד-חד-ערכי, ו-$(u^3,v,0)$ חד-חד-ערכית ואינה
          רגולרית.
        misconception: MC-c3-regular-means-injective

  - id: Q-3.1-local-param
    type: multi
    objectives: [OBJ-3.1-2, OBJ-3.1-1]
    qualitative: true
    level: mid
    prompt: >-
      $\sigma(u,v)=(\cos u\cos v,\ \sin u\cos v,\ \sin v)$, הפרמטריזציה הכדורית של ספרת היחידה $S^2$. על אילו מהתחומים $D$
      הבאים הצמצום $\sigma|_D$ הוא **פרמטריזציה מקומית** של $S^2$ (הגדרה 3.1.6: רגולרית, והומאומורפיזם מ-$D$ על $S^2\cap W$
      לאיזו $W$ פתוחה)? סמנו את כולם.
    choices:
      - text: '$D=(0,\pi)\times(-\frac\pi2,\frac\pi2)$'
        correct: true
        feedback: >-
          נכון. זה תת-תחום פתוח של $(0,2\pi)\times(-\frac\pi2,\frac\pi2)$ של טענה 3.1.7, ולכן $\sigma|_D$ רגולרית, חד-חד-ערכית
          ורציפה בהפיכה. והתמונה היא $S^2\cap\{y>0\}$: $y=\sin u\cos v>0$ בדיוק כש-$u\in(0,\pi)$ (כי $\cos v>0$), ו-$W=\{y>0\}$
          פתוחה.
      - text: '$D=(-1,4)\times(-1,1)$'
        correct: true
        feedback: >-
          נכון. $|v|<1<\frac\pi2$, ולכן רגולרית. ואם $R$ הסיבוב ברדיאן אחד סביב ציר $z$ (בכיוון השלילי), אז
          $\sigma(u,v)=R\,\sigma(u+1,v)$, ו-$u+1\in(0,5)\subset(0,2\pi)$. לכן $\sigma|_D$ היא הרכבה של הצמצום של הפרמטריזציה
          מטענה 3.1.7 לתת-תחום פתוח (עדיין הומאומורפיזם, על קבוצה פתוחה ב-$S^2$) עם סיבוב (הומאומורפיזם של $\mathbb R^3$
          ששומר את $S^2$).
      - text: '$D=\mathbb R\times(-\frac\pi2,\frac\pi2)$'
        feedback: >-
          רגולרית, אבל לא חד-חד-ערכית: $\sigma(u+2\pi,v)=\sigma(u,v)$. הגדרה 3.1.6 דורשת הומאומורפיזם, ולכן גם חד-חד-ערכיות.
        misconception: MC-c3-regular-means-injective
      - text: '$D=(0,2\pi)\times(-\frac\pi2,\frac\pi2]$'
        feedback: >-
          זה אינו תחום פתוח, ובקו $v=\frac\pi2$ הפרמטריזציה אינה רגולרית ($\|\sigma_u\times\sigma_v\|=|\cos v|=0$) ואינה
          חד-חד-ערכית: כל הקו נשלח לקוטב.
        misconception: MC-c3-regularity-only-generic-point
    explanation: >-
      פרמטריזציה מקומית צריכה שלושה דברים: תחום פתוח שבו היא רגולרית, חד-חד-ערכיות, והופכית רציפה על תמונה שפתוחה ב-$S^2$.
      בספרה, כל תחום פתוח שבו $|v|<\frac\pi2$ ושבו הקטע של $u$ קצר מ-$2\pi$ מספיק; את הקוטב מכסים בפרמטריזציה אחרת.

  - id: Q-3.1-root-cone
    type: twotier
    objectives: [OBJ-3.1-3, OBJ-3.1-1]
    qualitative: true
    level: exam
    prompt: >-
      $K=\{(x,y,z):\ z=(x^2+y^2)^{1/3}\}$, הגרף של פונקציה רציפה על כל המישור. האם הראשית היא נקודה סינגולרית של $K$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. אילו הייתה פרמטריזציה מקומית, $K$ הייתה ליד הראשית גרף **חלק** מעל אחד ממישורי הקואורדינטות, ואף אחד מהם
          לא מתאים.
      - text: לא
        feedback: >-
          גרף של פונקציה רציפה הוא הומאומורפי למישור, אבל הגדרה 3.1.6 דורשת פרמטריזציה חלקה ורגולרית. ראו את הנימוק הנכון.
        misconception: MC-c3-continuous-graph-is-surface
    reasons:
      - text: 'לפי טענה 3.1.11(א) בודקים את שלושת מישורי הקואורדינטות, וכל אחד נכשל'
        correct: true
        feedback: >-
          בדיוק. מעל $xy$ הגרף חייב להיות $h(x,y)=(x^2+y^2)^{1/3}$ ליד $(0,0)$, ו-$h(x,0)=|x|^{2/3}$ אינה גזירה ב-$0$ (מנת
          ההפרשים $|x|^{2/3}/x$ אינה חסומה). מעל $xz$: הנקודות $(0,\pm t,\ t^{2/3})$ נמצאות מעל אותה נקודה $(0,\ t^{2/3})$.
          מעל $yz$: $(\pm t,\ 0,\ t^{2/3})$. כמו בדוגמה 5, החרוט היחיד, אבל עם חוד חד יותר.
      - text: 'בלי הראשית, סביבה קטנה שלה ב-$K$ מתפרקת לשני חלקים, כמו בחרוט הכפול'
        feedback: >-
          לא נכון: $K$ בלי הראשית היא גרף מעל המישור בלי נקודה, קבוצה קשירה. טיעון הקשירות של משפט 3.1.10 לא עובד כאן;
          הפגם הוא בחלקות.
        misconception: MC-c3-cone-two-parts
      - text: 'פרמטריזציית הגרף היא הומאומורפיזם על $K$, ולכן $K$ משטח חלק ואין בה נקודות סינגולריות'
        feedback: >-
          ההעתקה $(x,y)\mapsto(x,y,h)$, עם $h=(x^2+y^2)^{1/3}$, אכן הומאומורפיזם, אבל היא אינה גזירה ב-$(0,0)$, ולכן אינה פרמטריזציה (הגדרה
          3.1.1). הגדרה 3.1.6 דורשת פרמטריזציה **חלקה ורגולרית** שהיא גם הומאומורפיזם.
        misconception: MC-c3-continuous-graph-is-surface
