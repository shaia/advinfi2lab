  - id: Q-9.2-interval
    type: twotier
    objectives: [OBJ-9.2-1]
    qualitative: true
    level: exam
    prompt: >-
      האם המערכת $1,\cos x,\sin x,\cos2x,\sin2x,\dots$ אורתוגונלית ב-$C[0,\pi]$ עם $\langle f,g\rangle=\int_0^\pi fg$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. בנפרד, $1,\cos x,\cos2x,\dots$ אורתוגונליות על $[0,\pi]$, וגם $\sin x,\sin2x,\dots$; יחד הן לא.
      - text: כן, כמו על $[-\pi,\pi]$
        feedback: >-
          על $[-\pi,\pi]$ האורתוגונליות של סינוס עם קוסינוס באה מזוגיות; על $[0,\pi]$ הטיעון הזה לא קיים.
        misconception: MC-c9-orthogonality-any-interval
    reasons:
      - text: '$\langle1,\sin x\rangle=\int_0^\pi\sin x\,dx=2\neq0$'
        correct: true
        feedback: >-
          בדיוק, ויש עוד: $\int_0^\pi\sin x\cos2x\,dx=-\frac23$.
      - text: 'כל זוג טריגונומטרי שונה ניצב על כל קטע שאורכו לפחות $\pi$'
        feedback: >-
          לא: $\int_0^\pi\sin x\,dx=2$ על קטע באורך $\pi$ בדיוק. מה שקובע הוא קטע של תקופה שלמה, או סימטריה מתאימה.
        misconception: MC-c9-orthogonality-any-interval
      - text: 'המערכת לא אורתוגונלית כי הנורמות אינן 1'
        feedback: >-
          נורמות שונות מ-1 פוגעות באורתונורמליות, לא באורתוגונליות. הבעיה כאן היא מכפלות שאינן אפס.
        misconception: MC-c9-orthogonal-normalized

  - id: Q-9.2-pyth-weights
    type: numeric
    objectives: [OBJ-9.2-3]
    level: exam
    prompt: >-
      ב-$C[-1,1]$ יהי $f=2P_0-P_1+3P_2$, כאשר $P_n$ פולינומי לז׳נדר. חשבו את $\|f-x^2\|^2$ בלי לפתוח את האינטגרל:
      כתבו קודם את $x^2$ בבסיס $P_0,P_1,P_2$.
    answer: 8.4
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{42}5$. $x^2=\frac13P_0+\frac23P_2$, ולכן $f-x^2=\frac53P_0-P_1+\frac73P_2$. $P_0,P_1,P_2$ ניצבים, ולכן לפי
      פיתגורס עם המשקלות $\|P_n\|^2=\frac2{2n+1}$:
      $$\|f-x^2\|^2=\frac{25}9\cdot2+1\cdot\frac23+\frac{49}9\cdot\frac25=\frac{250+30+98}{45}=\frac{42}5.$$
      בדיקה ישירה: $f-x^2=\frac12-x+\frac72x^2$, ו-$\int_{-1}^1\left(\frac12-x+\frac72x^2\right)^2dx=8.4$.
    wrongFeedback: >-
      שני שלבים: הצגת $x^2$ בבסיס (השוו מקדמים, או $\frac{\langle x^2,P_n\rangle}{\|P_n\|^2}$), ואז פיתגורס במערכת
      אורתוגונלית: $\left\|\sum c_nP_n\right\|^2=\sum c_n^2\|P_n\|^2$.
    commonWrong:
      - value: 9.2222222222
        feedback: >-
          $\frac{25}9+1+\frac{49}9$: זה $\sum c_n^2$, הנכון רק במערכת אורתונורמלית. כאן $\|P_0\|^2=2$, $\|P_1\|^2=\frac23$,
          $\|P_2\|^2=\frac25$.
        misconception: MC-c9-pythagoras-no-weights
      - value: 11.8666666667
        feedback: >-
          זה $\|f\|^2-\|x^2\|^2=\frac{184}{15}-\frac25$: ריבועי נורמות אינם מתחסרים כך, כי $f$ ו-$x^2$ אינם ניצבים. חסר
          האיבר המעורב $-2\langle f,x^2\rangle+2\|x^2\|^2$.
        misconception: MC-c9-drop-cross-term
      - value: 10.8444444444
        feedback: >-
          כאן נלקח $x^2=\frac23P_2$, בלי הרכיב $\frac13P_0$: $\frac23P_2=x^2-\frac13$. גם ל-$x^2$ יש רכיב קבוע.
        misconception: MC-c9-projection-drop-hidden
