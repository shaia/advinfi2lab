  - id: Q-11-exam-5
    type: exam
    title: אי-שוויון גרונוול ומשוואה לינארית
    prompt: >-
      בסעיף א מוכיחים את אי-שוויון גרונוול, ובשאר הסעיפים מפעילים אותו על המשוואה הלינארית $y'=(\cos t)\,y+t$.
    parts:
      - label: א
        points: 8
        type: open
        objectives: [OBJ-11.4-1]
        prompt: >-
          תהי $u$ רציפה ואי-שלילית ב-$[t_0,t_1]$, ויהיו $C\ge0$, $L\ge0$ כך ש-$u(t)\le C+\int_{t_0}^tLu(s)\,ds$ לכל
          $t\in[t_0,t_1]$. הוכיחו ש-$u(t)\le Ce^{L(t-t_0)}$ לכל $t\in[t_0,t_1]$.
        solution:
          - kind: given
            text: '$u\ge0$ רציפה, $C,L\ge0$, $u(t)\le C+\int_{t_0}^tLu(s)\,ds$.'
          - kind: goal
            text: '$u(t)\le Ce^{L(t-t_0)}$ לכל $t\in[t_0,t_1]$.'
          - kind: idea
            text: >-
              את $u$ אי אפשר לגזור, אבל את אגף ימין כן. מקבלים עליו אי-שוויון דיפרנציאלי $U'\le LU$, ופותרים אותו בגורם
              אינטגרציה.
          - kind: definition
            text: '$U(t)=C+\int_{t_0}^tLu(s)\,ds$. כי $u$ רציפה, לפי המשפט היסודי $U$ גזירה ו-$U''=Lu$.'
          - kind: step
            text: 'לפי ההנחה $u\le U$, ו-$L\ge0$, ולכן $U''(t)=Lu(t)\le LU(t)$.'
          - kind: computation
            text: >-
              $\frac{d}{dt}\left(e^{-L(t-t_0)}U(t)\right)=e^{-L(t-t_0)}\big(U'(t)-LU(t)\big)\le0$, ולכן
              $e^{-L(t-t_0)}U(t)$ לא עולה, ו-$e^{-L(t-t_0)}U(t)\le U(t_0)=C$.
          - kind: check
            text: 'ההוכחה לא חילקה ב-$C$, ולכן היא נכונה גם עבור $C=0$ (וזה המקרה של משפט היחידות).'
          - kind: result
            text: '$u(t)\le U(t)\le Ce^{L(t-t_0)}$ לכל $t\in[t_0,t_1]$.'
        rubric:
          - text: 'הגדרת $U$ ונימוק לגזירותה מהרציפות של $u$ (המשפט היסודי)'
            weight: 2
          - text: 'המעבר $U''=Lu\le LU$, עם שימוש מפורש ב-$u\le U$ וב-$L\ge0$'
            weight: 2
          - text: 'גורם האינטגרציה: הנגזרת של $e^{-L(t-t_0)}U$ אי-חיובית, ולכן הפונקציה חסומה על ידי ערכה ב-$t_0$'
            weight: 2
          - text: 'המסקנה $u\le U\le Ce^{L(t-t_0)}$'
            weight: 2

      - label: ב
        points: 4
        type: twotier
        objectives: [OBJ-11.4-3]
        qualitative: true
        prompt: >-
