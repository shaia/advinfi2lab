  - id: Q-1.3-inflection
    type: twotier
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: exam
    prompt: >-
      נתונה $\gamma(t)=(t,t^3)$. העקמומיות חיובית לכל $t\ne0$ ו-$\kappa(0)=0$. האם אפשר להגדיר את $\mathbf n(0)$ כך
      ש-$\mathbf n(t)$ יהיה רציף ב-$t=0$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. הגבולות החד-צדדיים של $\mathbf n$ ב-$0$ שונים, ולכן אין ערך שיהפוך אותו לרציף.
      - text: כן
        feedback: >-
          $\mathbf n$ מצביע אל הצד הקעור, והצד הקעור מתחלף ב-$t=0$: מעל הגרף מימין, מתחתיו משמאל.
        misconception: MC-c1-normal-always-defined
    reasons:
      - text: 'ל-$t>0$ הגרף קעור כלפי מעלה ו-$\mathbf n(t)\to(0,1)$; ל-$t<0$ קעור כלפי מטה ו-$\mathbf n(t)\to(0,-1)$'
        correct: true
        feedback: >-
          בדיוק. $\mathbf t(t)\to(1,0)$ משני הצדדים, ו-$\mathbf n$ הוא אחד משני הניצבים, לפי צד הקעירות. במישור
          הנורמל המסובב $\mathbf n_s$ פותר את זה: הוא רציף תמיד, והסימן עובר לעקמומיות המסומנת (שיעור 1.5).
      - text: 'כן: $\mathbf n(0)=\frac{\gamma''''(0)}{\|\gamma''''(0)\|}$'
        feedback: >-
          $\gamma''(0)=(0,0)$, ולכן הביטוי לא מוגדר. וגם בנקודות אחרות $\gamma''$ אינו מקביל ל-$\mathbf n$ בפרמטר כללי.
        misconception: MC-c1-normal-along-acceleration
      - text: 'כן: לכל מסילה רגולרית יש נורמל ראשי בכל נקודה'
        feedback: >-
          הנורמל הראשי מוגדר כ-$\frac{\mathbf t'}{\kappa}$, ורק כש-$\kappa>0$. כאן גם אין המשך רציף.
        misconception: MC-c1-normal-always-defined
