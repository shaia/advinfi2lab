# Lesson 1.3 — the unit tangent, curvature and the principal normal.
# Objectives (src/course.ts):
#   OBJ-1.3-1  curvature as ‖dt/ds‖; the circle and the line
#   OBJ-1.3-2  the cross-product formula in a general parameter, and why the cube
#   OBJ-1.3-3  the principal normal where κ > 0, and why it is perpendicular to t
chapter: 1
questions:
  - id: Q-1.3-circle
    type: mc
    objectives: [OBJ-1.3-1]
    qualitative: true
    level: basic
    prompt: >-
      נסמן $\mathbf t=\frac{\gamma'}{\|\gamma'\|}$, וקטור המשיק היחידה; בפרמטר אורך הקשת $s$ פשוט $\mathbf t(s)=\gamma'(s)$.
      העקמומיות היא $\kappa=\|\frac{d\mathbf t}{ds}\|$. מעגל ברדיוס $r$ בפרמטר אורך הקשת הוא
      $\gamma(s)=(r\cos\frac sr,\ r\sin\frac sr)$. מהי העקמומיות שלו?
    choices:
      - text: '$\frac1r$, בכל נקודה'
        correct: true
        feedback: >-
          נכון. $\mathbf t(s)=(-\sin\frac sr,\cos\frac sr)$ ו-$\mathbf t'(s)=-\frac1r(\cos\frac sr,\sin\frac sr)$, באורך
          $\frac1r$. מעגל גדול כמעט ישר בכל קטע קצר.
      - text: '$r$, בכל נקודה'
        feedback: >-
          זה הרדיוס, לא העקמומיות. מעגל ברדיוס מיליון כמעט ישר, ועקמומיותו $10^{-6}$. הקשר הוא $\kappa=\frac1r$.
        misconception: MC-c1-curvature-radius
      - text: 'תלוי במהירות שבה מקיפים את המעגל'
        feedback: >-
          העקמומיות מוגדרת לפי אורך הקשת דווקא כדי שלא תהיה תלויה במהירות: היא מודדת כמה הכיוון משתנה ליחידת
          אורך, לא ליחידת זמן.
        misconception: MC-c1-curvature-acceleration

  - id: Q-1.3-fastcircle
    type: numeric
    objectives: [OBJ-1.3-1]
    level: basic
    prompt: >-
      חשבו את העקמומיות של $\gamma(t)=(3\cos 2t,\ 3\sin 2t)$.
    answer: 0.33333333
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $\frac13$. זה מעגל ברדיוס $3$, ו-$2t$ רק משנה את המהירות. בפרמטר אורך הקשת $s=6t$ מקבלים
      $(3\cos\frac s3,3\sin\frac s3)$ ו-$\kappa=\frac13$.
    wrongFeedback: >-
      עברו לפרמטר אורך הקשת (המהירות היא $6$), או השתמשו בנוסחה $\frac{\|\gamma'\times\gamma''\|}{\|\gamma'\|^3}$.
    commonWrong:
      - value: 12
        feedback: >-
          $12=\|\gamma''(t)\|$ בפרמטר $t$, שאינו אורך הקשת. התאוצה כאן גדלה עם ריבוע המהירות, אבל הצורה לא השתנתה.
        misconception: MC-c1-curvature-acceleration
      - value: 3
        feedback: $3$ הוא הרדיוס. העקמומיות היא ההופכי שלו.
        misconception: MC-c1-curvature-radius
      - value: 2
        feedback: >-
          $2=\frac{\|\gamma''\|}{\|\gamma'\|}=\frac{12}{6}$. החזקה הנכונה במכנה היא השלישית:
          $\frac{\|\gamma'\times\gamma''\|}{\|\gamma'\|^3}=\frac{72}{216}$.
        misconception: MC-c1-curvature-power

  - id: Q-1.3-helix
    type: numeric
    objectives: [OBJ-1.3-2]
    level: basic
    prompt: >-
      חשבו את העקמומיות של הסליל $\gamma(t)=(3\cos t,\ 3\sin t,\ 4t)$ בנוסחה
      $\kappa=\frac{\|\gamma'\times\gamma''\|}{\|\gamma'\|^3}$.
    answer: 0.12
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $\frac{3}{25}$. $\gamma'=(-3\sin t,3\cos t,4)$, $\gamma''=(-3\cos t,-3\sin t,0)$,
      $\gamma'\times\gamma''=(12\sin t,-12\cos t,9)$ באורך $15$, ו-$\|\gamma'\|^3=125$. באופן כללי לסליל
      $(a\cos t,a\sin t,bt)$: $\kappa=\frac{a}{a^2+b^2}$.
    wrongFeedback: >-
      חשבו את המכפלה הווקטורית רכיב אחר רכיב, את האורך שלה, וחלקו בחזקה השלישית של $\|\gamma'\|=5$.
    commonWrong:
      - value: 0.33333333
        feedback: >-
          $\frac13$ היא העקמומיות של מעגל החתך של הגליל. הסליל גם עולה, וזה מיישר אותו: $\frac{3}{25}<\frac13$.
        misconception: MC-c1-natural-circle
      - value: 0.6
        feedback: >-
          $\frac{15}{25}$: חילקו ב-$\|\gamma'\|^2$. החזקה במכנה היא שלישית.
        misconception: MC-c1-curvature-power
      - value: 3
        feedback: >-
          $3=\|\gamma''\|$. בפרמטר $t$ המהירות היא $5$, לא $1$, ולכן $\|\gamma''\|$ אינו העקמומיות.
        misconception: MC-c1-curvature-acceleration

  - id: Q-1.3-helix-normal
    type: mc
    objectives: [OBJ-1.3-3]
    level: mid
    prompt: >-
      בנקודה שבה $\kappa>0$, **הנורמל הראשי** הוא וקטור היחידה $\mathbf n=\frac{1}{\kappa}\frac{d\mathbf t}{ds}$, הכיוון שאליו
      $\mathbf t$ פונה. מהו $\mathbf n(t)$ של הסליל $\gamma(t)=(a\cos t,\ a\sin t,\ bt)$, $a>0$?
    choices:
      - text: '$(-\cos t,\ -\sin t,\ 0)$'
        correct: true
        feedback: >-
          נכון. $\mathbf t=\frac{1}{\sqrt{a^2+b^2}}(-a\sin t,a\cos t,b)$ ו-$\frac{ds}{dt}=\|\gamma'\|=\sqrt{a^2+b^2}$, ולכן
          $\frac{d\mathbf t}{ds}=\frac{d\mathbf t/dt}{ds/dt}=\frac{a}{a^2+b^2}(-\cos t,-\sin t,0)$. מחלקים באורך $\kappa=\frac{a}{a^2+b^2}$.
          הנורמל מצביע אופקית, פנימה אל ציר הגליל.
      - text: '$(\cos t,\ \sin t,\ 0)$'
        feedback: >-
          זה הכיוון החוצה מהציר. $\mathbf n$ הוא הכיוון שאליו $\mathbf t$ פונה, אל הצד הקעור: פנימה.
        misconception: MC-c1-normal-outward
      - text: '$\frac{1}{\sqrt{a^2+b^2}}(b\sin t,\ -b\cos t,\ a)$'
        feedback: >-
          זה וקטור יחידה שניצב ל-$\mathbf t$ (בדקו: המכפלה הפנימית אפס), אבל הוא לא הכיוון של $\frac{d\mathbf t}{ds}$.
          במרחב יש מישור שלם של כיוונים ניצבים, והנורמל הראשי הוא אחד מסוים מהם.
        misconception: MC-c1-normal-any-perpendicular

  - id: Q-1.3-accel
    type: twotier
    objectives: [OBJ-1.3-1]
    qualitative: true
    level: mid
    prompt: >-
      נתונה $\gamma(t)=(e^t,\ 2e^t)$, $t\in\mathbb R$. האם העקמומיות שלה ב-$t$ היא $\|\gamma''(t)\|$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. $\gamma''(t)=e^t(1,2)\ne0$, אבל התמונה היא הקרן $y=2x$, $x>0$, ועקמומיותה $0$.
      - text: כן
        feedback: >-
          $\|\gamma''(t)\|=\sqrt5e^t>0$, אבל המסילה היא חלק מישר. התאוצה כאן רק משנה את המהירות, לא את הכיוון.
        misconception: MC-c1-curvature-acceleration
    reasons:
      - text: 'רק בפרמטר אורך הקשת $\kappa=\|\gamma''''\|$; כאן $\gamma''''$ מקביל ל-$\gamma''$, כלומר רק המהירות משתנה, והכיוון $\frac{1}{\sqrt5}(1,2)$ קבוע'
        correct: true
        feedback: >-
          בדיוק. $\mathbf t$ קבוע, ולכן $\frac{d\mathbf t}{ds}=0$. גם הנוסחה מסכימה: $\gamma'\times\gamma''=0$ כי
          הווקטורים מקבילים.
      - text: 'העקמומיות היא אורך התאוצה $\|\gamma''''\|$ בכל פרמטר, וכאן $\gamma''''=e^t(1,2)\ne0$, ולכן היא $\sqrt5e^t$'
        feedback: >-
          אז קרן שעוברים עליה בתאוצה הייתה "מעוקמת". העקמומיות מודדת שינוי כיוון ליחידת אורך, ולכן מוגדרת
          כ-$\|\frac{d\mathbf t}{ds}\|$.
        misconception: MC-c1-curvature-acceleration
      - text: 'העקמומיות היא $\frac{\|\gamma''''\|}{\|\gamma''\|}$, היחס בין התאוצה למהירות, שמבטל את הקצב; וכאן היא $1$'
        feedback: >-
          זה לא גודל גאומטרי: הוא $1$ על קרן, שעקמומיותה $0$. הנוסחה הנכונה היא
          $\frac{\|\gamma'\times\gamma''\|}{\|\gamma'\|^3}$, וכאן המונה אפס.
        misconception: MC-c1-curvature-power

  - id: Q-1.3-zero
    type: multi
    objectives: [OBJ-1.3-1]
    qualitative: true
    level: mid
    prompt: >-
      $\gamma$ מסילה רגולרית מסדר $C^2$ ב-$\mathbb R^3$ בפרמטר אורך הקשת. אילו טענות נכונות? סמנו את כולן.
    choices:
      - text: 'אם $\kappa\equiv0$ על קטע, המסילה על הקטע הזה היא קטע של ישר'
        correct: true
        feedback: >-
          נכון. $\mathbf t'=0$, ולכן $\mathbf t\equiv\mathbf t_0$ קבוע, ו-$\gamma(s)=\gamma(s_0)+(s-s_0)\mathbf t_0$.
      - text: 'למסילה בכיוון ההפוך, $\gamma(-s)$, אותה עקמומיות בכל נקודה של התמונה'
        correct: true
        feedback: >-
          נכון. בכיוון ההפוך $\mathbf t$ מתהפך, וגם $\frac{d\mathbf t}{ds}$ מחליף סימן פעמיים (פעם מ-$\mathbf t$ ופעם
          מ-$s$), כך ש-$\|\frac{d\mathbf t}{ds}\|$ לא משתנה. $\kappa\ge0$ אינו מרגיש בכיוון.
      - text: 'אם $\kappa(s_0)=0$, המסילה ישרה בסביבה של $\gamma(s_0)$'
        feedback: >-
          המסילה $(t,t^3)$: $\gamma'=(1,3t^2,0)$, $\gamma''=(0,6t,0)$ ו-$\gamma'\times\gamma''=(0,0,6t)$, ולכן
          $\kappa(0)=\frac{0}{1}=0$. ובכל זאת אין קטע ישר סביב הראשית: שם הקעירות מתחלפת. עקמומיות אפס בנקודה אחת לא גוררת
          ישר.
        misconception: MC-c1-zero-curvature-straight
      - text: 'למסילה $2\gamma$ עקמומיות כפולה מזו של $\gamma$ בנקודה המתאימה'
        feedback: >-
          הפוך: הגדלה פי $2$ מחלקת את העקמומיות ב-$2$. בנוסחה המונה גדל פי $4$ והמכנה פי $8$; מעגל ברדיוס $2$ מעוקם
          חצי ממעגל ברדיוס $1$.
        misconception: MC-c1-curvature-scaling

  - id: Q-1.3-ellipse
    type: numeric
    objectives: [OBJ-1.3-2]
    level: mid
    prompt: >-
      חשבו את העקמומיות של האליפסה $\gamma(t)=(2\cos t,\ \sin t)$ בנקודה $(0,1)$, כלומר ב-$t=\frac\pi2$.
    answer: 0.25
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $\frac14$. במישור $\kappa=\frac{|x'y''-y'x''|}{(x'^2+y'^2)^{3/2}}$, וכאן
      $x'y''-y'x''=(-2\sin t)(-\sin t)-(\cos t)(-2\cos t)=2$, ולכן
      $\kappa(t)=\frac{2}{(4\sin^2t+\cos^2t)^{3/2}}$. ב-$t=\frac\pi2$: $\frac{2}{8}$.
    wrongFeedback: >-
      במישור המכפלה הווקטורית של $(x',y',0)$ ו-$(x'',y'',0)$ היא $(0,0,x'y''-y'x'')$. חשבו אותה, ואת
      $\|\gamma'(\frac\pi2)\|$.
    commonWrong:
      - value: 0.5
        feedback: >-
          $\frac24$: חילקו ב-$\|\gamma'\|^2=4$. החזקה במכנה היא שלישית, $\|\gamma'\|^3=8$.
        misconception: MC-c1-curvature-power
      - value: 1
        feedback: >-
          $1=\|\gamma''(\frac\pi2)\|$. המהירות שם היא $2$, לא $1$, ולכן התאוצה אינה העקמומיות.
        misconception: MC-c1-curvature-acceleration
      - value: 2
        feedback: >-
          $2$ היא העקמומיות ב-$(2,0)$, קצה הציר הארוך, שם האליפסה הכי מעוקמת. ב-$(0,1)$, קצה הציר הקצר, היא הכי
          שטוחה.
        misconception: MC-c1-ellipse-ends

  - id: Q-1.3-cube
    type: twotier
    objectives: [OBJ-1.3-2]
    qualitative: true
    level: mid
    prompt: >-
      $\gamma$ רגולרית, ו-$\delta=\gamma\circ\varphi$ עם $\varphi'>0$. האם הנוסחה
      $\frac{\|\delta'\times\delta''\|}{\|\delta'\|^3}$ נותנת ב-$u$ את אותו ערך כמו
      $\frac{\|\gamma'\times\gamma''\|}{\|\gamma'\|^3}$ ב-$t=\varphi(u)$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. זו הסיבה שהנוסחה נכונה בכל פרמטר: היא לא תלויה בפרמטר, ובפרמטר אורך הקשת היא נותנת את ההגדרה. שם
          $\|\gamma'\|=1$; גזירת $\gamma'\cdot\gamma'=1$ נותנת $2\gamma'\cdot\gamma''=0$, כלומר $\gamma''\perp\gamma'$, ולכן
          $\|\gamma'\times\gamma''\|=\|\gamma'\|\,\|\gamma''\|\sin\frac\pi2=\|\gamma''\|=\|\frac{d\mathbf t}{ds}\|=\kappa$. (אם
          $\varphi'<0$, שני הצדדים מקבלים $|\varphi'|^3$ במקום $\varphi'^3$, והערך שוב זהה.)
      - text: 'לא, היא גדלה פי $\varphi''$: מעבר מהיר יותר נותן עקמומיות גדולה יותר'
        feedback: >-
          המהירות לא משנה את הצורה, וגודל גאומטרי לא יכול להיות תלוי בה. החשבון מראה שהגורמים מתקזזים בדיוק.
        misconception: MC-c1-curvature-acceleration
    reasons:
      - text: '$\delta''=\varphi''\gamma''$ ו-$\delta''''=\varphi''''\gamma''+\varphi''^2\gamma''''$, ולכן $\delta''\times\delta''''=\varphi''^3\,\gamma''\times\gamma''''$; גם המכנה מוכפל ב-$\varphi''^3$'
        correct: true
        feedback: >-
          בדיוק. המחובר $\varphi''\gamma'$ ב-$\delta''$ מקביל ל-$\gamma'$ ונעלם במכפלה הווקטורית. החזקה השלישית במכנה
          היא היחידה שמבטלת את $\varphi'^3$.
      - text: 'החזקה השלישית היא מוסכמה; גם $\|\gamma''\|^2$ במכנה היה נותן גודל שלא תלוי בפרמטריזציה'
        feedback: >-
          עם חזקה שנייה נשאר גורם $\varphi'$: למעגל $(3\cos 2t,3\sin 2t)$ זה נותן $\frac{72}{36}=2$, ולאותו מעגל
          בפרמטריזציה $(3\cos t,3\sin t)$ זה נותן $\frac99=1$. החזקה נכפית על ידי ההחלפה.
        misconception: MC-c1-curvature-power
      - text: 'החזקה השלישית באה מכך שעובדים ב-$\mathbb R^3$; במישור החזקה היא שנייה'
        feedback: >-
          גם במישור $\kappa=\frac{|x'y''-y'x''|}{(x'^2+y'^2)^{3/2}}$. החזקה באה מהחלפת הפרמטר: המונה מכיל שלושה
          גורמים של $\varphi'$, לא מממד המרחב.
        misconception: MC-c1-curvature-power

  - id: Q-1.3-normal-proof
    type: rank
    objectives: [OBJ-1.3-3]
    level: mid
    help: >-
      סדרו את שלבי ההוכחה שהנורמל הראשי ניצב למשיק, מהראשון לאחרון.
    prompt: >-
      $\gamma$ בפרמטר אורך הקשת, מסדר $C^2$, ו-$\kappa(s_0)>0$. הוכיחו ש-$\mathbf n(s_0)\perp\mathbf t(s_0)$.
    items:
      - id: unit
        label: '$\|\mathbf t(s)\|=1$ לכל $s$, כלומר $\mathbf t(s)\cdot\mathbf t(s)=1$'
      - id: diff
        label: 'גוזרים לפי $s$: $2\,\mathbf t(s)\cdot\mathbf t''(s)=0$'
      - id: perp
        label: 'לכן $\mathbf t''(s)\perp\mathbf t(s)$ לכל $s$'
      - id: conclude
        label: 'כש-$\kappa(s_0)=\|\mathbf t''(s_0)\|>0$, הווקטור $\mathbf n(s_0)=\frac{\mathbf t''(s_0)}{\kappa(s_0)}$ הוא כפולה חיובית של $\mathbf t''(s_0)$, ולכן גם הוא ניצב ל-$\mathbf t(s_0)$'
    order: [unit, diff, perp, conclude]
    correctFeedback: >-
      נכון. אותו טיעון מראה שכל וקטור באורך קבוע ניצב לנגזרת שלו. התנאי $\kappa>0$ נחוץ רק כדי לחלק ב-$\kappa$.
    wrongFeedback: >-
      ההוכחה מתחילה מהעובדה ש-$\mathbf t$ הוא וקטור יחידה, גוזרת אותה, ורק בסוף מנרמלת: כל שלב משתמש בתוצאה של קודמו.

  - id: Q-1.3-normal-accel
    type: twotier
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: mid
    prompt: >-
      האם הנורמל הראשי $\mathbf n(t)$ מקביל תמיד ל-$\gamma''(t)$? בדקו על הפרבולה $\gamma(t)=(t,t^2)$ ב-$t=1$.
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. ב-$t=1$: $\gamma''=(0,2)$, אבל $\mathbf t=\frac{1}{\sqrt5}(1,2)$ ו-$\mathbf n=\frac{1}{\sqrt5}(-2,1)$.
      - text: כן
        feedback: >-
          $(0,2)$ אינו ניצב ל-$\mathbf t=\frac{1}{\sqrt5}(1,2)$: המכפלה הפנימית היא $\frac{4}{\sqrt5}$. לכן $\gamma''$ אינו
          כיוון הנורמל.
        misconception: MC-c1-normal-along-acceleration
    reasons:
      - text: '$\gamma''''=\big(\frac{d}{dt}\|\gamma''\|\big)\mathbf t+\kappa\|\gamma''\|^2\mathbf n$: כשהמהירות משתנה יש ל-$\gamma''''$ רכיב לאורך המשיק'
        correct: true
        feedback: >-
          בדיוק. הפיתוח: נסמן $v=\|\gamma'\|=\frac{ds}{dt}$, כך ש-$\gamma'=v\,\mathbf t$. גוזרים לפי $t$ בכלל המכפלה ובכלל השרשרת:
          $\gamma''=v'\,\mathbf t+v\,\frac{d\mathbf t}{dt}=v'\,\mathbf t+v\,\frac{d\mathbf t}{ds}\frac{ds}{dt}=v'\,\mathbf t+\kappa v^2\,\mathbf n$.
          לכן $\mathbf n$ הוא הכיוון של **הרכיב הניצב** של $\gamma''$, ורק במהירות קבועה ($v'=0$) הרכיב המשיק מתאפס.
      - text: 'הנורמל הראשי מוגדר ככיוון התאוצה'
        feedback: >-
          הוא מוגדר ככיוון של $\frac{d\mathbf t}{ds}$. רק בפרמטר אורך הקשת זה $\gamma''(s)$.
        misconception: MC-c1-normal-along-acceleration
      - text: 'בקודקוד הפרבולה $\gamma''''=(0,2)$ מקביל לנורמל $(0,1)$, ולכן כך בכל נקודה'
        feedback: >-
          בקודקוד המהירות $\|\gamma'\|=\sqrt{1+4t^2}$ נמצאת במינימום, והרכיב המשיק של $\gamma''$ מתאפס שם במקרה. ב-$t=1$
          הוא כבר לא אפס.
        misconception: MC-c1-normal-along-acceleration

  - id: Q-1.3-cubic
    type: numeric
    objectives: [OBJ-1.3-2]
    level: mid
    prompt: >-
