            feedback: >-
              זה $\iint K\,du\,dv=2\pi\int_{-\pi/2}^{\pi/2}\frac{\cos v}{2+\cos v}\,dv$, בלי אלמנט השטח. $dS=(2+\cos v)\,du\,dv$,
