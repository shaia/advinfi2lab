              $v\in[-\frac\pi2,\frac\pi2]$: ההעתקה חד-חד-ערכית (פרט לקבוצה בעלת שטח אפס) ועל ספרת היחידה.
          - kind: step
            text: >-
              על $T_-$, נציב $v=\pi-w$ עם $w\in[-\frac\pi2,\frac\pi2]$: $\hat{\mathbf N}=(-\cos u\cos w,\ -\sin u\cos w,\ \sin w)$,
