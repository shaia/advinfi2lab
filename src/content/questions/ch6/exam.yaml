        objectives: [OBJ-6.5-3, OBJ-4.4-1, OBJ-4.2-1]
        prompt: >-
          הוכיחו שבכל משטח סגור $M$ יש נקודה שבה $K>0$. (רמז: הנקודה של $M$ הרחוקה ביותר מהראשית.) הסיקו שבכל משטח סגור שאפשר
          לעוות ברציפות לטורוס יש גם נקודה שבה $K<0$.
        solution:
          - kind: idea
            text: >-
              בנקודה הרחוקה ביותר המשטח מוכל בכדור שנוגע בו שם, ולכן מתעקם לפחות כמו הספרה החוסמת, בכל כיוון.
          - kind: step
            text: >-
              $M$ סגורה וחסומה ו-$\|x\|^2$ רציפה, ולכן יש $p\in M$ שבה $\|x\|$ מקסימלי; $\rho=\|p\|>0$ (אחרת $M=\{0\}$).
              לכל מסילה $\alpha$ על $M$ בפרמטר אורך הקשת עם $\alpha(0)=p$, ל-$f(s)=\|\alpha(s)\|^2$ יש מקסימום ב-$0$.
          - kind: computation
            text: >-
              $f'(0)=2p\cdot\alpha'(0)=0$ לכל כיוון משיק, ולכן $p$ ניצב למישור המשיק ו-$\hat{\mathbf N}(p)=\pm\frac p\rho$.
              $f''(0)=2\big(1+p\cdot\alpha''(0)\big)\le0$, כלומר $p\cdot\alpha''(0)\le-1$.
          - kind: step
            text: >-
              עם $\hat{\mathbf N}=-\frac p\rho$: $\kappa_n=\alpha''(0)\cdot\hat{\mathbf N}=-\frac{p\cdot\alpha''(0)}{\rho}\ge\frac1\rho$
              בכל כיוון. לכן $\kappa_1,\kappa_2\ge\frac1\rho$ ו-$K(p)=\kappa_1\kappa_2\ge\frac1{\rho^2}>0$ (ו-$K$ אינו תלוי בבחירת
              הנורמל).
          - kind: step
            text: >-
              משטח מצורת טורוס: לפי גאוס-בונה $\iint K\,dS=0$. יש נקודה עם $K>0$, ולכן ברציפות סביבה שבה $K>0$, שתורמת חיובי.
              אילו $K\ge0$ בכל מקום, האינטגרל היה חיובי ממש. לכן יש נקודה עם $K<0$.
          - kind: result
            text: 'בכל משטח סגור יש נקודה אליפטית, ובכל משטח סגור מצורת טורוס יש גם נקודה היפרבולית.'
