      - label: ב
        points: 6
        type: open
        objectives: [OBJ-6.5-2]
        prompt: >-
          הנורמל החיצוני של הטורוס הוא $\hat{\mathbf N}(u,v)=(\cos u\cos v,\ \sin u\cos v,\ \sin v)$. תארו את התמונה של העתקת
          גאוס של $T_+$ ושל החלק הפנימי $T_-$ ($v\in[\frac\pi2,\frac{3\pi}2]$), והסבירו בעזרתה את סעיף א ואת העקמומיות הכוללת
          של הטורוס כולו.
        solution:
          - kind: idea
            text: 'העקמומיות הכוללת היא השטח המסומן של תמונת העתקת גאוס; הסימן של $K$ אומר אם ההעתקה שומרת כיוון.'
          - kind: step
            text: >-
