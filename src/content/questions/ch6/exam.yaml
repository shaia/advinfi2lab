  - id: Q-6-exam-6
    type: exam
    title: עקמומיות כוללת והעתקת גאוס
    prompt: >-
      בשאלה זו "משטח סגור" הוא משטח חלק, מכוון ובלי שפה ב-$\mathbb{R}^3$, שהוא קבוצה סגורה וחסומה. אפשר להשתמש בגאוס-בונה בניסוח של שיעור 6.5,
