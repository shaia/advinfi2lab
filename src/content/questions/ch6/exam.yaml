          נתון $K=\frac{\cos v}{2+\cos v}$ ו-$\|\sigma_u\times\sigma_v\|=2+\cos v$. חשבו את $\iint_{T_+}K\,dS$.
        answer: 12.566371
        tolerance: 0.001
        correctFeedback: >-
          נכון, $4\pi$. $K\,dS=\cos v\,du\,dv$, ו-$\int_0^{2\pi}\int_{-\pi/2}^{\pi/2}\cos v\,dv\,du=2\pi\cdot2$.
        wrongFeedback: >-
