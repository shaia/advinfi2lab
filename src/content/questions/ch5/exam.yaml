  - id: Q-5-exam-5
    type: exam
    title: שטח של גרף
    prompt: >-
      $D\subseteq\mathbb R^2$ תחום בעל שטח ו-$f$ גזירה ברציפות על $\bar D$. הגרף של $f$ מעל $D$ הוא המשטח
      $\sigma(x,y)=(x,y,f(x,y))$, $(x,y)\in D$.
    parts:
      - label: א
        points: 5
        type: open
        objectives: [OBJ-5.3-1, OBJ-5.3-3]
        prompt: >-
          הוכיחו מהגדרת השטח שהשטח של הגרף הוא $\iint_D\sqrt{1+f_x^2+f_y^2}\,dx\,dy$.
        solution:
          - kind: definition
            text: >-
              לפרמטריזציה רגולרית וחד-חד-ערכית $\sigma:D\to\mathbb R^3$ השטח הוא $\iint_D\|\sigma_x\times\sigma_y\|\,dx\,dy$.
          - kind: step
            text: >-
              $\sigma$ חד-חד-ערכית (שתי הקואורדינטות הראשונות של $\sigma(x,y)$ הן $x,y$), גזירה ברציפות, ורגולרית:
              $\sigma_x=(1,0,f_x)$ ו-$\sigma_y=(0,1,f_y)$ בלתי תלויים לינארית, כי שני הרכיבים הראשונים שלהם הם
              $e_1$ ו-$e_2$.
          - kind: computation
            text: >-
              $$\sigma_x\times\sigma_y=\det\begin{pmatrix}e_1&e_2&e_3\\1&0&f_x\\0&1&f_y\end{pmatrix}=(-f_x,\ -f_y,\ 1).$$
          - kind: computation
            text: '$\|\sigma_x\times\sigma_y\|=\sqrt{f_x^2+f_y^2+1}$.'
          - kind: check
            text: >-
              בדרך התבנית הראשונה: $E=1+f_x^2$, $F=f_xf_y$, $G=1+f_y^2$, ו-$EG-F^2=1+f_x^2+f_y^2$. ולפונקציה קבועה
              מתקבל שטח $D$, כמצופה.
          - kind: result
            text: 'שטח הגרף הוא $\iint_D\sqrt{1+f_x^2+f_y^2}\,dx\,dy$.'
        rubric:
          - text: 'ניסוח הגדרת השטח, ובדיקה ש-$\sigma$ פרמטריזציה רגולרית וחד-חד-ערכית'
            weight: 1.5
          - text: 'חישוב $\sigma_x$, $\sigma_y$ ו-$\sigma_x\times\sigma_y=(-f_x,-f_y,1)$'
            weight: 2
          - text: 'האורך $\sqrt{1+f_x^2+f_y^2}$ והצבה בהגדרה'
            weight: 1.5
      - label: ב
        points: 5
        type: numeric
        objectives: [OBJ-5.3-3]
        prompt: >-
          חשבו את השטח של הגרף של $f(x,y)=\frac23\left(x^{3/2}+y^{3/2}\right)$ מעל $[0,1]^2$.
        answer: 1.4066
        tolerance: 0.001
        correctFeedback: >-
          נכון, $\frac4{15}\left(9\sqrt3-8\sqrt2+1\right)\approx1.4066$. $f_x=\sqrt x$, $f_y=\sqrt y$, ולכן
          $$A=\int_0^1\int_0^1\sqrt{1+x+y}\,dx\,dy=\int_0^1\frac23\left[(2+y)^{3/2}-(1+y)^{3/2}\right]dy=\frac4{15}\left[(3^{5/2}-2^{5/2})-(2^{5/2}-1)\right].$$
        wrongFeedback: >-
          $f_x^2+f_y^2=x+y$. חשבו את האינטגרל של $\sqrt{1+x+y}$ קודם לפי $x$ ואחר כך לפי $y$ (פוביני).
        commonWrong:
          - value: 2
            feedback: >-
              זה $\iint(1+x+y)=2$, בלי השורש.
            misconception: MC-c5-area-no-root
          - value: 0.975161
            feedback: >-
              זה $\iint\sqrt{x+y}$, בלי ה-1 שמגיע מהרכיב השלישי של $\sigma_x\times\sigma_y$.
            misconception: MC-c5-graph-forget-one
      - label: ג
        points: 6
        type: open
        objectives: [OBJ-5.3-3, OBJ-5.3-1]
        qualitative: true
        prompt: >-
          הוכיחו: אם $f,g\in C^1$ ו-$f_x^2+f_y^2=g_x^2+g_y^2$ בכל נקודה של $D$, לגרפים שלהן מעל $D$ אותו שטח.
          הסיקו שלגרפים של $f(x,y)=e^x\cos y$ ושל $g(x,y)=e^x\sin y$ מעל $D=[0,1]\times[0,\pi]$ אותו שטח.
        solution:
          - kind: idea
            text: >-
              לפי סעיף א, השטח של גרף תלוי ב-$f$ רק דרך $f_x^2+f_y^2$: אם האינטגרנדים שווים בכל נקודה, האינטגרלים
              שווים.
          - kind: step
            text: >-
              לפי סעיף א, $A(f)=\iint_D\sqrt{1+f_x^2+f_y^2}$ ו-$A(g)=\iint_D\sqrt{1+g_x^2+g_y^2}$. לפי ההנחה האינטגרנדים
              שווים בכל נקודה של $D$, ולכן $A(f)=A(g)$.
          - kind: computation
            text: >-
              $f_x=e^x\cos y$, $f_y=-e^x\sin y$, ולכן $f_x^2+f_y^2=e^{2x}$. $g_x=e^x\sin y$, $g_y=e^x\cos y$, ולכן
              גם $g_x^2+g_y^2=e^{2x}$.
          - kind: check
            text: >-
              זה אינו נובע מחפיפה פשוטה של המשטחים מעל אותו תחום: $f$ ו-$g$ שונות ב-$D$ (למשל $f(0,0)=1$, $g(0,0)=0$).
              המשפט צריך רק את אורך הגרדיאנט.
          - kind: result
            text: >-
              $A(f)=A(g)=\iint_D\sqrt{1+e^{2x}}\,dx\,dy$: לשני הגרפים אותו שטח.
        rubric:
          - text: 'שימוש בנוסחה מסעיף א ובהשוואה נקודתית של האינטגרנדים'
            weight: 2
          - text: 'חישוב הנגזרות החלקיות של $f$ ושל $g$'
            weight: 2
          - text: 'המסקנה $f_x^2+f_y^2=g_x^2+g_y^2=e^{2x}$ ומכאן שוויון השטחים'
            weight: 2
      - label: ד
        points: 4
        type: numeric
        standalone: false
        objectives: [OBJ-5.3-3]
        prompt: >-
          חשבו את השטח המשותף מסעיף ג. (רמז: ההצבה $w=\sqrt{1+e^{2x}}$ נותנת
          $\int\sqrt{1+e^{2x}}\,dx=w+\frac12\ln\frac{w-1}{w+1}+C$.)
        answer: 6.294172
        tolerance: 0.001
        correctFeedback: >-
          נכון. $A=\pi\int_0^1\sqrt{1+e^{2x}}\,dx=\pi\left[w+\frac12\ln\frac{w-1}{w+1}\right]_{\sqrt2}^{\sqrt{1+e^2}}\approx6.2942$.
        wrongFeedback: >-
          האינטגרנד אינו תלוי ב-$y$, ולכן $A=\pi\int_0^1\sqrt{1+e^{2x}}\,dx$. הציבו את הגבולות $w(0)=\sqrt2$ ו-$w(1)=\sqrt{1+e^2}$.
        commonWrong:
          - value: 13.177499
            feedback: >-
              זה $\pi\int_0^1(1+e^{2x})\,dx$, בלי השורש.
            misconception: MC-c5-area-no-root
          - value: 5.398142
            feedback: >-
              זה $\pi\int_0^1e^x\,dx=\pi(e-1)$, כלומר $\sqrt{f_x^2+f_y^2}$ בלי ה-1.
            misconception: MC-c5-graph-forget-one

  - id: Q-5-exam-6
    type: exam
    title: משפט ארכימדס על הספרה
    prompt: >-
      $S_a$ היא הספרה $x^2+y^2+z^2=a^2$, $a>0$, בפרמטריזציה
      $\sigma(\varphi,\theta)=(a\sin\varphi\cos\theta,\ a\sin\varphi\sin\theta,\ a\cos\varphi)$, $0\le\varphi\le\pi$,
      $0\le\theta\le2\pi$.
    parts:
      - label: א
        points: 6
        type: open
        objectives: [OBJ-5.3-3, OBJ-5.3-1]
        prompt: >-
          הוכיחו: לכל $-a\le h_1<h_2\le a$, השטח של החלק של $S_a$ שבו $h_1\le z\le h_2$ הוא $2\pi a(h_2-h_1)$.
        solution:
          - kind: computation
            text: >-
              $\sigma_\varphi=a(\cos\varphi\cos\theta,\cos\varphi\sin\theta,-\sin\varphi)$,
              $\sigma_\theta=a(-\sin\varphi\sin\theta,\sin\varphi\cos\theta,0)$. לכן $E=a^2$, $F=0$, $G=a^2\sin^2\varphi$,
              ו-$\sqrt{EG-F^2}=a^2\sin\varphi$ (כי $\sin\varphi\ge0$).
          - kind: idea
            text: >-
              התנאי על $z=a\cos\varphi$ הוא תנאי על $\varphi$ בלבד, ולכן האזור הוא מלבן בפרמטרים, ו-$\sin\varphi\,d\varphi$
              הוא בדיוק $-d(\cos\varphi)$.
          - kind: step
            text: >-
              $\cos$ יורד על $[0,\pi]$, ולכן $h_1\le a\cos\varphi\le h_2$ אם ורק אם $\varphi_2\le\varphi\le\varphi_1$, כש-
              $\varphi_i=\arccos\frac{h_i}{a}$. (הפרמטריזציה חד-חד-ערכית פרט לקבוצה בעלת שטח אפס: הקטבים והתפר $\theta=0,2\pi$.)
          - kind: computation
            text: >-
              $$A=\int_0^{2\pi}\int_{\varphi_2}^{\varphi_1}a^2\sin\varphi\,d\varphi\,d\theta=2\pi a^2\left(\cos\varphi_2-\cos\varphi_1\right)=2\pi a^2\cdot\frac{h_2-h_1}{a}.$$
          - kind: check
            text: 'עם $h_1=-a$, $h_2=a$ מתקבל $4\pi a^2$, שטח הספרה כולה.'
          - kind: result
            text: 'השטח הוא $2\pi a(h_2-h_1)$: הוא תלוי רק ברוחב הרצועה, לא במיקומה.'
        rubric:
          - text: 'חישוב אלמנט השטח $a^2\sin\varphi$ (דרך $E,F,G$ או המכפלה הווקטורית)'
            weight: 2
          - text: 'תרגום התנאי $h_1\le z\le h_2$ לטווח של $\varphi$, עם כיוון אי-השוויונות הנכון'
            weight: 2
          - text: 'חישוב האינטגרל עד $2\pi a(h_2-h_1)$'
            weight: 1.5
          - text: 'בדיקה במקרה פרטי (הספרה כולה) או הערה על חד-חד-ערכיות הפרמטריזציה'
            weight: 0.5
      - label: ב
        points: 4
        type: numeric
        objectives: [OBJ-5.4-3, OBJ-5.4-2]
        prompt: >-
          מעטפת הומוגנית בצורת חצי הספרה העליונה של $S_1$ ($z\ge0$). מהו $\bar z$?
        answer: 0.5
        tolerance: 0.001
        correctFeedback: >-
          נכון. לפי סעיף א, כל רצועה $[z,z+dz]$ שטחה $2\pi\,dz$: המסה מפוזרת **אחיד** בגובה, ולכן $\bar z$ הוא אמצע
          הקטע $[0,1]$. בחישוב ישיר: $\iint z\,dS=\pi$ והשטח $2\pi$.
        wrongFeedback: >-
          $\bar z=\frac{\iint_Sz\,dS}{\iint_SdS}$. סעיף א אומר שהשטח מתפלג אחיד לפי $z$.
        commonWrong:
          - value: 0.375
            feedback: >-
              $\frac38$ שייך לחצי כדור **מלא**. כאן יש רק מעטפת.
            misconception: MC-c5-shell-vs-solid
          - value: 3.141593
            feedback: >-
              זה $\iint_Sz\,dS$, בלי לחלק בשטח.
            misconception: MC-c5-centroid-no-normalize
      - label: ג
        points: 5
        type: numeric
        objectives: [OBJ-5.2-2, OBJ-5.4-3]
        prompt: >-
          ועכשיו חצי הכדור **המלא** וההומוגני $x^2+y^2+z^2\le1$, $z\ge0$. מהו $\bar z$?
        answer: 0.375
        tolerance: 0.001
        correctFeedback: >-
          נכון, $\frac38$. בכדוריות: $\iiint z\,dV=\int_0^{2\pi}\int_0^{\pi/2}\int_0^1\rho\cos\varphi\cdot\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta=\frac14\cdot\frac12\cdot2\pi=\frac\pi4$,
          והנפח $\frac{2\pi}3$.
        wrongFeedback: >-
          $\bar z=\frac{\iiint z\,dV}{V}$, עם $dV=\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$ ו-$0\le\varphi\le\frac\pi2$.
        commonWrong:
          - value: 0.5
            feedback: >-
              זה $\bar z$ של המעטפת מסעיף ב. בגוף המלא חלק מהמסה קרוב למרכז, ולכן $\bar z$ נמוך יותר.
            misconception: MC-c5-shell-vs-solid
          - value: 0.785398
            feedback: >-
              זה $\frac\pi4=\iiint z\,dV$, בלי לחלק בנפח $\frac{2\pi}3$.
            misconception: MC-c5-centroid-no-normalize
          - value: 0.333333
            feedback: >-
              זה יוצא עם היעקוביאן $\rho\sin\varphi$ (במונה ובמכנה). היעקוביאן הכדורי הוא $\rho^2\sin\varphi$.
            misconception: MC-c5-spherical-jacobian
      - label: ד
        points: 5
        type: open
        objectives: [OBJ-5.4-2, OBJ-5.1-2]
        prompt: >-
          הוכיחו שלכל $g$ רציפה על $[-a,a]$ מתקיים $\iint_{S_a}g(z)\,dS=2\pi a\int_{-a}^ag(z)\,dz$, והסיקו
          ש-$\iint_{S_a}z^2\,dS=\frac{4\pi a^4}{3}$.
        solution:
          - kind: idea
            text: >-
              זו גרסה רציפה של סעיף א: האינטגרל בפרמטרים תלוי רק ב-$\varphi$, וההצבה $z=a\cos\varphi$ הופכת את
              $a^2\sin\varphi\,d\varphi$ ל-$a\,dz$.
          - kind: computation
            text: >-
              $$\iint_{S_a}g(z)\,dS=\int_0^{2\pi}\int_0^\pi g(a\cos\varphi)\,a^2\sin\varphi\,d\varphi\,d\theta=2\pi a^2\int_0^\pi g(a\cos\varphi)\sin\varphi\,d\varphi.$$
          - kind: step
            text: >-
              בהצבה $z=a\cos\varphi$, $dz=-a\sin\varphi\,d\varphi$, כש-$\varphi$ רץ מ-0 ל-$\pi$ ו-$z$ מ-$a$ ל-$-a$:
              $\int_0^\pi g(a\cos\varphi)\sin\varphi\,d\varphi=\frac1a\int_{-a}^ag(z)\,dz$.
          - kind: step
            text: 'לכן $\iint_{S_a}g(z)\,dS=2\pi a\int_{-a}^ag(z)\,dz$.'
          - kind: computation
            text: 'עם $g(z)=z^2$: $2\pi a\cdot\frac{2a^3}{3}=\frac{4\pi a^4}{3}$.'
          - kind: check
            text: >-
              עם $g=1$ מתקבל $4\pi a^2$, השטח. ומסימטריה $\iint x^2=\iint y^2=\iint z^2$, וסכומם $a^2\cdot4\pi a^2$: שוב
              $\frac{4\pi a^4}{3}$.
          - kind: result
            text: '$\iint_{S_a}g(z)\,dS=2\pi a\int_{-a}^ag(z)\,dz$, ובפרט $\iint_{S_a}z^2\,dS=\frac{4\pi a^4}{3}$.'
        rubric:
          - text: 'כתיבת האינטגרל בפרמטריזציה עם אלמנט השטח $a^2\sin\varphi$'
            weight: 1.5
          - text: 'ההצבה $z=a\cos\varphi$ עם טיפול נכון בכיוון הגבולות ובסימן'
            weight: 2
          - text: 'המסקנה הכללית והצבת $g(z)=z^2$'
            weight: 1
          - text: 'בדיקה ($g=1$ נותן את השטח, או טיעון הסימטריה)'
            weight: 0.5
