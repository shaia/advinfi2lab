  - id: Q-5.2-gauss-steps
    type: rank
    objectives: [OBJ-5.2-3]
    qualitative: true
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה ש-$I=\int_{-\infty}^\infty e^{-x^2}\,dx=\sqrt\pi$. נסמן $Q_R=[-R,R]^2$ ו-$D_R$ העיגול
      ברדיוס $R$ סביב הראשית.
    help: סדרו מהשלב הראשון לאחרון. שני שלבים שאינם תלויים זה בזה יכולים לבוא בכל סדר.
    items:
      - id: fubini
        label: 'לפי פוביני: $\left(\int_{-R}^Re^{-x^2}dx\right)^2=\iint_{Q_R}e^{-(x^2+y^2)}\,dx\,dy$'
      - id: polar
        label: 'בקוטביות: $\iint_{D_R}e^{-(x^2+y^2)}\,dx\,dy=\int_0^{2\pi}\int_0^Re^{-r^2}r\,dr\,d\theta=\pi\left(1-e^{-R^2}\right)$'
      - id: squeeze
        label: 'כי $D_R\subseteq Q_R\subseteq D_{R\sqrt2}$ והאינטגרנד חיובי: $\pi(1-e^{-R^2})\le\left(\int_{-R}^Re^{-x^2}dx\right)^2\le\pi(1-e^{-2R^2})$'
      - id: limit
        label: '$I$ מתכנס, כי $0<e^{-x^2}\le e^{1-|x|}$; לכן כש-$R\to\infty$ שני צדי הכריך נותנים $I^2=\pi$, וכי $I>0$ מתקבל $I=\sqrt\pi$'
    order: [[fubini, polar], squeeze, limit]
    correctFeedback: >-
      נכון. שימו לב לשלב הכריך: פוביני נותן ריבועים, הקוטביות נותנות עיגולים, והחיוביות של האינטגרנד מחברת
      ביניהם. השורש בסוף מוצדק כי $I>0$.
    wrongFeedback: >-
      הכריך משתמש גם בתוצאה של פוביני וגם בזו של הקוטביות, והגבול בא רק אחריו. ההתכנסות של $I$ נחוצה רק בשלב
      הגבול: היא מה שמאפשר לכתוב את הגבול של אגף האמצע כ-$I^2$.

  - id: Q-5.2-moment
    type: numeric
    objectives: [OBJ-5.2-2]
    level: exam
    prompt: >-
      "גביע הגלידה" $G$ הוא הקבוצה שבתוך הכדור $x^2+y^2+z^2\le1$ ומעל החרוט $z\ge\sqrt{x^2+y^2}$, הומוגני
      (צפיפות 1). חשבו את מומנט ההתמד שלו סביב ציר $z$, $\iiint_G(x^2+y^2)\,dV$.
    answer: 0.097278
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{4\pi}{15}-\frac{\sqrt2\,\pi}{6}\approx0.0973$. בכדוריות החרוט הוא $\varphi=\frac\pi4$, ריבוע המרחק
      מציר $z$ הוא $\rho^2\sin^2\varphi$, ועם היעקוביאן
      $$\int_0^{2\pi}\int_0^{\pi/4}\int_0^1\rho^4\sin^3\varphi\,d\rho\,d\varphi\,d\theta=\frac{2\pi}{5}\int_0^{\pi/4}\sin^3\varphi\,d\varphi.$$
      עם $\sin^3\varphi=\sin\varphi\,(1-\cos^2\varphi)$:
      $\int_0^{\pi/4}\sin^3\varphi\,d\varphi=\left[-\cos\varphi+\frac{\cos^3\varphi}{3}\right]_0^{\pi/4}=\frac23-\frac{5\sqrt2}{12}$.
    wrongFeedback: >-
      שלושה שלבים: תארו את $G$ כתיבה בכדוריות (באיזו זווית $\varphi$ נמצא החרוט?), כתבו את $x^2+y^2$, ריבוע המרחק
      מציר $z$, בכדוריות, והוסיפו את היעקוביאן $\rho^2\sin\varphi$.
    commonWrong:
      - value: 0.36806
        feedback: >-
          זה $\frac{2\pi}{5}\left(1-\frac{\sqrt2}2\right)=\iiint_G\rho^2\,dV$: לקחתם את ריבוע המרחק מהראשית. המרחק
          מציר $z$ הוא $\rho\sin\varphi$.
        misconception: MC-c5-distance-to-axis
      - value: 0.121597
        feedback: >-
          זה $\frac\pi2\left(\frac23-\frac{5\sqrt2}{12}\right)$, עם היעקוביאן $\rho\sin\varphi$ במקום
          $\rho^2\sin\varphi$.
        misconception: MC-c5-spherical-jacobian
      - value: 1.675516
        feedback: >-
          זה $\frac{8\pi}{15}$, מומנט ההתמד של כדור היחידה כולו ($0\le\varphi\le\pi$). הגביע הוא רק $0\le\varphi\le\frac\pi4$.
        misconception: MC-c5-image-guess
