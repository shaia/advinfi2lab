  - id: Q-5-review-14
    type: numeric
    objectives: [OBJ-5.4-1, OBJ-1.2-1]
    level: exam
    prompt: >-
      תיל בצורת קשת אחת של הציקלואידה $\gamma(t)=(t-\sin t,\ 1-\cos t)$, $0\le t\le2\pi$, עם צפיפות
      $\rho(x,y)=y$. מהי המסה שלו?
    answer: 10.666667
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{32}{3}$. $\|\gamma'(t)\|^2=(1-\cos t)^2+\sin^2t=2-2\cos t=4\sin^2\frac t2$, ולכן
      $\|\gamma'\|=2\sin\frac t2$ (כי $0\le\frac t2\le\pi$) ו-$y=2\sin^2\frac t2$:
      $$\int_0^{2\pi}4\sin^3\frac t2\,dt=8\int_0^\pi\sin^3s\,ds=8\cdot\frac43.$$
    wrongFeedback: >-
      חשבו את $\|\gamma'(t)\|$ בעזרת $1-\cos t=2\sin^2\frac t2$ (כמו בחישוב אורך הציקלואידה), והציבו.
    commonWrong:
      - value: 6.283185
        feedback: >-
          זה $\int_0^{2\pi}(1-\cos t)\,dt=2\pi$, בלי $\|\gamma'\|$.
        misconception: MC-c5-line-no-speed
    hints:
      - 'חזרו לשיעור 1.2 (אורך הציקלואידה) ולשיעור 5.4 (אינטגרל לפי אורך קשת).'
