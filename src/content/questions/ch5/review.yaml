        misconception: MC-c5-shell-vs-solid
      - value: 3.141593
        feedback: >-
          זה $\iiint\rho\,dV=\pi$, בלי לחלק בנפח.
        misconception: MC-c5-centroid-no-normalize
      - value: 0.5
        feedback: >-
          זה $\int_0^1\rho\,d\rho$, הממוצע של $\rho$ על הקטע $[0,1]$, בלי המשקל $\rho^2$ של היעקוביאן. קליפה ברדיוס
          $\rho$ מכילה נפח שגדל כמו $\rho^2$.
        misconception: MC-c5-forgot-jacobian
    hints:
