# Lesson 5.4 — integrals of a function over a curve and over a surface.
# Objectives (src/course.ts):
#   OBJ-5.4-1  define and compute ∫_γ ρ ds
#   OBJ-5.4-2  define and compute ∬_S ρ dS
#   OBJ-5.4-3  mass, centre of mass and average, and their independence of orientation
# Spherical angle φ is measured from the z-axis; on the unit sphere dS = sin φ dφ dθ.
chapter: 5
questions:
  - id: Q-5.4-line-def
    type: mc
    objectives: [OBJ-5.4-1]
    qualitative: true
    level: basic
    prompt: >-
      $\gamma:[a,b]\to\mathbb R^3$ מסילה רגולרית ו-$\rho$ פונקציה רציפה על התמונה שלה. מהו $\int_\gamma\rho\,ds$?
    choices:
      - text: '$\int_a^b\rho(\gamma(t))\,\|\gamma''(t)\|\,dt$'
        correct: true
        feedback: >-
          נכון. $ds=\|\gamma'(t)\|\,dt$ הוא אורך הקטע הקטן במסילה, כמו בנוסחת אורך הקשת (שיעור 1.2). עם $\rho=1$
          מתקבל האורך של $\gamma$.
      - text: '$\int_a^b\rho(\gamma(t))\,dt$'
        feedback: >-
          זה תלוי במהירות: אם עוברים את אותה מסילה פי 2 לאט, $\int\rho(\gamma(t))\,dt$ גדל פי 2. עם $\rho=1$ זה
          נותן את אורך קטע הפרמטר, לא את אורך המסילה.
        misconception: MC-c5-line-no-speed
      - text: '$\int_a^b\rho(\gamma(t))\,\|\gamma''(t)\|^2\,dt$'
        feedback: >-
          עם $\rho=1$ זה אינו אורך: למעגל ברדיוס $r$ מתקבל $2\pi r^2$ במקום $2\pi r$. אלמנט האורך הוא $\|\gamma'\|$,
          לא ריבועו.
        misconception: MC-c5-line-no-speed

  - id: Q-5.4-segment
    type: numeric
    objectives: [OBJ-5.4-1]
    level: basic
    prompt: >-
      $\gamma$ הקטע מ-$(0,0)$ ל-$(1,2)$ במישור. חשבו את $\int_\gamma(x+y)\,ds$.
    answer: 3.354102
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{3\sqrt5}{2}$. עם $\gamma(t)=(t,2t)$, $0\le t\le1$: $\|\gamma'\|=\sqrt5$ ו-
      $\int_0^1 3t\sqrt5\,dt=\frac{3\sqrt5}{2}$.
    wrongFeedback: >-
      פרמטרו את הקטע, חשבו את $\|\gamma'(t)\|$, והציבו.
    commonWrong:
      - value: 1.5
        feedback: >-
          זה $\int_0^13t\,dt$, בלי $\|\gamma'\|=\sqrt5$. בדיקה: $\int_\gamma1\,ds$ צריך לתת את אורך הקטע, $\sqrt5$.
        misconception: MC-c5-line-no-speed

  - id: Q-5.4-surface-def
    type: mc
    objectives: [OBJ-5.4-2]
    qualitative: true
    level: basic
    prompt: >-
      $\sigma:D\to\mathbb R^3$ פרמטריזציה רגולרית וחד-חד-ערכית של $S$, ו-$\rho$ רציפה על $S$. מהו
      $\iint_S\rho\,dS$?
    choices:
      - text: '$\iint_D\rho(\sigma(u,v))\,\|\sigma_u\times\sigma_v\|\,du\,dv$'
        correct: true
        feedback: >-
          נכון. $dS=\|\sigma_u\times\sigma_v\|\,du\,dv=\sqrt{EG-F^2}\,du\,dv$ (שיעור 5.3); עם $\rho=1$ מתקבל השטח.
      - text: '$\iint_D\rho(\sigma(u,v))\,du\,dv$'
        feedback: >-
          חסר אלמנט השטח. בספרת היחידה עם $\rho=1$ זה נותן $2\pi^2$, שטח מלבן הפרמטרים, ולא $4\pi$.
        misconception: MC-c5-surface-no-dS
      - text: '$\iint_D\rho(\sigma(u,v))\,(EG-F^2)\,du\,dv$'
        feedback: >-
          $EG-F^2$ הוא ריבוע אלמנט השטח. צריך $\sqrt{EG-F^2}$.
        misconception: MC-c5-area-no-root
      - text: '$\iint_D\rho(\sigma(u,v))\,\|\sigma_u\|\,\|\sigma_v\|\,du\,dv$'
        feedback: >-
          זה נכון רק כש-$F=0$. בכלל, $\|\sigma_u\times\sigma_v\|=\|\sigma_u\|\|\sigma_v\|\sin\alpha$.
        misconception: MC-c5-area-ignore-F

  - id: Q-5.4-average-circle
    type: numeric
    objectives: [OBJ-5.4-3]
    level: basic
    prompt: >-
      הממוצע של פונקציה $f$ על מסילה $\gamma$ באורך $L$ הוא $\frac1L\int_\gamma f\,ds$. מהו הממוצע של הפונקציה
      $x^2$ על המעגל $x^2+y^2=4$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\int_\gamma x^2\,ds=\int_0^{2\pi}4\cos^2t\cdot2\,dt=8\pi$, אורך המעגל $4\pi$, והממוצע $\frac{8\pi}{4\pi}=2$.
      בדיקה בלי חישוב: מסימטריה הממוצע של $x^2$ שווה לזה של $y^2$, וסכומם $4$.
    wrongFeedback: >-
      ממוצע הוא $\frac{1}{L}\int_\gamma f\,ds$, כש-$L$ אורך המסילה.
    commonWrong:
      - value: 25.132741
        feedback: >-
          זה $8\pi=\int_\gamma x^2\,ds$, בלי לחלק באורך המסילה.
        misconception: MC-c5-centroid-no-normalize
      - value: 4
        feedback: >-
          חילקתם $\int_\gamma x^2\,ds=8\pi$ באורך קטע הפרמטר, $2\pi$, ולא באורך המעגל, $4\pi$. המונה והמכנה צריכים
          אותה מידה: $ds$ בשניהם.
        misconception: MC-c5-centroid-no-normalize

  - id: Q-5.4-helix
    type: numeric
    objectives: [OBJ-5.4-1, OBJ-5.4-3]
    level: mid
    prompt: >-
      תיל בצורת הסליל $\gamma(t)=(\cos t,\ \sin t,\ t)$, $0\le t\le2\pi$, עם צפיפות $\rho(x,y,z)=z$. מהי המסה
      שלו?
    answer: 27.915457
    tolerance: 0.001
    correctFeedback: >-
      נכון, $2\sqrt2\,\pi^2$. $\|\gamma'(t)\|=\|(-\sin t,\cos t,1)\|=\sqrt2$, ולכן
      $\int_0^{2\pi}t\sqrt2\,dt=\sqrt2\cdot2\pi^2$.
    wrongFeedback: >-
      המסה היא $\int_\gamma\rho\,ds=\int_0^{2\pi}\rho(\gamma(t))\|\gamma'(t)\|\,dt$.
    commonWrong:
      - value: 19.739209
        feedback: >-
          זה $2\pi^2=\int_0^{2\pi}t\,dt$, בלי $\|\gamma'\|=\sqrt2$.
        misconception: MC-c5-line-no-speed

  - id: Q-5.4-reverse
    type: twotier
    objectives: [OBJ-5.4-1, OBJ-5.4-3]
    qualitative: true
    level: mid
    prompt: >-
      $\tilde\gamma(t)=\gamma(a+b-t)$, $t\in[a,b]$, עוברת על אותה מסילה בכיוון ההפוך. האם
      $\int_{\tilde\gamma}\rho\,ds=-\int_\gamma\rho\,ds$ לכל $\rho$ רציפה?
    choices:
      - text: לא, שני האינטגרלים שווים
        correct: true
        feedback: >-
          נכון. אינטגרל לפי אורך קשת אינו תלוי בכיוון, ולכן גם מסה וממוצע לא.
      - text: כן
        feedback: >-
          $ds$ הוא אורך, ואורך אינו מחליף סימן. עם $\rho=1$ שני האגפים הם אורך המסילה, ואורך אינו שלילי.
        misconception: MC-c5-scalar-orientation
    reasons:
      - text: '$\|\tilde\gamma''(t)\|=\|\gamma''(a+b-t)\|$; ההצבה $s=a+b-t$ הופכת את הגבולות וגם נותנת $dt=-ds$, ושני הסימנים מתבטלים'
        correct: true
        feedback: >-
          בדיוק. בניסוח כללי: בהחלפת פרמטר $h$ מופיע $|h'|$, עם ערך מוחלט, ולכן הכיוון לא משנה.
      - text: 'בהצבה $s=a+b-t$ הגבולות מתחלפים, ולכן מופיע מינוס'
        feedback: >-
          הגבולות מתחלפים, אבל גם $dt=-ds$: המינוס השני מבטל את הראשון. בניגוד ל-$\gamma'$, האורך $\|\gamma'\|$ לא
          החליף סימן.
        misconception: MC-c5-scalar-orientation
      - text: '$ds=\gamma''(t)\,dt$, ו-$\tilde\gamma''$ הפוך בסימן ל-$\gamma''$'
        feedback: >-
          $\gamma'(t)\,dt$ הוא וקטור, ולא אלמנט האורך. אלמנט האורך הוא $\|\gamma'(t)\|\,dt$, והוא אינו שלילי.
        misconception: MC-c5-scalar-orientation

  - id: Q-5.4-reparam
    type: mc
    objectives: [OBJ-5.4-1]
    qualitative: true
    level: mid
    prompt: >-
      $\tilde\gamma=\gamma\circ h$, כש-$h:[c,d]\to[a,b]$ גזירה ברציפות, חד-חד-ערכית ועל, ו-$h'\neq0$. למה
      $\int_{\tilde\gamma}\rho\,ds=\int_\gamma\rho\,ds$?
    choices:
      - text: '$\|\tilde\gamma''(s)\|=\|\gamma''(h(s))\|\,|h''(s)|$, וזה בדיוק הגורם בהצבה $t=h(s)$'
        correct: true
        feedback: >-
          נכון. זו נוסחת החלפת המשתנים בממד אחד, והיא נותנת אותו אינטגרל בין ש-$h$ עולה ובין שהיא יורדת: הערך
          המוחלט הוא מה שהופך את התוצאה לבלתי תלויה בכיוון.
      - text: 'כי $\|\tilde\gamma''\|=\|\gamma''\|$ בכל החלפת פרמטר, ולכן האינטגרנד לא משתנה'
        feedback: >-
          המהירות משתנה: אם $h(s)=2s$, אז $\|\tilde\gamma'\|=2\|\gamma'\|$. מה שנשמר הוא האינטגרל, כי התחום
          מתקצר באותו יחס.
        misconception: MC-c5-line-no-speed
      - text: 'כי $h''>0$ תמיד בהחלפת פרמטר, ולכן ההצבה $t=h(s)$ לא הופכת גבולות'
        feedback: >-
          $h$ יכולה להיות יורדת, כמו בהיפוך כיוון. גם אז האינטגרל לא משתנה, בזכות הערך המוחלט $|h'|$.
        misconception: MC-c5-scalar-orientation

  - id: Q-5.4-sphere-z2
    type: numeric
    objectives: [OBJ-5.4-2]
    level: mid
    prompt: >-
      חשבו את $\iint_Sz^2\,dS$, כש-$S$ ספרת היחידה.
    answer: 4.18879
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{4\pi}{3}$. בכדוריות: $\int_0^{2\pi}\int_0^\pi\cos^2\varphi\,\sin\varphi\,d\varphi\,d\theta=2\pi\cdot\frac23$.
      ובלי חישוב: מסימטריה $\iint x^2=\iint y^2=\iint z^2$, וסכומם $\iint_S1\,dS=4\pi$.
    wrongFeedback: >-
      על ספרת היחידה $z=\cos\varphi$ ו-$dS=\sin\varphi\,d\varphi\,d\theta$.
    commonWrong:
      - value: 9.869604
        feedback: >-
          זה $\pi^2=\int_0^{2\pi}\int_0^\pi\cos^2\varphi\,d\varphi\,d\theta$, בלי $\sin\varphi$ של אלמנט השטח.
        misconception: MC-c5-surface-no-dS

  - id: Q-5.4-triangle
    type: numeric
    objectives: [OBJ-5.4-2]
    level: mid
    prompt: >-
      $S$ הוא החלק של המישור $x+y+z=1$ שבאוקטנט הראשון ($x,y,z\ge0$). חשבו את $\iint_Sz\,dS$.
    answer: 0.288675
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{\sqrt3}{6}$. כגרף $z=1-x-y$ מעל המשולש $T$: $dS=\sqrt{1+1+1}\,dx\,dy=\sqrt3\,dx\,dy$, ו-
      $\sqrt3\iint_T(1-x-y)\,dx\,dy=\sqrt3\cdot\frac16$.
    wrongFeedback: >-
      כתבו את $S$ כגרף מעל המשולש $x,y\ge0$, $x+y\le1$, ו-$dS=\sqrt{1+f_x^2+f_y^2}\,dx\,dy$.
    commonWrong:
      - value: 0.166667
        feedback: >-
          זה $\iint_T(1-x-y)\,dx\,dy$, הנפח של הפירמידה, בלי הגורם $\sqrt3$ של אלמנט השטח.
        misconception: MC-c5-surface-no-dS

  - id: Q-5.4-symmetry
    type: multi
    objectives: [OBJ-5.4-2]
    qualitative: true
    level: mid
    prompt: >-
      $S$ ספרת היחידה. אילו מהאינטגרלים הבאים שווים ל-0? סמנו את כולם.
    choices:
      - text: '$\iint_Sx\,dS$'
        correct: true
        feedback: >-
          נכון. השיקוף $x\mapsto-x$ שומר על הספרה ועל $dS$, ו-$x$ אי-זוגית ביחס אליו.
      - text: '$\iint_Sxy\,dS$'
        correct: true
        feedback: >-
          נכון. $xy$ אי-זוגית ביחס ל-$x\mapsto-x$ (גם ביחס ל-$y\mapsto-y$).
      - text: '$\iint_Sz^3\,dS$'
        correct: true
        feedback: >-
          נכון. $z^3$ אי-זוגית ביחס ל-$z\mapsto-z$.
      - text: '$\iint_Sx^2\,dS$'
        feedback: >-
          $x^2\ge0$ ואינה אפס זהותית, ולכן האינטגרל חיובי: $\frac{4\pi}3$. סימטריה מאפסת רק פונקציה אי-זוגית.
        misconception: MC-c5-symmetry-kills-all
      - text: '$\iint_S|z|\,dS$'
        feedback: >-
          $|z|$ זוגית ואי-שלילית. שני החצאים תורמים אותו ערך חיובי, ולכן האינטגרל חיובי.
        misconception: MC-c5-symmetry-kills-all

  - id: Q-5.4-normal-flip
    type: twotier
    objectives: [OBJ-5.4-2, OBJ-5.4-3]
    qualitative: true
    level: mid
    prompt: >-
      $S$ ספרה עם צפיפות $\rho$. מחליפים את הנורמל מהחיצוני לפנימי (למשל בהחלפת סדר הפרמטרים). האם המסה
      $\iint_S\rho\,dS$ משתנה?
    choices:
      - text: לא
        correct: true
        feedback: נכון. המסה, מרכז המסה והממוצע אינם תלויים בכיוון.
      - text: כן, היא מחליפה סימן
        feedback: >-
          מסה של ספרה עם $\rho>0$ אינה יכולה להיות שלילית. מה שמחליף סימן עם הנורמל הוא $\sigma_u\times\sigma_v$,
          לא האורך שלו.
        misconception: MC-c5-scalar-orientation
    reasons:
      - text: '$dS=\|\sigma_u\times\sigma_v\|\,du\,dv$ תלוי רק באורך של המכפלה הווקטורית, ו-$\|\sigma_v\times\sigma_u\|=\|\sigma_u\times\sigma_v\|$'
        correct: true
        feedback: >-
          בדיוק. ובהחלפת פרמטרים כללית מופיע $|\det D\psi|$, עם ערך מוחלט.
      - text: 'החלפת סדר הפרמטרים היא העתקה עם דטרמיננטה מינוס 1, וזו נכנסת לאינטגרל'
        feedback: >-
          לנוסחת החלפת המשתנים נכנס $|\det D\psi|=1$. הדטרמיננטה עם הסימן אינה מקדם שטח.
        misconception: MC-c5-signed-jacobian
      - text: 'בספרה הנורמל הפנימי והחיצוני נותנים אותו דבר רק כש-$\rho$ קבועה'
        feedback: >-
          הכיוון לא נכנס לאינטגרל לפי שטח בכלל, לכל $\rho$. הוא משנה רק באינטגרל שבו מופיע הנורמל עצמו, ולא רק
          האורך של $\sigma_u\times\sigma_v$.
        misconception: MC-c5-scalar-orientation

  - id: Q-5.4-hemisphere
    type: numeric
    objectives: [OBJ-5.4-3]
    level: mid
    prompt: >-
      מעטפת דקה הומוגנית בצורת חצי הספרה העליונה $x^2+y^2+z^2=1$, $z\ge0$. מהו $\bar z$, הגובה של מרכז המסה?
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\iint_Sz\,dS=\int_0^{2\pi}\int_0^{\pi/2}\cos\varphi\sin\varphi\,d\varphi\,d\theta=\pi$, השטח $2\pi$, ולכן
      $\bar z=\frac12$. מרכז המסה אינו על המשטח עצמו, וזה תקין.
    wrongFeedback: >-
      $\bar z=\frac{\iint_Sz\,dS}{\iint_S1\,dS}$, ו-$dS=\sin\varphi\,d\varphi\,d\theta$ על ספרת היחידה.
    commonWrong:
      - value: 0.375
        feedback: >-
          $\frac38$ הוא מרכז המסה של חצי כדור **מלא**, אינטגרל לפי נפח. כאן המסה כולה על המעטפת, רחוק יותר מהמרכז.
        misconception: MC-c5-shell-vs-solid
      - value: 3.141593
        feedback: >-
          זה $\iint_Sz\,dS=\pi$, בלי לחלק בשטח $2\pi$. בדיקה: $\bar z$ חייב להיות בין 0 ל-1.
        misconception: MC-c5-centroid-no-normalize

  - id: Q-5.4-semicircle
    type: numeric
    objectives: [OBJ-5.4-3, OBJ-5.4-1]
    level: mid
    prompt: >-
      תיל הומוגני בצורת חצי המעגל $x^2+y^2=1$, $y\ge0$. מהו $\bar y$ של מרכז המסה?
    answer: 0.63662
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac2\pi$. $\int_\gamma y\,ds=\int_0^\pi\sin t\,dt=2$ ואורך התיל $\pi$.
    wrongFeedback: >-
      $\bar y=\frac{\int_\gamma y\,ds}{\int_\gamma ds}$, עם $\gamma(t)=(\cos t,\sin t)$, $0\le t\le\pi$.
    commonWrong:
      - value: 0.424413
        feedback: >-
          $\frac{4}{3\pi}$ הוא מרכז המסה של חצי **עיגול** מלא (אינטגרל כפול). כאן זה תיל, אינטגרל לפי אורך קשת.
        misconception: MC-c5-shell-vs-solid
      - value: 2
        feedback: >-
          זה $\int_\gamma y\,ds$, בלי לחלק באורך $\pi$. מרכז המסה חייב להיות בין 0 ל-1.
        misconception: MC-c5-centroid-no-normalize

  - id: Q-5.4-sphere-mass
    type: numeric
    objectives: [OBJ-5.4-2]
    level: mid
    prompt: >-
      לספרת היחידה צפיפות ששווה למרחק מציר $z$, $\rho=\sqrt{x^2+y^2}$. מהי המסה שלה?
    answer: 9.869604
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\pi^2$. על ספרת היחידה $\sqrt{x^2+y^2}=\sin\varphi$, ולכן
      $\int_0^{2\pi}\int_0^\pi\sin\varphi\cdot\sin\varphi\,d\varphi\,d\theta=2\pi\cdot\frac\pi2$.
    wrongFeedback: >-
      כתבו את $\rho$ ואת $dS$ בכדוריות: שניהם תורמים $\sin\varphi$.
    commonWrong:
      - value: 12.566371
        feedback: >-
          זה $4\pi=\iint\sin\varphi\,d\varphi\,d\theta$: הצפיפות $\sin\varphi$ בלי אלמנט השטח, שתורם עוד
          $\sin\varphi$. (אותו מספר יוצא אם לוקחים את המרחק מהראשית, 1, במקום המרחק מציר $z$: זה השטח.)
        misconception: MC-c5-surface-no-dS

  - id: Q-5.4-cone-shell
    type: numeric
    objectives: [OBJ-5.4-2, OBJ-5.4-3]
    level: exam
    prompt: >-
      $S$ הוא משטח סגור והומוגני שמורכב משני חלקים: מעטפת החרוט $z=\sqrt{x^2+y^2}$, $0\le z\le1$, והמכסה, העיגול
      $x^2+y^2\le1$ במישור $z=1$. מהו $\bar z$, הגובה של מרכז המסה של $S$?
    answer: 0.804738
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{1+\sqrt2}{3}\approx0.8047$. אינטגרל על משטח שמורכב מחלקים הוא סכום האינטגרלים על החלקים.
      מעטפת החרוט כגרף: $f_x^2+f_y^2=1$, כלומר $dS=\sqrt2\,dx\,dy$, ולכן
      $\iint z\,dS=\sqrt2\int_0^{2\pi}\int_0^1r\cdot r\,dr\,d\theta=\frac{2\sqrt2\,\pi}{3}$ והשטח $\sqrt2\,\pi$. במכסה
      $z=1$: $\iint z\,dS=\pi$ והשטח $\pi$. לכן
      $$\bar z=\frac{\frac{2\sqrt2\pi}{3}+\pi}{\sqrt2\,\pi+\pi}=\frac{2\sqrt2+3}{3(\sqrt2+1)}=\frac{1+\sqrt2}{3}.$$
    wrongFeedback: >-
      חשבו בנפרד, לכל חלק, את $\iint z\,dS$ ואת השטח; אחר כך חברו מונים ומכנים. את המעטפת כתבו כגרף מעל עיגול
      היחידה ועברו לקוטביות.
    commonWrong:
      - value: 0.666667
        feedback: >-
          $\frac23$ הוא $\bar z$ של מעטפת החרוט לבדה: שכחתם את המכסה. המשטח $S$ כולל את שני החלקים.
        misconception: MC-c5-piecewise-forgot-piece
      - value: 0.833333
        feedback: >-
          $\frac56$ יוצא אם שוכחים את $\sqrt2$ של אלמנט השטח על המעטפת (ואז לשני החלקים שטח $\pi$), וגם אם לוקחים
          ממוצע פשוט של $\frac23$ ושל 1. המשקלות הם השטחים, $\sqrt2\,\pi$ ו-$\pi$.
        misconception: MC-c5-surface-no-dS
      - value: 6.103515
        feedback: >-
          זה $\frac{2\sqrt2\pi}{3}+\pi=\iint_Sz\,dS$, בלי לחלק בשטח הכולל.
        misconception: MC-c5-centroid-no-normalize
