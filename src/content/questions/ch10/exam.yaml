# Chapter 10 exam questions — original, in the style of an 80316 final (not taken from a real exam).
# Short questions (part א of the final): 7 points, a verdict plus an open justification.
# Long questions (parts ב, ג of the final): 20 points in 2–4 parts, each with at least one open part graded against a
# model solution and a rubric. Every number was recomputed (scratchpad ch10/nums.ts, nums2.ts).
chapter: 10
questions:
  - id: Q-10-exam-1
    type: exam
    title: הטלה על קוסינוסים
    prompt: >-
      ב-$H[-\pi,\pi]$ עם $\langle f,g\rangle=\int_{-\pi}^{\pi}fg$ נתון תת-המרחב
      $Y=\mathrm{span}\{1,\cos x,\cos2x,\dots,\cos5x\}$ והפונקציה $f(x)=x^3-2x$. האם ייתכן ש-$P_Yf\ne0$?
    parts:
      - label: א
        points: 2
        type: mc
        objectives: [OBJ-10.1-1]
        qualitative: true
        prompt: >-
          מה התשובה?
        choices:
          - text: 'לא: $P_Yf=0$'
            correct: true
            feedback: 'נכון. $f$ אי-זוגית ולכן ניצבת לכל פונקציה זוגית, ובפרט לכל $Y$.'
          - text: 'כן: $P_Yf$ הוא הסכום החלקי $S_5f$, ואינו אפס'
            feedback: >-
              $S_5f$ כולל גם סינוסים, ו-$Y$ לא. ההטלה על $Y$ לוקחת רק את המקדמים $a_0,\dots,a_5$, וכולם אפס כי $f$ אי-זוגית.
            misconception: MC-c10-parity-swapped
          - text: 'כן: רק $a_0=0$, ושאר המקדמים $a_k$ לא בהכרח'
            feedback: >-
              $f(x)\cos kx$ אי-זוגית לכל $k$, ולא רק ל-$k=0$, ולכן כל ה-$a_k$ מתאפסים.
            misconception: MC-c10-parity-swapped
      - label: ב
        points: 5
        type: open
        objectives: [OBJ-10.1-2, OBJ-10.1-1]
        prompt: >-
          נמקו את התשובה, וחשבו גם את $\|f-P_Yf\|$ במונחי $\|f\|$.
        solution:
          - kind: given
            text: '$f(x)=x^3-2x$, ו-$Y$ נפרש על ידי $1,\cos x,\dots,\cos5x$.'
          - kind: idea
            text: >-
              הפונקציות הפורשות את $Y$ ניצבות זו לזו, ולכן ההטלה היא סכום הרכיבים בכיווניהן. כל רכיב הוא מכפלה פנימית
              של פונקציה אי-זוגית בזוגית.
          - kind: theorem
            text: >-
              במערכת אורתוגונלית $u_0,\dots,u_5$ (שיעור 9.3):
              $P_Yf=\sum_{k=0}^5\frac{\langle f,u_k\rangle}{\|u_k\|^2}u_k$. כאן $u_0=1$, $u_k=\cos kx$, ו-$\int\cos kx\cos mx=0$ ל-$k\ne m$.
          - kind: computation
            text: >-
              $f(-x)=-x^3+2x=-f(x)$, ו-$\cos kx$ זוגית, ולכן $f(x)\cos kx$ אי-זוגית ו-$\langle f,u_k\rangle=\int_{-\pi}^{\pi}f(x)\cos kx\,dx=0$
              לכל $k=0,\dots,5$.
          - kind: step
            text: 'כל המקדמים בנוסחת ההטלה אפס, ולכן $P_Yf=0$. בפרט $f\perp Y$.'
          - kind: computation
            text: '$\|f-P_Yf\|=\|f-0\|=\|f\|$: כל $f$ נמצאת "מחוץ" ל-$Y$, ואף איבר של $Y$ אינו קרוב אליה יותר מ-0.'
          - kind: result
            text: 'לא ייתכן: $P_Yf=0$ ו-$\|f-P_Yf\|=\|f\|$.'
        rubric:
          - text: 'נוסחת ההטלה במערכת אורתוגונלית (או אפיון ההטלה בתנאי הניצבות)'
            weight: 2
          - text: 'הוכחה ש-$\int f\cos kx=0$ לכל $k$ מאי-זוגיות האינטגרנד, כולל $k=0$'
            weight: 2
          - text: 'המסקנה $P_Yf=0$ והמרחק $\|f-P_Yf\|=\|f\|$'
            weight: 1

  - id: Q-10-exam-2
    type: exam
    title: טור שמקדמיו דועכים לאט
    prompt: >-
      האם קיימת $f\in H[-\pi,\pi]$ שמקדמי פורייה שלה הם $a_n=0$ לכל $n\ge0$ ו-$b_n=\frac1{\ln(n+1)}$ לכל $n\ge1$?
    parts:
      - label: א
        points: 2
        type: mc
        objectives: [OBJ-10.2-3]
        qualitative: true
        prompt: >-
          מה התשובה?
        choices:
          - text: 'לא'
            correct: true
            feedback: 'נכון. סכום ריבועי המקדמים מתבדר, ובסל אוסר זאת.'
          - text: 'כן, כי $b_n\to0$ כפי שרימן-לבג דורשת'
            feedback: >-
              רימן-לבג היא תנאי הכרחי חלש. בסל דורש יותר: $\sum b_n^2<\infty$.
            misconception: MC-c10-coeffs-to-zero-enough
          - text: 'כן, כי הטור $\sum\frac{\sin nx}{\ln(n+1)}$ מתכנס בכל נקודה'
            feedback: >-
              גם אם הטור מתכנס בכל נקודה, זה לא הופך אותו לטור פורייה של פונקציה ב-$H$.
            misconception: MC-c10-convergent-series-is-fourier
      - label: ב
        points: 5
        type: open
        objectives: [OBJ-10.2-3, OBJ-10.2-1]
        prompt: >-
          הוכיחו את התשובה.
        solution:
          - kind: goal
            text: 'אין $f\in H$ עם $b_n=\frac1{\ln(n+1)}$.'
          - kind: idea
            text: >-
              אילו הייתה, בסל היה נותן $\sum b_n^2<\infty$. מראים ש-$b_n^2\ge\frac1n$, ולכן הסכום מתבדר.
          - kind: theorem
            text: 'בסל: לכל $f\in H$, $\frac{a_0^2}2+\sum_{n\ge1}(a_n^2+b_n^2)\le\frac1\pi\int_{-\pi}^{\pi}f^2<\infty$.'
          - kind: step
            text: >-
              טענה: $\ln(1+t)\le\sqrt t$ לכל $t\ge0$. נגדיר $h(t)=\sqrt t-\ln(1+t)$; אז $h(0)=0$ ו-
              $h'(t)=\frac1{2\sqrt t}-\frac1{1+t}=\frac{(\sqrt t-1)^2}{2\sqrt t\,(1+t)}\ge0$ ל-$t>0$, ולכן $h\ge0$.
          - kind: computation
            text: 'לכן $b_n^2=\frac1{\ln^2(n+1)}\ge\frac1n$ לכל $n\ge1$, ו-$\sum b_n^2\ge\sum\frac1n=\infty$.'
          - kind: step
            text: 'זה סותר את בסל, ולכן אין $f\in H$ כזו.'
          - kind: result
            text: 'לא קיימת: בסל דורש $\sum b_n^2<\infty$, וכאן $\sum\frac1{\ln^2(n+1)}=\infty$.'
        rubric:
          - text: 'ניסוח נכון של בסל, עם $\frac1\pi\int f^2$ באגף הימני'
            weight: 1
          - text: 'השוואה מוכחת של $b_n^2$ לטור מתבדר (למשל $\ln(n+1)\le\sqrt n$, או טיעון שקול)'
            weight: 3
          - text: 'המסקנה שהסכום מתבדר והסתירה לבסל'
            weight: 1

  - id: Q-10-exam-3
    type: exam
    title: התכנסות בממוצע בלי התכנסות בנקודה
    prompt: >-
      האם ייתכן ש-$f\in H[-\pi,\pi]$ מקיימת $\|f-S_Nf\|\to0$, ובכל זאת יש נקודה $x_0$ שבה $S_Nf(x_0)\not\to f(x_0)$?
    parts:
      - label: א
        points: 2
        type: mc
        objectives: [OBJ-10.5-3]
        qualitative: true
        prompt: >-
          מה התשובה?
        choices:
          - text: 'כן'
            correct: true
            feedback: 'נכון. הנורמה של $H$ לא רואה ערך בנקודה בודדת.'
          - text: 'לא, כי התכנסות בממוצע ריבועי גוררת התכנסות נקודתית'
            feedback: >-
              הגרירה נכונה רק בכיוון ההפוך: מהתכנסות במידה שווה נובעת התכנסות בממוצע ריבועי.
            misconception: MC-c9-L2-implies-uniform
          - text: 'לא, כי $\|f-S_Nf\|\to0$ רק לפונקציות רציפות, ושם יש גם התכנסות נקודתית'
            feedback: >-
              ההתכנסות בממוצע ריבועי חלה על כל $f\in H$, גם עם קפיצות.
            misconception: MC-c10-parseval-needs-continuity
      - label: ב
        points: 5
        type: open
        objectives: [OBJ-10.5-3, OBJ-10.5-1, OBJ-10.3-2]
        prompt: >-
          תנו דוגמה והוכיחו שהיא מקיימת את שתי הדרישות.
        solution:
          - kind: idea
            text: >-
              בוחרים פונקציה עם קפיצה, ובנקודת הקפיצה נותנים לה ערך שאינו הממוצע של הגבולות החד-צדדיים. הטור "לא יודע"
              מה הערך הזה.
          - kind: given
            text: '$f(x)=1$ ל-$0\le x<\pi$, $f(x)=-1$ ל-$-\pi\le x<0$; בפרט $f(0)=1$.'
          - kind: computation
            text: >-
              $f$ אי-זוגית פרט לנקודה 0, וערך בנקודה אחת לא משנה אינטגרל: $a_n=0$, ו-
              $b_n=\frac2\pi\int_0^\pi\sin nx\,dx=\frac{2(1-(-1)^n)}{\pi n}$, כלומר $\frac4{\pi n}$ ל-$n$ אי-זוגי ו-0 לזוגי.
          - kind: step
            text: 'לכן $S_Nf(0)=\sum b_n\sin0=0$ לכל $N$, ו-$S_Nf(0)\to0\ne1=f(0)$.'
          - kind: theorem
            text: 'משפט ההתכנסות בממוצע ריבועי (שיעור 10.5): לכל $f\in H$, $\|f-S_Nf\|\to0$. $f$ חסומה עם מספר סופי של קפיצות, ולכן $f\in H$.'
          - kind: check
            text: >-
              אפשר גם ישירות: $\frac1\pi\|f-S_Nf\|^2=2-\sum_{n\le N}b_n^2\to0$, כי מפרסבל $\sum b_n^2=\frac1\pi\int f^2=2$.
          - kind: result
            text: 'כן. לגל הריבועי עם $f(0)=1$: $\|f-S_Nf\|\to0$ אבל $S_Nf(0)=0$ לכל $N$.'
        rubric:
          - text: 'דוגמה מפורשת שבה הערך בנקודה שונה מגבול הסכומים החלקיים שם'
            weight: 1
          - text: 'חישוב (או נימוק) ש-$S_Nf(x_0)$ שואף לערך אחר מ-$f(x_0)$'
            weight: 2
          - text: 'הצדקה של $\|f-S_Nf\|\to0$: המשפט לכל $f\in H$, או פרסבל'
            weight: 2

  - id: Q-10-exam-4
    type: exam
    title: קירוב טריגונומטרי של המשכה לא רציפה
    prompt: >-
      $f$ היא ההמשכה המחזורית ב-$2\pi$ של $x^2$ מהקטע $[0,2\pi)$ לכל $\mathbb R$. האם קיימת סדרת פולינומים טריגונומטריים
      $T_k$ כך ש-$T_k\to f$ במידה שווה על $\mathbb R$?
    parts:
      - label: א
        points: 2
        type: mc
        objectives: [OBJ-10.6-1]
        qualitative: true
        prompt: >-
          מה התשובה?
        choices:
          - text: 'לא'
            correct: true
            feedback: 'נכון. $f$ קופצת ב-0 (ובכל $2\pi k$), וגבול במידה שווה של פונקציות רציפות רציף.'
          - text: 'כן, לפי הגרסה הטריגונומטרית של ויירשטראס, כי $x^2$ רציפה'
            feedback: >-
              הגרסה הטריגונומטרית דורשת פונקציה רציפה על המעגל. $x^2$ רציפה על $[0,2\pi)$, אבל ההמשכה המחזורית שלה קופצת.
            misconception: MC-c10-trig-approx-nonperiodic
          - text: 'כן, כי $x^2$ חלקה, ולכן טור פורייה שלה מתכנס במידה שווה'
            feedback: >-
              מה שקובע הוא ההמשכה המחזורית: $f(0)=0$ אבל $f(x)\to4\pi^2$ כש-$x\to0^-$.
            misconception: MC-c10-smooth-on-interval-uniform
      - label: ב
        points: 5
        type: open
        objectives: [OBJ-10.4-3, OBJ-10.6-1]
        prompt: >-
          הוכיחו את התשובה, והסבירו במשפט אחד למה אין סתירה למשפט הקירוב של ויירשטראס על הקטע $[0,2\pi]$.
        solution:
          - kind: goal
            text: 'אין פולינומים טריגונומטריים $T_k$ עם $\sup_{\mathbb R}|T_k-f|\to0$.'
          - kind: idea
            text: 'פולינום טריגונומטרי רציף; גבול במידה שווה של פונקציות רציפות רציף; ו-$f$ אינה רציפה ב-0.'
          - kind: step
            text: 'נניח בשלילה ש-$T_k\to f$ במידה שווה. כל $T_k$ רציף, ולכן $f$ רציפה (אינפי 2: גבול במידה שווה של רציפות).'
          - kind: computation
            text: >-
              אבל $f(0)=0^2=0$, ולכל $x\in(-2\pi,0)$, $f(x)=(x+2\pi)^2$, ולכן $\lim_{x\to0^-}f(x)=4\pi^2\ne0$. סתירה.
          - kind: check
            text: >-
              אין סתירה לוויירשטראס: על הקטע הסגור $[0,2\pi]$ הפונקציה $x^2$ היא כבר פולינום. מה שנכשל כאן הוא הקירוב
              בפונקציות **מחזוריות**, שחייבות לקבל ערכים שווים ב-0 וב-$2\pi$.
          - kind: result
            text: 'לא קיימת סדרה כזו: $f$ אינה רציפה ב-0, וגבול במידה שווה של פולינומים טריגונומטריים רציף.'
        rubric:
          - text: 'השימוש בכך שגבול במידה שווה של פונקציות רציפות הוא רציף'
            weight: 2
          - text: 'הוכחה מפורשת שההמשכה אינה רציפה ב-0 (שני הגבולות החד-צדדיים, $0$ ו-$4\pi^2$)'
            weight: 2
          - text: 'הסבר למה אין סתירה לוויירשטראס על $[0,2\pi]$ (מחזוריות מול קטע)'
            weight: 1

  - id: Q-10-exam-5
    type: exam
    title: חצי רמפה וסכום ההופכיים של הריבועים האי-זוגיים
    prompt: >-
      $f$ מחזורית ב-$2\pi$, ועל $(-\pi,\pi]$: $f(x)=0$ ל-$-\pi<x\le0$ ו-$f(x)=x$ ל-$0<x<\pi$ (ו-$f(\pi)$ כלשהו).
    parts:
      - label: א
        points: 5
        type: open
        objectives: [OBJ-10.3-2]
        prompt: >-
          נסחו משפט על התכנסות נקודתית של טור פורייה, כולל ההנחות.
        solution:
          - kind: definition
            text: >-
              $f$ מחזורית ב-$2\pi$ היא **גזירה למקוטעין** אם $[-\pi,\pi]$ מתחלק למספר סופי של קטעים, ובפנים כל קטע $f$ גזירה,
              ול-$f$ ול-$f'$ יש גבולות חד-צדדיים סופיים בקצוות הקטעים.
          - kind: theorem
            text: >-
              אם $f$ מחזורית ב-$2\pi$ וגזירה למקוטעין, אז לכל $x\in\mathbb R$
              $$S_Nf(x)\to\frac{f(x^+)+f(x^-)}2.$$
              בפרט בכל נקודת רציפות $S_Nf(x)\to f(x)$.
          - kind: check
            text: 'רציפות לבדה אינה מספיקה; וערך הפונקציה בנקודת קפיצה אינו משפיע על הגבול.'
          - kind: result
            text: 'בנקודה $x$: הממוצע של הגבולות החד-צדדיים, לכל $f$ מחזורית וגזירה למקוטעין.'
        rubric:
          - text: 'ההנחות: מחזורית, גזירה למקוטעין (עם גבולות חד-צדדיים של $f$ ושל $f''$)'
            weight: 2
          - text: 'המסקנה: התכנסות לממוצע $\frac{f(x^+)+f(x^-)}2$ בכל נקודה'
            weight: 2
          - text: 'ההבחנה בין נקודת רציפות לנקודת קפיצה'
            weight: 1

      - label: ב
        points: 6
        type: open
        objectives: [OBJ-10.1-1]
        prompt: >-
          חשבו את מקדמי פורייה $a_0$, $a_n$, $b_n$ של $f$.
        solution:
          - kind: idea
            text: '$f=0$ על חצי הקטע, ולכן כל אינטגרל מצטמצם ל-$[0,\pi]$. אין זוגיות לנצל; עושים אינטגרציה בחלקים.'
          - kind: computation
            text: '$a_0=\frac1\pi\int_0^\pi x\,dx=\frac\pi2$.'
          - kind: computation
            text: >-
              $a_n=\frac1\pi\int_0^\pi x\cos nx\,dx=\frac1\pi\left[\frac{x\sin nx}n+\frac{\cos nx}{n^2}\right]_0^\pi=\frac{(-1)^n-1}{\pi n^2}$,
              כלומר $-\frac2{\pi n^2}$ ל-$n$ אי-זוגי ו-0 ל-$n$ זוגי.
          - kind: computation
            text: >-
              $b_n=\frac1\pi\int_0^\pi x\sin nx\,dx=\frac1\pi\left[-\frac{x\cos nx}n+\frac{\sin nx}{n^2}\right]_0^\pi=\frac{(-1)^{n+1}}{n}$.
          - kind: check
            text: '$a_1=-\frac2\pi\approx-0.637$ ו-$b_2=-\frac12$, כפי שמתקבל גם בחישוב נומרי.'
          - kind: result
            text: '$a_0=\frac\pi2$, $a_n=\frac{(-1)^n-1}{\pi n^2}$, $b_n=\frac{(-1)^{n+1}}n$.'
        rubric:
          - text: '$a_0=\frac\pi2$, ובטור האיבר הקבוע $\frac\pi4$'
            weight: 1
          - text: '$a_n$ נכון, כולל ההתאפסות ל-$n$ זוגי'
            weight: 2
          - text: '$b_n$ נכון, כולל הסימן $(-1)^{n+1}$'
            weight: 2
          - text: 'אינטגרציה בחלקים מוצגת עם $\cos n\pi=(-1)^n$'
            weight: 1

      - label: ג
        points: 4
        type: numeric
        objectives: [OBJ-10.3-2]
        standalone: false
        prompt: >-
          לאיזה מספר מתכנס טור פורייה של $f$ בנקודה $x=\pi$?
        answer: 1.5707963
        tolerance: 0.001
        correctFeedback: >-
          נכון. $f(\pi^-)=\pi$ ומימין ל-$\pi$ (כמו ב-$-\pi^+$) $f=0$, והממוצע $\frac\pi2$. בדיקה מהמקדמים:
          $\frac\pi4+\sum a_n(-1)^n=\frac\pi4+\frac2\pi\sum\frac1{n^2}$ על האי-זוגיים $=\frac\pi4+\frac\pi4$.
        wrongFeedback: >-
          $f$ גזירה למקוטעין, ו-$\pi$ היא נקודת קפיצה של ההמשכה המחזורית. מהם שני הגבולות החד-צדדיים?
