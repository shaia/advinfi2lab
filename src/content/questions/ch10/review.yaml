  - id: Q-10-review-17
    type: twotier
    objectives: [OBJ-10.1-3, OBJ-10.6-4]
    qualitative: true
    level: exam
    prompt: >-
      $\sigma_Nf=\frac{S_0f+\dots+S_Nf}{N+1}$ הוא ממוצע צזרו של טור פורייה. טענה: לכל $f$ רציפה ומחזורית ב-$2\pi$ ולכל
      $N$, $\int_{-\pi}^{\pi}(f-S_Nf)^2\le\int_{-\pi}^{\pi}(f-\sigma_Nf)^2$. נכון או לא?
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. בנורמה של $H$ הסכום $S_Nf$ קרוב ל-$f$ יותר מכל פולינום טריגונומטרי ממעלה $\le N$, ו-$\sigma_Nf$ הוא אחד מהם.
      - text: לא נכון
        feedback: >-
          $S_Nf$ הוא ההטלה האורתוגונלית על $T_N$, ולכן הקירוב הטוב ביותר בנורמה הזו מכל איבר של $T_N$, כולל $\sigma_Nf$.
        misconception: MC-c9-ls-is-uniform
    reasons:
      - text: '$S_Nf$ הוא ההטלה על $T_N$, הפולינומים הטריגונומטריים ממעלה $\le N$, ו-$\sigma_Nf\in T_N$'
        correct: true
        feedback: >-
          בדיוק. בנורמת המקסימום התמונה הפוכה: שם $\sigma_Nf$ תמיד מתכנס ל-$f$, ו-$S_Nf$ לא בהכרח. כל נורמה והקירוב הטוב
          שלה.
      - text: 'לא נכון: $\sigma_Nf\to f$ במידה שווה ו-$S_Nf$ לא תמיד, ולכן $\sigma_Nf$ קרוב יותר בכל נורמה ולכל $N$'
        feedback: >-
          התכנסות במידה שווה היא תכונה של הסדרה, לא השוואה בכל $N$ ובכל נורמה. בנורמה של $H$ הסכום $S_Nf$ אופטימלי לכל $N$.
        misconception: MC-c9-ls-is-uniform
      - text: 'כי $\sigma_Nf=S_Nf$, ולכן יש שוויון'
        feedback: >-
          ל-$f=\cos x$: $S_1f=\cos x$ ו-$\sigma_1f=\frac{S_0f+S_1f}2=\frac12\cos x$. בדרך כלל יש אי-שוויון ממש.
        misconception: MC-c10-fejer-for-partial-sums
    hints:
      - 'חזרו לשיעור 10.1: הסכום החלקי כקירוב הטוב ביותר; ולשיעור 10.6: $\sigma_Nf$ כפולינום טריגונומטרי ממעלה $N$.'

  - id: Q-10-review-18
    type: twotier
    objectives: [OBJ-10.6-4, OBJ-10.6-5, OBJ-10.3-2]
    qualitative: true
    level: exam
    prompt: >-
      $f$ רציפה ומחזורית ב-$2\pi$ (לא נתון שהיא גזירה), וידוע שבנקודה $x_0$ הסדרה $S_Nf(x_0)$ מתכנסת למספר $L$. האם
      בהכרח $L=f(x_0)$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. אם $S_Nf(x_0)\to L$, גם ממוצעי צזרו $\sigma_Nf(x_0)\to L$. לפי משפט פייר $\sigma_Nf(x_0)\to f(x_0)$. לגבול
          יש ערך אחד.
      - text: לא בהכרח
        feedback: >-
          בלי גזירות אין ערובה שהטור מתכנס, אבל **אם** הוא מתכנס, הגבול נקבע: ממוצעי צזרו של סדרה מתכנסת מתכנסים לאותו
          גבול, ומשפט פייר אומר שהם מתכנסים ל-$f(x_0)$.
        misconception: MC-c10-cesaro-changes-limit
    reasons:
      - text: 'ממוצעי צזרו שומרים על גבול קיים, ולפי משפט פייר $\sigma_Nf(x_0)\to f(x_0)$'
        correct: true
        feedback: >-
          בדיוק: שני שיעורים בשורה אחת. משפט פייר לא יכול להוכיח שהטור מתכנס, אבל הוא קובע לאן, אם כן.
      - text: 'לא: $\sigma_Nf(x_0)$ ו-$S_Nf(x_0)$ יכולים להתכנס לגבולות שונים'
        feedback: >-
          כשהסדרה $S_Nf(x_0)$ מתכנסת, הממוצעים שלה מתכנסים לאותו גבול. מיצוע לא משנה גבול קיים.
        misconception: MC-c10-cesaro-changes-limit
      - text: 'כן, כי לפי משפט ההתכנסות הנקודתית הטור מתכנס ל-$f(x_0)$'
        feedback: >-
          משפט ההתכנסות הנקודתית דורש גזירות למקוטעין, ופה היא לא נתונה. הנימוק הנכון עובר דרך משפט פייר.
        misconception: MC-c10-continuity-enough-pointwise
    hints:
      - 'חזרו לשיעור 10.6: ממוצעי צזרו של סדרה מתכנסת ומשפט פייר; ולשיעור 10.3: ההנחות של משפט ההתכנסות הנקודתית.'

  - id: Q-10-review-19
    type: twotier
    objectives: [OBJ-10.5-4, OBJ-10.4-2, OBJ-10.5-2]
    qualitative: true
    level: exam
    prompt: >-
      טענה: יש קבוע $C$ כך שלכל $f$ מחזורית ב-$2\pi$, גזירה ברציפות, עם $\int_{-\pi}^{\pi}f=0$:
      $$\max_x|f(x)|\le C\left(\int_{-\pi}^{\pi}(f')^2\right)^{1/2}.$$
      נכון או לא?
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון, עם $C=\sqrt{\pi/6}$. ל-$f=\sin x$: $1\le\sqrt{\pi/6}\cdot\sqrt\pi\approx1.28$.
      - text: לא נכון
        feedback: >-
          הטור של $f$ מתכנס אליה במידה שווה, ו-$|f(x)|\le\sum\sqrt{a_n^2+b_n^2}$; קושי-שוורץ עם
          $\sum n^2(a_n^2+b_n^2)=\frac1\pi\int(f')^2$ נותן את החסם.
        misconception: MC-c10-decay-smoothness
    reasons:
      - text: '$|f(x)|\le\sum\sqrt{a_n^2+b_n^2}\le\left(\sum n^2(a_n^2+b_n^2)\right)^{1/2}\left(\sum\frac1{n^2}\right)^{1/2}$, ופרסבל ל-$f^{\prime}$'
        correct: true
        feedback: >-
          בדיוק, אותו טיעון כמו בהוכחת ההתכנסות במידה שווה (שיעור 10.4), עם פרסבל במקום בסל:
          $C=\frac{1}{\sqrt\pi}\cdot\frac{\pi}{\sqrt6}=\sqrt{\frac\pi6}$.
      - text: 'לא נכון: נורמה ריבועית לעולם לא שולטת בנורמת המקסימום, כי הנורמות אינן שקולות'
        feedback: >-
          נכון ש-$\|f\|$ לבדה לא שולטת ב-$\max|f|$. אבל כאן הנורמה הריבועית היא של **הנגזרת**, וזה מידע על דעיכת
          המקדמים: $\sum n^2(a_n^2+b_n^2)<\infty$ נותן $\sum(|a_n|+|b_n|)<\infty$.
        misconception: MC-c10-decay-smoothness
      - text: 'כן, כי לפי וירטינגר $\max|f|\le\|f\|\le\|f^{\prime}\|$'
        feedback: >-
          השלב הראשון שגוי: $\max|f|\le\|f\|$ אינו נכון באופן כללי (פונקציה עם שיא גבוה וצר). וירטינגר משווה שתי נורמות
          ריבועיות.
        misconception: MC-c9-L2-implies-uniform
    hints:
      - 'חזרו לשיעור 10.4: קושי-שוורץ בהוכחת ההתכנסות במידה שווה; ולשיעור 10.5: פרסבל ואי-שוויון וירטינגר.'
