# Lesson 2.5 (enrichment) — spherical curves and Lancret's theorem.
# Objectives (src/course.ts):
#   OBJ-2.5-1  prove that a curve is a generalized helix (the tangent makes a constant angle with a fixed direction) iff τ/κ is constant
#   OBJ-2.5-2  derive a condition on the curvature and torsion of a curve lying on a sphere
# Enrichment: no review or exam question of the chapter depends on this lesson.
# Notation as in the lesson: helix (a cos t, a sin t, ht); ρ = 1/κ, σ = 1/τ; the sphere's centre is bold c.
# Every number below was recomputed with src/math/spacecurves.ts (kappa, tau, frame).
chapter: 2
questions:
  - id: Q-2.5-helix-ratio
    type: mc
    objectives: [OBJ-2.5-1]
    level: basic
    prompt: >-
      **סליל מוכלל** הוא מסילה עם $\kappa>0$ שהמשיק שלה יוצר זווית קבועה $\theta$ עם כיוון קבוע $\mathbf u$, **הציר**:
      $\mathbf t\cdot\mathbf u=\cos\theta$ קבוע. הסליל $(a\cos t,a\sin t,ht)$ עם $a,h>0$ הוא סליל מוכלל. מה היחס
      $\frac\tau\kappa$ שלו, ומהו הציר?
    hints:
      - 'חזרו לשיעור 2.2 (העקמומיות והפיתול של סליל) ולשיעור 2.5 (משפט לנקרה).'
    choices:
      - text: '$\frac\tau\kappa=\frac ha$, והציר $(0,0,1)$'
        correct: true
        feedback: >-
          נכון. $\kappa=\frac{a}{a^2+h^2}$, $\tau=\frac{h}{a^2+h^2}$, ו-$\mathbf t\cdot(0,0,1)=\frac{h}{\sqrt{a^2+h^2}}$ קבוע:
          זה $\cos\theta$, ו-$\cot\theta=\frac ha$, כפי שמשפט לנקרה אומר.
      - text: '$\frac\tau\kappa=\frac ah$, והציר $(0,0,1)$'
        feedback: >-
          זה היחס ההפוך, $\frac\kappa\tau$. בפיתול המונה הוא $h$.
        misconception: MC-c2-lancret-ratio-inverted
      - text: '$\frac\tau\kappa=\frac{h}{\sqrt{a^2+h^2}}$, והציר $(0,0,1)$'
        feedback: >-
          זה $\cos\theta$, הקוסינוס של הזווית בין המשיק לציר. היחס $\frac\tau\kappa$ הוא $\cot\theta$.
        misconception: MC-c2-lancret-ratio-is-cos
      - text: '$\frac\tau\kappa=\frac ha$, אבל הסליל המעגלי אינו סליל מוכלל, כי $\kappa$ ו-$\tau$ שלו קבועים'
        feedback: >-
          "מוכלל" פירושו שהמושג רחב יותר, לא שהוא מוציא את המקרה הפשוט: הסליל המעגלי הוא המקרה שבו גם $\kappa$ וגם $\tau$
          קבועים, והציר שלו $(0,0,1)$.
        misconception: MC-c2-generalized-helix-constant

  - id: Q-2.5-def
    type: mc
    objectives: [OBJ-2.5-1]
    qualitative: true
    level: basic
    prompt: >-
      מתי מסילה עם $\kappa>0$ נקראת סליל מוכלל?
    choices:
      - text: 'כשיש וקטור יחידה קבוע $\mathbf u$ כך ש-$\mathbf t(s)\cdot\mathbf u$ קבוע (המשיק יוצר זווית קבועה עם כיוון קבוע)'
        correct: true
        feedback: >-
          נכון. $\mathbf u$ הוא הציר של הסליל המוכלל. בסליל המעגלי $(a\cos t,a\sin t,ht)$, $\mathbf u=(0,0,1)$ ו-$\mathbf t\cdot\mathbf u=\frac{h}{\sqrt{a^2+h^2}}$.
      - text: 'כש-$\kappa$ ו-$\tau$ קבועים'
        feedback: >-
          זה הסליל המעגלי, מקרה פרטי. סליל מוכלל דורש רק שהיחס $\frac\tau\kappa$ יהיה קבוע (משפט לנקרה): למעקה
          $(t,\cosh t,\sinh t)$ יש $\kappa=\tau=\frac{1}{2\cosh^2t}$, לא קבועות, והוא סליל מוכלל עם הציר $\mathbf e_z$.
        misconception: MC-c2-generalized-helix-constant
      - text: 'כשהמסילה מונחת על גליל מעגלי'
        feedback: >-
          לא כל מסילה על גליל מעגלי היא סליל מוכלל: ויויאני מונחת על הגליל $(x-1)^2+y^2=1$, ו-$\frac\tau\kappa$ שלה משתנה
          (דוגמה 3 בשיעור). ולהפך, סליל מוכלל לא חייב להיות על גליל מעגלי: המעקה $(t,\cosh t,\sinh t)$ מונח על הגליל מעל
          השרשרת.
        misconception: MC-c2-generalized-helix-constant
      - text: 'כשלכל $s$ יש וקטור יחידה $\mathbf u(s)$, שיכול להשתנות עם $s$, כך ש-$\mathbf b(s)\cdot\mathbf u(s)$ קבוע'
        feedback: >-
          אם $\mathbf u$ מותר להשתנות, כל מסילה מקיימת את זה (קחו $\mathbf u=\mathbf b$, ואז המכפלה $1$). ההגדרה דורשת כיוון
          **אחד** קבוע.
        misconception: MC-c2-binormal-any-perp

  - id: Q-2.5-tc
    type: numeric
    objectives: [OBJ-2.5-1]
    level: basic
    prompt: >-
      במסילה המעוקבת $\gamma(t)=(t,t^2,t^3)$ חשבו את $\frac{\tau}{\kappa}$ ב-$t=0$ מהנגזרות $\gamma'(0)$, $\gamma''(0)$,
      $\gamma'''(0)$ (טענות 2.1.3 ו-2.2.4). (ב-$t=1$ היחס הוא בערך $0.949$, ולכן המסילה המעוקבת אינה סליל מוכלל.)
    answer: 1.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\gamma'(0)=(1,0,0)$, $\gamma''(0)=(0,2,0)$, $\gamma'''(0)=(0,0,6)$, $\gamma'\times\gamma''=(0,0,2)$: $\kappa=\frac21=2$ ו-
      $\tau=\frac{(0,0,2)\cdot(0,0,6)}{2^2}=3$, והמנה $\frac32$. היא משתנה מנקודה לנקודה, ולפי משפט לנקרה אין כיוון קבוע שהמשיק
      יוצר איתו זווית קבועה.
    wrongFeedback: >-
      $\kappa=\frac{\|\gamma'\times\gamma''\|}{\|\gamma'\|^3}$ ו-$\tau=\frac{(\gamma'\times\gamma'')\cdot\gamma'''}{\|\gamma'\times\gamma''\|^2}$,
      ואז מחלקים את הפיתול בעקמומיות.
    commonWrong:
      - value: 0.6666667
        feedback: >-
          זה $\frac\kappa\tau$, היחס ההפוך.
        misconception: MC-c2-lancret-ratio-inverted
      - value: 3
        feedback: >-
          חילקתם ב-$\|\gamma'\times\gamma''\|=2$ ולא בריבוע שלו: $\tau=3$, לא $6$, והמנה $\frac32$.
        misconception: MC-c2-torsion-denominator
      - value: 6
        feedback: >-
          זו המכפלה $\kappa\tau$, לא היחס.

  - id: Q-2.5-cosh
    type: numeric
    objectives: [OBJ-2.5-1]
    level: mid
    prompt: >-
      למעקה $\gamma(t)=(t,\cosh t,\sinh t)$ יש $\kappa(t)=\tau(t)=\frac{1}{2\cosh^2t}$, ולכן לפי משפט לנקרה הוא סליל מוכלל. יהי
      $\mathbf u$ הציר המנורמל של משפט 2.5.2, זה עם $\mathbf u\cdot\mathbf b>0$, ו-$\theta$ הזווית בין המשיק ל-$\mathbf u$.
      חשבו את $\cos\theta$.
    answer: 0.7071068
    tolerance: 0.0005
    correctFeedback: >-
      נכון. לפי משפט 2.5.2(א), $\cot\theta=\frac\tau\kappa=1$, $\theta=45^\circ$, $\cos\theta=\frac{1}{\sqrt2}$. הציר הוא
      $\mathbf u=\mathbf e_z$: $\mathbf t\cdot\mathbf e_z=\frac{\cosh t}{\sqrt2\cosh t}=\frac{1}{\sqrt2}$ בכל נקודה, ו-$\mathbf b\cdot\mathbf e_z=\frac{1}{\sqrt2}>0$.
    wrongFeedback: >-
      $\frac\tau\kappa$ אינו $\cos\theta$, אלא $\cot\theta$. מצאו את $\theta$ מ-$\cot\theta=1$.
    commonWrong:
      - value: 1
        feedback: >-
          $1=\frac\tau\kappa=\cot\theta$, לא $\cos\theta$. אם $\cos\theta=1$, המשיק היה מקביל לציר בכל נקודה, והמסילה ישר.
        misconception: MC-c2-lancret-ratio-is-cos
      - value: 0.5
        feedback: >-
          זה הערך של $\kappa(0)$, לא קוסינוס של זווית.
      - value: -0.7071068
        feedback: >-
          זה הציר $-\mathbf e_z$, עם $\mathbf u\cdot\mathbf b<0$. הנרמול של משפט 2.5.2 בוחר את הסימן שבו $\mathbf u\cdot\mathbf b>0$.

  - id: Q-2.5-gh
    type: twotier
    objectives: [OBJ-2.5-1]
    qualitative: true
    level: mid
    prompt: >-
      האם המסילה $\gamma(t)=(3t,\ 3t^2,\ 2t^3)$ היא סליל מוכלל?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. החישוב נותן $\kappa=\tau=\frac{2}{3(1+2t^2)^2}$, והיחס $\frac\tau\kappa=1$ קבוע; הציר הוא $\frac{1}{\sqrt2}(1,0,1)$.
      - text: 'לא, כי העקמומיות והפיתול אינם קבועים'
        feedback: >-
          סליל מוכלל לא דורש $\kappa$ ו-$\tau$ קבועים, רק יחס קבוע ביניהם.
        misconception: MC-c2-generalized-helix-constant
    reasons:
      - text: '$\|\gamma''\|=3(1+2t^2)$ ו-$\gamma''\cdot(1,0,1)=3+6t^2$, ולכן $\mathbf t\cdot\frac{(1,0,1)}{\sqrt2}=\frac{1}{\sqrt2}$ בכל נקודה'
        correct: true
        feedback: >-
          בדיוק, וזה מראה את ההגדרה ישירות, בלי משפט לנקרה. $\|\gamma'\|^2=9+36t^2+36t^4=9(1+2t^2)^2$.
      - text: 'כל מסילה מהצורה $(at,bt^2,ct^3)$ עם מקדמים חיוביים היא סליל מוכלל'
        feedback: >-
          המסילה המעוקבת $(t,t^2,t^3)$ היא דוגמה נגדית: $\frac\tau\kappa$ הוא $\frac32$ ב-$t=0$ ובערך $0.949$ ב-$t=1$. התנאי
          על המקדמים הוא $9a^2c^2=4b^4$, וכאן $9\cdot9\cdot4=324=4\cdot81$.
        misconception: MC-c2-generalized-helix-constant
      - text: '$\gamma$ מונחת על גליל מעגלי, ולכן המשיק שלה בזווית קבועה עם ציר הגליל'
        feedback: >-
          המסקנה לא נובעת מההנחה: ויויאני מונחת על גליל מעגלי ואינה סליל מוכלל. בדקו את $\mathbf t\cdot\mathbf u$ ישירות.
        misconception: MC-c2-generalized-helix-constant

  - id: Q-2.5-sphere-kappa
    type: twotier
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      מסילה חלקה מונחת על ספרה ברדיוס 2. האם ייתכן שבנקודה כלשהי שלה $\kappa=\frac13$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. על ספרה ברדיוס $R$ כל מסילה מקיימת $\kappa\ge\frac1R=\frac12$.
      - text: כן
        feedback: >-
          מסילה על ספרה חייבת להתעקם לפחות כמו מעגל גדול, כדי להישאר על הספרה. ראו את הנימוק.
        misconception: MC-c2-spherical-kappa-any
    reasons:
      - text: 'גזירת $\|\gamma-\mathbf c\|^2=4$ פעמיים נותנת $\kappa\,\mathbf n\cdot(\gamma-\mathbf c)=-1$, ולפי קושי-שוורץ $\kappa\ge\frac12$'
        correct: true
        feedback: >-
          בדיוק. הגזירה הראשונה נותנת $\mathbf t\cdot(\gamma-\mathbf c)=0$, והשנייה $\mathbf t'\cdot(\gamma-\mathbf c)+\mathbf t\cdot\mathbf t=0$.
          לפי קושי-שוורץ $|\mathbf n\cdot(\gamma-\mathbf c)|\le\|\gamma-\mathbf c\|=2$. שוויון מתקבל במעגלים גדולים.
      - text: 'כל מסילה על ספרה היא מעגל על הספרה, ולכן $\kappa\ge\frac12$'
        feedback: >-
          לא כל מסילה על ספרה היא מעגל (ויויאני, או מסילה שמתפתלת מהקוטב לקו המשווה). המסקנה נכונה, אבל הנימוק צריך לעבוד
          לכל מסילה.
        misconception: MC-c2-spherical-kappa-any
      - text: 'העקמומיות של מסילה על ספרה שווה תמיד ל-$\frac1R$, ולכן $\kappa=\frac12$'
        feedback: >-
          זה נכון רק למעגלים גדולים. מעגל קטן ברדיוס $r<R$ מונח על הספרה עם $\kappa=\frac1r>\frac1R$.
        misconception: MC-c2-spherical-kappa-any

  - id: Q-2.5-sphere-R
    type: numeric
    objectives: [OBJ-2.5-2]
    level: mid
    prompt: >-
      מסילה בפרמטר אורך הקשת מונחת על ספרה, ו-$\tau\ne0$ בה; $\rho=\frac1\kappa$ ו-$\sigma=\frac1\tau$. בנקודה מסוימת $\rho=3$,
      הנגזרת $\rho'=2$ ו-$\tau=\frac12$. מהו רדיוס הספרה?
    answer: 5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\gamma-\mathbf c=-\rho\,\mathbf n-\rho'\sigma\,\mathbf b$ עם $\sigma=2$, ולכן $R^2=\rho^2+(\rho'\sigma)^2=9+16=25$.
    wrongFeedback: >-
      מגזירת $\mathbf n\cdot(\gamma-\mathbf c)=-\rho$ מקבלים $\mathbf b\cdot(\gamma-\mathbf c)=-\rho'\sigma$. חברו את שני הרכיבים
      בפיתגורס (הרכיב לאורך $\mathbf t$ אפס).
    commonWrong:
      - value: 3
        feedback: >-
          זה $\rho$ לבד: הרכיב לאורך $\mathbf n$ בלבד. זה הרדיוס רק כש-$\rho'=0$, כלומר במעגל גדול.
        misconception: MC-c2-spherical-kappa-any
      - value: 3.1622777
        feedback: >-
          זה $\sqrt{9+(\rho'\tau)^2}$. הרכיב לאורך $\mathbf b$ הוא $\rho'\sigma=\frac{\rho'}{\tau}=4$, לא $\rho'\tau=1$.
      - value: 7
        feedback: >-
          זה $\rho+\rho'\sigma$. הרכיבים ניצבים זה לזה, ולכן מחברים את הריבועים.

  - id: Q-2.5-proofrank
    type: rank
    objectives: [OBJ-2.5-1]
    level: mid
    prompt: >-
      סדרו את ההוכחה של הכיוון "סליל מוכלל גורר $\frac\tau\kappa$ קבוע": נתון $\mathbf t\cdot\mathbf u=\cos\theta$ קבוע, עם
      $\mathbf u$ וקטור יחידה קבוע ו-$0<\theta<\pi$.
    help: סדרו את שלבי ההוכחה מהראשון לאחרון.
    items:
      - id: diff1
        label: 'גזירה: $\kappa\,\mathbf n\cdot\mathbf u=0$, ולכן $\mathbf n\cdot\mathbf u=0$ (כי $\kappa>0$)'
      - id: expand
        label: '$\mathbf u$ במישור של $\mathbf t$ ו-$\mathbf b$: $\mathbf u=\cos\theta\,\mathbf t+\sin\theta\,\mathbf b$ (אחרי החלפת $\mathbf u$ ב-$-\mathbf u$ אם צריך)'
      - id: diff2
        label: 'גזירה של $\mathbf u$ הקבוע: $0=(\kappa\cos\theta-\tau\sin\theta)\,\mathbf n$'
      - id: ratio
        label: 'לכן $\frac\tau\kappa=\cot\theta$, קבוע'
    order: [diff1, expand, diff2, ratio]
    correctFeedback: >-
      נכון. לכיוון ההפוך מגדירים $\mathbf u=\cos\theta\,\mathbf t+\sin\theta\,\mathbf b$ עם $\cot\theta=\frac\tau\kappa$, ואותו חישוב
      מראה ש-$\mathbf u'=0$.
    wrongFeedback: >-
      ההוכחה גוזרת פעמיים: פעם את $\mathbf t\cdot\mathbf u$ (ומקבלת ש-$\mathbf u$ במישור המיישר), ופעם את $\mathbf u$ עצמו.

  - id: Q-2.5-sphere-helix
    type: twotier
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    qualitative: true
    level: exam
    prompt: >-
      האם יש סליל מוכלל לא מישורי, מסדר $C^4$ בפרמטר אורך הקשת, שמונח על ספרה **ומוגדר לכל** $s\in\mathbb R$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. על ספרה סליל מוכלל לא מישורי חי רק לאורך סופי. סליל כזה קיים: $\kappa=\frac{1}{\sqrt{1-\lambda^2s^2}}$ ו-$\tau=\lambda\kappa$
          על $|s|<\frac1\lambda$ נותנים (משפט 2.4.3) מסילה שמקיימת את התנאי של משפט 2.5.5 עם $R=1$, וכשמתקרבים לקצוות $\kappa\to\infty$.
      - text: כן
        feedback: >-
          נסו לבנות אחד: עם $\tau=\lambda\kappa$, מה התנאי של משפט 2.5.5 אומר על $\rho$? ראו את הנימוק.
        misconception: MC-c2-generalized-helix-constant
    reasons:
      - text: 'עם $\tau=\lambda\kappa$ ($\lambda\ne0$), $\sigma=\frac\rho\lambda$, והתנאי של משפט 2.5.5 נותן $(\rho^2)''''=-2\lambda^2$: $\rho^2$ שלילית רחוק מספיק'
        correct: true
        feedback: >-
          בדיוק. $\frac\rho\sigma=\lambda$ ו-$\rho'\sigma=\frac{\rho\rho'}{\lambda}=\frac{(\rho^2)'}{2\lambda}$, ולכן התנאי הוא
          $\lambda+\frac{(\rho^2)''}{2\lambda}=0$. אז $\rho^2$ פרבולה הפוכה, ו-$\rho^2>0$ לא יכול להתקיים על כל $\mathbb R$. ($\lambda=0$
          היה מסילה מישורית, לפי משפט 2.2.6.)
      - text: 'סליל מוכלל לא מישורי הוא סליל מעגלי (משפט 2.3.8), וסליל מעגלי אינו מונח על ספרה'
        feedback: >-
          הצעד הראשון שגוי: סליל מוכלל דורש רק $\frac\tau\kappa$ קבוע, לא $\kappa$ ו-$\tau$ קבועים. יש סליל מוכלל על ספרה, והוא אינו
          מעגלי: $\kappa=\frac{1}{\sqrt{1-\lambda^2s^2}}$, $\tau=\lambda\kappa$ על $|s|<\frac1\lambda$.
        misconception: MC-c2-generalized-helix-constant
      - text: 'מסילה על ספרה יכולה להיות כמעט ישרה, עם $\kappa$ קטן ככל שרוצים, ולכן אין מגבלה על אורכה'
        feedback: >-
          על ספרה ברדיוס $R$ תמיד $\kappa\ge\frac1R$ (טענה 2.5.4). ובכל מקרה עקמומיות קטנה אינה מה שקובע אם המסילה ממשיכה לנצח.
        misconception: MC-c2-spherical-kappa-any

  - id: Q-2.5-sphere-derive
    type: rank
    objectives: [OBJ-2.5-2]
    level: exam
    prompt: >-
      הוכיחו: אם מסילה מסדר $C^3$ בפרמטר אורך הקשת מונחת על ספרה $\|\gamma-\mathbf c\|=R$, אז בכל נקודה שבה $\tau=0$ גם
      $\kappa'=0$. (בוויויאני, למשל, $\tau(\pm\pi)=0$, וגם $\kappa'(\pm\pi)=0$.) סדרו את שלבי ההוכחה.
    help: סדרו את שלבי ההוכחה מהראשון לאחרון.
    items:
      - id: lemma
        label: 'לפי למה 2.5.3ב, $\kappa>0$, $(\gamma-\mathbf c)\cdot\mathbf t\equiv0$ ו-$(\gamma-\mathbf c)\cdot\mathbf n\equiv-\rho$'
      - id: diff
        label: 'גוזרים את $(\gamma-\mathbf c)\cdot\mathbf n=-\rho$ לפי משפט 2.3.2 ומקבלים $\tau\,(\gamma-\mathbf c)\cdot\mathbf b=-\rho''$'
      - id: zero
        label: 'בנקודה $s_0$ שבה $\tau(s_0)=0$ הצד השמאלי מתאפס, ולכן $\rho''(s_0)=0$'
      - id: kappa
        label: 'מ-$\rho''=-\frac{\kappa''}{\kappa^2}$ ו-$\kappa>0$ נובע $\kappa''(s_0)=0$'
