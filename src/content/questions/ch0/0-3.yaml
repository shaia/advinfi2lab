# Lesson 0.3 — review: the differential, the Jacobian matrix, the chain rule, the gradient.
# Objectives (src/course.ts):
#   OBJ-0.3-1  compute the Jacobian matrix of a map ℝⁿ → ℝᵐ and read the differential as the best linear approximation
#   OBJ-0.3-2  apply the chain rule to a curve composed with a function and to a composition of maps
#   OBJ-0.3-3  use the gradient: normal to level sets, pointing in the direction of fastest increase
chapter: 0
questions:
  - id: Q-0.3-size
    type: mc
    objectives: [OBJ-0.3-1]
    qualitative: true
    level: basic
    prompt: >-
      $\sigma:\mathbb R^2\to\mathbb R^3$, $\sigma(u,v)=(x(u,v),\ y(u,v),\ z(u,v))$, פרמטריזציה של משטח. מהי $D\sigma(u,v)$?
    choices:
      - text: 'מטריצה $3\times2$ שהעמודות שלה $\sigma_u$ ו-$\sigma_v$'
        correct: true
        feedback: >-
          נכון. שורה לכל רכיב ($x,y,z$) ועמודה לכל משתנה ($u,v$). כך $D\sigma\,h$ מוגדר ל-$h\in\mathbb R^2$ ונותן וקטור
          ב-$\mathbb R^3$: $D\sigma\,(h_1,h_2)=h_1\sigma_u+h_2\sigma_v$.
      - text: 'מטריצה $2\times3$ שהשורות שלה $\sigma_u$ ו-$\sigma_v$'
        feedback: >-
          זו המשוחלפת. $D\sigma$ צריכה לפעול על הזזות במישור הפרמטרים ($h\in\mathbb R^2$) ולתת הזזות במרחב, ולכן היא $3\times2$.
        misconception: MC-c0-jacobian-transposed
      - text: 'מטריצה $3\times3$, ויש לה דטרמיננטה'
        feedback: >-
          יש רק שני משתנים, ולכן שתי עמודות. לפרמטריזציה של משטח אין יעקוביאן ריבועי; את התפקיד של הדטרמיננטה ימלא
          $\|\sigma_u\times\sigma_v\|$.
        misconception: MC-c0-jacobian-transposed

  - id: Q-0.3-polar-det
    type: numeric
    objectives: [OBJ-0.3-1]
    level: basic
    prompt: >-
      $F(r,\theta)=(r\cos\theta,\ r\sin\theta)$. חשבו את $\det DF$ בנקודה $(r,\theta)=\left(2,\ \frac\pi3\right)$.
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $DF=\begin{pmatrix}\cos\theta&-r\sin\theta\\ \sin\theta&r\cos\theta\end{pmatrix}$, ו-$\det DF=r\cos^2\theta+r\sin^2\theta=r=2$.
      הזווית לא משפיעה.
    wrongFeedback: >-
      עמודה ראשונה: הנגזרות לפי $r$; עמודה שנייה: לפי $\theta$. אחר כך דטרמיננטה של $2\times2$.
    commonWrong:
      - value: 0.5
        feedback: >-
          $\frac1r$ הוא היעקוביאן של ההעתקה **ההפכית**, מ-$(x,y)$ ל-$(r,\theta)$. כאן מבקשים את של $F$ עצמה.
        misconception: MC-c0-inverse-derivative-confusion

  - id: Q-0.3-partials
    type: twotier
    objectives: [OBJ-0.3-1]
    qualitative: true
    level: mid
    prompt: >-
      $f(x,y)=\frac{xy}{x^2+y^2}$ ל-$(x,y)\ne(0,0)$, ו-$f(0,0)=0$. שתי הנגזרות החלקיות של $f$ קיימות בראשית ושוות לאפס.
      האם $f$ דיפרנציאבילית בראשית?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. $f$ אפילו אינה רציפה בראשית, ופונקציה דיפרנציאבילית היא רציפה.
      - text: 'כן, והדיפרנציאל הוא אפס'
        feedback: >-
          המועמד היחיד לדיפרנציאל הוא אכן אפס (הנגזרות החלקיות), אבל צריך לבדוק שהוא קירוב טוב, כלומר
          $\frac{|f(h)-f(0)-0|}{\|h\|}\to0$. על האלכסון $f=\frac12$, והמנה לא שואפת לאפס.
        misconception: MC-c0-partials-imply-differentiable
    reasons:
      - text: 'על הישר $y=x$, $f(t,t)=\frac12$ לכל $t\ne0$, ולכן $f$ אינה רציפה בראשית'
        correct: true
        feedback: >-
          בדיוק. הנגזרות החלקיות בודקות רק את שני הצירים, שעליהם $f=0$. דיפרנציאביליות היא תנאי על כל הכיוונים יחד.
      - text: 'קיום הנגזרות החלקיות מספיק לדיפרנציאביליות'
        feedback: >-
          זו בדיוק הטענה שהפונקציה הזו מפריכה. מה שמספיק הוא שהנגזרות החלקיות **רציפות** בסביבת הנקודה.
        misconception: MC-c0-partials-imply-differentiable
      - text: 'הנגזרות החלקיות אפס, ולכן $f$ קבועה ליד הראשית'
        feedback: >-
          הנגזרות החלקיות אפס רק בראשית, ורק לאורך הצירים. $f(1,1)=\frac12\ne0$.
        misconception: MC-c0-partials-imply-differentiable

  - id: Q-0.3-approx
    type: numeric
    objectives: [OBJ-0.3-1]
    level: mid
    prompt: >-
      $f(x,y)=x^2y$. השתמשו בדיפרנציאל של $f$ בנקודה $(1,2)$ כדי לקרב את $f(1.1,\ 1.9)$. מהו הקירוב?
    answer: 2.3
    tolerance: 0.0002
    correctFeedback: >-
      נכון. $f(1,2)=2$ ו-$\nabla f=(2xy,\ x^2)=(4,1)$. עם $h=(0.1,\ -0.1)$: $f(1,2)+\nabla f\cdot h=2+0.4-0.1=2.3$. הערך המדויק
      $1.21\cdot1.9=2.299$; ההפרש $0.001$ קטן כמו $\|h\|^2$.
    wrongFeedback: >-
      הקירוב הלינארי הוא $f(p+h)\approx f(p)+Df(p)h$. חשבו את $f(p)$, את הגרדיאנט ב-$p$ ואת $h$.
    commonWrong:
      - value: 0.3
        feedback: >-
          $0.3$ הוא $Df(p)h$, הקירוב **לשינוי** בערך. הקירוב לערך עצמו מוסיף את $f(p)=2$.
        misconception: MC-c0-differential-is-value
      - value: 2.299
        feedback: >-
          זה הערך המדויק של $f(1.1,\ 1.9)$, לא הקירוב הלינארי שהתבקש. חשבו $f(p)+\nabla f(p)\cdot h$.
        misconception: MC-c0-differential-is-value

  - id: Q-0.3-chain-curve
    type: numeric
    objectives: [OBJ-0.3-2]
    level: basic
    prompt: >-
      $f(x,y)=x^2+3y$ ו-$\gamma(t)=(\cos t,\ \sin t)$. חשבו את $\frac{d}{dt}f(\gamma(t))$ ב-$t=\frac\pi3$.
    answer: 0.6339746
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $\frac{3-\sqrt3}{2}\approx0.634$. $\gamma(\frac\pi3)=(\frac12,\frac{\sqrt3}2)$, $\nabla f=(2x,\ 3)=(1,3)$ ו-$\gamma'(\frac\pi3)=(-\frac{\sqrt3}2,\ \frac12)$,
      ולכן $\nabla f\cdot\gamma'=-\frac{\sqrt3}2+\frac32$. בדיקה ישירה: $\frac{d}{dt}(\cos^2t+3\sin t)=-2\cos t\sin t+3\cos t$.
    wrongFeedback: >-
      כלל השרשרת: $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$. חשבו את הגרדיאנט **בנקודה** $\gamma(\frac\pi3)$ ואת
      וקטור המהירות.
    commonWrong:
      - value: 3.0980762
        feedback: >-
          זה $\nabla f\cdot\gamma(\frac\pi3)$: כפלתם בנקודה במקום במהירות $\gamma'$.
        misconception: MC-c0-chain-position-for-velocity

  - id: Q-0.3-chain-order
    type: mc
    objectives: [OBJ-0.3-2]
    qualitative: true
    level: basic
    prompt: >-
      $F:\mathbb R^n\to\mathbb R^m$ ו-$G:\mathbb R^m\to\mathbb R^k$ דיפרנציאביליות. מהי $D(G\circ F)(x)$?
    choices:
      - text: '$DG(F(x))\,DF(x)$'
        correct: true
        feedback: >-
          נכון. מטריצה $k\times m$ כפול $m\times n$, תוצאה $k\times n$. קודם $DF(x)$ מעביר את ההזזה $h$, ואחריו $DG$ בנקודה
          שאליה $F$ הגיעה.
      - text: '$DF(x)\,DG(F(x))$'
        feedback: >-
          זה $m\times n$ כפול $k\times m$, מכפלה שאינה מוגדרת בכלל כש-$n\ne k$. הסדר הוא סדר ההרכבה: $G$ אחרונה, ולכן
          משמאל.
        misconception: MC-c0-chain-order
      - text: '$DG(x)\,DF(x)$'
        feedback: >-
          $DG$ מוגדרת על $\mathbb R^m$, ו-$x\in\mathbb R^n$. צריך לגזור את $G$ בנקודה שבה היא פועלת, $F(x)$.
        misconception: MC-c0-chain-wrong-point

  - id: Q-0.3-chain-polar
    type: numeric
    objectives: [OBJ-0.3-2]
    level: mid
    prompt: >-
      $g(x,y)=x^2-y^2$ ו-$F(r,\theta)=(r\cos\theta,\ r\sin\theta)$. בעזרת כלל השרשרת חשבו את $\frac{\partial}{\partial\theta}(g\circ F)$
      בנקודה $(r,\theta)=\left(1,\ \frac\pi6\right)$.
    answer: -1.7320508
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $-\sqrt3$. ב-$(1,\frac\pi6)$: $x=\frac{\sqrt3}2$, $y=\frac12$, $x_\theta=-r\sin\theta=-\frac12$, $y_\theta=r\cos\theta=\frac{\sqrt3}2$.
      $g_x\,x_\theta+g_y\,y_\theta=\sqrt3\cdot(-\frac12)+(-1)\cdot\frac{\sqrt3}2=-\sqrt3$. בדיקה: $g\circ F=r^2\cos2\theta$, והנגזרת
      $-2r^2\sin2\theta=-\sqrt3$.
    wrongFeedback: >-
      $\frac{\partial h}{\partial\theta}=g_x\,x_\theta+g_y\,y_\theta$: מחשבים את $g_x,g_y$ בנקודה $F(1,\frac\pi6)$ וכופלים בנגזרות של
      $x,y$ לפי $\theta$.
    commonWrong:
      - value: -0.8660254
        feedback: >-
          זה רק אחד משני המחוברים. $g$ תלויה ב-$\theta$ דרך $x$ **וגם** דרך $y$, וסוכמים על שני המסלולים.
        misconception: MC-c0-chain-one-path

  - id: Q-0.3-reparam
    type: twotier
    objectives: [OBJ-0.3-2]
    qualitative: true
    level: mid
    prompt: >-
      $\gamma(t)=(\cos t,\ \sin t)$ ו-$\tilde\gamma(s)=\gamma(s^3)$, $s\in\mathbb R$. האם $\tilde\gamma'(0)\ne0$?
    choices:
      - text: 'לא: $\tilde\gamma''(0)=0$'
        correct: true
        feedback: >-
          נכון. אותה תמונה (מעגל היחידה), אבל ב-$s=0$ המסילה $\tilde\gamma$ נעצרת לרגע.
      - text: 'כן: $\tilde\gamma''(0)=\gamma''(0)=(0,1)$'
        feedback: >-
          $\tilde\gamma$ ו-$\gamma$ עוברות באותה נקודה, אבל לא באותה מהירות. המהירות שייכת לפרמטריזציה, לא לתמונה.
        misconception: MC-c0-curve-is-image
    reasons:
      - text: 'לפי כלל השרשרת $\tilde\gamma''(s)=3s^2\,\gamma''(s^3)$, וב-$s=0$ הגורם $3s^2$ מתאפס'
        correct: true
        feedback: >-
          בדיוק. החלפת פרמטר $t=\varphi(s)$ כופלת את המהירות ב-$\varphi'(s)$. בפרק 1 נדרוש $\varphi'\ne0$ בהחלפת פרמטר, כדי
          שרגולריות תישמר.
      - text: 'כלל השרשרת נותן $\tilde\gamma''(s)=\gamma''(s^3)$'
        feedback: >-
          חסרה הנגזרת של הפונקציה הפנימית: $\frac{d}{ds}s^3=3s^2$.
        misconception: MC-c1-reparam-chain-rule
      - text: 'למעגל יש משיק בכל נקודה, ולכן כל מסילה שמציירת אותו מהירותה שונה מאפס'
        feedback: >-
          למעגל, כתמונה, יש ישר משיק בכל נקודה; אבל מסילה שמציירת אותו יכולה לעצור. מהירות היא תכונה של הפונקציה.
        misconception: MC-c0-curve-is-image

  - id: Q-0.3-normal
    type: mc
    objectives: [OBJ-0.3-3]
    qualitative: true
    level: basic
    prompt: >-
      $f(x,y)=x^2+4y^2$. הנקודה $(2,1)$ על קו הרמה $f=8$. איזה וקטור **ניצב** לקו הרמה בנקודה הזו?
    choices:
      - text: '$(1,2)$'
        correct: true
        feedback: >-
          נכון. $\nabla f=(2x,\ 8y)=(4,8)$, באותו כיוון כמו $(1,2)$. הגרדיאנט ניצב לקו הרמה.
      - text: '$(2,-1)$'
        feedback: >-
          $(2,-1)\cdot(4,8)=0$: זה וקטור **משיק** לקו הרמה, ניצב לגרדיאנט.
        misconception: MC-c0-gradient-tangent-to-level
      - text: '$(2,1)$'
        feedback: >-
          זה וקטור המקום. במעגל שמרכזו בראשית הוא היה ניצב, אבל זו אליפסה: $(2,1)$ אינו בכיוון של $(4,8)$.
        misconception: MC-c0-normal-is-position

  - id: Q-0.3-steepest
    type: numeric
    objectives: [OBJ-0.3-3]
    level: basic
    prompt: >-
      $f(x,y,z)=xy+z^2$. מהי הנגזרת הכיוונית **המקסימלית** של $f$ בנקודה $(1,2,1)$, על פני כל וקטורי היחידה?
    answer: 3
    tolerance: 0.001
    correctFeedback: >-
      נכון. $D_uf=\nabla f\cdot u\le\|\nabla f\|$, עם שוויון כש-$u$ בכיוון הגרדיאנט. $\nabla f=(y,\ x,\ 2z)=(2,1,2)$ ו-$\|\nabla f\|=3$.
    wrongFeedback: >-
      $D_uf=\nabla f\cdot u$. לפי קושי-שוורץ המקסימום על וקטורי יחידה הוא $\|\nabla f\|$.
    commonWrong:
      - value: 9
        feedback: >-
          $9$ הוא $\|\nabla f\|^2$. המקסימום הוא האורך עצמו, $\sqrt9$.
        misconception: MC-c0-norm-without-root

  - id: Q-0.3-perp-proof
    type: rank
    objectives: [OBJ-0.3-3, OBJ-0.3-2]
    qualitative: true
    level: mid
    prompt: >-
      סדרו את ההוכחה לטענה: אם $f$ דיפרנציאבילית ו-$\gamma$ מסילה גזירה בתוך קבוצת הרמה $\{f=c\}$ עם $\gamma(0)=p$, אז
      $\nabla f(p)\perp\gamma'(0)$.
    help: סדרו את שלבי ההוכחה מהראשון (למעלה) לאחרון.
    items:
      - { id: s1, label: 'כי $\gamma$ בתוך קבוצת הרמה, $f(\gamma(t))=c$ לכל $t$.' }
      - { id: s2, label: 'לכן הנגזרת של הפונקציה $t\mapsto f(\gamma(t))$ היא אפס.' }
      - { id: s3, label: 'לפי כלל השרשרת הנגזרת הזו היא $\nabla f(\gamma(t))\cdot\gamma''(t)$.' }
      - { id: s4, label: 'ב-$t=0$: $\nabla f(p)\cdot\gamma''(0)=0$, כלומר $\nabla f(p)\perp\gamma''(0)$.' }
    order: [s1, s2, s3, s4]
    correctFeedback: >-
      נכון. כל וקטור משיק לקבוצת הרמה, כלומר מהירות של מסילה בתוכה, ניצב לגרדיאנט. בשיעור 0.4 נראה שבערך רגולרי אלה
      בדיוק כל הווקטורים הניצבים לגרדיאנט.
    wrongFeedback: >-
      ההוכחה מתחילה במה שידוע על $\gamma$ (שהיא בקבוצת הרמה), גוזרת, ורק אז מפעילה את כלל השרשרת ומציבה $t=0$.

  - id: Q-0.3-saddle-level
    type: twotier
    objectives: [OBJ-0.3-3]
    qualitative: true
    level: exam
    prompt: >-
      נכון או לא: "לכל פונקציה חלקה $f:\mathbb R^2\to\mathbb R$ ולכל $c$, קבוצת הרמה $\{f=c\}$ היא, ליד כל נקודה שלה, עקום חלק
      שהנורמל שלו $\nabla f$."
    choices:
      - text: לא נכון
        correct: true
        feedback: >-
          נכון. הטענה נכשלת בנקודות שבהן $\nabla f=0$.
      - text: נכון
        feedback: >-
          בנקודה שבה $\nabla f=0$ אין נורמל, ושם קבוצת הרמה יכולה להיראות כמו צלב.
        misconception: MC-c0-level-set-always-smooth
    reasons:
      - text: 'ל-$f=x^2-y^2$, הקבוצה $\{f=0\}$ היא הישרים $y=x$ ו-$y=-x$, שנחתכים בראשית, ושם $\nabla f=0$'
        correct: true
        feedback: >-
          בדיוק. בשום סביבה של הראשית הקבוצה אינה עקום אחד חלק. משפט הפונקציה הסתומה (שיעור 0.4) מבטיח עקום חלק רק
          כש-$\nabla f\ne0$ על קבוצת הרמה.
      - text: 'הגרדיאנט ניצב לקווי רמה, ולכן כל קו רמה הוא עקום חלק'
        feedback: >-
          הניצבות מוכחת **על** מסילה גזירה בתוך קבוצת הרמה; היא לא אומרת שקבוצת הרמה היא עקום חלק. ב-$x^2-y^2=0$ הגרדיאנט
          בראשית הוא אפס.
        misconception: MC-c0-level-set-always-smooth
      - text: 'הטענה נכשלת רק לפונקציות שאינן חלקות, כמו $f=|x|-y$'
        feedback: >-
          הקבוצה $\{|x|-y=0\}$ אכן בעלת פינה, אבל גם פונקציות חלקות לגמרי נכשלות: $x^2-y^2$ היא פולינום, וקבוצת הרמה
          $\{x^2-y^2=0\}$ היא צלב. מה שחשוב הוא אם $\nabla f$ מתאפס על קבוצת הרמה.
        misconception: MC-c0-level-set-always-smooth
