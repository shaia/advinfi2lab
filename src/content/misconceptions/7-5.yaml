# Misconceptions first detected in lesson 7.5 (the divergence theorem).
- id: MC-c7-gauss-statement
  title: מנסחים את משפט גאוס עם הרוטור או עם אינטגרל משטחי של הדיברגנץ
  belief: >-
    משפט גאוס אומר ש-$\oiint_{\partial R}\mathbf F\cdot d\mathbf S=\iiint_R\nabla\times\mathbf F\,dV$, או
    ש-$\oiint_{\partial R}\nabla\cdot\mathbf F\,dS=\iiint_R\nabla\cdot\mathbf F\,dV$.
  truth: >-
    $\oiint_{\partial R}\mathbf F\cdot d\mathbf S=\iiint_R\nabla\cdot\mathbf F\,dV$, עם הנורמל **החיצוני** על $\partial R$.
    משמאל שטף (מספר), ומימין אינטגרל משולש של צפיפות השטף.
  remedy: { lesson: '7.5', label: 'הניסוח של משפט גאוס' }

- id: MC-c7-gauss-inward
  title: שוכחים שמשפט גאוס הוא עם הנורמל החיצוני
  belief: >-
    $\iiint_R\nabla\cdot\mathbf F\,dV$ שווה לשטף דרך $\partial R$ בכל כיוון של הנורמל.
  truth: >-
    השוויון הוא עם הנורמל החיצוני. עם הנורמל הפנימי השטף מחליף סימן: לשדה $(x,y,z)$ דרך ספרת היחידה, $4\pi$ החוצה
    ו-$-4\pi$ פנימה.
  remedy: { lesson: '7.5', label: 'הנורמל החיצוני' }

- id: MC-c7-gauss-open-surface
  title: מפעילים את משפט גאוס על משטח שאינו סגור
  belief: >-
    השטף דרך חצי ספרה (בלי הבסיס) שווה לאינטגרל המשולש של הדיברגנץ על חצי הכדור.
  truth: >-
    משפט גאוס חל על השפה **כולה** של תחום חסום, משטח סגור. כדי להשתמש בו לחצי ספרה מוסיפים מכסה (העיגול בבסיס)
    עם הנורמל החיצוני, ואז מחסירים את השטף דרך המכסה.
  remedy: { lesson: '7.5', label: 'סגירה של משטח במכסה' }

- id: MC-c7-lid-normal
  title: מכוונים את המכסה כמו את המשטח שהוא סוגר
  belief: >-
    כשסוגרים את חצי הספרה העליון בעיגול בבסיס, הנורמל של העיגול הוא כלפי מעלה, כמו הנורמל בפסגה.
  truth: >-
    בגאוס כל חלקי השפה עם הנורמל **החיצוני** לתחום. לחצי הכדור העליון, החוץ של העיגול בבסיס הוא כלפי מטה: $-\mathbf e_3$.
  remedy: { lesson: '7.5', label: 'סגירה של משטח במכסה: הנורמל של המכסה' }

- id: MC-c7-side-faces-contribute
  title: חושבים שהפאות הצדדיות תורמות לשטף של שדה אנכי
  belief: >-
    בהוכחה בתיבה, כל שש הפאות תורמות לשטף של $(0,0,R)$.
  truth: >-
    על ארבע הפאות הצדדיות הנורמל אופקי, $\pm\mathbf e_1$ או $\pm\mathbf e_2$, ולכן $(0,0,R)\cdot\hat{\mathbf N}=0$. רק
    המכסה והתחתית תורמות, וזה בדיוק מה שהמשפט היסודי נותן בכיוון $z$.
  remedy: { lesson: '7.5', label: 'ההוכחה בתיבה' }

- id: MC-c7-split-region-same
  title: חושבים שכשמחלקים תחום לשניים, שני החלקים נותנים אותו אינטגרל של הדיברגנץ
  belief: >-
    אם $\mathbf F=0$ על השפה של $K$ ומחלקים את $K$ לשני חלקים, האינטגרלים של $\nabla\cdot\mathbf F$ על שני החלקים שווים
    (או ששניהם בהכרח אפס).
  truth: >-
    לפי גאוס כל חלק נותן את השטף דרך פאת החיתוך המשותפת, אבל עם נורמלים חיצוניים **הפוכים**. לכן שני האינטגרלים
    נגדיים, וסכומם $\iiint_K\nabla\cdot\mathbf F=\oiint_{\partial K}\mathbf F\cdot d\mathbf S=0$. כל אחד לבדו יכול להיות שונה
    מאפס.
  remedy: { lesson: '7.5', label: 'גאוס על שני חלקים של תחום' }

- id: MC-c7-odd-symmetry-off-centre
  title: מאפסים אינטגרל של פונקציה אי-זוגית על תחום שאינו סימטרי
  belief: >-
    $\iiint(x+y+z)\,dV=0$ על כל כדור, כי האינטגרנד אי-זוגי.
  truth: >-
    אינטגרל של פונקציה אי-זוגית מתאפס על תחום סימטרי **ביחס לראשית**. על כדור שמרכזו $\mathbf c$ הממוצע של $x$ הוא
    $c_1$, ולכן $\iiint_B x\,dV=c_1\cdot\operatorname{vol}(B)$.
  remedy: { lesson: '7.5', label: 'שטף דרך ספרה שאינה מרוכזת בראשית' }

- id: MC-c7-zero-flux-zero-div
  title: מסיקים דיברגנץ אפס משטף אפס דרך כמה משטחים
  belief: >-
    אם השטף דרך כל ספרה סביב הראשית הוא אפס, הדיברגנץ אפס בכל מקום.
  truth: >-
    שטף אפס דרך משפחה של משטחים אומר רק שהאינטגרל של הדיברגנץ על התחומים שהם חוסמים אפס. ל-$(x^2,0,0)$ הדיברגנץ
    $2x$ אי-זוגי, והשטף דרך כל ספרה סביב הראשית אפס. רק שטף אפס דרך **כל** ספרה קטנה סביב **כל** נקודה נותן דיברגנץ אפס.
  remedy: { lesson: '7.5', label: 'מה גאוס אומר על הדיברגנץ' }
