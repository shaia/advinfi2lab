# Misconceptions first detected in lesson 7.2 (Green's theorem).
- id: MC-c7-green-sign
  title: הופכים את סדר ההפרש במשפט גרין
  belief: >-
    במשפט גרין האינטגרנד הכפול הוא $\frac{\partial P}{\partial y}-\frac{\partial Q}{\partial x}$.
  truth: >-
    $\oint_{\partial D}P\,dx+Q\,dy=\iint_D\left(\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}\right)dx\,dy$
    כשהשפה בכיוון החיובי. בדיקה מהירה: $P=-y$, $Q=x$ נותנים פעמיים השטח, מספר חיובי, על מעגל נגד כיוון השעון.
  remedy: { lesson: '7.2', label: 'הניסוח של משפט גרין' }

- id: MC-c7-green-divergence-form
  title: מחליפים את הרוטור המישורי בדיברגנץ במשפט גרין
  belief: >-
    $\oint_{\partial D}P\,dx+Q\,dy=\iint_D\left(\frac{\partial P}{\partial x}+\frac{\partial Q}{\partial y}\right)dx\,dy$.
  truth: >-
    האינטגרל הקווי $\oint P\,dx+Q\,dy$ הוא סירקולציה, ולכן מימין עומד הרוטור המישורי $Q_x-P_y$. הדיברגנץ $P_x+Q_y$
    שייך לשטף החוצה דרך השפה, $\oint P\,dy-Q\,dx$.
  remedy: { lesson: '7.2', label: 'גרין בצורת סירקולציה ובצורת שטף' }

- id: MC-c7-dx-on-vertical
  title: חושבים שצלע אנכית תורמת לאינטגרל של P dx
  belief: >-
    בהוכחה במלבן, הצלעות האנכיות תורמות לאינטגרל $\oint P\,dx$, כי $P$ אינו אפס עליהן.
  truth: >-
    על צלע אנכית $x$ קבוע, ולכן בפרמטריזציה $x'(t)=0$ והאינטגרנד $P\,x'(t)$ מתאפס, מה שלא יהיה $P$.
  remedy: { lesson: '7.2', label: 'ההוכחה במלבן' }

- id: MC-c7-one-type-enough
  title: חושבים שתחום פשוט בכיוון אחד מספיק להוכחת גרין כולו
  belief: >-
    אם $D$ הוא תחום בין שני גרפים מעל ציר $x$, ההוכחה של שני חלקי משפט גרין עוברת.
  truth: >-
    הצורה $a\le x\le b,\ \varphi_1(x)\le y\le\varphi_2(x)$ מוכיחה רק את החלק $\oint P\,dx=-\iint P_y$. את החלק
    $\oint Q\,dy=\iint Q_x$ מוכיחים כשהתחום בין שני גרפים מעל ציר $y$. תחום מורכב חותכים לחלקים פשוטים בשני הכיוונים.
  remedy: { lesson: '7.2', label: 'ההוכחה לתחום פשוט' }

- id: MC-c7-cuts-add-up
  title: חושבים שהחתכים הפנימיים תורמים לאינטגרל על השפה
  belief: >-
    כשמחלקים תחום לחלקים ומחברים את משפט גרין לכל חלק, החתכים הפנימיים מוסיפים אינטגרל שצריך לחשב.
  truth: >-
    כל חתך פנימי שייך לשפה של שני חלקים סמוכים, ובכיוון החיובי של כל אחד מהם הוא נעבר בכיוון ההפוך. שתי התרומות
    מתבטלות, ונשאר רק האינטגרל על השפה החיצונית.
  remedy: { lesson: '7.2', label: 'תאים קטנים: הסירקולציות הפנימיות מתבטלות' }

- id: MC-c7-closing-segment
  title: סוגרים מסילה פתוחה ושוכחים להחסיר את הקטע שהוסף
  belief: >-
    כדי לחשב אינטגרל קווי על מסילה פתוחה בעזרת גרין, מספיק לחשב את האינטגרל הכפול על התחום שהיא חוסמת יחד עם קטע.
  truth: >-
    גרין נותן את האינטגרל על **כל** השפה: המסילה יחד עם הקטע הסוגר. האינטגרל על המסילה הוא האינטגרל הכפול **פחות**
    האינטגרל על הקטע, ושניהם בכיוון החיובי של השפה.
  remedy: { lesson: '7.2', label: 'סגירה של מסילה פתוחה' }
