# Misconceptions first detected in lesson 4.7 (the Theorema Egregium).
- id: MC-c4-H-intrinsic
  title: חושבים שגם העקמומיות הממוצעת נקבעת מהתבנית הראשונה
  belief: >-
    המשפט המופלא אומר שכל העקמומיויות של המשטח, $K$, $H$, $\kappa_1$ ו-$\kappa_2$, תלויות רק בתבנית הראשונה.
  truth: >-
    רק $K$. המישור והגליל איזומטריים מקומית (אותה $Q_1$ בפרמטריזציות מתאימות), אבל במישור $H=0$ ובגליל ברדיוס $r$
    $|H|=\frac1{2r}$. $H$, $\kappa_i$ ו-$Q_2$ הן תכונות חיצוניות.
  remedy: { lesson: '4.7', label: 'המשפט המופלא: רק K פנימית' }

- id: MC-c4-K-needs-Q2
  title: חושבים שאי אפשר לדעת את עקמומיות גאוס בלי התבנית השנייה
  belief: >-
    $K=\frac{LN-M^2}{EG-F^2}$ דורשת את $L,M,N$, ולכן מי שיודע רק את $Q_1$ (מודד אורכים על המשטח בלבד) לא יכול לדעת את $K$.
  truth: >-
    זה תוכן המשפט המופלא: $LN-M^2$ אפשר לבטא דרך $E,F,G$ ונגזרותיהם עד סדר שני, ולכן $K$ נקבעת מ-$Q_1$ בלבד. למשל
    כש-$Q_1=du^2+dv^2$ בתחום כלשהו, $K=0$ שם, בלי לדעת דבר על צורת המשטח במרחב.
  remedy: { lesson: '4.7', label: 'המשפט המופלא: K מתוך Q₁ בלבד' }

- id: MC-c4-same-K-isometric
  title: חושבים שאותה עקמומיות גאוס בנקודות מתאימות מבטיחה איזומטריה
  belief: >-
    אם $f:M_1\to M_2$ מעבירה כל נקודה לנקודה עם אותה $K$, אז $f$ איזומטריה מקומית.
  truth: >-
    המשפט המופלא נותן רק כיוון אחד: איזומטריה שומרת על $K$. ההפך לא נכון: להליקואיד $(u\cos v,u\sin v,v)$ ולמשטח
    $(u\cos v,u\sin v,\ln u)$ אותה $K=-\frac1{(1+u^2)^2}$ בנקודות עם אותם $(u,v)$, אבל $Q_1$ שונות ($E=1$ מול
    $E=1+\frac1{u^2}$), ולכן ההתאמה הזו אינה איזומטריה.
  remedy: { lesson: '4.7', label: 'המשפט המופלא: כיוון אחד בלבד' }

- id: MC-c4-distance-map
  title: חושבים שאפשר למפות חלק מכדור הארץ בלי לעוות מרחקים אם מקטינים בקנה מידה קבוע
  belief: >-
    מפה טובה מספיק, עם קנה מידה קבוע, יכולה לשמור על כל המרחקים בחלק קטן של כדור הארץ.
  truth: >-
    מפה ששומרת על מרחקים (עד כדי קנה מידה קבוע) היא איזומטריה מקומית אחרי שינוי קנה מידה. לפי המשפט המופלא היא
    שומרת על $K$, אבל לספרה $K=\frac1{R^2}>0$ ולמישור (גם אחרי הכפלה בקבוע) $K=0$. לכן כל מפה מעוותת מרחקים, גם
    בחלק קטן ככל שנרצה.
  remedy: { lesson: '4.7', label: 'אין מפה ששומרת על מרחקים' }

- id: MC-c4-paper-sphere
  title: חושבים שאפשר לכופף דף נייר לחלק של ספרה בלי למתוח
  belief: >-
    אם מכופפים דף נייר בזהירות, אפשר להלביש אותו על חלק של כדור, כמו שמלבישים אותו על גליל.
  truth: >-
    כיפוף בלי מתיחה שומר על $Q_1$, ולכן על $K$. לדף $K=0$, ולכן הוא מתכופף לגליל ולחרוט ($K=0$), אבל לא לספרה
    ($K>0$) ולא לאוכף ($K<0$). כדי להלביש כדור צריך לקמט או למתוח.
  remedy: { lesson: '4.7', label: 'דף נייר: גליל כן, ספרה לא' }

- id: MC-c4-egregium-G-not-sqrt
  title: מציבים את G במקום השורש שלו בנוסחה של עקמומיות גאוס מהתבנית הראשונה
  belief: >-
    לתבנית $Q_1=du^2+G(u)\,dv^2$ מתקיים $K=-\frac{G''}{G}$.
  truth: >-
    $K=-\frac{(\sqrt G)''}{\sqrt G}$: הנוסחה הכללית כש-$F=0$ היא
    $K=-\frac{1}{2\sqrt{EG}}\left[\left(\frac{E_v}{\sqrt{EG}}\right)_v+\left(\frac{G_u}{\sqrt{EG}}\right)_u\right]$, ועם
    $E=1$ היא מצטמצמת לשורש. ל-$G=e^{2u}$: $K=-1$, ולא $-4$.
  remedy: { lesson: '4.7', label: 'K מהתבנית הראשונה כש-F = 0' }

- id: MC-c4-egregium-reduced-formula
  title: משתמשים בצורה המקוצרת של הנוסחה מהתבנית הראשונה כשאחד המקדמים אינו 1
  belief: >-
    לכל תבנית עם $F=0$ אפשר לחשב $K=-\frac{(\sqrt E)_{vv}}{\sqrt E}$ (או $-\frac{(\sqrt G)_{uu}}{\sqrt G}$), גם כשהמקדם השני
    אינו קבוע.
  truth: >-
    הצורה המקוצרת $K=-\frac{(\sqrt G)_{uu}}{\sqrt G}$ נכונה רק כש-$E=1$ ו-$G=G(u)$ (ובהחלפת תפקידים, כש-$G=1$). אחרת
    צריך את הנוסחה המלאה
    $K=-\frac{1}{2\sqrt{EG}}\left[\left(\frac{E_v}{\sqrt{EG}}\right)_v+\left(\frac{G_u}{\sqrt{EG}}\right)_u\right]$. בפרבולואיד
    $Q_1=v^2\,du^2+(1+4v^2)\,dv^2$ הצורה המקוצרת נותנת 0, והנכון הוא $\frac{4}{(1+4v^2)^2}$.
  remedy: { lesson: '4.7', label: 'K מהתבנית הראשונה כש-F = 0' }

- id: MC-c4-egregium-sign
  title: מאבדים את סימן המינוס בנוסחה של עקמומיות גאוס מהתבנית הראשונה
  belief: >-
    $K=+\frac{(\sqrt G)''}{\sqrt G}$ לתבנית $du^2+G(u)\,dv^2$.
  truth: >-
    $K=-\frac{(\sqrt G)''}{\sqrt G}$. בדיקה על ספרת היחידה בקואורדינטות $Q_1=du^2+\sin^2u\,dv^2$: $\sqrt G=\sin u$,
    $(\sin u)''=-\sin u$, ולכן $K=1$, כמו שצריך.
  remedy: { lesson: '4.7', label: 'K מהתבנית הראשונה: בדיקה על הספרה' }
