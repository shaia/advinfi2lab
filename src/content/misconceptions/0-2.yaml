# Misconceptions first detected in lesson 0.2 (inner and cross product, orthogonal matrices, the spectral theorem).
- id: MC-c0-cross-commutative
  title: חושבים שהמכפלה הווקטורית חילופית
  belief: >-
    $u\times v=v\times u$, כמו במכפלה הפנימית.
  truth: >-
    המכפלה הווקטורית אנטי-חילופית: $v\times u=-(u\times v)$. למשל $e_1\times e_2=e_3$ אבל $e_2\times e_1=-e_3$. סדר
    הגורמים קובע את הכיוון, ובהמשך את כיוון הנורמל $\sigma_u\times\sigma_v$ של משטח.
  remedy: { lesson: '0.2', label: 'המכפלה הווקטורית: כלל יד ימין' }

- id: MC-c0-cross-associative
  title: חושבים שהמכפלה הווקטורית קיבוצית
  belief: >-
    $(u\times v)\times w=u\times(v\times w)$ לכל שלושה וקטורים.
  truth: >-
    לא: $(e_1\times e_1)\times e_2=0$, אבל $e_1\times(e_1\times e_2)=e_1\times e_3=-e_2$. במקום קיבוציות יש את הנוסחה
    $u\times(v\times w)=(u\cdot w)\,v-(u\cdot v)\,w$.
  remedy: { lesson: '0.2', label: 'תכונות המכפלה הווקטורית' }

- id: MC-c0-cross-zero-vector
  title: חושבים שמכפלה וקטורית מתאפסת רק כשאחד הגורמים אפס
  belief: >-
    אם $u\times v=0$, אז $u=0$ או $v=0$.
  truth: >-
    $\|u\times v\|=\|u\|\|v\|\sin\theta$, ולכן $u\times v=0$ בדיוק כש-$u$ ו-$v$ תלויים לינארית (מקבילים, או שאחד מהם
    אפס). למשל $(1,2,3)\times(2,4,6)=0$.
  remedy: { lesson: '0.2', label: 'אורך המכפלה הווקטורית כשטח מקבילית' }

- id: MC-c0-norm-without-root
  title: שוכחים את השורש באורך של וקטור
  belief: >-
    האורך של וקטור הוא סכום ריבועי הרכיבים.
  truth: >-
    $\|x\|=\sqrt{x_1^2+\dots+x_n^2}$. סכום הריבועים הוא $\|x\|^2$. שטח המקבילית הוא $\|u\times v\|$, לא $\|u\times v\|^2$.
  remedy: { lesson: '0.2', label: 'מכפלה פנימית ונורמה' }

- id: MC-c0-parallelogram-vs-triangle
  title: מבלבלים בין מקבילית למשולש ובין מקבילון לטטראדר
  belief: >-
    $\|u\times v\|$ הוא שטח המשולש ש-$u$ ו-$v$ פורשים, ו-$|\det(u,v,w)|$ הוא נפח הטטראדר.
  truth: >-
    $\|u\times v\|$ הוא שטח **המקבילית**; המשולש הוא חצי ממנה. $|\det(u,v,w)|$ הוא נפח **המקבילון**; הטטראדר
    שקודקודיו $0,u,v,w$ הוא שישית ממנו.
  remedy: { lesson: '0.2', label: 'דטרמיננטה כנפח' }

- id: MC-c0-volume-signed
  title: שוכחים את הערך המוחלט בנפח
  belief: >-
    נפח המקבילון ש-$u,v,w$ פורשים הוא $\det(u,v,w)$, גם כשהוא שלילי.
  truth: >-
    הנפח הוא $|\det(u,v,w)|$. הסימן של $\det(u,v,w)$ אומר משהו אחר: אם השלשה $u,v,w$ ימנית (חיובי) או שמאלית (שלילי).
  remedy: { lesson: '0.2', label: 'דטרמיננטה כנפח עם סימן' }

- id: MC-c0-triple-order-irrelevant
  title: חושבים שסדר הגורמים במכפלה המשולשת לא משנה
  belief: >-
    $u\cdot(v\times w)$ לא תלויה בסדר שבו כותבים את שלושת הווקטורים.
  truth: >-
    $u\cdot(v\times w)=\det(u,v,w)$. החלפה מעגלית לא משנה אותה, אבל החלפה של שני וקטורים הופכת סימן:
    $v\cdot(u\times w)=-\,u\cdot(v\times w)$.
  remedy: { lesson: '0.2', label: 'המכפלה המשולשת' }

- id: MC-c0-orthogonal-any-invertible
  title: חושבים שלמטריצה אורתוגונלית יכולה להיות כל דטרמיננטה שונה מאפס
  belief: >-
    מטריצה אורתוגונלית היא פשוט מטריצה הפיכה, ולכן הדטרמיננטה שלה יכולה להיות כל מספר שונה מאפס.
  truth: >-
    $A^{T}A=I$ נותן $(\det A)^2=\det(A^{T}A)=1$, ולכן $\det A=\pm1$. ההפך לא נכון: $\det A=\pm1$ לא גורר אורתוגונליות.
  remedy: { lesson: '0.2', label: 'מטריצות אורתוגונליות' }

- id: MC-c0-orthogonal-is-rotation
  title: חושבים שכל מטריצה אורתוגונלית היא סיבוב
  belief: >-
    מטריצה אורתוגונלית מסובבת את המרחב, ולכן שומרת גם על הכיוון (ימני נשאר ימני).
  truth: >-
    מטריצה אורתוגונלית עם $\det A=1$ היא סיבוב; עם $\det A=-1$ היא הופכת כיוון (שיקוף, או שיקוף אחרי סיבוב). למשל
    $\begin{pmatrix}0&1\\1&0\end{pmatrix}$ היא השיקוף בישר $y=x$.
  remedy: { lesson: '0.2', label: 'סיבוב מול שיקוף' }

- id: MC-c0-det-one-is-rotation
  title: חושבים שדטרמיננטה אחת מבטיחה סיבוב
  belief: >-
    כל מטריצה עם $\det A=1$ היא סיבוב, ולכן שומרת על אורכים.
  truth: >-
    $\det A=1$ אומר רק שהנפח והכיוון נשמרים. מטריצת הגזירה $\begin{pmatrix}1&1\\0&1\end{pmatrix}$ ו-$\operatorname{diag}(2,\frac12)$
    הן עם דטרמיננטה $1$ ומשנות אורכים. סיבוב צריך גם $A^{T}A=I$.
  remedy: { lesson: '0.2', label: 'מטריצות אורתוגונליות' }

- id: MC-c0-translation-preserves-inner
  title: חושבים שתנועה קשיחה שומרת על מכפלה פנימית של נקודות
  belief: >-
    תנועה קשיחה $F(x)=Ax+b$ מקיימת $\langle F(x),F(y)\rangle=\langle x,y\rangle$, ובפרט $F(0)=0$.
  truth: >-
    ההזזה ב-$b$ לא שומרת על מכפלות פנימיות של נקודות ולא על הראשית. נשמרים המרחקים והמכפלות הפנימיות של **הפרשים**:
    $\langle F(x)-F(z),F(y)-F(z)\rangle=\langle x-z,y-z\rangle$, ולכן גם זוויות.
  remedy: { lesson: '0.2', label: 'תנועה קשיחה: הזזה ומטריצה אורתוגונלית' }

- id: MC-c0-cross-rigid-invariant
  title: חושבים שכל מטריצה אורתוגונלית מתחלפת עם המכפלה הווקטורית
  belief: >-
    לכל מטריצה אורתוגונלית $A$ ולכל $u,v$: $(Au)\times(Av)=A(u\times v)$.
  truth: >-
    לכל מטריצה אורתוגונלית $(Au)\times(Av)=\det(A)\,A(u\times v)$. סיבוב מתחלף עם המכפלה הווקטורית; שיקוף הופך את
    הסימן. למשל $A=-I$: $(-u)\times(-v)=u\times v=-A(u\times v)$.
  remedy: { lesson: '0.2', label: 'מכפלה וקטורית תחת סיבוב ושיקוף' }

- id: MC-c0-eigen-diagonal
  title: קוראים את הערכים העצמיים מהאלכסון
  belief: >-
    הערכים העצמיים של מטריצה הם האיברים שעל האלכסון שלה.
  truth: >-
    זה נכון רק למטריצה משולשית או אלכסונית. באופן כללי פותרים $\det(A-\lambda I)=0$: ל-$\begin{pmatrix}1&2\\2&-2\end{pmatrix}$
    הערכים העצמיים הם $2$ ו-$-3$, לא $1$ ו-$-2$.
  remedy: { lesson: '0.2', label: 'המשפט הספקטרלי' }

- id: MC-c0-distinct-eigen-orthogonal
  title: חושבים שערכים עצמיים שונים תמיד נותנים וקטורים עצמיים ניצבים
  belief: >-
    לכל מטריצה, וקטורים עצמיים של ערכים עצמיים שונים ניצבים זה לזה.
  truth: >-
    ערכים עצמיים שונים נותנים וקטורים עצמיים **בלתי תלויים**. ניצבות דורשת סימטריה: ל-$\begin{pmatrix}1&1\\0&2\end{pmatrix}$
    הווקטורים העצמיים הם $(1,0)$ ו-$(1,1)$, שאינם ניצבים.
  remedy: { lesson: '0.2', label: 'המשפט הספקטרלי: למה צריך סימטריה' }

- id: MC-c0-quadratic-max-absolute
  title: חושבים שהמקסימום של תבנית ריבועית על ספרת היחידה הוא הערך העצמי הגדול בערכו המוחלט
  belief: >-
    המקסימום של $x^{T}Ax$ על $\|x\|=1$ הוא הערך העצמי שערכו המוחלט הכי גדול, או האיבר הגדול באלכסון.
  truth: >-
    בבסיס אורתונורמלי של וקטורים עצמיים $x^{T}Ax=\sum\lambda_i y_i^2$ עם $\sum y_i^2=1$. לכן המקסימום הוא הערך העצמי
    **הגדול ביותר** והמינימום הוא הקטן ביותר, עם הסימנים שלהם.
  remedy: { lesson: '0.2', label: 'המשפט הספקטרלי ותבניות ריבועיות' }

- id: MC-c0-quadratic-form-matrix
  title: שמים את כל המקדם של האיבר המעורב בשני המקומות שמחוץ לאלכסון
  belief: >-
    המטריצה הסימטרית של $ax^2+bxy+cy^2$ היא $\begin{pmatrix}a&b\\b&c\end{pmatrix}$.
  truth: >-
    $x^{T}\begin{pmatrix}a&\beta\\\beta&c\end{pmatrix}x=ax^2+2\beta xy+cy^2$, ולכן $\beta=\frac b2$: המקדם של $xy$ מתחלק
    בין שני האיברים שמחוץ לאלכסון. בודקים בהצבה של $(1,1)$.
  remedy: { lesson: '0.2', label: 'המשפט הספקטרלי ותבניות ריבועיות' }

- id: MC-c0-orthogonal-by-pattern
  title: מזהים מטריצה אורתוגונלית לפי צורת האיברים ולא לפי העמודות
  belief: >-
    מטריצה אורתוגונלית נראית כמו מטריצת סיבוב: איברים שונים מאפס על האלכסון, וקוסינוסים וסינוסים.
  truth: >-
    $A$ אורתוגונלית אם $A^{T}A=I$, כלומר העמודות שלה אורתונורמליות. מטריצות תמורה, כמו
    $\begin{pmatrix}0&1\\1&0\end{pmatrix}$, אורתוגונליות אף שהאלכסון שלהן אפס.
  remedy: { lesson: '0.2', label: 'מטריצות אורתוגונליות' }

- id: MC-c0-rigid-is-translation
  title: חושבים שתנועה קשיחה רק מזיזה ולכן לא משנה וקטורים
  belief: >-
    תנועה קשיחה $F(x)=Ax+b$ רק מזיזה את המסילה, ולכן $(F\circ\gamma)'=\gamma'$.
  truth: >-
    ההזזה $b$ נעלמת בגזירה, אבל $A$ נשארת: $(F\circ\gamma)'(t)=A\gamma'(t)$. וקטור המהירות מסתובב (או משתקף); רק האורך שלו
    נשמר, כי $\|Av\|=\|v\|$.
  remedy: { lesson: '0.2', label: 'תנועה קשיחה: הזזה ומטריצה אורתוגונלית' }

- id: MC-c0-triple-not-determinant
  title: לא מזהים את המכפלה המשולשת כדטרמיננטה
  belief: >-
    $u\cdot(v\times w)$ ו-$w\cdot(u\times v)$ הם מספרים בלתי קשורים, ואי אפשר לחשב אחד מהשני בלי הווקטורים עצמם.
  truth: >-
    $u\cdot(v\times w)=\det(u,v,w)$, הדטרמיננטה של המטריצה שהשורות שלה $u,v,w$. כל מכפלה משולשת של אותם שלושה וקטורים
    היא אותה דטרמיננטה עם השורות בסדר אחר, כלומר אותו מספר כפול הסימן של התמורה.
  remedy: { lesson: '0.2', label: 'המכפלה המשולשת' }
