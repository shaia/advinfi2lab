# Misconceptions first detected in lesson 11.3 (the Picard–Lindelöf theorem and Picard iterates).
- id: MC-c11-interval-is-a
  title: חושבים שהפתרון מובטח על כל רוחב המלבן
  belief: >-
    משפט הקיום מבטיח פתרון בכל הקטע $|t-t_0|\le a$, כלומר $h=a$.
  truth: >-
    הפתרון עלול לצאת מהמלבן לפני הזמן $a$: הוא זז לכל היותר בקצב $M$, ולכן מובטח שיישאר בגובה $b$ רק עד הזמן
    $\frac bM$. לכן $h=\min(a,\frac bM)$. עבור $y'=y^2$, $y(0)=1$, $a=2$, $b=1$ הפתרון $\frac1{1-t}$ יוצא
    מהמלבן ב-$t=\frac12$.
  remedy: { lesson: '11.3', label: 'אורך קטע הקיום: למה b חלקי M' }

- id: MC-c11-continuity-gives-uniqueness
  title: חושבים שרציפות של אגף ימין מבטיחה יחידות
  belief: >-
    אם $f$ רציפה, לבעיית ההתחלה יש פתרון יחיד.
  truth: >-
    יחידות דורשת יותר, למשל תנאי ליפשיץ. $f=3y^{2/3}$ רציפה, ול-$y'=3y^{2/3}$, $y(0)=0$ יש אינסוף פתרונות.
  remedy: { lesson: '11.3', label: 'מה כל הנחה נותנת: רציפות וליפשיץ' }

- id: MC-c11-h-is-exact-interval
  title: חושבים שקטע הקיום המובטח הוא הקטע שבו הפתרון באמת קיים
  belief: >-
    הפתרון קיים בדיוק בקטע $|t-t_0|\le h$ שהמשפט נותן, ומחוצה לו הוא (או האיטרציות) כבר לא קיים.
  truth: >-
    $h$ הוא **הבטחה**, חסם מלרע. עבור $y'=y^2$, $y(0)=1$ המשפט נותן לכל היותר $h=\frac14$, והפתרון $\frac1{1-t}$
    קיים בכל $(-\infty,1)$.
  remedy: { lesson: '11.3', label: 'הקטע המובטח והקטע האמיתי' }

- id: MC-c11-h-conditions-mixed
  title: מבלבלים בין התנאי h קטן מ-b חלקי M לבין תנאי הכיווץ
  belief: >-
    התנאי $h\le\frac bM$ נועד לכך שההעתקה $T$ תהיה מכווצת; או: כיווץ דורש תמיד $hL<1$.
  truth: >-
    $h\le\frac bM$ מבטיח ש-$T$ מעבירה את הכדור הסגור לתוך עצמו (הגרף נשאר במלבן). הכיווץ בא מתנאי ליפשיץ: בנורמת
    הסופרמום הרגילה הוא דורש $hL<1$, ובנורמה הממושקלת $e^{-2L|t-t_0|}$ הוא מתקיים תמיד עם קבוע $\frac12$.
  remedy: { lesson: '11.3', label: 'ההוכחה: שני תפקידים, שני תנאים' }

- id: MC-c11-T-on-whole-space
  title: מפעילים את העתקת פיקאר על כל מרחב הפונקציות הרציפות
  belief: >-
    בהוכחה אפשר לעבוד על כל $C[t_0-h,t_0+h]$.
  truth: >-
    $f$ נתונה (וחסומה וליפשיצית) רק במלבן $R$, ולכן $Ty$ מוגדרת רק כשהגרף של $y$ במלבן. עובדים על הכדור הסגור
    $\{y:\ \|y-y_0\|_\infty\le b\}$, שהוא תת-קבוצה סגורה של מרחב שלם ולכן שלם.
  remedy: { lesson: '11.3', label: 'המרחב שעליו מפעילים את בנך' }

- id: MC-c11-C1-space
  title: מחפשים את נקודת השבת במרחב הפונקציות הגזירות
  belief: >-
    כי מחפשים פתרון גזיר, עובדים במרחב הפונקציות הגזירות ברציפות עם נורמת הסופרמום.
  truth: >-
    המרחב הזה אינו שלם בנורמת הסופרמום: $\sqrt{t^2+\frac1n}\to|t|$ במידה שווה. עובדים על פונקציות רציפות, והגזירות
    של נקודת השבת באה מהשקילות של שיעור 11.1.
  remedy: { lesson: '11.3', label: 'למה פונקציות רציפות ולא גזירות' }

- id: MC-c11-weighted-norm-incomplete
  title: חושבים שהנורמה הממושקלת הורסת את השלמות
  belief: >-
    עם הנורמה $\max e^{-2L|t-t_0|}|y(t)|$ המרחב כבר אינו שלם, ולכן אי אפשר להפעיל את בנך.
  truth: >-
    $e^{-2Lh}\|y\|_\infty\le\|y\|_w\le\|y\|_\infty$: הנורמות שקולות, ולכן אותן סדרות קושי ואותם גבולות. המרחב שלם
    גם בנורמה הממושקלת.
  remedy: { lesson: '11.3', label: 'הנורמה הממושקלת' }

- id: MC-c11-picard-index
  title: מתבלבלים במספור איטרציות פיקאר
  belief: >-
    $y_1$ היא כבר האיטרציה השנייה, או ש-$y_k$ מכילה $k$ איברים של הטור.
  truth: >-
    $y_0\equiv y_0$ קבועה, ו-$y_{k+1}=Ty_k$. עבור $y'=y$, $y(0)=1$: $y_1=1+t$, $y_2=1+t+\frac{t^2}2$, כלומר $y_k$ היא
    הסכום החלקי עד $t^k$.
  remedy: { lesson: '11.3', label: 'איטרציות פיקאר: המספור' }

- id: MC-c11-iterate-is-solution
  title: מחליפים קירוב בפתרון עצמו
  belief: >-
    איטרציית פיקאר, או כל קירוב אחר, היא הפתרון, או שהערך שלה שווה לערך של הפתרון.
  truth: >-
    כל איטרציה היא קירוב; הפתרון הוא הגבול. עבור $y'=t+y$, $y(0)=0$: $y_3(1)=\frac{17}{24}$ והפתרון
    $y(1)=e-2$.
  remedy: { lesson: '11.3', label: 'איטרציות ופתרון' }

- id: MC-c11-uniform-on-R
  title: מסיקים התכנסות במידה שווה על כל הישר מהתכנסות על כל קטע חסום
  belief: >-
    אם האיטרציות מתכנסות במידה שווה בכל קטע חסום והפתרון קיים על כל הישר, הן מתכנסות במידה שווה על כל הישר.
  truth: >-
    עבור $y'=y$, $y(0)=1$ ההפרש $e^t-y_k(t)$ אינו חסום על $\mathbb{R}$ לאף $k$. ההתכנסות במידה שווה היא על כל קטע
    חסום, לא על כל הישר.
  remedy: { lesson: '11.3', label: 'איפה האיטרציות מתכנסות במידה שווה' }

- id: MC-c11-banach-bound-formula
  title: טועים בנוסחת חסם השגיאה של בנך
  belief: >-
    החסם הוא $q^n d(x_1,x_0)$, או $\frac{q^{n+1}}{1-q}d(x_1,x_0)$, או $\frac{d(x_1,x_0)}{1-q}$ בלי חזקה.
  truth: >-
    $d(x_n,x^*)\le\frac{q^n}{1-q}\,d(x_1,x_0)$: סכום הצעדים $d(x_k,x_{k+1})\le q^k d(x_1,x_0)$ מ-$k=n$ עד אינסוף.
    באיטרציות פיקאר עם $q=hL$ ובנורמת הסופרמום: $\|y_n-y\|_\infty\le\frac{(hL)^n}{1-hL}\|y_1-y_0\|_\infty$.
  remedy: { lesson: '11.3', label: 'חסם השגיאה של איטרציות פיקאר' }
