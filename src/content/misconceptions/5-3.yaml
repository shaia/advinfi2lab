# Misconceptions first detected in lesson 5.3 (surface area).
- id: MC-c5-area-no-root
  title: שוכחים את השורש בנוסחת השטח
  belief: >-
    שטח משטח הוא $\iint_D(EG-F^2)\,du\,dv$, או לגרף $\iint_D(1+f_x^2+f_y^2)\,dx\,dy$.
  truth: >-
    אלמנט השטח הוא אורך המכפלה הווקטורית, $\|\sigma_u\times\sigma_v\|=\sqrt{EG-F^2}$, ולכן
    $$A=\iint_D\sqrt{EG-F^2}\,du\,dv.$$
    בדיקת יחידות: אם מכפילים את המשטח פי $\lambda$, השטח צריך לגדול פי $\lambda^2$; בלי השורש הוא גדל פי
    $\lambda^4$.
  remedy: { lesson: '5.3', label: 'אלמנט השטח: אורך המכפלה הווקטורית' }

- id: MC-c5-area-ignore-F
  title: מחשבים שטח בלי המקדם F
  belief: >-
    אלמנט השטח הוא $\sqrt{EG}$, כלומר $\|\sigma_u\|\,\|\sigma_v\|$, גם כשהקווים הפרמטריים אינם ניצבים.
  truth: >-
    שטח מקבילית הוא $\|a\|\|b\|\sin\alpha$, לא $\|a\|\|b\|$. לפי זהות לגרנז׳
    $\|\sigma_u\times\sigma_v\|^2=EG-F^2$, וזה שווה ל-$EG$ רק כש-$F=0$. למשל במישור עם
    $\sigma(u,v)=(u+v,v,0)$: $E=1$, $F=1$, $G=2$, ואלמנט השטח הוא 1 ולא $\sqrt2$.
  remedy: { lesson: '5.3', label: 'זהות לגרנז׳ ומקדם F' }

- id: MC-c5-area-depends-on-param
  title: חושבים שהשטח תלוי בפרמטריזציה
  belief: >-
    פרמטריזציה שהנגזרות שלה ארוכות יותר נותנת שטח גדול יותר; למשל $\tilde\sigma(s,t)=\sigma(2s,t)$ מכפילה
    את השטח.
  truth: >-
    בהחלפת פרמטרים $\psi$ מתקיים $\|\tilde\sigma_s\times\tilde\sigma_t\|=|\det D\psi|\,\|\sigma_u\times\sigma_v\|\circ\psi$,
    והתחום משתנה בדיוק בגורם הזה, לפי נוסחת החלפת המשתנים. אם $\sigma(2s,t)$, אלמנט השטח גדל פי 2 והתחום
    קטן פי 2. שטח שונה מתקבל רק מפרמטריזציה שאינה חד-חד-ערכית, וזו אינה החלפת פרמטרים.
  remedy: { lesson: '5.3', label: 'השטח אינו תלוי בפרמטריזציה' }

- id: MC-c5-area-vs-volume
  title: מבלבלים בין שטח משטח לנפח
  belief: >-
    שטח הגרף של $f$ מעל $D$ הוא $\iint_D f$, או ששטח הטורוס הוא הנפח שלו $2\pi^2Rr^2$.
  truth: >-
    $\iint_D f$ הוא נפח (מתחת לגרף), ושטח הגרף הוא $\iint_D\sqrt{1+f_x^2+f_y^2}$: הוא תלוי רק בשיפועים,
    ולא משתנה כשמוסיפים קבוע ל-$f$. לטורוס $A=4\pi^2Rr$ ו-$V=2\pi^2Rr^2$, ושימו לב שהם שונים ביחידות.
  remedy: { lesson: '5.3', label: 'שטח גרף: תלוי בשיפועים בלבד' }

- id: MC-c5-graph-forget-one
  title: שוכחים את האחד בנוסחת השטח של גרף
  belief: >-
    שטח הגרף של $f$ הוא $\iint_D\sqrt{f_x^2+f_y^2}$, כלומר אורך הגרדיאנט.
  truth: >-
    לגרף $\sigma(x,y)=(x,y,f(x,y))$ מתקבל $\sigma_x\times\sigma_y=(-f_x,-f_y,1)$, ולכן
    $\|\sigma_x\times\sigma_y\|=\sqrt{1+f_x^2+f_y^2}$. בדיקה: לפונקציה קבועה הגרף הוא עותק של $D$ ושטחו שטח
    $D$, לא אפס.
  remedy: { lesson: '5.3', label: 'שטח של גרף' }

- id: MC-c5-revolution-no-arclength
  title: שוכחים את אורך הקשת בשטח של משטח סיבוב
  belief: >-
    שטח המשטח שמתקבל מסיבוב הגרף של $f\ge0$ סביב ציר $x$ הוא $2\pi\int_a^bf(x)\,dx$.
  truth: >-
    כל רצועה היא בקירוב קטע של חרוט ברוחב **אורך הקשת** $\sqrt{1+f'(x)^2}\,dx$, ולכן
    $$A=2\pi\int_a^bf(x)\sqrt{1+f'(x)^2}\,dx.$$
    $2\pi\int f\,dx$ נכון רק כש-$f$ קבועה (גליל).
  remedy: { lesson: '5.3', label: 'משטח סיבוב: הרצועה ברוחב אורך קשת' }

- id: MC-c5-area-extrinsic
  title: חושבים שכיפוף של משטח משנה את שטחו
  belief: >-
    השטח תלוי באופן שבו המשטח יושב במרחב: אם מגלגלים מלבן של נייר לגליל, השטח משתנה.
  truth: >-
    השטח הוא $\iint_D\sqrt{EG-F^2}\,du\,dv$, ולכן תלוי רק בתבנית הראשונה: זו תכונה פנימית. איזומטריה שומרת על
    $E,F,G$ (שיעור 3.5), ולכן גם על השטח. גלגול בלי מתיחה שומר על שטח; מה שמשנה שטח הוא מתיחה.
  remedy: { lesson: '5.3', label: 'השטח תלוי רק בתבנית הראשונה' }

- id: MC-c5-equal-area-congruent
  title: חושבים ששטחים שווים מחייבים משטחים חופפים
  belief: >-
    אם לשני גרפים מעל אותו תחום אותו שטח, הם אותו משטח עד כדי תנועה קשיחה.
  truth: >-
    שטח הגרף תלוי רק ב-$f_x^2+f_y^2$. הגרפים של $\frac12(x^2+y^2)$ ושל $xy$ מעל עיגול מרוכז בראשית הם בעלי
    אותו שטח, אבל בראשית לראשון עקמומיות גאוס חיובית ולשני שלילית, ולכן אינם חופפים.
  remedy: { lesson: '5.3', label: 'שטח של גרף: רק אורך הגרדיאנט משנה' }

- id: MC-c5-equal-integrals-pointwise
  title: מסיקים מאינטגרלים שווים שהאינטגרנדים שווים
  belief: >-
    אם $\iint_Dg=\iint_Dh$ אז $g=h$ בכל נקודה; לכן שני גרפים שווי שטח חייבים להיות בעלי אותו $f_x^2+f_y^2$ בכל
    נקודה.
  truth: >-
    שוויון נקודתי של האינטגרנדים מספיק לשוויון האינטגרלים, אבל אינו נחוץ: $\int_0^1x\,dx=\int_0^1\frac12\,dx$. כדי
    להראות ששני שטחים שונים משווים את האינטגרנדים באי-שוויון: אם $g\le h$ בכל מקום ו-$g<h$ על קבוצה פתוחה, עם
    רציפות, אז $\iint g<\iint h$.
  remedy: { lesson: '5.3', label: 'השוואת שטחים של גרפים בעזרת אי-שוויון בין האינטגרנדים' }
