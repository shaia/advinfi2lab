# Misconceptions first detected in lesson 10.4 (uniform convergence of Fourier series).
- id: MC-c10-smooth-on-interval-uniform
  title: חושבים שפונקציה חלקה על הקטע מינוס פאי עד פאי תמיד מקבלת התכנסות במידה שווה
  belief: >-
    $f(x)=x$ (או $e^x$, או $x^3$) גזירה ברציפות על $[-\pi,\pi]$, ולכן טור פורייה שלה מתכנס אליה במידה שווה.
  truth: >-
    המשפט מדבר על פונקציה רציפה וגזירה למקוטעין **על המעגל**, כלומר על ההמשכה המחזורית. אם
    $f(-\pi)\ne f(\pi)$ להמשכה יש קפיצה ב-$\pm\pi$, ושם אין התכנסות במידה שווה (עבור $x$: $S_Nf(\pi)=0\ne\pi$).
  remedy: { lesson: '10.4', label: 'רציפות על המעגל, לא רק על הקטע' }

- id: MC-c10-uniform-limit-can-jump
  title: חושבים שגבול במידה שווה של פונקציות רציפות יכול לקפוץ
  belief: >-
    סדרה של פולינומים טריגונומטריים יכולה להתכנס במידה שווה לגל ריבועי, אם רק המקדמים מתאימים.
  truth: >-
    גבול במידה שווה של פונקציות רציפות הוא רציף (אינפי 2). כל $S_Nf$ רציף, ולכן אם $f$ קופצת, אף סדרה של
    פולינומים טריגונומטריים (או פולינומים) לא מתכנסת אליה במידה שווה.
  remedy: { lesson: '10.4', label: 'קפיצה מונעת התכנסות במידה שווה' }

- id: MC-c10-pointwise-everywhere-uniform
  title: חושבים שהתכנסות בכל נקודה היא התכנסות במידה שווה
  belief: >-
    אם $S_Nf(x)\to f(x)$ לכל $x$, אז גם $\sup|f-S_Nf|\to0$, ומותר לעשות אינטגרציה איבר-איבר.
  truth: >-
    לגל ריבועי $S_Nf(x)\to f(x)$ לכל $x\ne0$, אבל $\sup_{0<x<\pi}|f-S_Nf|\ge1$ לכל $N$, כי $S_Nf$ רציף
    ו-$S_Nf(0)=0$. אינטגרציה איבר-איבר מוצדקת בהתכנסות במידה שווה (או בנורמה של $H$).
  remedy: { lesson: '10.4', label: 'נקודתית מול במידה שווה' }

- id: MC-c10-derivative-coeffs-pairing
  title: טועים בקשר בין מקדמי הנגזרת למקדמי הפונקציה
  belief: >-
    $a_n(f')=n\,a_n(f)$ ו-$b_n(f')=n\,b_n(f)$, או $b_n(f')=n\,a_n(f)$ בלי סימן.
  truth: >-
    לפונקציה רציפה, מחזורית וגזירה למקוטעין, אינטגרציה בחלקים (בלי איברי שפה, בגלל המחזוריות) נותנת
    $a_n(f')=n\,b_n(f)$ ו-$b_n(f')=-n\,a_n(f)$: הנגזרת מחליפה קוסינוס בסינוס ומכפילה ב-$n$.
  remedy: { lesson: '10.4', label: 'מקדמי הנגזרת' }

- id: MC-c10-corner-blocks-uniform
  title: חושבים שפינה בגרף מונעת התכנסות במידה שווה
  belief: >-
    ל-$|x|$ או ל-$|\sin x|$ אין נגזרת ב-0, ולכן הטור שלהן לא מתכנס במידה שווה.
  truth: >-
    פינה אינה קפיצה. פונקציה רציפה על המעגל וגזירה למקוטעין מקיימת $\sum(|a_n|+|b_n|)<\infty$ (קושי-שוורץ ובסל
    לנגזרת), ולכן הטור שלה מתכנס במידה שווה. ל-$|x|$: $\sum|a_n|=\frac\pi2$.
  remedy: { lesson: '10.4', label: 'פונקציה רציפה וגזירה למקוטעין על המעגל' }

- id: MC-c10-decay-smoothness
  title: טועים בקשר בין החלקות של הפונקציה לקצב הדעיכה של המקדמים
  belief: >-
    לכל פונקציה רציפה $|a_n|,|b_n|\le\frac Cn$ (למשל "כי כך אומרת למת רימן-לבג"); או שכל פונקציה חלקה נותנת דעיכה מהירה
    מכל חזקה של $\frac1n$; או שקצב הדעיכה של המקדמים לא אומר דבר על החלקות של הסכום.
  truth: >-
    למת רימן-לבג נותנת רק שאיפה לאפס, בלי קצב: לפונקציה הרציפה $\sum_k2^{-k/2}\sin(2^kx)$, $n\,b_n=\sqrt n$ ב-$n=2^k$. כל
    נגזרת רציפה על המעגל קונה גורם $\frac1n$: קפיצה ב-$f$ נותנת $\sim\frac1n$, פינה (קפיצה ב-$f'$) נותנת $\sim\frac1{n^2}$,
    קפיצה ב-$f''$ נותנת $\sim\frac1{n^3}$. ובכיוון ההפוך, $\sum n(|a_n|+|b_n|)<\infty$ נותן סכום גזיר ברציפות.
  remedy: { lesson: '10.4', label: 'חלקות וקצב הדעיכה של המקדמים' }

- id: MC-c10-termwise-always
  title: גוזרים טור פורייה איבר איבר בלי לבדוק תנאים
  belief: >-
    אם טור פורייה מתכנס ל-$f$ ו-$f$ גזירה, הטור הנגזר מתכנס ל-$f'$; ופעולות איבר איבר מותרות כשהטור מתכנס נקודתית.
  truth: >-
    הטור הנגזר הוא טור פורייה של $f'$ רק כשההמשכה המחזורית של $f$ רציפה (וגזירה למקוטעין), כי רק אז
    $a_n(f')=n\,b_n(f)$ ו-$b_n(f')=-n\,a_n(f)$ בלי איבר שפה. לטור של $x$ הגזירה נותנת $2\sum(-1)^{n+1}\cos nx$, שמתבדר בכל
    נקודה.
  remedy: { lesson: '10.4', label: 'גזירה איבר איבר: מתי מותר' }

- id: MC-c10-termwise-int-needs-uniform
  title: חושבים שאינטגרציה איבר איבר של טור פורייה דורשת התכנסות במידה שווה
  belief: >-
    אי אפשר לבצע אינטגרציה איבר איבר לטור של $x$, כי הוא אינו מתכנס במידה שווה.
  truth: >-
    התכנסות במידה שווה היא תנאי מספיק כללי לטורי פונקציות, אבל לטור פורייה האינטגרציה מותרת תמיד: ל-$f$ רציפה למקוטעין הפונקציה
    $F(x)=\int_0^x\left(f-\frac{a_0}2\right)$ רציפה על המעגל וגזירה למקוטעין, ולכן הטור שלה, שמקדמיו הם מקדמי $f$ חלקי $n$,
    מתכנס אליה במידה שווה.
  remedy: { lesson: '10.4', label: 'אינטגרציה איבר איבר: מתי מותר' }

- id: MC-c10-integrate-constant-term
  title: באינטגרציה איבר איבר שוכחים את קבוע האינטגרציה
  belief: >-
    $\int_0^x\sin nt\,dt=-\frac{\cos nx}n$, ולכן האינטגרל של הטור הוא רק טור הקוסינוסים $-\sum\frac{b_n}n\cos nx$.
  truth: >-
    $\int_0^x\sin nt\,dt=\frac{1-\cos nx}n$: הגבול התחתון תורם קבוע לכל איבר, ובסך הכול $\sum\frac{b_n}n$. בודקים ב-$x=0$:
    שני האגפים חייבים להתאפס שם.
  remedy: { lesson: '10.4', label: 'אינטגרציה איבר איבר וקבוע האינטגרציה' }
