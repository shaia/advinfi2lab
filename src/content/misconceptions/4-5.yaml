# Misconceptions first detected in lesson 4.5 (Gauss and mean curvature, classifying points).
- id: MC-c4-K-sqrt-denominator
  title: מחלקים בשורש של EG פחות F בריבוע בנוסחה של עקמומיות גאוס
  belief: >-
    $K=\frac{LN-M^2}{\sqrt{EG-F^2}}$, כאילו המכנה הוא $\|\sigma_u\times\sigma_v\|=\sqrt{EG-F^2}$.
  truth: >-
    $K=\det(Q_1^{-1}Q_2)=\frac{LN-M^2}{EG-F^2}$, בלי שורש: דטרמיננטה חלקי דטרמיננטה. $\sqrt{EG-F^2}$ הוא שטח המקבילית
    שפורשים $\sigma_u,\sigma_v$, ואין לו מקום בעקמומיות. בדיקת
    יחידות: $L,M,N$ הם מסדר אורך, $E,F,G$ מסדר אורך בריבוע, ו-$K$ מסדר אורך בחזקת מינוס 2.
  remedy: { lesson: '4.5', label: 'עקמומיות גאוס כדטרמיננטה של אופרטור הצורה' }

- id: MC-c4-K-numerator-only
  title: שוכחים את המכנה בנוסחה של עקמומיות גאוס
  belief: >-
    $K=LN-M^2$ בכל פרמטריזציה, ולגרף $z=f(x,y)$ בכל נקודה $K=f_{xx}f_{yy}-f_{xy}^2$.
  truth: >-
    $K=\frac{LN-M^2}{EG-F^2}$. המכנה הוא 1 רק כשהבסיס $\sigma_u,\sigma_v$ אורתונורמלי, למשל בגרף בנקודה שבה $\nabla f=0$.
    לגרף בנקודה כללית $K=\frac{f_{xx}f_{yy}-f_{xy}^2}{(1+f_x^2+f_y^2)^2}$.
  remedy: { lesson: '4.5', label: 'עקמומיות גאוס של גרף' }

- id: MC-c4-H-sum
  title: שוכחים לחלק ב-2 בעקמומיות הממוצעת
  belief: >-
    $H=\kappa_1+\kappa_2$, כלומר העקבה של אופרטור הצורה.
  truth: >-
    $H=\frac{\kappa_1+\kappa_2}{2}$, הממוצע. כך לספרה ברדיוס $R$ (עם הנורמל פנימה) $H=\frac1R$, כמו העקמומיות של כל
    חתך נורמלי.
  remedy: { lesson: '4.5', label: 'עקמומיות ממוצעת: ממוצע, לא סכום' }

- id: MC-c4-K-changes-sign
  title: חושבים שעקמומיות גאוס מחליפה סימן כשהופכים את הנורמל
  belief: >-
    כל העקמומיויות של משטח תלויות בכיוון הנורמל, ולכן גם $K$ מחליפה סימן כשהופכים את $\hat{\mathbf N}$.
  truth: >-
    $\kappa_1$ ו-$\kappa_2$ שתיהן מחליפות סימן, ולכן המכפלה $K=\kappa_1\kappa_2$ לא משתנה (וגם $LN-M^2$ לא משתנה כשכל
    אחד מהגורמים מחליף סימן). רק $H$, $\kappa_n$ ו-$\kappa_i$ מחליפות סימן.
  remedy: { lesson: '4.5', label: 'מה משתנה כשהופכים את הנורמל ומה לא' }

- id: MC-c4-K-zero-planar
  title: חושבים שעקמומיות גאוס אפס פירושה נקודה מישורית
  belief: >-
    אם $K(P)=0$ אז המשטח שטוח ליד $P$, כלומר $P$ נקודה מישורית.
  truth: >-
    $K=0$ פירושו שאחת העקמומיויות הראשיות אפס. אם רק אחת מהן אפס הנקודה **פרבולית** (כל נקודה של הגליל); נקודה
    מישורית היא נקודה שבה **שתיהן** אפס, כלומר $Q_2=0$.
  remedy: { lesson: '4.5', label: 'נקודה פרבולית מול נקודה מישורית' }

- id: MC-c4-parabolic-one-side
  title: חושבים שהסוג של הנקודה קובע תמיד אם המשטח בצד אחד של המישור המשיק
  belief: >-
    ליד נקודה פרבולית המשטח תמיד בצד אחד של המישור המשיק (כמו הגליל), וליד נקודה מישורית הוא תמיד מתנהג כמו מישור.
  truth: >-
    התבנית השנייה מכריעה רק כשהיא מוגדרת חיובית או שלילית (אליפטית: צד אחד) או מקבלת ערכים חיוביים ושליליים (היפרבולית:
    שני צדדים). בנקודה פרבולית
    או מישורית קובעים איברים מסדר גבוה: $z=x^2+y^3$ פרבולית בראשית וחוצה את המישור המשיק לאורך ציר $y$, ו-$z=x^4+y^4$
    מישורית בראשית ונמצאת כולה מעליו.
  remedy: { lesson: '4.5', label: 'צורת המשטח ליד נקודה מכל סוג' }

- id: MC-c4-planar-not-umbilic
  title: חושבים שנקודה טבורית היא תמיד נקודה כמו על ספרה
  belief: >-
    נקודה טבורית היא נקודה עם $K>0$ שבה המשטח נראה כמו ספרה; נקודה מישורית אינה טבורית.
  truth: >-
    טבורית פירושו $\kappa_1=\kappa_2$, כלומר $Q_2=\lambda Q_1$, ובפרט $H^2=K$. גם $\lambda=0$ מותר: כל נקודה מישורית
    היא טבורית, וכל נקודה של המישור טבורית.
  remedy: { lesson: '4.5', label: 'נקודה טבורית: Q₂ כפולה של Q₁' }

- id: MC-c4-K-is-principal
  title: מבלבלים בין עקמומיות גאוס לבין אחת העקמומיויות הראשיות
  belief: >-
    עקמומיות גאוס היא העקמומיות הנורמלית בכיוון מסוים, ולכן מסדר גודל של $\kappa_1$ או $\kappa_2$.
  truth: >-
    $K=\kappa_1\kappa_2$ היא **מכפלה**, מסדר אורך בחזקת מינוס 2. בספרה ברדיוס 2 עם הנורמל פנימה
    $\kappa_1=\kappa_2=\frac12$ ו-$K=\frac14$.
  remedy: { lesson: '4.5', label: 'K מכפלה, H ממוצע' }

- id: MC-c4-umbilic-global
  title: חושבים שנקודה טבורית היא תכונה של המשטח כולו, ולא של נקודה אחת
  belief: >-
    משטח שבו $K$ אינה קבועה, או מחליפה סימן, לא יכול להכיל נקודה טבורית; נקודה טבורית מופיעה רק במשטחים כמו ספרה
    או מישור.
  truth: >-
    טבורית היא תנאי נקודתי, $\kappa_1(P)=\kappa_2(P)$, ובודקים אותו בכל נקודה לחוד, למשל דרך $H^2-K=\frac{(\kappa_1-\kappa_2)^2}4$.
    לאליפסואיד סיבוב שאינו ספרה $K$ אינה קבועה, ושני הקטבים שלו טבוריים. בטורוס אין נקודה טבורית מסיבה אחרת:
    $\frac LE=-\frac{\cos v}{3+\cos v}$ לעולם אינו שווה ל-$\frac NG=-1$.
  remedy: { lesson: '4.5', label: 'נקודה טבורית: תנאי בנקודה אחת' }
