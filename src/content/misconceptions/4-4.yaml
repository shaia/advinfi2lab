# Misconceptions first detected in lesson 4.4 (principal curvatures and directions).
- id: MC-c4-principal-from-curves
  title: מגדירים עקמומיויות ראשיות כמקסימום ומינימום של עקמומיות המסילות
  belief: >-
    העקמומיויות הראשיות ב-$P$ הן המקסימום והמינימום של $\kappa$ על פני כל המסילות במשטח שעוברות ב-$P$.
  truth: >-
    העקמומיות $\kappa$ של מסילות דרך $P$ אינה חסומה (מעגלים קטנים מאוד על הספרה). העקמומיויות הראשיות הן המקסימום
    והמינימום של **העקמומיות הנורמלית** $\kappa_n(v)$ על פני הכיוונים $v$ במישור המשיק, והן חתומות.
  remedy: { lesson: '4.4', label: 'ההגדרה: קיצון של κₙ על מעגל הכיוונים' }

- id: MC-c4-eigen-of-Q2
  title: מחשבים עקמומיויות ראשיות כערכים העצמיים של מטריצת התבנית השנייה לבדה
  belief: >-
    העקמומיויות הראשיות הן הערכים העצמיים של $\begin{pmatrix}L&M\\M&N\end{pmatrix}$.
  truth: >-
    הן הערכים העצמיים של אופרטור הצורה, שמטריצתו בבסיס $\sigma_u,\sigma_v$ היא
    $\begin{pmatrix}E&F\\F&G\end{pmatrix}^{-1}\begin{pmatrix}L&M\\M&N\end{pmatrix}$, כלומר הפתרונות של
    $\det(Q_2-\lambda Q_1)=0$. רק כש-$E=G=1$, $F=0$ זה אותו דבר.
  remedy: { lesson: '4.4', label: 'אופרטור הצורה: Q₁ הפוכה כפול Q₂' }

- id: MC-c4-principal-coordinate-dirs
  title: חושבים שהכיוונים הראשיים הם תמיד כיווני הפרמטרים
  belief: >-
    הכיוונים הראשיים הם $\sigma_u$ ו-$\sigma_v$, כי שם מופיעים המקדמים $L$ ו-$N$.
  truth: >-
    זה נכון רק כש-$F=M=0$ (כמו בספרה, בגליל ובטורוס בפרמטריזציות הרגילות). בגרף $z=x^2+3xy-y^2$ בראשית
    $M=3\neq0$, והכיוונים הראשיים הם הווקטורים העצמיים של $\begin{pmatrix}2&3\\3&-2\end{pmatrix}$, לא הצירים.
  remedy: { lesson: '4.4', label: 'כיוונים ראשיים כווקטורים עצמיים' }

- id: MC-c4-orthogonal-in-coordinates
  title: בודקים ניצבות של כיוונים ראשיים במישור הפרמטרים במקום במישור המשיק
  belief: >-
    הכיוונים הראשיים $(a,b)$ ו-$(c,d)$ ניצבים פירושו $ac+bd=0$, ואם זה לא מתקיים נפלה טעות.
  truth: >-
    הניצבות היא של הווקטורים המשיקים $a\sigma_u+b\sigma_v$ ו-$c\sigma_u+d\sigma_v$, כלומר
    $Eac+F(ad+bc)+Gbd=0$. מטריצת אופרטור הצורה בבסיס $\sigma_u,\sigma_v$ אינה סימטרית כש-$Q_1\neq I$, והווקטורים
    העצמיים שלה ניצבים לפי $Q_1$, לא לפי המכפלה האוקלידית של $\mathbb R^2$.
  remedy: { lesson: '4.4', label: 'ניצבות הכיוונים הראשיים לפי Q₁' }

- id: MC-c4-euler-linear
  title: כותבים את נוסחת אוילר בלי ריבועים
  belief: >-
    $\kappa_n(\theta)=\kappa_1\cos\theta+\kappa_2\sin\theta$.
  truth: >-
    $\kappa_n(\theta)=\kappa_1\cos^2\theta+\kappa_2\sin^2\theta$: $\kappa_n$ היא תבנית ריבועית בווקטור היחידה
    $\cos\theta\,e_1+\sin\theta\,e_2$. בלי הריבועים $\kappa_n(\theta+\pi)\neq\kappa_n(\theta)$, אף שזה אותו כיוון.
  remedy: { lesson: '4.4', label: 'נוסחת אוילר' }

- id: MC-c4-euler-angle-swap
  title: מודדים את הזווית בנוסחת אוילר מהכיוון הראשי הלא נכון
  belief: >-
    הזווית $\theta$ בנוסחת אוילר נמדדת מכל אחד מהכיוונים הראשיים, והתוצאה אותה תוצאה.
  truth: >-
    בנוסחה $\kappa_1\cos^2\theta+\kappa_2\sin^2\theta$ הזווית נמדדת מהכיוון של $\kappa_1$. מדידה מהכיוון של $\kappa_2$
    מחליפה את $\cos^2$ ב-$\sin^2$, ונותנת מספר אחר (אלא אם $\theta=\frac\pi4$ או $\kappa_1=\kappa_2$).
  remedy: { lesson: '4.4', label: 'נוסחת אוילר: מאיפה מודדים את הזווית' }

- id: MC-c4-flip-keeps-order
  title: חושבים שהיפוך הנורמל משאיר את סדר העקמומיויות הראשיות
  belief: >-
    כשהופכים את $\hat{\mathbf N}$, העקמומיות הראשית הגדולה $\kappa_1$ הופכת ל-$-\kappa_1$ ונשארת הגדולה.
  truth: >-
    כל $\kappa_n$ מחליפה סימן, ולכן המקסימום החדש הוא $-\kappa_2$ והמינימום החדש $-\kappa_1$:
    $(\kappa_1,\kappa_2)\mapsto(-\kappa_2,-\kappa_1)$. הכיוונים הראשיים עצמם לא משתנים.
  remedy: { lesson: '4.4', label: 'עקמומיויות ראשיות והיפוך הנורמל' }

- id: MC-c4-always-two-principal-dirs
  title: חושבים שבכל נקודה יש בדיוק שני כיוונים ראשיים
  belief: >-
    בכל נקודה של משטח יש שני כיוונים ראשיים מסוימים, והם ניצבים.
  truth: >-
    בנקודה טבורית ($\kappa_1=\kappa_2$) אופרטור הצורה הוא כפולה של הזהות, $\kappa_n$ קבועה, ו**כל** כיוון ראשי. בכל
    נקודה של הספרה ושל המישור כך. רק בנקודה שאינה טבורית יש בדיוק שני כיוונים ראשיים, והם ניצבים.
  remedy: { lesson: '4.4', label: 'כיוונים ראשיים בנקודה טבורית' }
