# Misconceptions first detected in lesson 2.5 (enrichment: Lancret's theorem and spherical curves).
- id: MC-c2-generalized-helix-constant
  title: חושבים שסליל מוכלל חייב עקמומיות ופיתול קבועים
  belief: >-
    סליל מוכלל הוא סליל מעגלי, כלומר מסילה עם $\kappa$ ו-$\tau$ קבועים, או מסילה על גליל מעגלי.
  truth: >-
    סליל מוכלל מוגדר בכך שהמשיק יוצר זווית קבועה עם כיוון קבוע. לפי משפט לנקרה זה שקול לכך שהיחס $\frac\tau\kappa$ קבוע,
    לא כל אחד מהם. המעקה $(t,\cosh t,\sinh t)$ מקיים $\kappa=\tau=\frac{1}{2\cosh^2t}$, לא קבועות, והוא סליל מוכלל עם הציר
    $\mathbf e_z$.
  remedy: { lesson: '2.5', anchor: 'lancret-hyp', label: 'משפט לנקרה: שניהם משתנים, המנה קבועה' }

- id: MC-c2-lancret-ratio-is-cos
  title: מבלבלים בין היחס של הפיתול לעקמומיות לבין הקוסינוס של הזווית
  belief: >-
    בסליל מוכלל היחס $\frac\tau\kappa$ הוא הקוסינוס של הזווית $\theta$ בין המשיק לציר.
  truth: >-
    $\mathbf u=\cos\theta\,\mathbf t+\sin\theta\,\mathbf b$, וגזירה נותנת $\kappa\cos\theta=\tau\sin\theta$, כלומר
    $\frac\tau\kappa=\cot\theta$. לכן $\cos\theta=\frac{\tau}{\sqrt{\kappa^2+\tau^2}}$; כש-$\tau=\kappa$ הזווית $45^\circ$.
  remedy: { lesson: '2.5', anchor: 'lancret', label: 'משפט לנקרה: הציר והזווית' }

- id: MC-c2-lancret-ratio-inverted
  title: הופכים את היחס ומחשבים עקמומיות חלקי פיתול
  belief: >-
    המנה הקבועה במשפט לנקרה היא $\frac\kappa\tau$, ובסליל $(a\cos t,\ a\sin t,\ ht)$ היא $\frac ah$.
  truth: >-
    המנה במשפט היא $\frac\tau\kappa=\cot\theta$, הפיתול במונה. בסליל $\kappa=\frac{a}{a^2+h^2}$ ו-$\tau=\frac{h}{a^2+h^2}$, ולכן
    $\frac\tau\kappa=\frac ha$; המנה ההפוכה $\frac ah$ היא $\tan\theta$.
  remedy: { lesson: '2.5', anchor: 'lancret', label: 'משפט לנקרה: המנה והזווית' }

- id: MC-c2-spherical-kappa-any
  title: חושבים שמסילה על ספרה יכולה להיות בעלת עקמומיות קטנה כרצוננו
  belief: >-
    מסילה על ספרה ברדיוס $R$ יכולה להיות כמעט ישרה, עם $\kappa$ קטנה מ-$\frac1R$.
  truth: >-
    גזירה כפולה של $\|\gamma-\mathbf c\|^2=R^2$ נותנת $\kappa\,\mathbf n\cdot(\gamma-\mathbf c)=-1$, ולכן
    $\kappa=\frac{1}{|\mathbf n\cdot(\gamma-\mathbf c)|}\ge\frac1R$. על הספרה, המעגלים הגדולים, עם $\kappa=\frac1R$, הם המסילות הכי פחות עקומות.
  remedy: { lesson: '2.5', anchor: 'sphere-kappa', label: 'טענה 2.5.4: על ספרה κ ≥ 1/R' }
