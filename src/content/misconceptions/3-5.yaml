# Misconceptions first detected in lesson 3.5 (local isometries and intrinsic geometry).
- id: MC-c3-isometry-is-rigid-motion
  title: חושבים שאיזומטריה בין משטחים שומרת מרחקים במרחב
  belief: >-
    איזומטריה מקומית $f:S_1\to S_2$ מקיימת $\|f(p)-f(q)\|=\|p-q\|$, כלומר היא צמצום של תנועה קשיחה.
  truth: >-
    איזומטריה מקומית שומרת **אורכים של מסילות על המשטח**, לא מרחקים בקו ישר במרחב. גלגול דף לגליל משנה את המרחק
    במרחב בין שני קצות הדף (הם יכולים אפילו להיפגש), ושומר כל אורך של מסילה על הדף.
  remedy: { lesson: '3.5', anchor: 'local-isometry-def', label: 'ההגדרה של איזומטריה מקומית' }

- id: MC-c3-isometry-area-only
  title: חושבים שהעתקה ששומרת שטחים היא איזומטריה
  belief: >-
    אם העתקה בין משטחים שומרת את גודל השטח של כל מקבילית משיקה, היא איזומטריה.
  truth: >-
    שמירת שטח פירושה רק $\sqrt{EG-F^2}$ שווה. $(x,y)\mapsto(2x,\tfrac y2)$ במישור שומרת שטחים ומשנה אורכים: הקטע
    מ-$(0,0)$ ל-$(1,0)$ הופך לקטע באורך 2. איזומטריה צריכה את כל שלושת המקדמים $E,F,G$.
  remedy: { lesson: '3.5', anchor: 'isometry-criterion', label: 'ההגדרה של איזומטריה מקומית' }

- id: MC-c3-isometry-needs-normal
  title: חושבים שאיזומטריה צריכה לשמור גם על הנורמל או על הצורה במרחב
  belief: >-
    העתקה בין משטחים היא איזומטריה רק אם היא שומרת גם את $\hat{\mathbf N}$, או את האופן שבו המשטח מונח במרחב.
  truth: >-
    ההגדרה דורשת רק שמירת אורכים של מסילות, ושקול לכך: אותם $E,F,G$. הלפפת המישור על הגליל היא איזומטריה מקומית,
    אף שהנורמל של המישור קבוע והנורמל של הגליל מסתובב.
  remedy: { lesson: '3.5', anchor: 'cylinder-plane', label: 'גליל ומישור' }

- id: MC-c3-local-isometry-injective
  title: חושבים שאיזומטריה מקומית חייבת להיות חד-חד-ערכית
  belief: >-
    $f(x,y)=(\cos x,\sin x,y)$ אינה איזומטריה מקומית מהמישור לגליל, כי $f(x+2\pi,y)=f(x,y)$.
  truth: >-
    "מקומית" פירושו שהתנאי נבדק בסביבות קטנות. בכל רצועה $a<x<a+2\pi$ ההעתקה חד-חד-ערכית ושומרת אורכים, ובסך הכול
    היא מלפפת את המישור על הגליל אינסוף פעמים.
  remedy: { lesson: '3.5', anchor: 'cylinder-plane', label: 'גליל ומישור' }

- id: MC-c3-cone-full-angle
  title: חושבים שחרוט נפרש לדיסק שלם
  belief: >-
    כשחותכים חרוט לאורך ישר יוצר ופורשים אותו, מקבלים מישור שלם סביב הקודקוד, זווית $2\pi$.
  truth: >-
    החרוט $z=\sqrt{x^2+y^2}$ נפרש לגזרה של מעגל בזווית $\frac{2\pi}{\sqrt2}=\pi\sqrt2$: מעגל בגובה $v$ אורכו
    $2\pi v$, והמרחק שלו מהקודקוד לאורך החרוט הוא $\sqrt2\,v$.
  remedy: { lesson: '3.5', anchor: 'cone-unroll', label: 'פורשים חרוט' }

- id: MC-c3-chart-is-isometry
  title: חושבים שהטלה על מישור הפרמטרים שומרת אורכים
  belief: >-
    הפרמטריזציה $\sigma:D\to S$ (או ההטלה של גרף על מישור $xy$) היא איזומטריה בין $D$ לבין $S$.
  truth: >-
    $\sigma$ שומרת אורכים רק כש-$E=G=1$ ו-$F=0$. בגרף $z=f(x,y)$ מתקבל $E=1+f_x^2$, ולכן ההטלה מקצרת כל מסילה שעולה
    או יורדת, אלא אם $f$ קבועה.
  remedy: { lesson: '3.5', anchor: 'isometry-criterion', label: 'מתי פרמטריזציה היא איזומטריה' }

- id: MC-c3-every-surface-locally-flat
  title: חושבים שכל משטח איזומטרי מקומית למישור כי מקומית הוא גרף
  belief: >-
    ליד כל נקודה משטח הוא גרף, כלומר "כמעט מישור", ולכן כל משטח איזומטרי מקומית למישור.
  truth: >-
    גרף הוא הומיאומורפי לתחום במישור, לא איזומטרי לו. על ספרת היחידה המעגל של הנקודות במרחק פנימי $\rho$ מהקוטב
    אורכו $2\pi\sin\rho$, ובמישור $2\pi\rho$; איזומטריה הייתה שומרת את שניהם.
  remedy: { lesson: '3.5', anchor: 'sphere-plane', label: 'ספרה ומישור' }

- id: MC-c3-normal-is-intrinsic
  title: חושבים שהנורמל או ההתעקמות במרחב הם תכונה פנימית
  belief: >-
    $\hat{\mathbf N}$, או העובדה שהמשטח "מעוקל" במרחב, נקבעים מהתבנית הראשונה; לכן משטח מעוקל אינו איזומטרי למישור.
  truth: >-
    לגליל ולמישור יש פרמטריזציות עם $E=1,F=0,G=1$, אבל הנורמל של המישור קבוע והנורמל של הגליל מסתובב. הנורמל
    תלוי בשיכון במרחב, ולכן "הוא מעוקל" אינו נימוק לאי-איזומטריה.
  remedy: { lesson: '3.5', anchor: 'intrinsic-extrinsic', label: 'תכונה פנימית מול חיצונית' }

- id: MC-c3-curvature-of-curve-intrinsic
  title: חושבים שהעקמומיות של מסילה על משטח נשמרת באיזומטריה
  belief: >-
    איזומטריה מקומית שומרת אורכים, ולכן היא שומרת גם את העקמומיות $\kappa$ של כל מסילה.
  truth: >-
    הלפפת המישור על גליל היחידה מעבירה את הקטע $(t,t)$, שעקמומיותו 0, לסליל $(\cos t,\sin t,t)$, שעקמומיותו $\frac12$.
    העקמומיות של מסילה כמסילה במרחב היא תכונה חיצונית.
  remedy: { lesson: '3.5', anchor: 'intrinsic-extrinsic', label: 'תכונה פנימית מול חיצונית' }

- id: MC-c3-q1-determines-shape
  title: חושבים שהתבנית הראשונה קובעת את המשטח עד כדי תנועה קשיחה
  belief: >-
    שני משטחים עם אותם $E,F,G$ הם אותו משטח, אולי מוזז ומסובב.
  truth: >-
    התבנית הראשונה קובעת את הגאומטריה **הפנימית** בלבד. המישור והגליל, או הקטנואיד וההליקואיד, הם זוגות עם אותם
    $E,F,G$ ובכל זאת אינם חופפים: באחד יש ישר שבשני הופך למעגל.
  remedy: { lesson: '3.5', anchor: 'first-form-not-shape', label: 'תכונה פנימית מול חיצונית' }

- id: MC-c3-global-argument-for-local-claim
  title: מכריעים שאלה מקומית בעזרת תכונה גלובלית
  belief: >-
    הספרה אינה איזומטרית מקומית למישור כי היא קומפקטית והמישור לא (או כי יש לה "צד אחד", "שפה אחת" וכדומה).
  truth: >-
    איזומטריה **מקומית** משווה סביבות קטנות, וסביבה קטנה של נקודה בספרה או במישור היא חסומה ואינה סגורה בשני המקרים.
    טיעון נכון משתמש בגודל שנמדד בתוך הסביבה, כמו אורך של מעגל פנימי קטן: $2\pi\sin\rho$ מול $2\pi\rho$.
  remedy: { lesson: '3.5', anchor: 'sphere-plane', label: 'ספרה ומישור' }

- id: MC-c3-isometry-requires-unit-coefficients
  title: חושבים שמשטח איזומטרי למישור רק אם בפרמטריזציה הנתונה E שווה 1, F שווה 0 ו-G שווה 1
  belief: >-
    אם בפרמטריזציה הנתונה $E=v^2$ ו-$G=1$, המשטח אינו איזומטרי מקומית למישור.
  truth: >-
    צריך **פרמטריזציה כלשהי** של חתיכת מישור עם אותם מקדמים, באותו תחום. $E=v^2,F=0,G=1$ הם המקדמים של קואורדינטות
    קוטביות $(v\cos u,\,v\sin u,\,0)$, ולכן משטח כזה איזומטרי מקומית למישור.
  remedy: { lesson: '3.5', anchor: 'same-forms', label: 'מתי שני משטחים איזומטריים' }

- id: MC-c3-image-determines-isometry
  title: חושבים שהעתקה על משטח שאיזומטרי למישור היא בהכרח איזומטריה מקומית
  belief: >-
    ההעתקה $(x,y,0)\mapsto(\cos x,\ \sin x,\ 2y)$ מלפפת את המישור על הגליל, והגליל איזומטרי מקומית למישור, ולכן היא שומרת
    אורכים.
  truth: >-
    איזומטריה היא תכונה של **ההעתקה**, לא של התמונה. כאן $(f\circ\sigma_1)_y=(0,0,2)$, כלומר $G=4\ne1$: ההעתקה מותחת פי 2
    בכיוון $y$, אף שיש העתקה **אחרת**, $(\cos x,\ \sin x,\ y)$, שהיא איזומטריה מקומית על אותו גליל. בודקים את $E,F,G$ של
    $f\circ\sigma_1$ (משפט 3.5.3).
  remedy: { lesson: '3.5', anchor: 'isometry-criterion', label: 'איך בודקים שהעתקה היא איזומטריה' }

- id: MC-c3-distance-from-point-enough
  title: חושבים ששמירת המרחק מנקודה אחת, או של כמה משפחות של מסילות, מספיקה לאיזומטריה
  belief: >-
    העתקה של הספרה ששומרת את המרחק הפנימי מהקוטב של כל נקודה, ושולחת כל קו רוחב לעצמו, היא איזומטריה מקומית.
  truth: >-
    הנתונים האלה קובעים, בקואורדינטות שמסביב לקוטב, רק את $E$ ואת $G$; האורך באלכסון, כלומר $F$, יכול להשתנות. הסיבוב סביב
    ציר $z$ בזווית $1-z$ שומר את שניהם ומשנה את הזווית בין קווי האורך לקווי הרוחב, ולכן אינו איזומטריה מקומית. צריך את
    שלושת המקדמים (משפט 3.5.3, דוגמה 2).
  remedy: { lesson: '3.5', anchor: 'isometry-criterion', label: 'שלושת המקדמים נחוצים' }
