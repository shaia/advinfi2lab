# Misconceptions first detected in lesson 5.4 (integrals of a function over a curve and over a surface).
- id: MC-c5-line-no-speed
  title: מחשבים אינטגרל לפי אורך קשת בלי אורך הנגזרת
  belief: >-
    $\int_\gamma\rho\,ds=\int_a^b\rho(\gamma(t))\,dt$: מציבים את המסילה ומחשבים את האינטגרל לפי הפרמטר.
  truth: >-
    $ds$ הוא אורך של קטע קטן במסילה, $\|\gamma'(t)\|\,dt$ (שיעור 1.2), ולכן
    $\int_\gamma\rho\,ds=\int_a^b\rho(\gamma(t))\,\|\gamma'(t)\|\,dt$. בלי הגורם הזה התוצאה תלויה במהירות
    שבה עוברים את המסילה. בדיקה: עם $\rho=1$ צריך לצאת אורך המסילה.
  remedy: { lesson: '5.4', label: 'אינטגרל לפי אורך קשת' }

- id: MC-c5-surface-no-dS
  title: מחשבים אינטגרל משטחי בלי אלמנט השטח
  belief: >-
    $\iint_S\rho\,dS=\iint_D\rho(\sigma(u,v))\,du\,dv$, או שבספרה $dS=d\varphi\,d\theta$.
  truth: >-
    $dS=\|\sigma_u\times\sigma_v\|\,du\,dv$. בספרת היחידה עם זווית $\varphi$ מציר $z$ זה
    $\sin\varphi\,d\varphi\,d\theta$. בדיקה: עם $\rho=1$ צריך לצאת השטח, $4\pi$ ולא $2\pi^2$.
  remedy: { lesson: '5.4', label: 'אינטגרל של פונקציה לפי שטח' }

- id: MC-c5-scalar-orientation
  title: חושבים שאינטגרל של פונקציה תלוי בכיוון
  belief: >-
    כשהופכים את כיוון המסילה, או את כיוון הנורמל של המשטח, $\int_\gamma\rho\,ds$ ו-$\iint_S\rho\,dS$ מחליפים
    סימן.
  truth: >-
    $ds$ ו-$dS$ הם אורך ושטח, ואינם שליליים: $\|\gamma'\|$ ו-$\|\sigma_u\times\sigma_v\|$ לא משתנים כשהופכים
    כיוון, ובהחלפת פרמטר הגורם הוא $|h'|$ או $|\det D\psi|$, עם ערך מוחלט. לכן מסה, מרכז מסה וממוצע אינם
    תלויים בכיוון.
  remedy: { lesson: '5.4', label: 'אי-תלות בכיוון: הערך המוחלט' }

- id: MC-c5-centroid-no-normalize
  title: שוכחים לחלק במסה כשמחשבים מרכז מסה או ממוצע
  belief: >-
    הקואורדינטה $\bar z$ של מרכז המסה היא $\iint_Sz\,dS$, והממוצע של $f$ הוא $\int_\gamma f\,ds$.
  truth: >-
    מרכז מסה וממוצע הם מנות: $\bar z=\frac{\iint_Sz\,\rho\,dS}{\iint_S\rho\,dS}$, והממוצע של $f$ על $\gamma$ הוא
    $\frac{1}{L}\int_\gamma f\,ds$ כש-$L$ אורך המסילה. בדיקה: ממוצע של קבוע $c$ חייב לצאת $c$, ומרכז מסה חייב
    להיות בתוך הקמור של הגוף.
  remedy: { lesson: '5.4', label: 'מרכז מסה וממוצע: מחלקים במסה' }

- id: MC-c5-symmetry-kills-all
  title: חושבים שסימטריה של התחום מאפסת כל אינטגרל
  belief: >-
    על ספרה (או כל משטח סימטרי) האינטגרל של כל פונקציה שבה מופיעים $x$, $y$ או $z$ מתאפס, כי "החיובי מתבטל
    עם השלילי".
  truth: >-
    סימטריה מאפסת רק אינטגרל של פונקציה **אי-זוגית** ביחס לסימטריה: אם $(x,y,z)\mapsto(-x,y,z)$ שומרת על
    המשטח ועל $dS$, ו-$f(-x,y,z)=-f(x,y,z)$, אז $\iint_Sf\,dS=0$. ל-$x^2$ או ל-$|z|$ אין שום ביטול: הם אי-שליליים,
    והאינטגרל שלהם חיובי.
  remedy: { lesson: '5.4', label: 'סימטריה באינטגרל משטחי: רק פונקציה אי-זוגית' }

- id: MC-c5-shell-vs-solid
  title: מבלבלים בין מעטפת לגוף מלא
  belief: >-
    למרכז המסה של חצי ספרה (מעטפת דקה) ושל חצי כדור מלא יש אותו גובה, או שאפשר להשתמש בנוסחה של האחד
    לשני.
  truth: >-
    מעטפת היא אינטגרל לפי שטח ($dS$), וגוף מלא אינטגרל לפי נפח ($dV$). לחצי ספרה ברדיוס $a$ מתקבל
    $\bar z=\frac a2$, ולחצי כדור מלא $\bar z=\frac{3a}{8}$: בגוף המלא יש יותר מסה קרוב למרכז. כך גם חצי מעגל
    (תיל) מול חצי עיגול מלא: $\frac2\pi$ מול $\frac{4}{3\pi}$.
  remedy: { lesson: '5.4', label: 'מרכז מסה: מעטפת מול גוף מלא' }

- id: MC-c5-piecewise-forgot-piece
  title: מחשבים על משטח מורכב מחלקים רק את אחד החלקים
  belief: >-
    במשטח שמורכב מכמה חלקים חלקים (חרוט עם מכסה, גליל עם שני בסיסים) מספיק לפרמטר את החלק ה"עיקרי"; המכסה
    שטוח ולכן אינו משנה את התוצאה.
  truth: >-
    אינטגרל על משטח חלק למקוטעין הוא סכום האינטגרלים על החלקים, ושטחו סכום השטחים. בחרוט $z=\sqrt{x^2+y^2}$,
    $0\le z\le1$, עם מכסה: $\bar z=\frac{1+\sqrt2}{3}$, ובלי המכסה $\frac23$.
  remedy: { lesson: '5.4', label: 'אינטגרל על משטח שמורכב מחלקים' }
