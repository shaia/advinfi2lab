# Misconceptions first detected in lesson 9.5 (projection onto a closed convex set and onto a complete subspace).
- id: MC-c9-closed-enough
  title: חושבים שבכל קבוצה סגורה יש נקודה קרובה ביותר, גם בממד אינסופי
  belief: >-
    ב-$\mathbb R^n$ לכל קבוצה סגורה לא ריקה יש נקודה קרובה ביותר, ולכן גם במרחב הילברט.
  truth: >-
    ב-$\mathbb R^n$ זה נובע מקומפקטיות של חיתוך הקבוצה עם כדור. במרחב הילברט כדור סגור אינו קומפקטי: הקבוצה
    $\{(1+\frac1n)e_n\}$ ב-$\ell^2$ סגורה, המרחקים שלה מ-0 הם $1+\frac1n$, והאינפימום 1 לא מתקבל. בממד אינסופי
    צריך קמירות.
  remedy: { lesson: '9.5', label: 'דוגמה בלי נקודה קרובה ביותר: קבוצה לא קמורה' }

- id: MC-c9-nonconvex-unique
  title: חושבים שהנקודה הקרובה ביותר יחידה גם בקבוצה שאינה קמורה
  belief: >-
    אם יש נקודה קרובה ביותר, היא יחידה, בלי קשר לצורת הקבוצה.
  truth: >-
    היחידות באה מהקמירות: אמצע הקטע בין שתי נקודות קרובות ביותר קרוב עוד יותר. במעגל היחידה (לא קמור) כל נקודה
    קרובה ביותר לראשית.
  remedy: { lesson: '9.5', label: 'היחידות מחוק המקבילית ומהקמירות' }

- id: MC-c9-obtuse-sign
  title: הופכים את הסימן בתנאי הזווית של ההטלה על קבוצה קמורה
  belief: >-
    $y=P_Kx$ אם ורק אם $\langle x-y,k-y\rangle\ge0$ לכל $k\in K$.
  truth: >-
    התנאי הוא $\langle x-y,k-y\rangle\le0$: הזווית בין הכיוון מ-$y$ אל $x$ לבין הכיוון מ-$y$ אל כל נקודה של $K$ אינה
    חדה. בקטע $K=[0,1]$ ו-$x=3$: $y=1$ ו-$(3-1)(k-1)\le0$.
  remedy: { lesson: '9.5', label: 'תנאי הזווית הלא חדה' }

- id: MC-c9-completeness-necessary
  title: חושבים שבמרחב שאינו שלם אין אף פעם נקודה קרובה ביותר
  belief: >-
    ב-$C[a,b]$ עם $\int fg$, שאינו שלם, אי אפשר להטיל על שום קבוצה.
  truth: >-
    שלמות היא תנאי מספיק, לא הכרחי. כל תת-מרחב סוף-ממדי שלם, ולכן ההטלה עליו קיימת בכל מרחב מכפלה פנימית (שיעור 9.3);
    גם ההטלה על כדור סגור קיימת תמיד: $\frac{g}{\|g\|}$ כש-$\|g\|>1$.
  remedy: { lesson: '9.5', label: 'מתי השלמות נחוצה' }

- id: MC-c9-inf-attained
  title: חושבים שהאינפימום של המרחקים לקבוצה תמיד מתקבל
  belief: >-
    $d(x,K)=\inf_{k\in K}\|x-k\|$ הוא תמיד המרחק לנקודה כלשהי של $K$.
  truth: >-
    אינפימום אינו מינימום. מהחצי-מישור הפתוח $\{y>0\}$ המרחק של $(0,-1)$ הוא 1 ואין נקודה שמשיגה אותו; ב-$C[-1,1]$
    המרחק של הפונקציה הקבועה 1 מתת-המרחב של הפונקציות שמתאפסות על $[-1,0]$ הוא 1, ולא מתקבל.
  remedy: { lesson: '9.5', label: 'דוגמאות בלי נקודה קרובה ביותר' }

- id: MC-c9-blame-wrong-hypothesis
  title: כשאין נקודה קרובה ביותר מאשימים תנאי שדווקא מתקיים
  belief: >-
    אם אין נקודה קרובה ביותר, הקבוצה בוודאי אינה סגורה (או אינה קמורה, או שהמרחב אינו שלם), בלי לבדוק איזה מהתנאים
    באמת נכשל.
  truth: >-
    למשפט שלושה תנאים: $K$ סגורה, $K$ קמורה, המרחב שלם. בכל דוגמה נגדית בודקים כל אחד מהם. ב-$\ell^2$ עם
    $K=\{(1+\frac1n)e_n\}$ הקבוצה סגורה והמרחב שלם, ונכשלת הקמירות; ב-$C[-1,1]$ עם $\int fg$ תת-המרחב של הפונקציות
    שמתאפסות על $[-1,0]$ סגור וקמור, ונכשלת השלמות.
  remedy: { lesson: '9.5', label: 'שלושת התנאים של משפט ההטלה' }

- id: MC-c9-distance-to-center
  title: מודדים את המרחק למרכז הכדור במקום לכדור
  belief: >-
    המרחק של $x$ מהכדור הסגור $\{\|k\|\le1\}$ הוא $\|x\|$.
  truth: >-
    כש-$\|x\|>1$ הנקודה הקרובה ביותר היא $\frac{x}{\|x\|}$, והמרחק הוא $\|x\|-1$: לפי אי-שוויון המשולש
    $\|x-k\|\ge\|x\|-\|k\|\ge\|x\|-1$.
  remedy: { lesson: '9.5', label: 'ההטלה על כדור' }

- id: MC-c9-unconstrained-projection
  title: מטילים על תת-המרחב שמכיל את הקבוצה הקמורה ושוכחים לבדוק שההטלה בתוך הקבוצה
  belief: >-
    הנקודה הקרובה ביותר בקבוצה קמורה $K$ שבתוך תת-מרחב $Y$ היא תמיד $P_Yx$, ההטלה על תת-המרחב.
  truth: >-
    $P_Yx$ היא הנקודה הקרובה ביותר רק אם היא שייכת ל-$K$. אחרת מחפשים את המינימום על $K$ עצמה: ל-$K=\{c\,e:\ |c|\le1\}$
    עם $\|e\|=1$, המרחק בריבוע $\|x\|^2-2c\langle x,e\rangle+c^2$ הוא פרבולה ב-$c$, והמינימום על $[-1,1]$ הוא בקצה
    הקרוב ל-$\langle x,e\rangle$ כש-$|\langle x,e\rangle|>1$.
  remedy: { lesson: '9.5', label: 'הטלה על קבוצה קמורה' }
