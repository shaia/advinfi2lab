# Misconceptions first detected in lesson 3.4 (the first fundamental form).
- id: MC-c3-efg-order
  title: מחליפים בין E לבין G
  belief: >-
    $E$ שייך לנגזרת לפי הפרמטר השני ו-$G$ לנגזרת לפי הראשון, או שאין חשיבות לסדר.
  truth: >-
    $E=\sigma_u\cdot\sigma_u$, $F=\sigma_u\cdot\sigma_v$, $G=\sigma_v\cdot\sigma_v$, לפי סדר הפרמטרים ב-$\sigma(u,v)$.
    בספרה $(r\cos u\cos v,\ r\sin u\cos v,\ r\sin v)$ מתקבל $E=r^2\cos^2v$ ו-$G=r^2$, ולא להפך.
  remedy: { lesson: '3.4', anchor: 'efg-def', label: 'מקדמי התבנית הראשונה' }

- id: MC-c3-lagrange-sign
  title: כותבים את ריבוע אורך המכפלה הווקטורית כ-EG ועוד F בריבוע
  belief: >-
    $\|\sigma_u\times\sigma_v\|^2=EG+F^2$.
  truth: >-
    זהות לגרנז׳: $\|a\times b\|^2=\|a\|^2\|b\|^2-(a\cdot b)^2$, ולכן $\|\sigma_u\times\sigma_v\|^2=EG-F^2$. ככל ש-$\sigma_u$
    ו-$\sigma_v$ קרובים להיות מקבילים, $F^2$ קרוב ל-$EG$ והשטח של המקבילית קטן.
  remedy: { lesson: '3.4', anchor: 'restriction', label: 'זהות לגרנז׳ ומקבילית הנגזרות' }

- id: MC-c3-coordinate-curves-orthogonal
  title: חושבים שקווים פרמטריים תמיד נחתכים בזווית ישרה
  belief: >-
    הקווים $u=\text{const}$ ו-$v=\text{const}$ ניצבים זה לזה, כמו קווי הרשת במישור הפרמטרים.
  truth: >-
    הזווית ביניהם במשטח היא $\cos\theta=\frac{F}{\sqrt{EG}}$, והיא ישרה רק כש-$F=0$. בגרף $z=x^2-y^2$ בנקודה $(1,2)$
    מתקבל $\cos\theta=-\frac{8}{\sqrt{85}}$.
  remedy: { lesson: '3.4', anchor: 'angles', label: 'זווית בין קווים פרמטריים' }

- id: MC-c3-q1-is-euclidean-in-params
  title: מודדים אורכים וזוויות במישור הפרמטרים במקום על המשטח
  belief: >-
    האורך של וקטור משיק $a\sigma_u+b\sigma_v$ הוא $\sqrt{a^2+b^2}$, והזווית בין שני וקטורים משיקים היא הזווית בין
    $(a_1,b_1)$ ל-$(a_2,b_2)$ במישור.
  truth: >-
    $\|a\sigma_u+b\sigma_v\|^2=Q_1(a,b)=Ea^2+2Fab+Gb^2$. רק כש-$E=G=1$ ו-$F=0$ זה שווה ל-$a^2+b^2$. על הספרה בקו רוחב
    $v=\frac\pi3$ הכיוונים $(1,1)$ ו-$(1,-1)$ ניצבים במישור הפרמטרים, אבל על הספרה $\cos\theta=-0.6$.
  remedy: { lesson: '3.4', anchor: 'restriction', label: 'התבנית הראשונה כמכפלה פנימית' }

- id: MC-c3-q1-drop-cross-term
  title: שוכחים את האיבר המעורב 2F
  belief: >-
    $\|\gamma'\|^2=Eu'^2+Gv'^2$ תמיד, או שהאיבר המעורב הוא $F\,u'v'$ בלי הכפל ב-2.
  truth: >-
    $\|u'\sigma_u+v'\sigma_v\|^2=Eu'^2+2Fu'v'+Gv'^2$: הפיתוח של מכפלה פנימית של סכום נותן את $\sigma_u\cdot\sigma_v$
    פעמיים. האיבר נעלם רק כש-$F=0$.
  remedy: { lesson: '3.4', anchor: 'length', label: 'אורך של מסילה על משטח' }

- id: MC-c3-q1-measures-bending
  title: חושבים שהתבנית הראשונה מודדת כמה המשטח מתעקם
  belief: >-
    $Q_1$ מודדת את הסטייה של המשטח מהמישור המשיק, או את העקמומיות שלו.
  truth: >-
    $Q_1(a,b)=\|a\sigma_u+b\sigma_v\|^2$ מודדת **אורכים של וקטורים משיקים** בלבד. במישור ובגליל, שהם משטחים שונים מאוד
    במרחב, יש פרמטריזציות עם אותה $Q_1$. את ההתעקמות במרחב תמדוד התבנית השנייה (פרק 4).
  remedy: { lesson: '3.4', anchor: 'ex-3-4-5', label: 'מה התבנית הראשונה מודדת' }

- id: MC-c3-F-nonneg
  title: חושבים ש-F אי-שלילי כמו E ו-G
  belief: >-
    כל מקדמי התבנית הראשונה הם ריבועים של אורכים, ולכן $F\ge0$.
  truth: >-
    $E=\|\sigma_u\|^2>0$ ו-$G=\|\sigma_v\|^2>0$, אבל $F=\sigma_u\cdot\sigma_v$ הוא מכפלה פנימית ויכול להיות שלילי: בגרף
    $z=x^2-y^2$ בנקודה $(1,2)$ מתקבל $F=-8$. מה שתמיד חיובי הוא $EG-F^2$.
  remedy: { lesson: '3.4', anchor: 'efg-def', label: 'מקדמי התבנית הראשונה' }

- id: MC-c3-positive-diagonal-enough
  title: חושבים שכל שלשה עם E ו-G חיוביים היא תבנית ראשונה
  belief: >-
    כל שלשה $(E,F,G)$ עם $E>0$ ו-$G>0$ מתקבלת כתבנית ראשונה של פרמטריזציה רגולרית בנקודה.
  truth: >-
    לפי קושי-שוורץ $F^2=(\sigma_u\cdot\sigma_v)^2\le EG$, ובנקודה רגולרית $EG-F^2=\|\sigma_u\times\sigma_v\|^2>0$. השלשה
    $(1,2,1)$ אינה תבנית ראשונה של שום פרמטריזציה.
  remedy: { lesson: '3.4', anchor: 'characterization', label: 'התבנית הראשונה מוגדרת חיובית' }

- id: MC-c3-q1-positive-needs-orthogonal
  title: חושבים שהתבנית הראשונה מוגדרת חיובית רק כשהקווים הפרמטריים ניצבים
  belief: >-
    כש-$F\ne0$ האיבר המעורב $2Fab$ יכול להפוך את $Q_1(a,b)$ לאפס או לשלילית, ולכן החיוביות מובטחת רק כש-$F=0$.
  truth: >-
    $Q_1(a,b)=\|a\sigma_u+b\sigma_v\|^2$, ובפרמטריזציה רגולרית $a\sigma_u+b\sigma_v\ne0$ לכל $(a,b)\ne(0,0)$. לכן $Q_1$ מוגדרת
    חיובית תמיד, עם $F$ כלשהו: בגרף $z=x^2-y^2$ בנקודה $(1,2)$, $F=-8$ ו-$EG-F^2=21>0$.
  remedy: { lesson: '3.4', anchor: 'restriction', label: 'התבנית הראשונה מוגדרת חיובית' }

- id: MC-c3-cs-equality-allowed
  title: חושבים שבנקודה רגולרית מותר ש-F בריבוע יהיה שווה ל-EG
  belief: >-
    אי-שוויון קושי-שוורץ נותן $F^2\le EG$, ולכן בנקודה רגולרית $F$ יכול להגיע עד $\pm\sqrt{EG}$.
  truth: >-
    שוויון $F^2=EG$ קורה רק כש-$\sigma_u,\sigma_v$ תלויים לינארית, כלומר בנקודה שאינה רגולרית. בנקודה רגולרית
    $EG-F^2=\|\sigma_u\times\sigma_v\|^2>0$, והאי-שוויון חזק: $|F|<\sqrt{EG}$.
  remedy: { lesson: '3.4', anchor: 'characterization', label: 'אילו שלשות הן תבניות ראשונות' }

- id: MC-c3-space-chord-as-length
  title: מודדים את המרחק בקו ישר במרחב במקום אורך של מסילה על המשטח
  belief: >-
    המסילה הקצרה ביותר על משטח בין שתי קבוצות היא הקטע הישר ביניהן, ואורכה הוא המרחק במרחב.
  truth: >-
    מסילה על משטח חייבת להישאר בו, והקטע הישר בדרך כלל יוצא ממנו. האורך על המשטח מחושב מהתבנית הראשונה, והוא לפחות
    המרחק במרחב (ולפעמים גדול ממנו בהרבה): על הטורוס, בין קו המשווה החיצוני לפנימי, $\pi$ לעומת $2$.
  remedy: { lesson: '3.4', anchor: 'length', label: 'אורך של מסילה על משטח' }
