# Misconceptions first detected in lesson 7.3 (area by a boundary integral, Green with a hole, the winding field).
- id: MC-c7-area-double
  title: שוכחים את החצי בנוסחת השטח הסימטרית
  belief: >-
    השטח של $D$ הוא $\oint_{\partial D}x\,dy-y\,dx$.
  truth: >-
    לשדה $(-y,x)$ מתקיים $Q_x-P_y=1-(-1)=2$, ולכן $\oint_{\partial D}x\,dy-y\,dx$ שווה **לפעמיים** השטח של $D$, והשטח
    הוא $\frac12\oint_{\partial D}x\,dy-y\,dx$. גם $\oint x\,dy$ לבדו וגם $-\oint y\,dx$ לבדו שווים לשטח.
  remedy: { lesson: '7.3', label: 'שטח כאינטגרל על השפה' }

- id: MC-c7-area-always-positive
  title: חושבים שנוסחת השטח נותנת מספר חיובי בכל כיוון
  belief: >-
    $\oint_C x\,dy$ הוא שטח, ולכן חיובי בכל כיוון שבו עוברים על $C$; תוצאה שלילית פירושה טעות חישוב.
  truth: >-
    $\oint_{\partial D}x\,dy$ שווה לשטח של $D$ רק בכיוון החיובי. מסילה סגורה פשוטה עם כיוון השעון נותנת מינוס השטח.
  remedy: { lesson: '7.3', label: 'שטח כאינטגרל על השפה: הכיוון' }

- id: MC-c7-area-only-symmetric
  title: חושבים שרק הנוסחה הסימטרית נותנת שטח
  belief: >-
    רק $\frac12\oint_{\partial D}x\,dy-y\,dx$ שווה לשטח של $D$; האינטגרל $\oint_{\partial D}x\,dy$ לבדו אינו קשור לשטח.
  truth: >-
    כל זוג $P,Q$ עם $Q_x-P_y=1$ נותן את השטח לפי גרין: $\oint x\,dy$, $-\oint y\,dx$ והממוצע שלהם
    $\frac12\oint x\,dy-y\,dx$ שווים כולם לשטח, כשהשפה בכיוון החיובי.
  remedy: { lesson: '7.3', label: 'שטח כאינטגרל על השפה' }

- id: MC-c7-area-sign-from-position
  title: קובעים את הסימן של אינטגרל השטח לפי מיקום המסילה
  belief: >-
    $\oint_C x\,dy$ שלילי כשהמסילה נמצאת בחצי המישור $x<0$, כי האינטגרנד $x$ שלילי שם.
  truth: >-
    $\oint_C x\,dy$ שווה לשטח שהמסילה חוסמת בכיוון החיובי ולמינוס השטח בכיוון ההפוך, בכל מקום במישור: הסימן נקבע
    מהכיוון, לא מהמיקום. הזזה $x\mapsto x+c$ מוסיפה $c\oint dy=0$.
  remedy: { lesson: '7.3', label: 'שטח כאינטגרל על השפה: הכיוון' }

- id: MC-c7-hole-boundary
  title: שוכחים את השפה הפנימית של תחום עם חור, או מכוונים אותה כמו החיצונית
  belief: >-
    השפה של טבעת היא רק המעגל החיצוני, או ששני המעגלים בכיוון החיובי הם נגד כיוון השעון.
  truth: >-
    השפה של תחום עם חור כוללת גם את שפת החור. בכיוון החיובי התחום משמאל: החיצונית נגד כיוון השעון והפנימית **עם**
    כיוון השעון. לכן $\oint_{\partial D}=\oint_{C_{\text{out}}}-\oint_{C_{\text{in}}}$ כששתיהן נגד כיוון השעון.
  remedy: { lesson: '7.3', label: 'גרין על תחום עם חור' }

- id: MC-c7-green-singularity
  title: מפעילים את משפט גרין על תחום שבו השדה לא מוגדר
  belief: >-
    נקודה אחת לא משנה אינטגרל כפול, ולכן אפשר להפעיל את גרין על עיגול גם כשהשדה לא מוגדר במרכזו.
  truth: >-
    משפט גרין דורש $P,Q\in C^1$ בקבוצה פתוחה שמכילה את התחום ואת שפתו. לשדה הסיבוב על עיגול סביב הראשית התנאי
    נכשל, והחישוב הישיר נותן $2\pi$, לא את ה-$0$ של $\iint 0$.
  remedy: { lesson: '7.3', label: 'למה גרין לא חל על העיגול כולו' }

- id: MC-c7-slit-is-hole
  title: חושבים שתחום עם חתך אינו פשוט קשר
  belief: >-
    המישור בלי חצי ישר, או בלי קטע שיוצא מהשפה, "חסר בו משהו", ולכן אינו פשוט קשר, בדיוק כמו המישור בלי נקודה.
  truth: >-
    במישור בלי חצי הישר $\{(x,0):x\le0\}$ אין מסילה סגורה פשוטה שמקיפה את הראשית, כי כל מסילה כזו חוצה את חצי
    הישר. כל מסילה סגורה פשוטה בו חוסמת תחום שכולו בתוכו, ולכן הוא פשוט קשר; שם זווית הקוטב היא פוטנציאל לשדה הסיבוב.
  remedy: { lesson: '7.3', label: 'תחום פשוט קשר: חור מול חתך' }

- id: MC-c7-winding-depends-on-curve
  title: חושבים שהאינטגרל של שדה הסיבוב תלוי בגודל ובצורה של המסילה
  belief: >-
    האינטגרל של שדה הסיבוב על מעגל ברדיוס $r$ גדל עם $r$, ועל ריבוע או אליפסה הוא שונה מאשר על מעגל.
  truth: >-
    על כל מסילה סגורה פשוטה שמקיפה את הראשית נגד כיוון השעון האינטגרל הוא $2\pi$: גרין על התחום שבין המסילה למעגל
    קטן נותן אפס, כי $Q_x-P_y=0$ שם. על מסילה שלא מקיפה את הראשית האינטגרל $0$.
  remedy: { lesson: '7.3', label: 'שדה הסיבוב על כל מסילה סביב הראשית' }
