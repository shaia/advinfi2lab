# Misconceptions first detected in lesson 0.6 (linear systems of differential equations).
- id: MC-c0-linear-ode-local-only
  title: חושבים שפתרון של מערכת לינארית קיים רק ליד נקודת ההתחלה
  belief: >-
    משפט הקיום והיחידות נותן פתרון רק בקטע קטן סביב $t_0$, גם למערכת לינארית.
  truth: >-
    למערכת **לינארית** $X'=A(t)X+B(t)$ עם $A,B$ רציפות על קטע $I$, הפתרון קיים ויחיד **על כל** $I$. רק במשוואות לא
    לינאריות הפתרון יכול "להתפוצץ" לפני סוף הקטע.
  remedy: { lesson: '0.6', label: 'משפט הקיום והיחידות למערכת לינארית' }

- id: MC-c0-ode-constant-only
  title: חושבים שמשפט הקיום והיחידות דורש מקדמים קבועים
  belief: >-
    יחידות של פתרון מובטחת רק כשהמטריצה $A$ קבועה, כי רק אז יש נוסחה מפורשת.
  truth: >-
    המשפט דורש רק ש-$A(t)$ ו-$B(t)$ יהיו **רציפות**. נוסחה מפורשת ($e^{tA}X_0$) יש כש-$A$ קבועה, אבל הקיום והיחידות לא
    תלויים בנוסחה. במערכת של פרנה-סרה המקדמים הם פונקציות של $s$.
  remedy: { lesson: '0.6', label: 'משפט הקיום והיחידות' }

- id: MC-c0-ode-solution-can-leave-zero
  title: חושבים שפתרון של מערכת לינארית הומוגנית יכול להתאפס ברגע אחד ולהתעורר
  belief: >-
    פתרון של $X'=A(t)X$ יכול להיות $0$ ברגע $t_0$ ושונה מאפס ברגעים אחרים.
  truth: >-
    $X\equiv0$ הוא פתרון עם $X(t_0)=0$, ולפי היחידות הוא **היחיד**. לכן פתרון שמתאפס ברגע אחד הוא אפס בכל רגע.
  remedy: { lesson: '0.6', label: 'יחידות: הפתרון האפס' }

- id: MC-c0-nonlinear-global
  title: חושבים שכל משוואה עם אגף ימין חלק פתירה לכל הזמנים
  belief: >-
    אם $f$ חלקה, לכל פתרון של $x'=f(x)$ יש הגדרה על כל $\mathbb R$, כמו במערכות לינאריות.
  truth: >-
    $x'=x^2$, $x(0)=1$ נותנת $x(t)=\frac{1}{1-t}$, שמתפוצצת ב-$t=1$. הקיום על כל הקטע הוא תכונה של משוואות **לינאריות**.
  remedy: { lesson: '0.6', label: 'מה מיוחד במערכות לינאריות' }

- id: MC-c0-ode-sign
  title: מאבדים סימן כשכותבים או פותרים מערכת
  belief: >-
    כשמעבירים את $x''+3x'+2x=0$ לצורה $X'=AX$ מעתיקים את המקדמים כמו שהם; ו-$x'=-x$ פותרים כמו $x'=x$.
  truth: >-
    מבודדים $x''=-2x-3x'$, ולכן השורה השנייה של $A$ היא $(-2,\ -3)$. הסימן של מקדם קובע גדילה או דעיכה: $x'=\lambda x$ נותנת
    $x(t)=e^{\lambda t}x(0)$, עם הסימן של $\lambda$.
  remedy: { lesson: '0.6', label: 'משוואה מסדר שני כמערכת' }

- id: MC-c0-rotation-direction
  title: טועים בכיוון הסיבוב של הפתרון
  belief: >-
    הפתרון של $x_1'=-x_2$, $x_2'=x_1$ מסתובב בכיוון השעון.
  truth: >-
    הפתרון הוא $X(t)=R(t)X(0)$ עם $R(t)=\begin{pmatrix}\cos t&-\sin t\\ \sin t&\cos t\end{pmatrix}$, סיבוב נגד כיוון השעון.
    בודקים בנקודה $(1,0)$: שם $X'=(0,1)$, כלומר למעלה.
  remedy: { lesson: '0.6', label: 'מערכת הסיבוב' }

- id: MC-c0-eigen-initial-coefficients
  title: שוכחים את המקדמים כשמפרקים את תנאי ההתחלה לווקטורים עצמיים
  belief: >-
    אם $v_1,v_2$ וקטורים עצמיים, הפתרון הוא $e^{\lambda_1t}v_1+e^{\lambda_2t}v_2$, בלי קשר לתנאי ההתחלה.
  truth: >-
    כותבים $X_0=c_1v_1+c_2v_2$ ופותרים את $c_1,c_2$; הפתרון הוא $c_1e^{\lambda_1t}v_1+c_2e^{\lambda_2t}v_2$. בלי המקדמים
    $X(0)$ לא יוצא $X_0$.
  remedy: { lesson: '0.6', label: 'פתרון בעזרת וקטורים עצמיים' }

- id: MC-c0-antisym-growth
  title: חושבים שהפתרון של מערכת עם מטריצה אנטי-סימטרית גדל
  belief: >-
    לפתרון של $X'=AX$ יש תמיד גדילה או דעיכה אקספוננציאלית, גם כש-$A$ אנטי-סימטרית.
  truth: >-
    כש-$A^{T}=-A$: $\frac{d}{dt}\|X\|^2=2\langle X,AX\rangle=0$, כי $\langle X,AX\rangle=\langle A^{T}X,X\rangle=-\langle AX,X\rangle$. האורך
    קבוע; הפתרון רק מסתובב.
  remedy: { lesson: '0.6', label: 'אנטי-סימטרית שומרת אורך' }

- id: MC-c0-antisym-needs-constant
  title: חושבים ששמירת האורך דורשת מטריצה קבועה
  belief: >-
    רק כש-$A$ קבועה ואנטי-סימטרית הפתרון של $X'=AX$ שומר על אורך, כי רק אז $e^{tA}$ אורתוגונלית.
  truth: >-
    ההוכחה $\frac{d}{dt}\langle X,Y\rangle=\langle (A+A^{T})X,Y\rangle=0$ משתמשת רק בכך ש-$A(t)$ אנטי-סימטרית **בכל רגע**. במערכת
    של פרנה-סרה המקדמים משתנים, וזה בדיוק המקרה שצריך.
  remedy: { lesson: '0.6', label: 'אנטי-סימטרית שומרת מכפלות פנימיות' }

- id: MC-c0-trace-zero-preserves-length
  title: חושבים שמטריצה עם עקבה אפס שומרת על אורך
  belief: >-
    אם העקבה של $A$ אפס, הפתרונות של $X'=AX$ שומרים על אורך.
  truth: >-
    $A=\operatorname{diag}(1,-1)$ היא עם עקבה אפס, והפתרון $(e^t,0)$ גדל. מה ששומר על אורך ועל מכפלות פנימיות הוא
    $A^{T}=-A$ (שגורר עקבה אפס, אבל לא להפך).
  remedy: { lesson: '0.6', label: 'אנטי-סימטרית שומרת אורך' }

- id: MC-c0-symmetric-preserves-length
  title: מבלבלים בין סימטרית לאנטי-סימטרית
  belief: >-
    אם $A$ סימטרית, הפתרונות של $X'=AX$ שומרים על אורך.
  truth: >-
    עם $A=I$, שהיא סימטרית, $X(t)=e^tX_0$ והאורך גדל. החישוב נותן $\frac{d}{dt}\|X\|^2=\langle (A+A^{T})X,X\rangle$, ואפס
    מובטח רק כש-$A+A^{T}=0$.
  remedy: { lesson: '0.6', label: 'אנטי-סימטרית שומרת אורך' }

- id: MC-c0-preserve-fixed-vector
  title: חושבים שהפתרון שומר על מכפלה פנימית עם כל וקטור קבוע
  belief: >-
    אם $A$ אנטי-סימטרית ו-$X'=AX$, אז $\langle X(t),w\rangle$ קבוע לכל וקטור קבוע $w$, למשל $w=X(0)$.
  truth: >-
    נשמרות המכפלות הפנימיות בין **שני פתרונות**. וקטור קבוע $w$ הוא פתרון רק כש-$Aw=0$. ל-$X'=\omega\times X$ הווקטור $\omega$
    עצמו פתרון, ולכן $\langle X,\omega\rangle$ קבוע; אבל $\langle X(t),X(0)\rangle$ משתנה כשהפתרון מסתובב.
  remedy: { lesson: '0.6', label: 'אנטי-סימטרית שומרת מכפלות פנימיות בין פתרונות' }

- id: MC-c0-det-jumps
  title: חושבים שמשפחה רציפה של מטריצות אורתוגונליות יכולה לעבור מסיבוב לשיקוף
  belief: >-
    אם $\Phi(t)$ אורתוגונלית לכל $t$ ו-$\Phi(0)=I$, ייתכן ש-$\det\Phi(t)=-1$ לאיזה $t$.
  truth: >-
    $\det\Phi(t)$ רציפה ב-$t$ ומקבלת רק את הערכים $\pm1$; לפי משפט ערך הביניים היא קבועה, ולכן שווה ל-$\det I=1$. משפחה
    רציפה של סיבובים נשארת סיבובים.
  remedy: { lesson: '0.6', label: 'מטריצת הפתרון אורתוגונלית' }
