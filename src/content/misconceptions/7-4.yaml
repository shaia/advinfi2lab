# Misconceptions first detected in lesson 7.4 (Stokes' theorem).
- id: MC-c7-stokes-statement
  title: מנסחים את משפט סטוקס עם הדיברגנץ או בלי הכיוון
  belief: >-
    משפט סטוקס אומר ש-$\iint_S\nabla\cdot\mathbf F\,dS=\oint_{\partial S}\mathbf F\cdot d\mathbf s$, או שהשוויון נכון בכל
    כיוון של השפה.
  truth: >-
    $\iint_S(\nabla\times\mathbf F)\cdot d\mathbf S=\oint_{\partial S}\mathbf F\cdot d\mathbf s$, כשהכיוון של $\partial S$
    מתואם עם $\hat{\mathbf N}$ לפי כלל יד ימין. מימין סירקולציה, ולכן משמאל שטף של **רוטור**.
  remedy: { lesson: '7.4', label: 'הניסוח של משפט סטוקס' }

- id: MC-c7-right-hand-rule
  title: מכוונים את השפה של משטח בלי קשר לנורמל
  belief: >-
    השפה של משטח בסטוקס היא תמיד נגד כיוון השעון כשמסתכלים מלמעלה, מה שלא יהיה הנורמל.
  truth: >-
    הכיוון של $\partial S$ נקבע מ-$\hat{\mathbf N}$: אגודל יד ימין לאורך $\hat{\mathbf N}$ והאצבעות מראות את כיוון השפה;
    או: בנקודה של השפה, בכיוון ההתקדמות הנכון $\mathbf t$ הווקטור $\hat{\mathbf N}\times\mathbf t$ מצביע אל תוך המשטח.
    לחצי הספרה התחתון עם הנורמל החיצוני (למטה) השפה היא עם כיוון השעון כשמסתכלים מלמעלה.
  remedy: { lesson: '7.4', label: 'כלל יד ימין בין הנורמל לשפה' }

- id: MC-c7-graph-normal
  title: טועים בסימן של הנורמל של גרף
  belief: >-
    לגרף $\sigma(x,y)=(x,y,f(x,y))$ מתקיים $\sigma_x\times\sigma_y=(f_x,f_y,1)$ או $(f_x,f_y,-1)$, ולגרף מעל מישור
    $yz$ מתקיים $\sigma_y\times\sigma_z=(1,g_y,g_z)$.
  truth: >-
    $\sigma_x\times\sigma_y=(1,0,f_x)\times(0,1,f_y)=(-f_x,-f_y,1)$: הרכיב השלישי $1>0$, ולכן הנורמל של הפרמטריזציה הזו
    תמיד כלפי מעלה. באותו אופן לגרף $\sigma(y,z)=(g(y,z),y,z)$ מעל מישור $yz$:
    $\sigma_y\times\sigma_z=(1,-g_y,-g_z)$. בדיקה מהירה: הנורמל מאונך ל-$\sigma_y$ ול-$\sigma_z$.
  remedy: { lesson: '7.4', label: 'סטוקס למשטח שהוא גרף' }

- id: MC-c7-chain-rule-dropped
  title: שוכחים את כלל השרשרת כשמציבים את המשטח בפונקציה
  belief: >-
    $\frac{\partial}{\partial y}P(x,y,f(x,y))=P_y(x,y,f(x,y))$.
  truth: >-
    לפי כלל השרשרת $\frac{\partial}{\partial y}P(x,y,f(x,y))=P_y+P_z\,f_y$. המחובר $P_z f_y$ הוא בדיוק מה שמתאים לרכיב
    $-f_y$ של הנורמל בצד של השטף.
  remedy: { lesson: '7.4', label: 'ההוכחה למשטח שהוא גרף' }

- id: MC-c7-unit-normal-dA
  title: מכפילים בנורמל היחידה ומשלבים לפי השטח של ההיטל
  belief: >-
    שטף דרך גרף מעל $D$ הוא $\iint_D\mathbf F\cdot\hat{\mathbf N}\,dx\,dy$, עם הנורמל המנורמל.
  truth: >-
    $d\mathbf S=\hat{\mathbf N}\,dS=(\sigma_x\times\sigma_y)\,dx\,dy$. או שמשלבים $\mathbf F\cdot\hat{\mathbf N}$ לפי
    $dS=\|\sigma_x\times\sigma_y\|\,dx\,dy$, או $\mathbf F\cdot(\sigma_x\times\sigma_y)$ לפי $dx\,dy$; הערבוב מאבד את
    הגורם $\|\sigma_x\times\sigma_y\|$.
  remedy: { lesson: '7.4', label: 'שטף דרך גרף: הנורמל לא מנורמל' }

- id: MC-c7-flux-depends-only-on-boundary
  title: חושבים שהשטף של כל שדה תלוי רק בשפת המשטח
  belief: >-
    לשני משטחים עם אותה שפה יש אותו שטף, לכל שדה.
  truth: >-
    זה נכון לשטף של **רוטור**, כי שניהם שווים לאינטגרל על השפה. לשדה כללי לא: השטף של $(x,y,z)$ דרך חצי ספרת
    היחידה העליונה הוא $2\pi$, ודרך עיגול היחידה במישור $z=0$ הוא $0$.
  remedy: { lesson: '7.4', label: 'החלפת משטח במשטח עם אותה שפה' }

- id: MC-c7-closed-curl-flux
  title: חושבים שלשטף של רוטור דרך משטח סגור יכול להיות כל ערך
  belief: >-
    לספרה אין שפה, ולכן אי אפשר לומר דבר על $\oiint_S(\nabla\times\mathbf F)\cdot d\mathbf S$.
  truth: >-
    חותכים את הספרה לשני חצאים. לפי סטוקס כל חצי נותן אינטגרל על אותו מעגל, אבל בכיוונים הפוכים, ולכן הסכום אפס.
    השטף של רוטור (של שדה מסדר $C^1$) דרך כל משטח סגור הוא $0$.
  remedy: { lesson: '7.4', label: 'שטף של רוטור דרך משטח סגור' }

- id: MC-c7-stokes-needs-solid
  title: חושבים שסטוקס תלוי ברוטור בכל המרחב שסביב המשטח
  belief: >-
    כדי להסיק מסטוקס שהאינטגרל על השפה אפס, צריך שהרוטור יתאפס בכל התחום התלת-ממדי שהמשטח חוסם.
  truth: >-
    בצד של השטף מופיעים רק ערכי $\nabla\times\mathbf F$ **על המשטח** עצמו (וההנחה ש-$\mathbf F\in C^1$ סביבו). אם
    $\nabla\times\mathbf F=0$ בכל נקודות משטח אחד שהשפה שלו $C$, אז $\oint_C\mathbf F\cdot d\mathbf s=0$.
  remedy: { lesson: '7.4', label: 'מה סטוקס צריך לדעת על הרוטור' }

- id: MC-c7-stokes-scope
  title: חושבים שסטוקס חל רק על גרף חלק מעל תחום סגור
  belief: >-
    המשפט הוכח לגרף של פונקציה מסדר $C^2$, ולכן אי אפשר להפעיל אותו על חצי ספרה, שפונקציית הגובה שלה לא גזירה בשפה,
    או שמחליפים את חצי הספרה בעיגול בלי להזדקק לסטוקס עליה.
  truth: >-
    סטוקס חל על כל משטח קומפקטי, מכוון וחלק למקוטעין עם שפה. ההוכחה לגרפים מגיעה לחצי הספרה בגבול (החלק מעל העיגול
    ברדיוס $r<1$, ו-$r\to1$) או בחלוקה לחתיכות שכל אחת גרף חלק מעל אחד ממישורי הקואורדינטות; ההוכחה הכללית בשיעור 8.5.
    ההחלפה של משטח במשטח אחר עם אותה שפה היא עצמה שימוש בסטוקס על שניהם.
  remedy: { lesson: '7.4', label: 'על אילו משטחים סטוקס חל' }

- id: MC-c7-graph-continuity-enough
  title: חושבים שבהוכחת סטוקס לגרף מספיק שפונקציית הגובה רציפה
  belief: >-
    ההוכחה לגרף $z=f(x,y)$ משתמשת רק ברציפות של $f$, ולכן היא חלה על כל משטח שהוא גרף של פונקציה רציפה.
  truth: >-
    ההוכחה גוזרת את $f$: בכלל השרשרת $\tilde P_y=P_y+P_zf_y$, בנורמל $(-f_x,-f_y,1)$, וברכיב $(0,0,R)$ גם
    $f_{xy}=f_{yx}$. לכן היא דורשת $f\in C^2$ עד השפה, ומשטח כמו חצי ספרה מקבלים בגבול או בחלוקה לחתיכות.
  remedy: { lesson: '7.4', label: 'ההוכחה למשטח שהוא גרף' }
