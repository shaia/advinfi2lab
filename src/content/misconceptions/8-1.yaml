# Misconceptions first detected in lesson 8.1 (1-forms, their integral on a curve, df).
- id: MC-c8-form-is-number
  title: חושבים שתבנית מסדר 1 בנקודה היא מספר או פונקציה סקלרית
  belief: >-
    תבנית מסדר 1 היא פונקציה שנותנת מספר בכל נקודה, ו-$df$ הוא המספר $f_x+f_y+f_z$.
  truth: >-
    בכל נקודה $p$ התבנית $\omega_p$ היא פונקציונל לינארי על וקטורים: היא מקבלת וקטור $v$ ומחזירה מספר
    $\omega_p(v)$. למשל $df_p(v)=f_x(p)v_1+f_y(p)v_2+f_z(p)v_3$, ובלי $v$ אין מספר.
  remedy: { lesson: '8.1', label: 'תבנית מסדר 1: פונקציונל לינארי בכל נקודה' }

- id: MC-c8-dx-is-increment
  title: חושבים ש-dx הוא שינוי קטן או הקואורדינטה של הנקודה
  belief: >-
    $dx$ הוא "שינוי אינפיניטסימלי ב-$x$", או הקואורדינטה $x$ של הנקודה, ולכן $dy_p(v)$ תלוי ב-$p$.
  truth: >-
    $dx$, $dy$, $dz$ הם הפונקציונלים של הקואורדינטות: $dx_p(v)=v_1$, $dy_p(v)=v_2$, $dz_p(v)=v_3$, באותו אופן בכל
    נקודה. הם בסיס למרחב הפונקציונלים הלינאריים על $\mathbb R^3$.
  remedy: { lesson: '8.1', label: 'הבסיס dx, dy, dz' }

- id: MC-c8-point-vector-swap
  title: מציבים את הווקטור במקדמים ואת הנקודה בפונקציונל
  belief: >-
    כדי לחשב $\omega_p(v)$ אפשר להציב את $v$ במקדמים ולהפעיל על $p$, או פשוט לחשב את המכפלה הסקלרית של $p$ ו-$v$.
  truth: >-
    למקדמים מציבים את **הנקודה** $p$; את הפונקציונל שמתקבל מפעילים על **הווקטור** $v$. לנקודה ולווקטור
    תפקידים שונים: המקדמים יכולים להיות כל פונקציה של $p$, והתלות ב-$v$ תמיד לינארית.
  remedy: { lesson: '8.1', label: 'הערכה של תבנית על וקטור בנקודה' }

- id: MC-c8-form-nonlinear
  title: חושבים שכל ביטוי בנקודה ובווקטור הוא תבנית מסדר 1
  belief: >-
    כל כלל שנותן מספר לנקודה ולווקטור, למשל $\|v\|$ או $v_1v_2$, הוא תבנית מסדר 1.
  truth: >-
    תבנית מסדר 1 צריכה להיות **לינארית** ב-$v$ בכל נקודה. $\|v\|$ (אלמנט אורך הקשת) ו-$v_1v_2$ אינם לינאריים,
    וגם $v_1+1$ לא (הוא אפיני). לכן $\int\rho\,ds$ אינו אינטגרל של תבנית.
  remedy: { lesson: '8.1', label: 'ההגדרה: לינאריות בכל נקודה' }

- id: MC-c8-forget-velocity
  title: מציבים את המסילה במקדמים ושוכחים את הנגזרת שלה
  belief: >-
    $\int_\gamma P\,dx+Q\,dy+R\,dz=\int_a^b\big(P(\gamma(t))+Q(\gamma(t))+R(\gamma(t))\big)\,dt$.
  truth: >-
    לאורך המסילה $dx$ הופך ל-$x'(t)\,dt$:
    $\int_\gamma\omega=\int_a^b\omega_{\gamma(t)}(\gamma'(t))\,dt=\int_a^b\big(Px'+Qy'+Rz'\big)\,dt$.
  remedy: { lesson: '8.1', label: 'אינטגרל של תבנית על מסילה' }

- id: MC-c8-form-integral-unoriented
  title: חושבים שהאינטגרל של תבנית על מסילה לא תלוי בכיוון
  belief: >-
    כמו אורך קשת, גם $\int_\gamma\omega$ תלוי רק בצורה של המסילה, לא בכיוון שבו עוברים אותה.
  truth: >-
    $\int_\gamma\omega$ אינו משתנה בפרמטריזציה ששומרת כיוון ומחליף סימן כשהופכים את הכיוון: הנגזרת של החלפת
    הפרמטר נכנסת עם הסימן שלה. רק $\int\rho\,ds$, שמשתמש ב-$\|\gamma'\|$, עיוור לכיוון.
  remedy: { lesson: '8.1', label: 'אינטגרל של תבנית: אי-תלות בפרמטריזציה ותלות בכיוון' }

- id: MC-c8-every-form-exact
  title: חושבים שכל תבנית היא הנגזרת של משהו
  belief: >-
    כל תבנית מסדר 1 היא $df$ לאיזו $f$ (מוצאים אותה באינטגרציה של כל מקדם), ובאותו אופן כל תבנית מסדר 2 היא
    $d\omega$.
  truth: >-
    אם $\omega=df$ אז $d\omega=0$, כי $d^2=0$. לכן $x\,dy$ אינה $df$ (כי $d(x\,dy)=dx\wedge dy\ne0$), ו-$x\,dy\wedge dz$
    אינה $d\omega$ (כי $d(x\,dy\wedge dz)\ne0$). תנאי הכרחי הוא נגזרת חיצונית אפס.
  remedy: { lesson: '8.3', label: 'הנגזרת החיצונית פעמיים היא אפס' }

- id: MC-c8-df-finite-difference
  title: מחליפים את הדיפרנציאל בהפרש של ערכי הפונקציה
  belief: >-
    $df_p(v)=f(p+v)-f(p)$.
  truth: >-
    $df_p(v)$ הוא הקירוב **הלינארי** להפרש: $df_p(v)=\nabla f(p)\cdot v$, הנגזרת הכיוונית. ההפרש $f(p+v)-f(p)$ שווה לו
    רק עד שגיאה $o(\|v\|)$, ואינו לינארי ב-$v$.
  remedy: { lesson: '8.1', label: 'הדיפרנציאל של פונקציה כתבנית' }

- id: MC-c8-partial-one-term
  title: גוזרים כל מחובר רק לפי המשתנה הבולט בו כשכותבים את הדיפרנציאל
  belief: >-
    $d(x^2y+yz^3)=2x\,dx+z^3\,dy+3z^2\,dz$: כל מחובר תורם רק למקדם של "המשתנה שלו", והמשתנים האחרים בו נשארים או
    נעלמים.
  truth: >-
    המקדם של $dx$ הוא הנגזרת החלקית המלאה $f_x$, שבה כל מחובר שתלוי ב-$x$ נגזר והשאר קבועים:
    $d(x^2y+yz^3)=2xy\,dx+(x^2+z^3)\,dy+3yz^2\,dz$.
  remedy: { lesson: '8.1', label: 'הדיפרנציאל של פונקציה כתבנית' }
