# Misconceptions first detected in lesson 9.1 (inner product spaces: axioms, Cauchy–Schwarz, parallelogram law).
- id: MC-c9-ip-positivity
  title: בודקים סימטריה ולינאריות ושוכחים את החיוביות המוחלטת
  belief: >-
    תבנית סימטרית ולינארית בכל משתנה היא מכפלה פנימית; את התנאי על $\langle x,x\rangle$ אפשר לבדוק בכמה
    וקטורים או לדלג עליו.
  truth: >-
    מכפלה פנימית חייבת לקיים $\langle x,x\rangle\ge0$ לכל $x$, ושוויון רק ב-$x=0$. התבנית
    $x_1y_1-x_2y_2$ על $\mathbb R^2$ נותנת $\langle(0,1),(0,1)\rangle<0$, והתבנית $\int_0^{1/2}fg$ על
    $C[0,1]$ מתאפסת על פונקציה שאינה אפס אבל מתאפסת על $[0,\tfrac12]$.
  remedy: { lesson: '9.1', label: 'ההגדרה של מכפלה פנימית: שלוש האקסיומות' }

- id: MC-c9-ip-linearity
  title: חושבים שערך מוחלט בתוך התבנית לא פוגע בה
  belief: >-
    $\int_0^1|fg|$ או $|x_1y_1|+|x_2y_2|$ הן מכפלות פנימיות, כי הן סימטריות וחיוביות.
  truth: >-
    מכפלה פנימית לינארית בכל משתנה, ובפרט $\langle -x,y\rangle=-\langle x,y\rangle$. ערך מוחלט שובר את זה:
    $\int_0^1|(-f)g|=\int_0^1|fg|$.
  remedy: { lesson: '9.1', label: 'ההגדרה של מכפלה פנימית: לינאריות' }

- id: MC-c9-terms-to-zero
  title: חושבים שטור שאיבריו שואפים לאפס מתכנס
  belief: >-
    כדי שהטור $\sum x_ny_n$ יתכנס מספיק ש-$x_ny_n\to0$.
  truth: >-
    זה תנאי הכרחי בלבד: $\sum\frac1n$ מתבדר. ב-$\ell^2$ ההתכנסות באה מההשוואה
    $|x_ny_n|\le\frac12(x_n^2+y_n^2)$.
  remedy: { lesson: '9.1', label: 'המרחב של הסדרות: למה המכפלה מוגדרת' }

- id: MC-c9-ell2-needs-l1
  title: חושבים שבשביל המכפלה במרחב הסדרות צריך שהטורים של האיברים עצמם יתכנסו
  belief: >-
    ב-$\ell^2$ מתקיים $\sum x_n<\infty$, ולכן המכפלה מוגדרת; ובלי זה הטור $\sum x_ny_n$ עלול להתבדר.
  truth: >-
    $x_n=\frac1n$ נמצאת ב-$\ell^2$ אף ש-$\sum\frac1n$ מתבדר. הטור $\sum x_ny_n$ מתכנס בהחלט לכל
    $x,y\in\ell^2$, בלי שום הנחה על $\sum x_n$.
  remedy: { lesson: '9.1', label: 'המרחב של הסדרות: דוגמאות' }

- id: MC-c9-riemann-definite
  title: מתעלמים מתפקיד הרציפות בחיוביות המוחלטת של אינטגרל הריבוע
  belief: >-
    השאלה אם $\int_a^b f^2=0$ גורר $f=0$ אינה תלויה במרחב: זה נכון לכל פונקציה אינטגרבילית, או שזה נכשל
    גם ב-$C[a,b]$.
  truth: >-
    ב-$C[a,b]$ זה נכון: אם $f(x_0)\neq0$, הרציפות נותנת קטע שבו $f^2>\frac12f(x_0)^2$, והאינטגרל חיובי.
    לפונקציה אינטגרבילית זה לא נכון: הפונקציה שהיא 1 בנקודה אחת ו-0 בשאר מקיימת $\int f^2=0$. לכן
    $\int fg$ על $H[a,b]$ היא רק מכפלה פנימית למחצה.
  remedy: { lesson: '9.1', label: 'מרחב הפונקציות הרציפות: למה צריך רציפות' }

- id: MC-c9-norm-without-square
  title: מרבעים את הסכום או את האינטגרל במקום לסכום ריבועים
  belief: >-
    $\|f\|^2=\left(\int_a^b f\right)^2$, או $\|x\|^2=\sum x_n$; ובאותו אופן $\int f=0$ גורר $f=0$.
  truth: >-
    $\|f\|^2=\int_a^b f^2$ ו-$\|x\|^2=\sum x_n^2$: מרבעים קודם ומסכמים אחר כך. למשל ב-$C[0,1]$
    $\|1+x\|^2=\frac73$, ואילו $\left(\int_0^1(1+x)\,dx\right)^2=\frac94$.
  remedy: { lesson: '9.1', label: 'הנורמה המושרית' }

- id: MC-c9-drop-cross-term
  title: שוכחים את האיבר המעורב בפתיחת ריבוע של סכום
  belief: >-
    $\|x+y\|^2=\|x\|^2+\|y\|^2$ לכל $x,y$, וכך גם $(1+x)^2=1+x^2$ בתוך אינטגרל.
  truth: >-
    $\|x+y\|^2=\|x\|^2+2\langle x,y\rangle+\|y\|^2$. האיבר המעורב נעלם רק כש-$x\perp y$: זה משפט
    פיתגורס, לא כלל כללי.
  remedy: { lesson: '9.1', label: 'פתיחת ריבוע הנורמה' }

- id: MC-c9-norm-vs-square
  title: מבלבלים בין הנורמה לבין ריבוע הנורמה
  belief: >-
    המספר $\int(f-g)^2$ הוא המרחק בין $f$ ל-$g$, או שמחלקים ב-$\|u\|$ במקום שצריך לחלק ב-$\|u\|^2$.
  truth: >-
    המרחק הוא $\|f-g\|=\sqrt{\int(f-g)^2}$. בנוסחאות של מקדמים והטלות מופיע $\|u\|^2$:
    $\frac{\langle f,u\rangle}{\|u\|^2}u$. בדקו כל תשובה לפי האם שאלו על המרחק או על ריבועו.
  remedy: { lesson: '9.1', label: 'הנורמה המושרית והמרחק' }

- id: MC-c9-cs-squared-norms
  title: מציבים ריבועי נורמות באי-שוויון קושי-שוורץ
  belief: >-
    $|\langle x,y\rangle|\le\|x\|^2\|y\|^2$.
  truth: >-
    $|\langle x,y\rangle|\le\|x\|\,\|y\|$, או בריבוע $\langle x,y\rangle^2\le\|x\|^2\|y\|^2$. שני האגפים צריכים
    להיות מאותה "מעלה": הכפלת $x$ ב-$t$ מכפילה את האגף השמאלי ב-$|t|$.
  remedy: { lesson: '9.1', label: 'אי-שוויון קושי-שוורץ' }

- id: MC-c9-cs-equality
  title: חושבים שיש שוויון בקושי-שוורץ גם לווקטורים שאינם פרופורציוניים
  belief: >-
    אם שתי פונקציות חיוביות, או עולות, אז $\langle f,g\rangle=\|f\|\,\|g\|$.
  truth: >-
    שוויון מתקבל בדיוק כש-$x$ ו-$y$ תלויים לינארית. ב-$C[0,1]$:
    $\langle x,x^2\rangle=\frac14<\frac1{\sqrt{15}}=\|x\|\,\|x^2\|$.
  remedy: { lesson: '9.1', label: 'קושי-שוורץ: מתי יש שוויון' }

- id: MC-c9-cs-interval-length
  title: שוכחים את הנורמה של הפונקציה הקבועה 1
  belief: >-
    קושי-שוורץ עם $g\equiv1$ נותן $\left(\int_a^b f\right)^2\le\int_a^b f^2$ בכל קטע.
  truth: >-
    $\|1\|^2=b-a$, ולכן $\left(\int_a^b f\right)^2\le(b-a)\int_a^b f^2$. על $[0,2]$ והפונקציה $f\equiv1$:
    $4>2$.
  remedy: { lesson: '9.1', label: 'קושי-שוורץ באינטגרלים' }

- id: MC-c9-triangle-from-axioms
  title: חושבים שאי-שוויון המשולש לנורמה המושרית נובע ישר מהאקסיומות
  belief: >-
    אי-שוויון המשולש הוא אחת האקסיומות של מכפלה פנימית, או שהוא יוצא מפתיחת הריבוע בלבד.
  truth: >-
    פתיחת הריבוע נותנת $\|x+y\|^2=\|x\|^2+2\langle x,y\rangle+\|y\|^2$, ורק קושי-שוורץ,
    $\langle x,y\rangle\le\|x\|\,\|y\|$, הופך את זה ל-$(\|x\|+\|y\|)^2$.
  remedy: { lesson: '9.1', label: 'אי-שוויון המשולש מקושי-שוורץ' }

- id: MC-c9-identity-no-squares
  title: כותבים את חוק המקבילית ואת זהות הפולריזציה עם נורמות במקום ריבועי נורמות
  belief: >-
    $\langle x,y\rangle=\frac14\left(\|x+y\|-\|x-y\|\right)$, או $\|x+y\|+\|x-y\|=2\|x\|+2\|y\|$.
  truth: >-
    שתי הזהויות הן על ריבועים: $\langle x,y\rangle=\frac14\left(\|x+y\|^2-\|x-y\|^2\right)$
    וגם $\|x+y\|^2+\|x-y\|^2=2\|x\|^2+2\|y\|^2$. הן נובעות מפתיחת $\|x\pm y\|^2$.
  remedy: { lesson: '9.1', label: 'חוק המקבילית וזהות הפולריזציה' }

- id: MC-c9-parallelogram-form
  title: טועים במקדמים של חוק המקבילית או של זהות הפולריזציה
  belief: >-
    $\|x+y\|^2+\|x-y\|^2=\|x\|^2+\|y\|^2$, או $\langle x,y\rangle=\frac12\left(\|x+y\|^2-\|x-y\|^2\right)$.
  truth: >-
    מחברים את $\|x\pm y\|^2=\|x\|^2\pm2\langle x,y\rangle+\|y\|^2$: הסכום הוא $2\|x\|^2+2\|y\|^2$ וההפרש הוא
    $4\langle x,y\rangle$. בריבוע היחידה במישור: שני האלכסונים בריבוע, $2+2$, שווים לארבע הצלעות בריבוע.
  remedy: { lesson: '9.1', label: 'חוק המקבילית: הגזירה מפתיחת הריבוע' }

- id: MC-c9-every-norm-inner
  title: חושבים שכל נורמה באה ממכפלה פנימית
  belief: >-
    כל נורמה (למשל נורמת המקסימום או סכום הערכים המוחלטים) היא $\sqrt{\langle x,x\rangle}$ של מכפלה פנימית
    כלשהי.
  truth: >-
    נורמה שבאה ממכפלה פנימית מקיימת את חוק המקבילית. נורמת המקסימום על $C[0,1]$ נכשלת בו: עם
    $f\equiv1$ ו-$g(x)=x$ מתקבל $4+1=5\neq4$.
  remedy: { lesson: '9.1', label: 'נורמת המקסימום אינה באה ממכפלה פנימית' }

- id: MC-c9-one-example-proves
  title: בודקים זהות בדוגמה אחת ומסיקים שהיא נכונה תמיד
  belief: >-
    אם חוק המקבילית מתקיים לזוג אחד של וקטורים, הנורמה מקיימת אותו.
  truth: >-
    זהות צריכה להתקיים לכל זוג. דוגמה אחת יכולה רק להפריך: נורמת המקסימום מקיימת את החוק ב-$f=g\equiv1$
    ונכשלת ב-$f\equiv1$, $g(x)=x$.
  remedy: { lesson: '9.1', label: 'חוק המקבילית: דוגמה נגדית' }
