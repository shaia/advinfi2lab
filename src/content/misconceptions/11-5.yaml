# Misconceptions first detected in lesson 11.5 (Peano's theorem, enrichment).
- id: MC-c11-peano-by-banach
  title: מנסים להוכיח את משפט פאנו במשפט נקודת השבת של בנך
  belief: >-
    גם את משפט פאנו מוכיחים כמו את פיקאר-לינדלוף: העתקת פיקאר מכווצת ויש לה נקודת שבת.
  truth: >-
    בלי תנאי ליפשיץ אין כיווץ, ובנך היה נותן גם יחידות, שאינה נכונה כאן. פאנו נשען על קומפקטיות: משפחת קירובים
    חסומה ורציפה במידה אחידה, ומשפט ארצלה-אסקולי.
  remedy: { lesson: '11.5', label: 'ההוכחה של פאנו: קומפקטיות במקום כיווץ' }

- id: MC-c11-euler-converges-whole
  title: חושבים שהסדרה של מצולעי אוילר מתכנסת כולה
  belief: >-
    מצולעי אוילר הם סדרת קושי במידה שווה, או שמשפט ארצלה-אסקולי נותן התכנסות של כל הסדרה.
  truth: >-
    ארצלה-אסקולי נותן רק **תת-סדרה** מתכנסת במידה שווה. כשאין יחידות, תת-סדרות שונות עשויות להתכנס לפתרונות
    שונים. כשיש יחידות, כל תת-סדרה מכילה תת-סדרה שמתכנסת לאותו פתרון, ואז כל הסדרה מתכנסת.
  remedy: { lesson: '11.5', label: 'תת-סדרה, לא סדרה' }

- id: MC-c11-each-uc-enough
  title: מבלבלים בין רציפות במידה שווה של כל פונקציה לרציפות במידה אחידה של המשפחה
  belief: >-
    כל מצולע אוילר רציף בקטע סגור ולכן רציף במידה שווה, וזה מה שמשפט ארצלה-אסקולי צריך.
  truth: >-
    ארצלה-אסקולי דורש **רציפות במידה אחידה**: $\delta$ אחד לכל הפונקציות במשפחה. כאן הוא בא מכך שכל המצולעים
    ליפשיציים עם אותו קבוע $M$. המשפחה $\sin nx$ מורכבת מפונקציות רציפות במידה שווה ואינה רציפה במידה אחידה.
  remedy: { lesson: '11.5', label: 'רציפות במידה אחידה של מצולעי אוילר' }

- id: MC-c11-aa-whole-sequence
  title: חושבים שארצלה-אסקולי נותן התכנסות של כל הסדרה
  belief: >-
    סדרה חסומה ורציפה במידה אחידה ב-$C(K)$ מתכנסת במידה שווה.
  truth: >-
    המשפט נותן **תת-סדרה** מתכנסת. $f_n\equiv(-1)^n$ חסומה ורציפה במידה אחידה ואינה מתכנסת. בהוכחת פאנו זה מספיק:
    הגבול של תת-הסדרה הוא פתרון.
  remedy: { lesson: '11.5', label: 'מה בדיוק ארצלה-אסקולי נותן' }

- id: MC-c11-peano-discontinuous
  title: חושבים שמשפט פאנו חל על אגף ימין חסום שאינו רציף
  belief: >-
    מספיק ש-$f$ תהיה חסומה במלבן כדי שיהיה פתרון.
  truth: >-
    פאנו דורש רציפות; היא משמשת במעבר לגבול באינטגרל. ל-$y'=\operatorname{sgn}t$, $y(0)=0$, עם אגף ימין חסום, אין
    פתרון גזיר בשום קטע שמכיל את 0.
  remedy: { lesson: '11.5', label: 'ההנחה של פאנו: רציפות' }
