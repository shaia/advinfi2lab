# Misconceptions first detected in lesson 11.4 (Grönwall's inequality, uniqueness, continuous dependence, global existence).
- id: MC-c11-gronwall-no-growth
  title: חושבים שאי-שוויון גרונוול משאיר את החסם בלי גדילה
  belief: >-
    מ-$u(t)\le C+\int_{t_0}^t Lu$ נובע $u(t)\le C$; או: פתרונות שמתחילים במרחק $\delta$ נשארים במרחק $\delta$.
  truth: >-
    המסקנה היא $u(t)\le Ce^{L(t-t_0)}$, והחסם גדל מעריכית. עבור $y'=y$ ההפרש בין שני פתרונות הוא בדיוק
    $\delta e^{t}$.
  remedy: { lesson: '11.4', label: 'אי-שוויון גרונוול: הניסוח' }

- id: MC-c11-gronwall-linear
  title: עוצרים בקירוב הלינארי של גרונוול
  belief: >-
    מ-$u\le C+\int Lu$ נובע $u(t)\le C(1+L(t-t_0))$.
  truth: >-
    זה רק הצעד הראשון באיטרציה. החסם הנכון הוא $Ce^{L(t-t_0)}$, והוא גדול מ-$C(1+L(t-t_0))$ לכל $t>t_0$. עבור
    $u=Ce^{L(t-t_0)}$ ההנחה מתקיימת בשוויון, ולכן חסם לינארי אינו נכון.
  remedy: { lesson: '11.4', label: 'אי-שוויון גרונוול: למה מעריכי' }

- id: MC-c11-gronwall-exponent
  title: טועים במעריך של גרונוול
  belief: >-
    החסם הוא $Ce^{L}$, או $Ce^{t-t_0}$, או $Ce^{-L(t-t_0)}$ כשהפתרונות מתקרבים.
  truth: >-
    המעריך הוא $L(t-t_0)$, עם $L\ge0$ קבוע ליפשיץ ו-$t-t_0$ אורך הזמן שעבר. קבוע ליפשיץ אינו שלילי לעולם, גם
    כש-$\frac{\partial f}{\partial y}<0$.
  remedy: { lesson: '11.4', label: 'אי-שוויון גרונוול: המעריך' }

- id: MC-c11-gronwall-needs-positive-C
  title: חושבים שגרונוול לא חל כשהקבוע C הוא אפס
  belief: >-
    אי-שוויון גרונוול דורש $C>0$, ולכן אי אפשר להפעיל אותו עם $C=0$ כדי להוכיח יחידות.
  truth: >-
    ההוכחה עם $U(t)=C+\int_{t_0}^t Lu$ לא מחלקת ב-$C$, ולכן היא עובדת גם עם $C=0$ ונותנת $u\equiv0$. זו בדיוק
    הוכחת היחידות.
  remedy: { lesson: '11.4', label: 'גרונוול עם C אפס' }

- id: MC-c11-gronwall-wrong-function
  title: מפעילים את גרונוול על הפונקציה הלא נכונה
  belief: >-
    בהוכחת היחידות מפעילים את גרונוול על $|f(t,y_1)-f(t,y_2)|$, או עם $C=|y_0|$.
  truth: >-
    מחסירים את שתי המשוואות האינטגרליות ומקבלים עבור $u=|y_1-y_2|$ את $u(t)\le\int_{t_0}^t Lu$, כלומר $C=0$
    כי לשני הפתרונות אותו ערך התחלה.
  remedy: { lesson: '11.4', label: 'הוכחת היחידות מגרונוול' }

- id: MC-c11-bound-is-equality
  title: קוראים את החסם של גרונוול כאילו הוא שוויון
  belief: >-
    לפי גרונוול, פתרונות קרובים **מתרחקים** בקצב $e^{L|t-t_0|}$.
  truth: >-
    גרונוול נותן חסם עליון בלבד. עבור $y'=-y$ (עם $L=1$) ההפרש הוא $\delta e^{-t}$ ודועך, אף שהחסם $\delta e^{t}$
    גדל.
  remedy: { lesson: '11.4', label: 'תלות רציפה: חסם, לא שוויון' }

- id: MC-c11-system-L-entry
  title: מחשבים את קבוע ליפשיץ של מערכת לינארית מאיבר אחד של המטריצה
  belief: >-
    קבוע ליפשיץ של $Y'=AY$ הוא האיבר הגדול ביותר של $A$, השורה הראשונה, או סכום כל האיברים.
  truth: >-
    $|AY_1-AY_2|\le\|A\|_{\mathrm{op}}|Y_1-Y_2|$, וזה הקבוע הקטן ביותר. בנורמת אינסוף, נורמת האופרטור היא הסכום
    המקסימלי של ערכים מוחלטים בשורה.
  remedy: { lesson: '11.4', label: 'מערכות לינאריות: קבוע ליפשיץ הוא נורמת האופרטור' }

- id: MC-c11-local-vs-global-uniqueness
  title: מבלבלים בין יחידות מקומית ליד ההתחלה ליחידות לאורך כל הפתרון
  belief: >-
    אם $f$ ליפשיצית ליד ערך ההתחלה, הפתרון יחיד לכל הזמנים; או: אם $f$ אינה ליפשיצית באיזו נקודה, אין יחידות
    בשום מקום.
  truth: >-
    התנאי נבדק במלבן שסביב הנקודה הנוכחית של הפתרון. ל-$y'=2\sqrt{|y|}$, $y(0)=1$ יש פתרון יחיד כל עוד $y>0$,
    כלומר עבור $t>-1$, ואחרי שהפתרון מגיע ל-0 (אחורה בזמן) היחידות נשברת.
  remedy: { lesson: '11.4', label: 'יחידות מקומית ויחידות לאורך כל הפתרון' }

- id: MC-c11-uniqueness-only-near-t0
  title: חושבים ששני פתרונות שנפגשים יכולים להיפרד מחוץ לקטע של המשפט
  belief: >-
    אם $f$ ליפשיצית מקומית ושני פתרונות שווים ברגע $t_1$, מובטח שהם שווים רק בקטע $|t-t_1|\le h$ של משפט
    פיקאר-לינדלוף; מחוצה לו הם יכולים להיפרד.
  truth: >-
    הקבוצה $S=\{t:\ y_1(t)=y_2(t)\}$ סגורה (רציפות) ופתוחה (בכל נקודה שלה חל המשפט המקומי מחדש, עם מלבן משלה), ולכן
    בקטע משותף היא כל הקטע או ריקה. גרפים של שני פתרונות שונים אינם נחתכים.
  remedy: { lesson: '11.4', label: 'יחידות לאורך כל הקטע' }
