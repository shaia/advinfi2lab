# Misconceptions first detected in lesson 11.1 (initial value problems and the integral equation).
- id: MC-c11-integral-forget-y0
  title: שוכחים את ערך ההתחלה במשוואה האינטגרלית
  belief: >-
    המשוואה האינטגרלית של $y'=f(t,y)$ היא $y(t)=\int_{t_0}^t f(s,y(s))\,ds$.
  truth: >-
    המשפט היסודי נותן $y(t)-y(t_0)=\int_{t_0}^t y'(s)\,ds$, ולכן $y(t)=y_0+\int_{t_0}^t f(s,y(s))\,ds$. בלי
    $y_0$ ההצבה $t=t_0$ נותנת $y(t_0)=0$: תנאי ההתחלה אבד.
  remedy: { lesson: '11.1', label: 'המשוואה האינטגרלית: ההצבה t שווה t אפס' }

- id: MC-c11-integral-lower-limit
  title: מתחילים את האינטגרל מאפס במקום מזמן ההתחלה
  belief: >-
    במשוואה האינטגרלית תמיד כותבים $\int_0^t$, גם כשתנאי ההתחלה נתון בנקודה אחרת.
  truth: >-
    הגבול התחתון הוא $t_0$, הנקודה שבה $y$ ידוע. רק כך ההצבה $t=t_0$ מאפסת את האינטגרל ומחזירה את
    $y(t_0)=y_0$.
  remedy: { lesson: '11.1', label: 'המשוואה האינטגרלית: הגבול התחתון' }

- id: MC-c11-integral-y-at-t
  title: מציבים את y בזמן t בתוך האינטגרל במקום בזמן s
  belief: >-
    אפשר לכתוב $\int_{t_0}^t f(s,y(t))\,ds$: בתוך האינטגרל הפתרון מוערך בנקודה $t$.
  truth: >-
    האינטגרל צובר את הנגזרת $y'(s)=f(s,y(s))$ לאורך הדרך, ולכן גם $y$ מוערך ב-$s$. הביטוי עם $y(t)$ הוא
    משוואה אלגברית בערך $y(t)$, לא אינטגרל של הנגזרת.
  remedy: { lesson: '11.1', label: 'המשוואה האינטגרלית: משתנה האינטגרציה' }

- id: MC-c11-integral-always-differentiable
  title: חושבים שאינטגרל עם גבול עליון משתנה תמיד גזיר
  belief: >-
    לכל פונקציה אינטגרבילית $g$, הפונקציה $G(t)=\int_{t_0}^t g$ גזירה ו-$G'=g$; לכן המשוואה האינטגרלית שקולה
    לבעיית ההתחלה בלי שום הנחה על $f$.
  truth: >-
    המשפט היסודי נותן $G'(t)=g(t)$ בנקודות שבהן $g$ רציפה. עבור $g(s)=\operatorname{sgn}s$ מקבלים
    $G(t)=|t|$, שאינה גזירה ב-0. השקילות בין בעיית ההתחלה למשוואה האינטגרלית משתמשת ברציפות של $f$.
  remedy: { lesson: '11.1', label: 'השקילות: איפה משתמשים ברציפות של f' }

- id: MC-c11-integral-equation-weaker
  title: חושבים שפתרון של המשוואה האינטגרלית הוא רק פתרון חלש
  belief: >-
    פתרון רציף של המשוואה האינטגרלית אינו בהכרח גזיר, ולכן צריך להניח גזירות בנפרד כדי לקבל פתרון של בעיית
    ההתחלה.
  truth: >-
    כש-$f$ רציפה, הפונקציה $s\mapsto f(s,y(s))$ רציפה לכל $y$ רציף, ולכן האינטגרל גזיר והמשוואה עצמה נותנת
    $y'(t)=f(t,y(t))$. הגזירות היא מסקנה, לא הנחה.
  remedy: { lesson: '11.1', label: 'השקילות: מהמשוואה האינטגרלית חזרה לבעיית ההתחלה' }

- id: MC-c11-system-substitution
  title: מחליפים משתנים לא נכון במעבר למערכת מסדר ראשון
  belief: >-
    במעבר $u=y$, $v=y'$ אפשר לכתוב את $v'$ בעזרת $v$ במקום $u$ או להפך, או לשכוח סימן.
  truth: >-
    $u'=v$ תמיד, ו-$v'=y''$ נכתב מהמשוואה המקורית כשבכל מקום $y$ מוחלף ב-$u$ ו-$y'$ מוחלף ב-$v$. עבור
    $y''+ty'+y=0$: $v'=-tv-u$.
  remedy: { lesson: '11.1', label: 'מסדר שני למערכת מסדר ראשון' }

- id: MC-c11-system-order-count
  title: סופרים לא נכון את מספר הנעלמים ותנאי ההתחלה במערכת
  belief: >-
    משוואה מסדר שני צריכה תנאי התחלה אחד, ומערכת של שתי משוואות מסדר שני היא מערכת של שתי משוואות מסדר ראשון.
  truth: >-
    משוואה מסדר $n$ היא מערכת של $n$ משוואות מסדר ראשון, בנעלמים $y,y',\dots,y^{(n-1)}$, ולכן צריך $n$ תנאי
    התחלה. שתי משוואות מסדר שני הן מערכת ממימד 4.
  remedy: { lesson: '11.1', label: 'מסדר שני למערכת מסדר ראשון: כמה תנאי התחלה' }

- id: MC-c11-forget-initial-condition
  title: בודקים רק את המשוואה ושוכחים את תנאי ההתחלה
  belief: >-
    פונקציה שמקיימת את המשוואה הדיפרנציאלית היא פתרון של בעיית ההתחלה; או: הפתרון של בעיה דומה עם תנאי התחלה
    אחר מתאים גם כאן.
  truth: >-
    פתרון של בעיית התחלה מקיים גם את המשוואה וגם את $y(t_0)=y_0$. למשל $(t-2)^3$ פותרת את $y'=3y^{2/3}$ אבל לא
    את $y(0)=0$, ו-$\tan t$ פותרת את $y'=1+y^2$ עם $y(0)=0$ ולא עם $y(0)=1$.
  remedy: { lesson: '11.1', label: 'בעיית התחלה: משוואה ותנאי' }

- id: MC-c11-smooth-implies-global
  title: חושבים שאגף ימין חלק מבטיח פתרון לכל הזמנים
  belief: >-
    אם $f$ גזירה אינסוף פעמים (או ליפשיצית מקומית) בכל המישור, הפתרון של כל בעיית התחלה מוגדר על כל הישר.
  truth: >-
    חלקות של $f$ נותנת קיום ויחידות מקומיים בלבד. $y'=y^2$, $y(0)=1$ נפתרת ב-$y=\frac1{1-t}$, שמתפוצצת ב-$t=1$.
    קיום גלובלי מובטח, למשל, כש-$f$ ליפשיצית גלובלית (שיעור 11.4).
  remedy: { lesson: '11.1', label: 'התפוצצות בזמן סופי' }

- id: MC-c11-blowup-backward
  title: מבלבלים בין התפוצצות קדימה בזמן להתפוצצות אחורה
  belief: >-
    אם הנוסחה של הפתרון מתפוצצת באיזה $t$, הפתרון מתפוצץ קדימה בזמן.
  truth: >-
    צריך לבדוק באיזה צד של $t_0$ נמצא הקוטב. $y'=y^2$, $y(0)=-1$ נפתרת ב-$y=-\frac1{1+t}$: הקוטב ב-$t=-1$, ולכן
    הפתרון קיים לכל $t\ge0$ ומתפוצץ רק אחורה בזמן.
  remedy: { lesson: '11.1', label: 'התפוצצות: באיזה כיוון בזמן' }

- id: MC-c11-blowup-time-guess
  title: מנחשים את זמן ההתפוצצות בלי לפתור
  belief: >-
    זמן ההתפוצצות של $y'=y^2$ הוא תמיד $1$, או שהוא שווה לערך ההתחלה.
  truth: >-
    פותרים: $y=\frac{y_0}{1-y_0 t}$, ולכן עבור $y_0>0$ הקוטב ב-$t=\frac1{y_0}$. ערך התחלה גדול יותר מתפוצץ מהר יותר.
  remedy: { lesson: '11.1', label: 'התפוצצות: חישוב הזמן' }

- id: MC-c11-growth-is-blowup
  title: חושבים שגדילה מהירה היא התפוצצות
  belief: >-
    פתרון שגדל מהר, כמו $e^t$, מתפוצץ.
  truth: >-
    התפוצצות פירושה ש-$|y(t)|\to\infty$ כש-$t$ שואף לזמן **סופי**. $e^t$ סופית לכל $t$ ומוגדרת על כל הישר.
  remedy: { lesson: '11.1', label: 'התפוצצות בזמן סופי: ההגדרה' }

- id: MC-c11-formula-everywhere
  title: משתמשים בנוסחה של פתרון גם מחוץ לתחום שבו היא פותרת
  belief: >-
    אם נוסחה פותרת את המשוואה בחלק מהישר, או בכל רכיב של תחום לא קשיר, היא פתרון בכל מקום שבו היא מוגדרת.
  truth: >-
    פתרון מוגדר בקטע שמכיל את $t_0$ ומקיים את המשוואה בכל נקודה שלו. $\frac1{1-t}$ על $\mathbb{R}\setminus\{1\}$
    אינה פתרון בקטע, ו-$t^2$ פותרת את $y'=2\sqrt{|y|}$ רק עבור $t\ge0$.
  remedy: { lesson: '11.1', label: 'פתרון בקטע' }
