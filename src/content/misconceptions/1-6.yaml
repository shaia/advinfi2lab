# Misconceptions first detected in lesson 1.6 (the plane curve determined by its signed curvature).
- id: MC-c1-k-integrate-once
  title: משחזרים את המסילה מהעקמומיות באינטגרציה אחת, או בלי אינטגרציה
  belief: >-
    זווית המשיק היא $k(s)$ עצמה, כלומר $\mathbf t=(\cos k,\sin k)$; או ש-$\gamma$ היא פשוט $\iint k$.
  truth: >-
    שתי אינטגרציות, בסדר: $\theta(s)=\theta_0+\int_{s_0}^s k$, ואז
    $\gamma(s)=\gamma(s_0)+\int_{s_0}^s(\cos\theta,\sin\theta)$. ל-$k\equiv1$ זה נותן מעגל; $\theta=k=1$ היה נותן
    ישר בזווית רדיאן אחד.
  remedy: { lesson: '1.6', anchor: recipe, label: 'שחזור המסילה בשתי אינטגרציות' }

- id: MC-c1-initial-data-ignored
  title: שוכחים את נתוני ההתחלה כשמשחזרים מסילה מהעקמומיות
  belief: >-
    $k(s)$ לבדה קובעת את המסילה, ואפשר להשמיט את קבועי האינטגרציה.
  truth: >-
    $k$ קובעת את המסילה עד כדי שלושה קבועים: שני הרכיבים של $\gamma(s_0)$ (הזזה) והזווית $\theta(s_0)$ (סיבוב). את הקבועים
    קובעים מתנאי ההתחלה: עם $\gamma(0)=0$, $y(s)=\int_0^s\sin\theta$ ולא פונקציה קדומה כלשהי.
  remedy: { lesson: '1.6', anchor: recipe, label: 'שחזור המסילה בשתי אינטגרציות' }

- id: MC-c1-unsigned-determines
  title: חושבים שהעקמומיות הלא-מסומנת לבדה קובעת את המסילה
  belief: >-
    שתי מסילות בפרמטר אורך הקשת עם אותה $\kappa(s)$ נבדלות בתנועה קשיחה; עקמומיות קבועה תמיד נותנת מעגל.
  truth: >-
    במישור צריך את $k$: ל-$k_1(s)=s$ ול-$k_2(s)=|s|$ אותה $\kappa=|s|$, ואין תנועה קשיחה (גם עם שיקוף) שמעבירה אחת
    לשנייה, כי תנועה כזו מכפילה את $k$ בסימן קבוע. במרחב $\kappa$ קבועה גם לסלילים: לסליל
    $(\frac14\cos t,\frac14\sin t,\frac14t)$ יש $\kappa=\frac{a}{a^2+b^2}=2$ בכל נקודה, והוא אינו מעגל.
  remedy: { lesson: '1.6', anchor: unsigned, label: 'למה צריך את העקמומיות המסומנת' }

- id: MC-c1-congruence-reflection
  title: חושבים שהעתק ראי של מסילה מתקבל ממנה בסיבוב
  belief: >-
    ל-$k(s)=s$ ול-$k(s)=-s$ (העתק הראי) יש מסילות שנבדלות בסיבוב ובהזזה, כי המשפט נותן יחידות עד כדי תנועה קשיחה.
  truth: >-
    המשפט נותן יחידות עד כדי **סיבוב והזזה**, וסיבוב שומר את $k$. את העקמומיות ההפוכה, $\tilde k=-k$, מקבלים משיקוף. ספירלת קורנו
    "ימנית" ו"שמאלית" הן העתקי ראי שאי אפשר לסובב זו לזו.
  remedy: { lesson: '1.6', anchor: mirror, label: 'יחידות עד כדי הזזה וסיבוב' }

- id: MC-c1-spiral-unbounded
  title: חושבים שמסילה באורך אינסופי חייבת להתרחק לאינסוף
  belief: >-
    לספירלה עם $k(s)=s$ על $[0,\infty)$ אורך אינסופי, ולכן התמונה שלה לא חסומה.
  truth: >-
    העקמומיות גדלה, והמסילה מסתובבת במעגלים קטנים והולכים, ברדיוס $\frac1s$, סביב נקודה גבולית. $x(s)=\int_0^s\cos\frac{u^2}{2}du$
    ו-$y(s)$ מתכנסים (אינטגרלי פרנל), ו-$\gamma(s)\to(\frac{\sqrt\pi}2,\frac{\sqrt\pi}2)$: אורך אינסופי בתחום חסום.
  remedy: { lesson: '1.6', anchor: cornu, label: 'ספירלת קורנו' }

- id: MC-c1-sign-switch-anywhere
  title: חושבים שהעקמומיות המסומנת יכולה להחליף סימן בלי לעבור באפס
  belief: >-
    מסילה עם $\kappa\equiv\frac1R$ יכולה לפנות שמאלה וימינה לסירוגין, כמו צורת S של שתי קשתות.
  truth: >-
    במסילה מסדר $C^2$ הפונקציה $k$ רציפה, ו-$|k|=\frac1R$ קבוע; לפי ערך הביניים $k$ אינה יכולה לקפוץ
    מ-$k=\frac1R$ ל-$k=-\frac1R$. צורת S משתי קשתות היא מסדר $C^1$ בלבד: $k$ קופצת בנקודת החיבור.
  remedy: { lesson: '1.6', anchor: constant-unsigned, label: 'מסילות עם עקמומיות קבועה' }

- id: MC-c1-one-point-determines
  title: חושבים שהעקמומיות בנקודה אחת קובעת את המסילה
  belief: >-
    שתי מסילות עם אותה נקודה, אותו משיק ואותה עקמומיות בנקודה אחת הן אותה מסילה.
  truth: >-
    הנתונים בנקודה אחת קובעים רק את המעגל המנשק, כלומר מגע מסדר שני. כדי לקבוע את המסילה צריך את $k(s)$ **לכל**
    $s$. לשרשרת $y=\cosh x-1$, לפרבולה $y=\frac{x^2}2$ ולמעגל היחידה סביב $(0,1)$ אותם נתונים בראשית.
  remedy: { lesson: '1.6', anchor: one-point, label: 'המסילה נקבעת מהעקמומיות שלה' }
