# Misconceptions first detected in lesson 10.3 (pointwise convergence, the Dirichlet kernel, Gibbs).
- id: MC-c10-value-at-jump
  title: חושבים שבנקודת קפיצה הטור מתכנס לערך הפונקציה, או לא מתכנס בכלל
  belief: >-
    בנקודת קפיצה $x_0$ הסכומים החלקיים שואפים ל-$f(x_0)$, או שאין שם גבול.
  truth: >-
    לפונקציה גזירה למקוטעין $S_Nf(x_0)\to\frac{f(x_0^+)+f(x_0^-)}{2}$, הממוצע של הגבולות החד-צדדיים, ואין לזה
    קשר לערך $f(x_0)$. לגל ריבועי $S_Nf(0)=0$ לכל $N$, מה שלא יהיה $f(0)$.
  remedy: { lesson: '10.3', label: 'משפט ההתכנסות הנקודתית: הממוצע בקפיצה' }

- id: MC-c10-endpoint-not-periodic
  title: שוכחים שהטור רואה את ההמשכה המחזורית, גם בקצות הקטע
  belief: >-
    בנקודה $x=\pi$ הטור מתכנס ל-$f(\pi)$ (או ל-$f(\pi^-)$), ונוסחה שנכונה על $(0,2\pi)$ אפשר להציב בכל $x$.
  truth: >-
    טור פורייה הוא פונקציה מחזורית ב-$2\pi$, ולכן הוא מתאר את ההמשכה המחזורית של $f$. ב-$x=\pi$ הוא מתכנס
    ל-$\frac{f(\pi^-)+f(-\pi^+)}2$; עבור $e^x$ על $(-\pi,\pi)$ זה $\cosh\pi$. נוסחה שהוכחה על $(0,2\pi)$ מציבים
    אחרי הזזה של $x$ לקטע הזה.
  remedy: { lesson: '10.3', label: 'ההמשכה המחזורית והקצוות' }

- id: MC-c10-kernel-sum-form
  title: כותבים את גרעין דיריכלה בלי הגורם 2
  belief: >-
    $D_N(t)=\sum_{k=0}^{N}\cos kt$, ולכן $D_N(0)=N+1$.
  truth: >-
    $D_N(t)=1+2\sum_{k=1}^{N}\cos kt=\frac{\sin((N+\frac12)t)}{\sin(t/2)}$, ולכן $D_N(0)=2N+1$. הגורם 2 בא מכך
    שהאיבר הקבוע מקבל $\frac{1}{2\pi}$ וכל האחרים $\frac1\pi$.
  remedy: { lesson: '10.3', label: 'חישוב גרעין דיריכלה' }

- id: MC-c10-kernel-mass
  title: טועים בנרמול של גרעין דיריכלה
  belief: >-
    $S_Nf(x)=\frac1\pi\int_{-\pi}^{\pi}f(x-t)D_N(t)\,dt$, או $\int_{-\pi}^{\pi}D_N=1$.
  truth: >-
    $\frac1{2\pi}\int_{-\pi}^{\pi}D_N(t)\,dt=1$ (רק האיבר הקבוע 1 תורם), ולכן
    $S_Nf(x)=\frac1{2\pi}\int_{-\pi}^{\pi}f(x-t)D_N(t)\,dt$. מכאן גם $\frac1\pi\int_0^{\pi}D_N=1$.
  remedy: { lesson: '10.3', label: 'גרעין דיריכלה: השטח שלו' }

- id: MC-c10-dirichlet-positive
  title: חושבים שגרעין דיריכלה חיובי ומתנהג כמו ממוצע
  belief: >-
    $D_N\ge0$, ולכן $S_Nf(x)$ הוא ממוצע משוקלל של ערכי $f$, והתכנסות נובעת מרציפות בלבד.
  truth: >-
    $D_N$ מחליף סימן ($D_3(\pi)=-1$), ו-$\frac1{2\pi}\int|D_N|$ גדל עם $N$ (בערך $1.96$ ב-$N=5$ ו-$2.86$
    ב-$N=50$). לכן ההוכחה צריכה את הגזירות של $f$ ואת רימן-לבג, ולא רק רציפות.
  remedy: { lesson: '10.3', label: 'גרעין דיריכלה אינו חיובי' }

- id: MC-c10-continuity-enough-pointwise
  title: חושבים שרציפות מספיקה להתכנסות נקודתית של טור פורייה
  belief: >-
    אם $f$ רציפה ב-$x_0$, אז $f(x_0^+)=f(x_0^-)=f(x_0)$ ולכן משפט ההתכנסות נותן $S_Nf(x_0)\to f(x_0)$.
  truth: >-
    המשפט דורש ש-$f$ גזירה למקוטעין (נגזרות חד-צדדיות). ידוע (בלי הוכחה בקורס) שיש פונקציה רציפה ומחזורית שטור
    פורייה שלה מתבדר בנקודה (דו בואה-ריימון).
  remedy: { lesson: '10.3', label: 'ההנחות של משפט ההתכנסות הנקודתית' }

- id: MC-c10-gibbs-vanishes
  title: חושבים שהחריגה של גיבס נעלמת כש-N גדל
  belief: >-
    ככל ש-$N$ גדל, החריגה מעל הקפיצה קטנה ושואפת לאפס, ולכן $\sup|f-S_Nf|\to0$ גם ליד קפיצה.
  truth: >-
    החריגה מתכווצת לרוחב (היא זזה לעבר הקפיצה) אבל גובהה שואף לכ-$9\%$ מגודל הקפיצה: לגל ריבועי
    $\pm1$ המקסימום של $S_Nf$ שואף ל-$1.179$ בערך. בכל $x$ קבוע עדיין $S_Nf(x)\to f(x)$.
  remedy: { lesson: '10.3', label: 'תופעת גיבס' }

- id: MC-c10-gibbs-fixed-size
  title: חושבים שהחריגה של גיבס היא כמות קבועה שלא תלויה בגודל הקפיצה
  belief: >-
    ליד כל קפיצה הסכום החלקי חורג בכ-$0.09$, או בכ-$9\%$ מערך הפונקציה.
  truth: >-
    החריגה פרופורציונלית לגודל הקפיצה $f(x_0^+)-f(x_0^-)$: כ-$0.0895$ מהקפיצה בכל צד (הטור לינארי ב-$f$, וכל
    קפיצה היא כפולה של גל ריבועי ועוד פונקציה רציפה).
  remedy: { lesson: '10.3', label: 'תופעת גיבס: גודל החריגה' }

- id: MC-c10-series-value-is-sum
  title: מציבים נקודה בטור ושוכחים לחלק בגורם המשותף של המקדמים
  belief: >-
    אם הטור מתכנס ל-$f(x_0)$, אז $f(x_0)$ הוא כבר הסכום המספרי שמבקשים.
  truth: >-
    $f(x_0)=\sum b_n\sin nx_0$ כולל את המקדמים. כש-$b_n=C\,c_n$ עם קבוע $C$ (למשל $b_n=\frac{12(-1)^{n+1}}{n^3}$), הסכום
    $\sum c_n\sin nx_0$ הוא $\frac{f(x_0)}C$. בודקים בסוף שהתוצאה קרובה לאיבר הראשון של הסכום.
  remedy: { lesson: '10.3', label: 'סכומים מספריים מהצבה בטור' }

- id: MC-c10-no-locality
  title: חושבים שההתנהגות של הטור בנקודה תלויה בכל הפונקציה
  belief: >-
    כל מקדם הוא אינטגרל על כל הקטע, ולכן שינוי של $f$ רחוק מ-$x_0$ יכול לשנות את ההתנהגות של $S_Nf(x_0)$ כש-$N\to\infty$.
  truth: >-
    עקרון המקומיות של רימן: אם $f=g$ בסביבה של $x_0$, אז $S_Nf(x_0)-S_Ng(x_0)\to0$. ההפרש הוא
    $\frac1{2\pi}\int h(x_0-t)D_N(t)\,dt$ עם $h=f-g$ שמתאפסת ליד $t=0$, ולכן $\frac{h(x_0-t)}{\sin(t/2)}$ ב-$H$, והאינטגרל
    שואף ל-0 לפי למת רימן-לבג. המקדמים עצמם תלויים בכל הפונקציה; הגבול של ההפרש לא.
  remedy: { lesson: '10.3', label: 'עקרון המקומיות' }
