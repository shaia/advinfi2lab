# Misconceptions first detected in lesson 10.2 (Bessel's inequality and the Riemann-Lebesgue lemma).
- id: MC-c10-bessel-reversed
  title: הופכים את כיוון אי-שוויון בסל
  belief: >-
    סכום ריבועי המקדמים גדול מ-$\frac1\pi\int f^2$, או שווה לו תמיד, כבר עבור $N$ סופי.
  truth: >-
    מפיתגורס $\|f\|^2=\|S_Nf\|^2+\|f-S_Nf\|^2\ge\|S_Nf\|^2$, ולכן
    $\frac{a_0^2}2+\sum_{n\le N}(a_n^2+b_n^2)\le\frac1\pi\int f^2$. ההפרש הוא $\frac1\pi\|f-S_Nf\|^2$.
  remedy: { lesson: '10.2', label: 'אי-שוויון בסל מפיתגורס' }

- id: MC-c10-bessel-missing-pi
  title: משווים את סכום ריבועי המקדמים לאינטגרל של f בריבוע בלי לחלק בפאי
  belief: >-
    $\|S_Nf\|^2=\frac{a_0^2}2+\sum_{n\le N}(a_n^2+b_n^2)$, ולכן בבסל האגף הימני הוא $\int f^2$.
  truth: >-
    $\|a_n\cos nx\|^2=\pi a_n^2$, ולכן $\|S_Nf\|^2=\pi\left(\frac{a_0^2}2+\sum_{n\le N}(a_n^2+b_n^2)\right)$, והאגף
    הימני הוא $\frac1\pi\int f^2$.
  remedy: { lesson: '10.2', label: 'הנורמה של הסכום החלקי' }

- id: MC-c10-coeffs-to-zero-enough
  title: חושבים שמקדמים ששואפים לאפס מספיקים כדי שטור יהיה טור פורייה
  belief: >-
    אם $a_n,b_n\to0$ (כמו שלמת רימן-לבג דורשת), הטור הטריגונומטרי הוא טור פורייה של פונקציה כלשהי ב-$H$.
  truth: >-
    רימן-לבג היא תנאי הכרחי בלבד, ובסל חזק ממנה: צריך $\sum(a_n^2+b_n^2)<\infty$. ב-$\sum\frac{\sin nx}{\sqrt n}$
    המקדמים שואפים לאפס אבל $\sum\frac1n=\infty$, ולכן זה אינו טור פורייה של שום $f\in H$.
  remedy: { lesson: '10.2', label: 'טור טריגונומטרי שאינו טור פורייה' }

- id: MC-c10-convergent-series-is-fourier
  title: חושבים שטור טריגונומטרי שמתכנס בכל נקודה הוא טור פורייה של סכומו
  belief: >-
    אם $\sum b_n\sin nx$ מתכנס לכל $x$, אז הסכום $g$ הוא פונקציה ב-$H$ והטור הוא טור פורייה שלה.
  truth: >-
    כדי לחשב את מקדמי $g$ איבר-איבר צריך התכנסות במידה שווה (או בנורמה של $H$). $\sum\frac{\sin nx}{\sqrt n}$
    מתכנס בכל נקודה, ובכל זאת בסל פוסל אותו כטור פורייה של פונקציה ב-$H$.
  remedy: { lesson: '10.2', label: 'טור טריגונומטרי שאינו טור פורייה' }

- id: MC-c10-rl-needs-smooth
  title: חושבים שלמת רימן-לבג דורשת פונקציה רציפה או גזירה
  belief: >-
    המקדמים שואפים לאפס רק אם $f$ גזירה (אז אינטגרציה בחלקים נותנת $|b_n|\le\frac Cn$); לפונקציית מדרגות
    הם לא בהכרח שואפים לאפס.
  truth: >-
    רימן-לבג נובעת מבסל לכל $f\in H$: $\sum(a_n^2+b_n^2)\le\frac1\pi\int f^2<\infty$, ולכן האיברים שואפים לאפס.
    לגל ריבועי $b_n=\frac4{\pi n}\to0$, אף שהוא לא רציף.
  remedy: { lesson: '10.2', label: 'למת רימן-לבג מבסל' }

- id: MC-c10-rl-any-oscillation
  title: חושבים שכל גורם מתנודד הופך את האינטגרל לאפס בגבול
  belief: >-
    $\int f(x)\cos^2(nx)\,dx\to0$, או $\int f(x)|\sin nx|\,dx\to0$, כמו ברימן-לבג.
  truth: >-
    רימן-לבג מדברת על $\cos nx$ ו-$\sin nx$, שהממוצע שלהם אפס. $\cos^2 nx=\frac12+\frac12\cos 2nx$, ולכן
    $\int f\cos^2 nx\to\frac12\int f$: החלק הקבוע של הגורם נשאר.
  remedy: { lesson: '10.2', label: 'למת רימן-לבג: מה שואף לאפס' }

- id: MC-c10-squares-vs-abs
  title: מבלבלים בין סכום ריבועי המקדמים לסכום הערכים המוחלטים שלהם
  belief: >-
    מבסל, $\sum(a_n^2+b_n^2)<\infty$, ולכן גם $\sum(|a_n|+|b_n|)<\infty$; או להפך: אם $\sum|b_n|=\infty$ אז זה
    לא טור פורייה.
  truth: >-
    $\sum b_n^2<\infty$ חלש בהרבה מ-$\sum|b_n|<\infty$: לגל ריבועי $b_n=\frac{4}{\pi n}$ (לאי-זוגיים), סכום
    הריבועים סופי וסכום הערכים המוחלטים אינסופי. בסל פוסל רק סדרות עם $\sum b_n^2=\infty$.
  remedy: { lesson: '10.2', label: 'בסל: סכום ריבועים, לא ערכים מוחלטים' }

- id: MC-c10-abs-sum-necessary
  title: חושבים שהתכנסות סכום הערכים המוחלטים של המקדמים הכרחית להתכנסות הטור
  belief: >-
    אם $\sum(|a_n|+|b_n|)=\infty$, טור פורייה לא יכול להתכנס בכל נקודה (או לא יכול להתכנס במידה שווה).
  truth: >-
    התנאי $\sum(|a_n|+|b_n|)<\infty$ מספיק להתכנסות במידה שווה, לא הכרחי להתכנסות. טור פורייה של
    $\frac{\pi-x}{2}$ על $(0,2\pi)$ הוא $\sum\frac{\sin nx}{n}$, עם $\sum\frac1n=\infty$, ובכל זאת מתכנס בכל נקודה.
  remedy: { lesson: '10.4', label: 'התנאי על סכום הערכים המוחלטים: מספיק, לא הכרחי' }
