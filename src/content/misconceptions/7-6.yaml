# Misconceptions first detected in lesson 7.6 (potentials on star-shaped regions, inverse-square flux, choosing the theorem).
- id: MC-c7-star-shaped
  title: מבלבלים בין תחום כוכבי, תחום קמור ותחום שאין בו נקודה חסרה
  belief: >-
    תחום כוכבי הוא תחום קמור; או שכל תחום שחסרה בו רק נקודה אחת, כמו המרחב בלי הראשית, הוא כוכבי.
  truth: >-
    $U$ כוכבי ביחס ל-$p\in U$ אם לכל $\mathbf x\in U$ הקטע מ-$p$ ל-$\mathbf x$ כולו ב-$U$. כל קבוצה קמורה כוכבית, אבל
    לא להפך: המרחב בלי חצי הישר $\{(0,0,z):z\le0\}$ כוכבי ביחס ל-$(0,0,1)$ ואינו קמור. המרחב בלי הראשית אינו כוכבי:
    הקטע מ-$p$ ל-$-p$ עובר דרך הראשית.
  remedy: { lesson: '7.6', label: 'תחום כוכבי' }

- id: MC-c7-potential-formula
  title: שוכחים את הפרמטר בתוך השדה בנוסחת הפוטנציאל
  belief: >-
    בתחום כוכבי ביחס לראשית, הפוטנציאל הוא $f(\mathbf x)=\int_0^1\mathbf F(\mathbf x)\cdot\mathbf x\,dt$.
  truth: >-
    $f(\mathbf x)=\int_0^1\mathbf F(t\mathbf x)\cdot\mathbf x\,dt$: זה האינטגרל הקווי של $\mathbf F$ לאורך הקטע $t\mapsto t\mathbf x$
    מהראשית ל-$\mathbf x$. בלי $t$ בתוך $\mathbf F$ האינטגרנד לא תלוי ב-$t$ ומתקבל $\mathbf F(\mathbf x)\cdot\mathbf x$, שאינו
    פוטנציאל.
  remedy: { lesson: '7.6', label: 'פוטנציאל לאורך קטעים מהמרכז' }

- id: MC-c7-div-zero-is-curl
  title: חושבים ששדה עם דיברגנץ אפס הוא רוטור בכל תחום
  belief: >-
    אם $\nabla\cdot\mathbf F=0$ בתחום, יש $\mathbf G$ בתחום כך ש-$\mathbf F=\nabla\times\mathbf G$.
  truth: >-
    זה מובטח בתחום כוכבי. ב-$\mathbb R^3\setminus\{0\}$ השדה $\frac{\mathbf x}{\|\mathbf x\|^3}$ עם דיברגנץ אפס, אבל השטף
    שלו דרך ספרת היחידה $4\pi\ne0$, ושטף של רוטור דרך משטח סגור הוא תמיד $0$. לכן הוא אינו רוטור שם.
  remedy: { lesson: '7.6', label: 'דיברגנץ אפס ופוטנציאל וקטורי' }

- id: MC-c7-vector-potential-unique
  title: חושבים שלשדה יש פוטנציאל וקטורי יחיד
  belief: >-
    אם $\nabla\times\mathbf G=\mathbf F$, אז $\mathbf G$ נקבע ביחידות, כמו פוטנציאל עד כדי קבוע.
  truth: >-
    אפשר להוסיף ל-$\mathbf G$ כל גרדיאנט, כי $\nabla\times\nabla h=0$. למשל $(-y,0,0)$, $(0,x,0)$ ו-$\frac{(-y,x,0)}{2}$ כולם
    עם רוטור $(0,0,1)$.
  remedy: { lesson: '7.6', label: 'פוטנציאל וקטורי' }

- id: MC-c7-inverse-square-scales
  title: חושבים שהשטף של שדה ריבוע-הפוך תלוי בגודל המשטח
  belief: >-
    השטף של $\frac{\mathbf x}{\|\mathbf x\|^3}$ דרך ספרה ברדיוס $R$ גדל עם השטח, $4\pi R^2$, או קטן כמו $\frac1{R^2}$.
  truth: >-
    על הספרה $\mathbf F\cdot\hat{\mathbf N}=\frac1{R^2}$ והשטח $4\pi R^2$; המכפלה $4\pi$ לכל $R$. ודרך כל משטח סגור שמקיף את
    הראשית השטף $4\pi$, לפי גאוס על התחום שבינו לבין ספרה קטנה.
  remedy: { lesson: '7.6', label: 'השטף של שדה ריבוע-הפוך' }

- id: MC-c7-inverse-square-always-4pi
  title: חושבים שהשטף של שדה ריבוע-הפוך דרך כל משטח סגור הוא 4 פאי
  belief: >-
    השטף של $\frac{\mathbf x}{\|\mathbf x\|^3}$ דרך **כל** משטח סגור הוא $4\pi$, גם כשהמשטח לא מקיף את הראשית.
  truth: >-
    כשהראשית מחוץ לתחום הסגור שהמשטח חוסם, השדה מסדר $C^1$ על התחום ו-$\nabla\cdot\mathbf F=0$ בו, ולכן לפי גאוס השטף
    $0$: מה שנכנס בצד הקרוב יוצא בצד הרחוק. $4\pi$ מתקבל רק למשטח שמקיף את הראשית.
  remedy: { lesson: '7.6', label: 'השטף של שדה ריבוע-הפוך' }

- id: MC-c7-gauss-singularity
  title: מפעילים את משפט גאוס על תחום שבו השדה לא מוגדר
  belief: >-
    ל-$\frac{\mathbf x}{\|\mathbf x\|^3}$ הדיברגנץ אפס, ולכן לפי גאוס השטף שלו דרך כל משטח סגור הוא אפס.
  truth: >-
    גאוס דורש שדה מסדר $C^1$ על התחום כולו. אם הראשית בתחום, המשפט לא חל, והשטף $4\pi$. אם הראשית מחוץ לתחום
    הסגור, המשפט חל, והשטף באמת $0$.
  remedy: { lesson: '7.6', label: 'גאוס עם ספרה קטנה סביב הראשית' }

- id: MC-c7-tool-choice
  title: בוחרים משפט שלא מתאים לצורת השאלה
  belief: >-
    אפשר להפעיל את סטוקס על משטח סגור, את גאוס על מסילה, או את גרין על מסילה במרחב שאינה במישור.
  truth: >-
    גרין: מסילה סגורה במישור, שפה של תחום מישורי. סטוקס: מסילה סגורה במרחב, שפה של משטח, או שטף של רוטור דרך משטח
    עם שפה. גאוס: שטף דרך משטח סגור, שפה של תחום מרחבי. בכל מקרה בודקים גם שהשדה מסדר $C^1$ בכל התחום או המשטח.
  remedy: { lesson: '7.6', label: 'בחירת הכלי' }
