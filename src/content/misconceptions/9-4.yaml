# Misconceptions first detected in lesson 9.4 (completeness, Hilbert spaces, the space H[a,b]).
- id: MC-c9-coordinatewise-enough
  title: חושבים שהתכנסות בכל קואורדינטה היא התכנסות במרחב הסדרות
  belief: >-
    אם $x^{(k)}_n\to y_n$ לכל $n$, אז $x^{(k)}\to y$ ב-$\ell^2$.
  truth: >-
    וקטורי היחידה $e_k$ שואפים ל-0 בכל קואורדינטה, אבל $\|e_k\|=1$ לכל $k$ ו-$\|e_k-e_m\|=\sqrt2$. בהוכחת השלמות
    הגבול הקואורדינטי הוא רק המועמד, ואת ההתכנסות בנורמה מוכיחים בנפרד.
  remedy: { lesson: '9.4', label: 'וקטורי היחידה במרחב הסדרות' }

- id: MC-c9-cauchy-implies-limit
  title: חושבים שכל סדרת קושי מתכנסת בכל מרחב מכפלה פנימית
  belief: >-
    סדרת קושי במרחב מכפלה פנימית מתכנסת תמיד לאיבר של המרחב, כמו בממשיים.
  truth: >-
    זו בדיוק תכונת השלמות, והיא לא תמיד מתקיימת. הסדרות $(1,\frac12,\dots,\frac1k,0,0,\dots)$ הן סדרת קושי במרחב
    הסדרות הסופיות, והגבול שלהן ב-$\ell^2$, $(\frac1n)$, אינו סופי.
  remedy: { lesson: '9.4', label: 'מרחב הילברט: מרחב מכפלה פנימית שלם' }

- id: MC-c9-L2-limit-continuous
  title: חושבים שגבול בממוצע ריבועי של פונקציות רציפות הוא רציף
  belief: >-
    $C[a,b]$ שלם גם בנורמה $\|f\|=\sqrt{\int f^2}$, כמו בנורמת המקסימום.
  truth: >-
    הרמפות $f_n$ (0 עד 0, עולות בקו ישר עד 1 ב-$\frac1n$) הן סדרת קושי בנורמת האינטגרל ומתקרבות למדרגה, ושום פונקציה
    רציפה אינה במרחק 0 מהמדרגה. השלמות בנורמת המקסימום לא עוברת לנורמה אחרת.
  remedy: { lesson: '9.4', label: 'הרמפות שמתקרבות למדרגה' }

- id: MC-c9-L2-implies-uniform
  title: חושבים שהתכנסות בממוצע ריבועי גוררת התכנסות במידה שווה או נקודתית
  belief: >-
    אם $\int_a^b(f_n-f)^2\to0$, אז $f_n\to f$ בכל נקודה, ואף במידה שווה.
  truth: >-
    הכיוון הוא רק ההפוך: $\|g\|_2\le\sqrt{b-a}\,\max|g|$. הפונקציות $x^n$ על $[0,1]$ שואפות ל-0 בממוצע ריבועי
    ($\|x^n\|^2=\frac1{2n+1}$) אבל לא במידה שווה; האוהלים $\max(0,1-nx)$ שואפים ל-0 בממוצע ריבועי ושווים ל-1 ב-0.
  remedy: { lesson: '9.4', label: 'במידה שווה לעומת ממוצע ריבועי' }

- id: MC-c9-sup-bound-length
  title: שוכחים את השורש של אורך הקטע בהשוואה בין הנורמות
  belief: >-
    $\sqrt{\int_a^b g^2}\le\max|g|$, או $\le(b-a)\max|g|$.
  truth: >-
    $\int_a^b g^2\le(b-a)\max g^2$, ולכן $\|g\|_2\le\sqrt{b-a}\,\max|g|$. על $[0,4]$ הגורם הוא 2.
  remedy: { lesson: '9.4', label: 'השוואה בין הנורמות' }

- id: MC-c9-semi-vs-complete
  title: מבלבלים בין מכפלה פנימית למחצה לבין אי-שלמות
  belief: >-
    $\int fg$ על $H[a,b]$ היא רק מכפלה פנימית למחצה כי המרחב אינו שלם; או להפך, אחרי הזיהוי של פונקציות במרחק 0 נשארת
    בעיה של "מחצה".
  truth: >-
    אלה שתי בעיות נפרדות. "למחצה": יש $f\neq0$ עם $\int f^2=0$ (פונקציה שאינה אפס רק בנקודה אחת); הזיהוי של פונקציות
    במרחק 0 פותר אותה לגמרי. אי-השלמות נשארת גם אחרי הזיהוי.
  remedy: { lesson: '9.4', label: 'המרחב H[a,b]: זיהוי ושלמות' }

- id: MC-c9-H-is-hilbert
  title: חושבים שהמרחב של הפונקציות האינטגרביליות בריבוע של הקורס הוא מרחב הילברט
  belief: >-
    $H[a,b]$, עם $\int fg$ ואחרי זיהוי פונקציות במרחק 0, שלם.
  truth: >-
    $H[a,b]$ אינו שלם: $f_n=\min(x^{-1/4},n)$ היא סדרת קושי ב-$H[0,1]$, והגבול הטבעי $x^{-1/4}$ אינו חסום ולכן אינו
    אינטגרבילי רימן; שום פונקציה אינטגרבילית רימן אינה גבול שלה. ההשלמה, $L^2$, שייכת לתורת המידה. להטלה על תת-מרחב
    סוף-ממדי אין צורך בשלמות.
  remedy: { lesson: '9.4', label: 'המרחב H[a,b] של הקורס' }
