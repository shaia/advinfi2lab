# Misconceptions first detected in lesson 5.1 (the change-of-variables formula).
- id: MC-c5-forgot-jacobian
  title: מחליפים משתנים בלי היעקוביאן
  belief: >-
    כשמחליפים משתנים מספיק להציב את ההעתקה באינטגרנד ולהחליף את גבולות האינטגרציה; $dx\,dy$ הופך פשוט
    ל-$du\,dv$.
  truth: >-
    העתקה מותחת ומכווצת שטחים. מלבן קטן בגודל $du\,dv$ עובר בקירוב למקבילית ששטחה
    $|\det D\varphi|\,du\,dv$, ולכן
    $$\iint_D f\,dx\,dy=\iint_{D^*} f(\varphi(u,v))\,|\det D\varphi(u,v)|\,du\,dv.$$
    בלי הגורם הזה האינטגרל של הפונקציה 1 אינו שטח התחום.
  remedy: { lesson: '5.1', label: 'נוסחת החלפת המשתנים: ריבוע קטן הופך למקבילית' }

- id: MC-c5-signed-jacobian
  title: משתמשים בדטרמיננטה בלי ערך מוחלט
  belief: >-
    בנוסחת החלפת המשתנים כופלים ב-$\det D\varphi$ עצמו, ולכן העתקה שהופכת כיוון (דטרמיננטה שלילית) נותנת
    אינטגרל עם סימן הפוך.
  truth: >-
    שטח אינו שלילי: מקדם שינוי השטח הוא $|\det D\varphi|$. סימן הדטרמיננטה אומר רק אם ההעתקה שומרת על
    הכיוון (סיבוב) או הופכת אותו (שיקוף). למשל $\varphi(u,v)=(v,u)$ מקיימת $\det D\varphi=-1$ ושומרת על כל
    שטח.
  remedy: { lesson: '5.1', label: 'למה הערך המוחלט: שיקוף שומר על שטח' }

- id: MC-c5-inverse-jacobian
  title: כופלים ביעקוביאן של ההעתקה בכיוון ההפוך
  belief: >-
    כשהמשתנים החדשים נתונים כ-$u=u(x,y)$, $v=v(x,y)$, כופלים את האינטגרנד ב-$\left|\frac{\partial(u,v)}{\partial(x,y)}\right|$.
  truth: >-
    בנוסחה מופיע היעקוביאן של ההעתקה מהמשתנים החדשים לישנים, $\left|\frac{\partial(x,y)}{\partial(u,v)}\right|$.
    לפי כלל השרשרת הוא ההופכי של היעקוביאן בכיוון השני:
    $$\frac{\partial(x,y)}{\partial(u,v)}=\left(\frac{\partial(u,v)}{\partial(x,y)}\right)^{-1}.$$
    כך שאם $u,v$ נתונים במפורש, מחלקים ביעקוביאן שלהם ולא כופלים בו.
  remedy: { lesson: '5.1', label: 'היעקוביאן בכיוון הנכון: מחלקים ולא כופלים' }

- id: MC-c5-image-guess
  title: מנחשים את התמונה של התחום במקום לחשב אותה
  belief: >-
    התמונה של ריבוע היא ריבוע באותו מקום, או שאחרי החלפת משתנים אפשר להשאיר את הגבולות הישנים.
  truth: >-
    התחום החדש הוא בדיוק הקבוצה $D^*$ שההעתקה שולחת על $D$. מוצאים אותו מהשפה: כל קו שפה של $D$ נכתב
    במשתנים החדשים. העתקה לינארית שולחת ריבוע למקבילית, לא בהכרח לריבוע.
  remedy: { lesson: '5.1', label: 'מציאת התמונה של התחום דרך השפה שלו' }

- id: MC-c5-non-injective-ok
  title: חושבים שההעתקה לא חייבת להיות חד-חד-ערכית
  belief: >-
    מספיק שההעתקה תהיה על התחום וגזירה ברציפות; אם היא מכסה חלק מהתחום פעמיים, זה לא משנה את האינטגרל.
  truth: >-
    כל כיסוי כפול נספר פעמיים. $\varphi(u,v)=(u^2,v)$ על $[-1,1]\times[0,1]$ מכסה את $[0,1]^2$ פעמיים,
    ו-$\iint|\det D\varphi|=2$ ולא 1. גם קוטביות עם $\theta\in[0,4\pi]$ נותנות פעמיים את השטח. הנוסחה דורשת
    העתקה חד-חד-ערכית, פרט לקבוצה בעלת שטח אפס.
  remedy: { lesson: '5.1', label: 'תנאי הנוסחה: חד-חד-ערכיות' }

- id: MC-c5-hypotheses-everywhere
  title: דורשים את תנאי הנוסחה גם על קבוצה בעלת שטח אפס
  belief: >-
    אם ההעתקה אינה חד-חד-ערכית בכמה נקודות או שהיעקוביאן מתאפס על קו, אסור להשתמש בנוסחה; לכן קוטביות
    "לא חוקיות" על עיגול שמכיל את הראשית.
  truth: >-
    קבוצה בעלת שטח אפס אינה משנה אינטגרל. הנוסחה נשארת נכונה כשההעתקה חד-חד-ערכית עם יעקוביאן שונה מאפס
    על התחום פרט לקבוצה כזו. בקוטביות על $[0,R]\times[0,2\pi]$ החריגים הם הצלע $r=0$ (שם היעקוביאן $r$
    מתאפס) והצלעות $\theta=0,\ \theta=2\pi$ שמודבקות זו לזו: כולם קטעים, בעלי שטח אפס.
  remedy: { lesson: '5.1', label: 'תנאי הנוסחה: למעט קבוצה בעלת שטח אפס' }

- id: MC-c5-local-to-global-injective
  title: מסיקים חד-חד-ערכיות מיעקוביאן שונה מאפס
  belief: >-
    אם $\det D\varphi\neq0$ בכל נקודה, אז לפי משפט הפונקציה ההפוכה $\varphi$ חד-חד-ערכית על כל התחום.
  truth: >-
    משפט הפונקציה ההפוכה נותן הפיכות **מקומית** בלבד. $\varphi(r,\theta)=(r\cos\theta,r\sin\theta)$ על
    $[1,2]\times[0,4\pi]$ מקיימת $\det D\varphi=r\ge1$ בכל נקודה, ובכל זאת מכסה את הטבעת פעמיים.
  remedy: { lesson: '5.1', label: 'תנאי הנוסחה: הפיכות מקומית אינה חד-חד-ערכיות' }

- id: MC-c5-jacobian-sign-flip
  title: חושבים שהיעקוביאן יכול להחליף סימן בלי להתאפס
  belief: >-
    על תחום קשיר ההעתקה יכולה לשמור על הכיוון בחלק אחד ולהפוך אותו בחלק אחר, גם כשהיעקוביאן אינו מתאפס
    באף נקודה.
  truth: >-
    $\det D\varphi$ רציפה כש-$\varphi$ גזירה ברציפות. על תחום קשיר (קשיר מסילתית) פונקציה רציפה שאינה מתאפסת
    שומרת על סימן אחד, לפי משפט ערך הביניים לאורך מסילה. לכן החלפת סימן מחייבת נקודה שבה היעקוביאן אפס.
  remedy: { lesson: '5.1', label: 'סימן היעקוביאן על תחום קשיר' }
