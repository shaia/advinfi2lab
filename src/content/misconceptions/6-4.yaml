# Misconceptions first detected in lesson 6.4 (closed curves and closed surfaces).
- id: MC-c6-piece-forgotten
  title: שוכחים חלק של משטח סגור או רכיב של שפה
  belief: >-
    השטף דרך "הגליל" הוא השטף דרך הדופן; השפה של טבעת היא המעגל החיצוני.
  truth: >-
    משטח סגור כולל את כל החלקים שסוגרים את הגוף: לגליל סגור יש דופן ושני מכסים. השפה של תחום עם חור כוללת גם את שפת
    החור. מחשבים את האינטגרל על כל חלק, עם הכיוון שלו, ומחברים.
  remedy: { lesson: '6.4', label: 'משטח סגור מכמה חלקים: גליל עם מכסים' }

- id: MC-c6-lids-same-normal
  title: נותנים לשני מכסים מנוגדים את אותו נורמל
  belief: >-
    לשני המכסים של גליל הנורמל הוא $(0,0,1)$, כי שניהם אופקיים (או: הפרמטריזציה $(r\cos\theta,r\sin\theta,z_0)$ נותנת
    נורמל כלפי חוץ בשני המכסים).
  truth: >-
    הנורמל החיצוני של המכסה העליון הוא $(0,0,1)$ ושל התחתון $(0,0,-1)$: שניהם מצביעים **החוצה מהגוף**. פרמטריזציה אחת
    לשני המכסים נותנת אותו $\sigma_r\times\sigma_\theta$, ובמכסה אחד צריך להחליף סימן.
  remedy: { lesson: '6.4', label: 'הנורמל החיצוני בכל חלק' }

- id: MC-c6-radial-normal-everywhere
  title: לוקחים את הנורמל של ספרה, בכיוון וקטור המקום, לכל משטח סגור סביב הראשית
  belief: >-
    הנורמל החיצוני של משטח סגור שמקיף את הראשית הוא $\frac{(x,y,z)}{\sqrt{x^2+y^2+z^2}}$ בכל נקודה, גם על דופן של גליל.
  truth: >-
    הנורמל בכיוון וקטור המקום הוא תכונה של ספרה סביב הראשית בלבד. על הדופן $x^2+y^2=r^2$ של גליל הנורמל החיצוני הוא
    $\frac{(x,y,0)}{r}$, ניצב לציר $z$; על מכסה הוא $\pm(0,0,1)$. בכל חלק מחשבים את הנורמל מהפרמטריזציה שלו.
  remedy: { lesson: '6.4', label: 'הנורמל החיצוני בכל חלק' }

- id: MC-c6-all-circles-ccw
  title: מכוונים כל מעגל בשפה נגד כיוון השעון
  belief: >-
    הכיוון החיובי של השפה הוא "נגד כיוון השעון", ולכן גם מעגל החור בטבעת מכוון נגד כיוון השעון.
  truth: >-
    הכיוון החיובי של השפה הוא זה שבו התחום נמצא **משמאל**. בטבעת $1\le r\le2$ המעגל החיצוני נגד כיוון השעון והפנימי
    עם כיוון השעון.
  remedy: { lesson: '6.4', label: 'הכיוון החיובי של שפה: התחום משמאל' }

- id: MC-c6-opposite-boundaries-cancel
  title: חושבים שרכיבי שפה שמכוונים הפוך תמיד מקזזים זה את זה
  belief: >-
    בשפה החיובית של טבעת המעגל החיצוני נגד כיוון השעון והפנימי עם כיוון השעון, ולכן שני האינטגרלים מתקזזים והסכום אפס
    לכל שדה.
  truth: >-
    כיוון הפוך מחליף את הסימן של האינטגרל על אותו רכיב, אבל שני הרכיבים הם מסילות שונות, עם ערכים שונים. לשדה הסיבוב
    התרומות הן $2\pi$ ומינוס $2\pi$, ואכן מתקזזות; ל-$(-y,x)$ על הטבעת $1\le r\le2$ הן $8\pi$ ומינוס $2\pi$, והסכום $6\pi$.
  remedy: { lesson: '6.4', label: 'הכיוון החיובי של שפה: התחום משמאל' }

- id: MC-c6-closed-means-zero
  title: חושבים שאינטגרל על מסילה סגורה או על משטח סגור הוא תמיד אפס
  belief: >-
    $\oint$ ו-$\oiint$ "חוזרים לנקודת ההתחלה", ולכן נותנים אפס.
  truth: >-
    הסימון $\oint$ או $\oiint$ אומר רק שהמסילה או המשטח סגורים. אפס מובטח רק לשדה משמר על מסילה סגורה (שיעור 6.2). שדה
    הסיבוב נותן $2\pi$ על מעגל, ו-$(x,y,z)$ נותן $4\pi$ דרך ספרת היחידה.
  remedy: { lesson: '6.4', label: 'הסימונים למסילה סגורה ולמשטח סגור' }
