# Misconceptions first detected in lesson 0.5 (the Riemann integral in ℝⁿ and Fubini's theorem).
- id: MC-c0-bounded-integrable
  title: חושבים שכל פונקציה חסומה על תיבה אינטגרבילית
  belief: >-
    אם $f$ חסומה על תיבה, אפשר לחשב את האינטגרל שלה.
  truth: >-
    חסימות הכרחית, לא מספיקה. הפונקציה ששווה $1$ בנקודות שבהן שתי הקואורדינטות רציונליות ו-$0$ בשאר, חסומה על
    $[0,1]^2$, אבל לכל חלוקה הסכום העליון $1$ והתחתון $0$. היא אינה אינטגרבילית רימן.
  remedy: { lesson: '0.5', label: 'אינטגרל רימן על תיבה: סכומים עליונים ותחתונים' }

- id: MC-c0-riemann-ignores-countable
  title: חושבים שקבוצה בת מנייה של נקודות חריגות לא משפיעה על אינטגרביליות רימן
  belief: >-
    אם $f$ שונה מאפס רק בקבוצה בת מנייה של נקודות, אז $f$ אינטגרבילית רימן והאינטגרל שלה אפס.
  truth: >-
    מה שקובע הוא **קבוצת נקודות אי-הרציפות**, לא הקבוצה שבה $f\ne0$. אם הנקודות הרציונליות צפופות, $f$ אינה רציפה באף
    נקודה, וכל תת-תיבה מכילה ערכים $0$ ו-$1$: הסכום העליון לא מתקרב לתחתון.
  remedy: { lesson: '0.5', label: 'אינטגרביליות רימן' }

- id: MC-c0-jordan-boundary
  title: חושבים שלכל קבוצה חסומה יש שטח
  belief: >-
    לכל קבוצה חסומה במישור יש שטח, ואפשר לחשב אותו כאינטגרל של $1$.
  truth: >-
    לקבוצה יש שטח (היא מדידה ז׳ורדן) בדיוק כשהשפה שלה בעלת שטח אפס. לקבוצה $\{(x,y)\in[0,1]^2: x\in\mathbb Q\}$ השפה היא
    כל הריבוע, ולכן אין לה שטח.
  remedy: { lesson: '0.5', label: 'תחום בעל שטח' }

- id: MC-c0-simple-means-straight-edges
  title: חושבים שתחום פשוט צריך שפה ישרה
  belief: >-
    רק מלבן (או מצולע עם צלעות מקבילות לצירים) הוא תחום פשוט שאפשר להפעיל עליו פוביני.
  truth: >-
    תחום פשוט ביחס ל-$x$ הוא $\{a\le x\le b,\ \varphi_1(x)\le y\le\varphi_2(x)\}$ עם $\varphi_1,\varphi_2$ רציפות. עיגול ומשולש הם כאלה.
    מה שאינו פשוט הוא תחום שישר אנכי חותך בשני קטעים נפרדים, כמו טבעת.
  remedy: { lesson: '0.5', label: 'תחומים פשוטים' }

- id: MC-c0-fubini-swap-symbols
  title: מחליפים סדר אינטגרציה בלי לשנות את הגבולות
  belief: >-
    כדי להחליף סדר מספיק להחליף בין $dx$ ל-$dy$ ולהשאיר את הגבולות.
  truth: >-
    הגבולות מתארים את התחום, ולכן כשמחליפים סדר מתארים את **אותו תחום** מחדש: מה הטווח של המשתנה החיצוני, ולכל ערך שלו
    בין אילו שני גרפים נע הפנימי. בגבולות קבועים (תיבה) הם מתחלפים יחד עם המשתנים.
  remedy: { lesson: '0.5', label: 'החלפת סדר במשולש' }

- id: MC-c0-fubini-wrong-region
  title: מתארים את התחום לא נכון כשמחליפים סדר
  belief: >-
    אפשר לנחש את הגבולות החדשים מהישנים, למשל להפוך את התחתון והעליון, או להתייחס למשולש כאל ריבוע.
  truth: >-
    משרטטים את התחום, ומכל ערך של המשתנה החיצוני מעבירים ישר: הכניסה לתחום היא הגבול התחתון והיציאה העליון. משולש
    $0\le y\le x\le1$ מתואר גם כ-$0\le y\le1$, $y\le x\le1$, ולא כריבוע וגם לא כמשולש המשלים.
  remedy: { lesson: '0.5', label: 'החלפת סדר במשולש' }

- id: MC-c0-fubini-no-hypotheses
  title: חושבים שמותר תמיד להחליף סדר אינטגרציה
  belief: >-
    לכל פונקציה שני האינטגרלים החוזרים שווים, ולכן מותר תמיד להחליף סדר.
  truth: >-
    פוביני דורש ש-$f$ תהיה אינטגרבילית על התחום (למשל רציפה וחסומה על תחום פשוט). ל-$\frac{x^2-y^2}{(x^2+y^2)^2}$ על
    $(0,1]^2$, שאינה חסומה ליד הראשית, האינטגרלים החוזרים הם $\frac\pi4$ ו-$-\frac\pi4$.
  remedy: { lesson: '0.5', label: 'משפט פוביני: ההנחות' }

- id: MC-c0-cross-section-constant
  title: מחשבים נפח כשטח בסיס כפול גובה גם כשהחתך משתנה
  belief: >-
    הנפח של גוף שווה לשטח הבסיס כפול הגובה.
  truth: >-
    זה נכון רק כשהחתך קבוע (מנסרה, גליל). באופן כללי, לפי פוביני, $V=\int_a^b A(z)\,dz$ כש-$A(z)$ שטח החתך בגובה $z$.
    בפירמידה $A(z)$ קטן ריבועית, והנפח הוא שליש מבסיס כפול גובה.
  remedy: { lesson: '0.5', label: 'נפח של פירמידה' }

- id: MC-c0-cavalieri-shape
  title: חושבים שהנפח תלוי בצורת החתכים ולא רק בשטחם
  belief: >-
    כדי לקבוע נפח של גוף צריך לדעת את צורת החתכים האופקיים, לא רק את השטחים שלהם.
  truth: >-
    לפי פוביני $V=\int A(z)\,dz$: הנפח נקבע רק מפונקציית השטח $A(z)$ (עיקרון קוולירי). שני גופים עם אותם שטחי חתכים בכל
    גובה הם בעלי אותו נפח, גם אם החתכים שונים בצורתם.
  remedy: { lesson: '0.5', label: 'נפח מחתכים' }

- id: MC-c0-integrand-dropped
  title: מחשבים נפח במקום האינטגרל של הפונקציה
  belief: >-
    $\iiint_T x\,dV$ שווה לנפח של $T$, כי "אינטגרל משולש הוא נפח".
  truth: >-
    $\iiint_T 1\,dV$ הוא הנפח. האינטגרל של פונקציה אחרת שוקל כל נקודה בערך הפונקציה בה: $\iiint_T x\,dV$ הוא הנפח כפול
    הממוצע של $x$ על $T$.
  remedy: { lesson: '0.5', label: 'שטח ונפח כאינטגרל של 1' }
