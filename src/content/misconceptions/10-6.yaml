# Misconceptions first detected in lesson 10.6 (the Weierstrass approximation theorem).
- id: MC-c10-weierstrass-hypotheses
  title: מפעילים את משפט ויירשטראס בלי ההנחות שלו
  belief: >-
    כל פונקציה, על כל קטע, אפשר לקרב במידה שווה בפולינומים: גם $\frac1x$ על $(0,1]$, גם $\sin x$ על כל
    הישר, וגם פונקציית מדרגה.
  truth: >-
    המשפט דורש פונקציה **רציפה** על קטע **סגור וחסום**. פולינום חסום על $[0,1]$ ולכן לא מקרב את $\frac1x$;
    פולינום לא קבוע אינו חסום על $\mathbb R$; וגבול במידה שווה של פולינומים הוא רציף. בנורמה של $H$, לעומת זאת,
    פולינומים מקרבים גם פונקציית מדרגה.
  remedy: { lesson: '10.6', label: 'משפט ויירשטראס: ההנחות' }

- id: MC-c10-weierstrass-via-taylor
  title: חושבים שמשפט ויירשטראס הוא פשוט טור טיילור
  belief: >-
    הפולינומים שמקרבים את $f$ הם פולינומי טיילור שלה.
  truth: >-
    פולינומי טיילור דורשים גזירות, וגם אז לא תמיד מתכנסים. $|x-\frac12|$ אינה גזירה ב-$\frac12$ ובכל זאת
    ויירשטראס חל עליה. ההוכחות משתמשות בפולינומי ברנשטיין, או בטור פורייה של פונקציה עזר ורק אז בטיילור של
    $\cos nx$, שהוא פונקציה שלמה.
  remedy: { lesson: '10.6', label: 'שתי הוכחות למשפט ויירשטראס' }

- id: MC-c10-bernstein-reproduces
  title: חושבים שפולינום ברנשטיין משחזר פולינומים או עובר דרך ערכי הפונקציה בצמתים
  belief: >-
    $B_n(x^2)=x^2$, ובאופן כללי $B_nf(\frac kn)=f(\frac kn)$, כמו באינטרפולציה.
  truth: >-
    $B_n$ משחזר רק את $1$ ואת $x$: $B_n(x^2)=x^2+\frac{x(1-x)}n$. בצמתים הפנימיים אין שוויון:
    $B_4(x^2)$ ב-$\frac12$ שווה $\frac5{16}\ne\frac14$. $B_n$ אינו הטלה.
  remedy: { lesson: '10.6', label: 'פולינומי ברנשטיין' }

- id: MC-c10-trig-weierstrass-is-fourier
  title: חושבים שהגרסה הטריגונומטרית של ויירשטראס אומרת שטור פורייה מתכנס במידה שווה
  belief: >-
    לכל $f$ רציפה ומחזורית, $S_Nf\to f$ במידה שווה, כי יש פולינומים טריגונומטריים שמקרבים אותה.
  truth: >-
    המשפט אומר שקיימים פולינומים טריגונומטריים $T_k$ עם $\sup|f-T_k|\to0$; הם לא חייבים להיות הסכומים החלקיים.
    ידוע (בלי הוכחה בקורס) שיש $f$ רציפה ומחזורית שטור פורייה שלה מתבדר בנקודה.
  remedy: { lesson: '10.6', label: 'הגרסה הטריגונומטרית' }

- id: MC-c10-trig-approx-nonperiodic
  title: מקרבים בפולינומים טריגונומטריים פונקציה שאינה מחזורית
  belief: >-
    כל פונקציה רציפה על $[-\pi,\pi]$, למשל $f(x)=x$, אפשר לקרב במידה שווה בפולינומים טריגונומטריים.
  truth: >-
    כל פולינום טריגונומטרי $T$ מקיים $T(-\pi)=T(\pi)$. אם $f(-\pi)\ne f(\pi)$, אז
    $\sup|f-T|\ge\frac{|f(\pi)-f(-\pi)|}2$; עבור $x$ זה $\pi$. הגרסה הטריגונומטרית דורשת $f(-\pi)=f(\pi)$.
  remedy: { lesson: '10.6', label: 'הגרסה הטריגונומטרית: למה צריך מחזוריות' }

- id: MC-c10-sup-not-maximized
  title: חוסמים את הגורם בסופרמום ב-1 במקום למצוא את המקסימום שלו
  belief: >-
    $\sup_{[0,1]}\frac{x(1-x)}n=\frac1n$, כי $x\le1$ ו-$1-x\le1$.
  truth: >-
    זה חסם, לא הסופרמום: $x(1-x)$ מקבל מקסימום $\frac14$ ב-$x=\frac12$, ולכן
    $\sup|B_n(x^2)-x^2|=\frac1{4n}$. כששואלים על ה-$n$ הקטן ביותר צריך את הסופרמום המדויק.
  remedy: { lesson: '10.6', label: 'השגיאה של ברנשטיין עבור x בריבוע' }

- id: MC-c10-cesaro-changes-limit
  title: חושבים שמיצוע צזרו יכול לשנות גבול קיים
  belief: >-
    גם כש-$s_N\to s$, הממוצעים $\sigma_N=\frac{s_0+\dots+s_N}{N+1}$ יכולים לשאוף למספר אחר, למשל בגלל איברים ראשונים גדולים.
  truth: >-
    אם $s_N\to s$ אז $\sigma_N\to s$: תרומת ההתחלה היא קבוע חלקי $N+1$, והזנב קרוב ל-$s$. לכן בכל נקודה שבה טור
    פורייה מתכנס, ממוצעי צזרו שלו מתכנסים לאותו מספר.
  remedy: { lesson: '10.6', label: 'ממוצעי צזרו' }

- id: MC-c10-cesaro-converse
  title: חושבים שהתכנסות של ממוצעי צזרו גוררת התכנסות של הסדרה
  belief: >-
    אם $\sigma_N\to s$ אז $s_N\to s$; או שהגבול של הממוצעים הוא אחד מערכי הסדרה.
  truth: >-
    $s_N=1,0,1,0,\dots$ אינה מתכנסת, ו-$\sigma_N\to\frac12$, ערך שהסדרה לא מקבלת אף פעם. הממוצעים מתכנסים במקרים רבים
    יותר מהסדרה עצמה.
  remedy: { lesson: '10.6', label: 'ממוצעי צזרו של הסדרה 1, 0, 1, 0' }

- id: MC-c10-dirichlet-fejer-confusion
  title: מבלבלים בין גרעין דיריכלה לגרעין פייר
  belief: >-
    $D_N$ ו-$F_N$ הם אותו גרעין, או שיש להם אותן תכונות: אותו ערך באפס, חיוביות, אותו אינטגרל של הערך המוחלט.
  truth: >-
    $D_N(0)=2N+1$, $D_N$ מחליף סימן ו-$\frac1{2\pi}\int|D_N|\to\infty$ (כמו $\frac4{\pi^2}\ln N$). לעומתו
    $F_N=\frac1{N+1}\sum_{k=0}^ND_k=\frac1{N+1}\left(\frac{\sin\frac{(N+1)t}2}{\sin(t/2)}\right)^2$: $F_N(0)=N+1$, $F_N\ge0$,
    ו-$\frac1{2\pi}\int|F_N|=\frac1{2\pi}\int F_N=1$.
  remedy: { lesson: '10.6', label: 'גרעין פייר מול גרעין דיריכלה' }

- id: MC-c10-fejer-normalization
  title: טועים בנרמול של ממוצע צזרו או של גרעין פייר
  belief: >-
    ב-$\sigma_N$ מחלקים ב-$N$; או שהערך של $F_N$ באפס, $N+1$, הוא גם ערכו בנקודות אחרות.
  truth: >-
    $\sigma_Nf=\frac{S_0f+\dots+S_Nf}{N+1}$ הוא ממוצע של $N+1$ סכומים חלקיים, ולכן מחלקים ב-$N+1$, והמקדם ה-$n$ מוכפל
    ב-$1-\frac n{N+1}$. $F_N(0)=N+1$ הוא המקסימום של הגרעין; הרחק מ-0 הוא לכל היותר $\frac1{(N+1)\sin^2(t/2)}$.
  remedy: { lesson: '10.6', label: 'ממוצעי צזרו וגרעין פייר' }

- id: MC-c10-fejer-for-partial-sums
  title: מייחסים לסכומים החלקיים את מה שמשפט פייר אומר על הממוצעים
  belief: >-
    משפט פייר אומר ש-$S_Nf\to f$ במידה שווה לכל $f$ רציפה ומחזורית; או ש-$\sigma_Nf=S_Nf$.
  truth: >-
    פייר עוסק ב-$\sigma_Nf=\frac1{N+1}\sum_{n=0}^NS_nf$, שמכפיל את המקדם ה-$n$ ב-$1-\frac n{N+1}$; ל-$f=\cos3x$,
    $S_4f=\cos3x$ ואילו $\sigma_4f=\frac25\cos3x$. לפונקציה רציפה כללית $S_Nf$ יכול להתבדר בנקודה (ידוע, בלי הוכחה
    בקורס), ואילו $\sigma_Nf\to f$ במידה שווה.
  remedy: { lesson: '10.6', label: 'משפט פייר: ממוצעים, לא סכומים חלקיים' }

- id: MC-c10-fejer-only-pointwise
  title: חושבים שמשפט פייר נותן רק התכנסות נקודתית
  belief: >-
    $\sigma_Nf(x)\to f(x)$ לכל $x$, אבל אין סיבה שההתכנסות תהיה במידה שווה.
  truth: >-
    בהוכחה החסם על $|\sigma_Nf(x)-f(x)|$ אינו תלוי ב-$x$: ה-$\delta$ בא מהרציפות **במידה שווה** של $f$ (קנטור, על מחזור
    אחד), והחסם הרחק מ-0, $\frac{2\max|f|}{(N+1)\sin^2(\delta/2)}$, אחיד. לכן $\max|\sigma_Nf-f|\to0$.
  remedy: { lesson: '10.6', label: 'משפט פייר: למה במידה שווה' }

- id: MC-c10-polynomials-are-trig
  title: מבלבלים בין פולינומים רגילים לפולינומים טריגונומטריים
  belief: >-
    משפט הקירוב של ויירשטראס נותן ישירות קירוב בפולינומים טריגונומטריים, כי פולינום הוא פולינום טריגונומטרי.
  truth: >-
    פולינום טריגונומטרי הוא צירוף סופי של $1,\cos nx,\sin nx$, ולכן מחזורי ב-$2\pi$; $x$ אינו כזה. את הגרסה
    הטריגונומטרית מוכיחים ישירות, למשל ממשפט פייר: $\sigma_Nf$ הוא פולינום טריגונומטרי, ו-$\sigma_Nf\to f$ במידה שווה.
  remedy: { lesson: '10.6', label: 'הגרסה הטריגונומטרית של ויירשטראס' }
