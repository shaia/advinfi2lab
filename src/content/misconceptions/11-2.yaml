# Misconceptions first detected in lesson 11.2 (the Lipschitz condition and non-uniqueness).
- id: MC-c11-lipschitz-L-depends-on-t
  title: מרשים לקבוע ליפשיץ להיות תלוי בזמן
  belief: >-
    מספיק שלכל $t$ קבוע הפונקציה $y\mapsto f(t,y)$ תהיה ליפשיצית, כל אחת עם קבוע משלה.
  truth: >-
    תנאי ליפשיץ במשתנה התלוי הוא **אחיד בזמן**: קבוע אחד $L$ לכל $t$. הפונקציה $f(t,y)=ty$ ליפשיצית ב-$y$ לכל
    $t$ עם קבוע $|t|$, אבל לא באופן אחיד ב-$\mathbb{R}\times\mathbb{R}$.
  remedy: { lesson: '11.2', label: 'תנאי ליפשיץ: קבוע אחד לכל הזמנים' }

- id: MC-c11-lipschitz-in-t
  title: דורשים תנאי ליפשיץ גם במשתנה הזמן
  belief: >-
    תנאי ליפשיץ של אגף ימין פירושו $|f(t_1,y_1)-f(t_2,y_2)|\le L(|t_1-t_2|+|y_1-y_2|)$.
  truth: >-
    התנאי משווה ערכים **באותו** $t$ בלבד. ב-$t$ דורשים רק רציפות. למשל $f(t,y)=\sqrt{|t|}$ מקיימת את התנאי ב-$y$
    עם $L=0$, אף שאינה ליפשיצית ב-$t$.
  remedy: { lesson: '11.2', label: 'תנאי ליפשיץ: רק במשתנה התלוי' }

- id: MC-c11-lipschitz-negation
  title: שוללים את תנאי ליפשיץ בלי להפוך את כל הכמתים
  belief: >-
    "$f$ אינה ליפשיצית" פירושו שקיים $L$ שעבורו אי-השוויון נכשל, או שהוא נכשל לכל זוג נקודות.
  truth: >-
    השלילה היא: לכל $L\ge0$ קיימים $t$ ו-$y_1,y_2$ עם $|f(t,y_1)-f(t,y_2)|>L|y_1-y_2|$. כלומר מנות ההפרשים אינן
    חסומות.
  remedy: { lesson: '11.2', label: 'שלילת תנאי ליפשיץ' }

- id: MC-c11-bounded-derivative-any-domain
  title: מסיקים ליפשיץ מנגזרת חסומה בתחום שאינו קמור
  belief: >-
    אם $\frac{\partial f}{\partial y}$ חסומה ב-$D$, אז $f$ ליפשיצית ב-$y$ ב-$D$, בכל תחום.
  truth: >-
    ההוכחה מפעילה את משפט הערך הממוצע על הקטע בין $y_1$ ל-$y_2$, ולכן הקטע צריך להיות בתוך $D$. עבור
    $f=\operatorname{sgn}y$ על $\mathbb{R}\times(\mathbb{R}\setminus\{0\})$ הנגזרת החלקית אפס, ו-$f$ אינה ליפשיצית.
  remedy: { lesson: '11.2', label: 'נגזרת חסומה גוררת ליפשיץ: למה צריך קמירות' }

- id: MC-c11-lipschitz-needs-derivative
  title: חושבים שפונקציה ליפשיצית חייבת להיות גזירה
  belief: >-
    פונקציה שאינה גזירה בנקודה אינה ליפשיצית; ובכיוון ההפוך, ההגדרה של תנאי ליפשיץ היא חסם על הנגזרת.
  truth: >-
    $|y|$ אינה גזירה ב-0 והיא ליפשיצית עם $L=1$. נגזרת חסומה היא תנאי **מספיק** לליפשיץ (בתחום קמור), לא ההגדרה.
    מה שמכשיל את $y^{2/3}$ ליד 0 הוא מנת הפרשים לא חסומה, לא עצם אי-הגזירות.
  remedy: { lesson: '11.2', label: 'ליפשיץ בלי נגזרת' }

- id: MC-c11-continuous-implies-lipschitz
  title: חושבים שרציפות, אפילו על קבוצה קומפקטית, גוררת ליפשיץ
  belief: >-
    פונקציה רציפה על מלבן סגור וחסום מקיימת תנאי ליפשיץ.
  truth: >-
    רציפות על קומפקט נותנת רציפות במידה שווה, לא ליפשיץ. $\sqrt{|y|}$ ו-$y^{2/3}$ רציפות על $[-1,1]$, ומנות
    ההפרשים שלהן ליד 0 אינן חסומות.
  remedy: { lesson: '11.2', label: 'רציף אבל לא ליפשיצי' }

- id: MC-c11-local-is-global-lipschitz
  title: מסיקים ליפשיץ גלובלי מליפשיץ על כל רצועה
  belief: >-
    אם $f$ ליפשיצית בכל רצועה $|y|\le b$, היא ליפשיצית בכל המישור.
  truth: >-
    הקבוע עשוי לגדול עם $b$. עבור $y^2$ הקבוע ברצועה הוא $2b$, ומנת ההפרשים בין $n+1$ ל-$n$ היא $2n+1$: ליפשיצית
    מקומית, לא גלובלית.
  remedy: { lesson: '11.2', label: 'ליפשיץ מקומי וגלובלי' }

- id: MC-c11-M-vs-L
  title: מבלבלים בין החסם על f לבין קבוע ליפשיץ
  belief: >-
    החסם $M=\max_R|f|$ הוא גם קבוע ליפשיץ, או: פונקציה חסומה היא ליפשיצית.
  truth: >-
    $M$ חוסם את **ערכי** $f$ וקובע כמה מהר הפתרון זז; $L$ חוסם את **מנות ההפרשים** ב-$y$ וקובע יחידות וכיווץ.
    $\sin(y^2)$ חסומה ב-1 ואינה ליפשיצית גלובלית; $t\sin 2y$ על $|t|\le3$ חסומה ב-3 וקבוע ליפשיץ שלה 6.
  remedy: { lesson: '11.2', label: 'החסם M וקבוע ליפשיץ L' }

- id: MC-c11-L-not-sup
  title: מחשבים קבוע ליפשיץ מנקודה אחת או מזוג נקודות אחד
  belief: >-
    קבוע ליפשיץ הוא הנגזרת בנקודת ההתחלה, או בקצה נוח, או מנת ההפרשים בין קצות התחום.
  truth: >-
    קבוע ליפשיץ חייב לחסום את מנות ההפרשים **לכל** זוג נקודות. הקבוע הקטן ביותר לפונקציה גזירה ב-$y$ בתחום קמור
    הוא $\sup|\frac{\partial f}{\partial y}|$ על כל התחום.
  remedy: { lesson: '11.2', label: 'חישוב קבוע ליפשיץ' }

- id: MC-c11-lipschitz-implies-bounded
  title: חושבים שפונקציה ליפשיצית חייבת להיות חסומה
  belief: >-
    פונקציה לא חסומה אינה ליפשיצית; או: קיום גלובלי דורש ש-$f$ תהיה חסומה.
  truth: >-
    $f(t,y)=y$ אינה חסומה וליפשיצית עם $L=1$, והפתרונות $ce^t$ קיימים לכל $t$. ליפשיץ מגביל את קצב השינוי של $f$,
    לא את גודלה.
  remedy: { lesson: '11.2', label: 'ליפשיץ וחסימות' }

- id: MC-c11-glued-not-differentiable
  title: חושבים שפונקציה מודבקת משני חלקים אינה גזירה בנקודת ההדבקה
  belief: >-
    $y=0$ עבור $t\le c$ ו-$y=(t-c)^3$ עבור $t>c$ אינה גזירה ב-$c$, ולכן אינה פתרון.
  truth: >-
    בנקודת ההדבקה שתי הנגזרות החד-צדדיות שוות 0, ולכן הפונקציה גזירה שם ו-$y'(c)=0=3y(c)^{2/3}$. כך מתקבלים
    אינסוף פתרונות של $y'=3y^{2/3}$, $y(0)=0$.
  remedy: { lesson: '11.2', label: 'אינסוף פתרונות: הדבקה' }

- id: MC-c11-no-lipschitz-no-solution
  title: חושבים שבלי תנאי ליפשיץ אין פתרון
  belief: >-
    אם $f$ אינה ליפשיצית ליד נקודת ההתחלה, לבעיית ההתחלה אין פתרון.
  truth: >-
    ליפשיץ נחוץ ל**יחידות** במשפט, לא לקיום. $y'=3y^{2/3}$, $y(0)=0$ פתירה ($y\equiv0$, $y=t^3$ ועוד אינסוף). שיעור ההעשרה 11.5
    (משפט פאנו) מראה שרציפות של $f$ לבדה כבר מבטיחה קיום.
  remedy: { lesson: '11.2', label: 'בלי ליפשיץ: פתרונות יש, יחידות אין' }

- id: MC-c11-only-zero-solution
  title: מסיקים שהפתרון היחיד הוא הפתרון שמצאנו
  belief: >-
    ל-$y'=3y^{2/3}$, $y(0)=0$ (או ל-$y'=2\sqrt{|y|}$, $y(0)=0$) הפתרון $y\equiv0$ הוא היחיד, כי הוא הפתרון שמתקבל
    מיד, או שכל קירוב שמתחיל ב-0 נשאר 0.
  truth: >-
    פתרון אחד שמצאנו, בניחוש או בקירוב, אינו מוכיח שאין אחרים. כאן גם $t^3$ (או $t^2$ עבור $t\ge0$) וכל ההדבקות
    $(t-c)^3$ אחרי $c\ge0$ הן פתרונות: $f$ אינה ליפשיצית ליד $y=0$, ויחידות אינה מובטחת.
  remedy: { lesson: '11.2', label: 'אינסוף פתרונות: הדבקה' }

- id: MC-c11-lipschitz-at-one-point
  title: בודקים את תנאי ליפשיץ רק מול הנקודה הבעייתית
  belief: >-
    אם מנות ההפרשים $\frac{|f(t,y)-f(t,0)|}{|y|}$ חסומות, $f$ ליפשיצית ב-$y$ ליד $y=0$.
  truth: >-
    תנאי ליפשיץ חוסם את מנות ההפרשים של **כל** זוג נקודות. עבור $f=y\sin\frac1y$ המנות מול 0 חסומות ב-1, אבל בין
    $\frac1{2\pi n+\pi/2}$ ל-$\frac1{2\pi n+3\pi/2}$ המנה היא $4n+2$.
  remedy: { lesson: '11.2', label: 'שלילת תנאי ליפשיץ' }
