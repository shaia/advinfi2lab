# Misconceptions first detected in lesson 6.2 (conservative fields and potentials).
- id: MC-c6-potential-order
  title: מחסירים את ערך הפוטנציאל בסוף מערכו בהתחלה
  belief: >-
    $\int_\gamma\nabla\varphi\cdot d\mathbf s=\varphi(\gamma(a))-\varphi(\gamma(b))$: ההתחלה פחות הסוף, כמו "ירידה בפוטנציאל".
  truth: >-
    לפי כלל השרשרת $\frac{d}{dt}\varphi(\gamma(t))=\nabla\varphi(\gamma(t))\cdot\gamma'(t)$, ולפי המשפט היסודי
    $\int_\gamma\nabla\varphi\cdot d\mathbf s=\varphi(\gamma(b))-\varphi(\gamma(a))$: הסוף פחות ההתחלה. (בפיזיקה מסמנים לפעמים
    $\mathbf F=-\nabla U$, ומשם המינוס.)
  remedy: { lesson: '6.2', label: 'המשפט היסודי לאינטגרלים קוויים' }

- id: MC-c6-gradient-perpendicular
  title: מסבירים אינטגרל אפס של גרדיאנט על מסילה סגורה בכך שהגרדיאנט ניצב למסילה
  belief: >-
    $\oint\nabla\varphi\cdot d\mathbf s=0$ כי הגרדיאנט ניצב למסילה, ולכן $\nabla\varphi\cdot\gamma'=0$ בכל נקודה.
  truth: >-
    הגרדיאנט ניצב לקווי הרמה, לא לכל מסילה. האינטגרנד $\nabla\varphi\cdot\gamma'$ יכול להיות חיובי בחלק מהדרך ושלילי
    בחלק אחר; האינטגרל הוא אפס כי הוא $\varphi(\gamma(b))-\varphi(\gamma(a))$, ובמסילה סגורה $\gamma(b)=\gamma(a)$.
  remedy: { lesson: '6.2', label: 'המשפט היסודי: מסילה סגורה' }

- id: MC-c6-shadow-closed
  title: חושבים שמסילה סגורה כי ההיטל שלה למישור סגור
  belief: >-
    הסליל $(\cos t,\sin t,t)$ על $[0,2\pi]$ "מקיף פעם אחת", ולכן חוזר לנקודת ההתחלה.
  truth: >-
    מסילה סגורה פירושה $\gamma(b)=\gamma(a)$ בכל הרכיבים. הסליל מתחיל ב-$(1,0,0)$ ומסתיים ב-$(1,0,2\pi)$; רק ההיטל
    שלו למישור $xy$ סגור.
  remedy: { lesson: '6.2', label: 'המשפט היסודי: לבדוק את נקודות הקצה' }

- id: MC-c6-mixed-partials-suffice
  title: חושבים ששוויון הנגזרות החלקיות המעורבות מבטיח שדה משמר בכל תחום
  belief: >-
    אם $\frac{\partial P}{\partial y}=\frac{\partial Q}{\partial x}$ בכל התחום, השדה $(P,Q)$ משמר שם, ולכן כל אינטגרל
    שלו על מסילה סגורה הוא אפס.
  truth: >-
    התנאי **הכרחי** לשדה משמר גזיר ברציפות, אבל לא מספיק בכל תחום. שדה הסיבוב $\frac{(-y,x)}{x^2+y^2}$ מקיים אותו
    ב-$\mathbb{R}^2\setminus\{0\}$, ובכל זאת האינטגרל שלו על מעגל סביב הראשית הוא $2\pi$, בחישוב ישיר.
  remedy: { lesson: '6.2', label: 'שדה הסיבוב סביב הראשית' }

- id: MC-c6-few-curves-suffice
  title: בודקים מסילה סגורה אחת או כמה ומסיקים ששדה משמר
  belief: >-
    אם האינטגרל על מעגל היחידה (או על כמה מסילות סגורות) הוא אפס, השדה משמר.
  truth: >-
    ההגדרה השקולה היא "אפס על **כל** מסילה סגורה בתחום". ל-$\mathbf F=(0,x^2)$ האינטגרל על מעגל היחידה הוא אפס,
    אבל בין $(0,0)$ ל-$(1,1)$ הוא 1 דרך $(1,0)$ ו-0 דרך $(0,1)$.
  remedy: { lesson: '6.2', label: 'השקילות: משמר, אי-תלות במסלול, אפס על כל מסילה סגורה' }

- id: MC-c6-circular-potential
  title: מוכיחים שיש פוטנציאל בעזרת המשפט היסודי, שמניח שיש פוטנציאל
  belief: >-
    כדי להראות שאינטגרל על מסילה סגורה אפס גורר אי-תלות במסלול (או משמר), מספיק לכתוב "לפי המשפט היסודי האינטגרל הוא
    הפרש הפוטנציאל בקצוות".
  truth: >-
    המשפט היסודי חל רק על שדה שכבר ידוע שהוא גרדיאנט. בהוכחת השקילות משתמשים רק בהנחה: שתי מסילות מ-$A$ ל-$B$ יוצרות,
    עם היפוך של אחת מהן, מסילה סגורה; ואת הפוטנציאל בונים במפורש, $\varphi(p)=\int_{p_0}^{p}\mathbf F\cdot d\mathbf s$.
  remedy: { lesson: '6.2', label: 'הוכחת השקילות, צעד אחרי צעד' }

- id: MC-c6-sum-antiderivatives
  title: בונים פוטנציאל מסכום שלוש הפונקציות הקדומות
  belief: >-
    פוטנציאל ל-$(P,Q,R)$ הוא $\int P\,dx+\int Q\,dy+\int R\,dz$.
  truth: >-
    איבר שמופיע בשתי פונקציות קדומות נספר פעמיים, והגרדיאנט של הסכום אינו $\mathbf F$. מחשבים פונקציה קדומה לפי $x$ בלבד, עם
    "קבוע" $g(y,z)$, ואת $g$ קובעים מהשוואה לרכיב הבא. בסוף בודקים $\nabla\varphi=\mathbf F$.
  remedy: { lesson: '6.2', label: 'מציאת פוטנציאל, רכיב אחרי רכיב' }

- id: MC-c6-integration-constant
  title: קבוע האינטגרציה לפי x נחשב מספר ולא פונקציה של שאר המשתנים
  belief: >-
    $\int e^y\,dx=xe^y+C$ עם $C$ מספר, ולכן $\varphi=xe^y$ הוא הפוטנציאל של $(e^y,\ xe^y+1)$.
  truth: >-
    כשמחשבים פונקציה קדומה לפי $x$, ה"קבוע" יכול להיות כל פונקציה של $y$: $\varphi=xe^y+g(y)$. ההשוואה
    $\varphi_y=xe^y+g'(y)=xe^y+1$ נותנת $g(y)=y$.
  remedy: { lesson: '6.2', label: 'מציאת פוטנציאל: הפונקציה g' }

- id: MC-c6-singularity-means-nonconservative
  title: חושבים ששדה שאינו מוגדר בנקודה אינו משמר בגלל הנקודה הזו
  belief: >-
    שדה הסיבוב אינו משמר כי הוא לא מוגדר בראשית, שנמצאת בתוך המעגל.
  truth: >-
    גם $\frac{(x,y)}{x^2+y^2}$ אינו מוגדר בראשית, והוא משמר ב-$\mathbb{R}^2\setminus\{0\}$: הוא הגרדיאנט של
    $\frac12\ln(x^2+y^2)$. מה שמכריע אינו החור עצמו, אלא חישוב: ל-$\frac{(-y,x)}{x^2+y^2}$ האינטגרל על המעגל הוא $2\pi\ne0$.
  remedy: { lesson: '6.2', label: 'שדה הסיבוב מול השדה הרדיאלי' }

- id: MC-c6-conservative-domain-free
  title: חושבים ששדה משמר או לא משמר בלי קשר לתחום
  belief: >-
    שדה הסיבוב אינו משמר ב-$\mathbb{R}^2\setminus\{0\}$, ולכן אינו משמר גם בשום תת-תחום.
  truth: >-
    "משמר" היא תכונה של שדה **על תחום**. בחצי המישור $x>0$ שדה הסיבוב הוא הגרדיאנט של $\arctan\frac yx$, ושם הוא משמר.
    מה שנכשל ב-$\mathbb{R}^2\setminus\{0\}$ הוא שאין פוטנציאל אחד על כל התחום.
  remedy: { lesson: '6.2', label: 'שדה הסיבוב בחצי מישור' }

- id: MC-c6-potential-unique
  title: חושבים שלשדה משמר יש פוטנציאל יחיד
  belief: >-
    אם $\nabla\varphi=\nabla\psi=\mathbf F$ על $U$, אז $\varphi=\psi$.
  truth: >-
    $\nabla(\varphi-\psi)=0$ על $U$, ועל תחום קשיר זה אומר ש-$\varphi-\psi$ **קבועה**, לא אפס: $\varphi+c$ הוא פוטנציאל
    לכל קבוע $c$. ההפרש $\varphi(B)-\varphi(A)$, שהוא מה שהאינטגרל הקווי רואה, אינו תלוי בבחירה.
  remedy: { lesson: '6.2', label: 'פוטנציאל: יחיד עד כדי קבוע' }

- id: MC-c6-conservative-by-look
  title: מחליטים אם שדה משמר לפי המראה שלו, בלי לבדוק
  belief: >-
    שדה שרכיביו "מעורבבים", כמו $(y,x)$ או $(y\cos(xy),\ x\cos(xy))$, אינו משמר, ושדה שנראה פשוט משמר.
  truth: >-
    בודקים: אם $\partial_yP\ne\partial_xQ$ בנקודה אחת, השדה אינו משמר; אם השוויון מתקיים, מחפשים פוטנציאל. $(y,x)=\nabla(xy)$
    ו-$(y\cos(xy),\ x\cos(xy))=\nabla\sin(xy)$ משמרים, ו-$(y,-x)$ אינו משמר.
  remedy: { lesson: '6.2', label: 'מציאת פוטנציאל, רכיב אחרי רכיב' }
