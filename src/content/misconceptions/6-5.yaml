# Misconceptions first detected in lesson 6.5 (total curvature).
- id: MC-c6-K-one-over-r
  title: חושבים שעקמומיות גאוס של ספרה ברדיוס r היא אחד חלקי r
  belief: >-
    לספרה שרדיוסה $r$ מתקיים $K=\frac1r$, כמו העקמומיות של מעגל גדול.
  truth: >-
    $K=\kappa_1\kappa_2$, ובספרה $\kappa_1=\kappa_2=\frac1r$, ולכן $K=\frac{1}{r^2}$. אז $\iint K\,dS=\frac{1}{r^2}\cdot4\pi r^2=4\pi$.
  remedy: { lesson: '6.5', label: 'העקמומיות הכוללת של ספרה' }

- id: MC-c6-total-is-area
  title: מבלבלים בין העקמומיות הכוללת לבין השטח של המשטח
  belief: >-
    $\iint_S K\,dS$ הוא השטח של $S$, או שהוא גדל עם השטח.
  truth: >-
    $\iint_S K\,dS$ הוא השטח המסומן של **התמונה** של העתקת גאוס, תת-קבוצה של ספרת היחידה. כיפה של ספרה גדולה ושל ספרה
    קטנה, עם אותם כיווני נורמל, נותנות אותה עקמומיות כוללת, אף שהשטחים שלהן שונים.
  remedy: { lesson: '6.5', label: 'העקמומיות הכוללת כשטח של תמונת העתקת גאוס' }

- id: MC-c6-total-abs
  title: סופרים את תמונת העתקת גאוס בלי סימן
  belief: >-
    העקמומיות הכוללת היא השטח של תמונת העתקת גאוס, תמיד בסימן חיובי; לכן לטורוס היא $8\pi$ (שתי ספרות).
  truth: >-
    במקום שבו $K<0$, העתקת גאוס הופכת את הכיוון (דטרמיננטת הדיפרנציאל שלה היא $K$), והשטח נספר במינוס. בטורוס החצי החיצוני
    מכסה את הספרה בשטח מסומן $4\pi$ והפנימי בשטח מסומן מינוס $4\pi$; סך הכול $0$. $\iint|K|\,dS=8\pi$ הוא גודל אחר.
  remedy: { lesson: '6.5', label: 'השטח המסומן: הטורוס מכסה את הספרה פעמיים' }

- id: MC-c6-total-depends-on-size
  title: חושבים שהעקמומיות הכוללת משתנה כשמגדילים את המשטח
  belief: >-
    ספרה גדולה עקומה פחות, ולכן העקמומיות הכוללת שלה קטנה יותר (או: שטח גדול יותר נותן יותר עקמומיות).
  truth: >-
    בהגדלה פי $\lambda$, $K$ קטן פי $\lambda^2$ ו-$dS$ גדל פי $\lambda^2$: המכפלה לא משתנה. גם העתקת גאוס לא משתנה, כי
    כיווני הנורמלים זהים.
  remedy: { lesson: '6.5', label: 'מה נשאר בהגדלה' }

- id: MC-c6-total-always-4pi
  title: חושבים שהעקמומיות הכוללת של כל משטח סגור היא ארבע פאי
  belief: >-
    העתקת גאוס של כל משטח סגור מכסה את הספרה פעם אחת, ולכן תמיד $\iint K\,dS=4\pi$.
  truth: >-
    התוצאה תלויה בצורה הטופולוגית של המשטח: $4\pi$ למשטח שאפשר לעוות לספרה, $0$ למשטח שאפשר לעוות לטורוס (גאוס-בונה).
    העתקת גאוס של טורוס מכסה את הספרה פעמיים, בסימנים מנוגדים.
  remedy: { lesson: '6.5', label: 'גאוס-בונה בניסוח איכותי' }

- id: MC-c6-dent-changes-total
  title: חושבים ששקע או בליטה משנים את העקמומיות הכוללת של משטח סגור
  belief: >-
    אם לוחצים שקע בספרה, נוצר אזור עם $K<0$, ולכן העקמומיות הכוללת יורדת מתחת ל-$4\pi$.
  truth: >-
    לפי גאוס-בונה העקמומיות הכוללת של משטח סגור לא משתנה בעיוות חלק. האזור עם $K<0$ מתקזז בדיוק בתוספת של $K>0$ בשפת
    השקע, שם המשטח מתעקם חזק יותר.
  remedy: { lesson: '6.5', label: 'גאוס-בונה: עיוות לא משנה את הסכום' }

- id: MC-c6-K-pointwise-invariant
  title: חושבים שעיוות של משטח שומר על עקמומיות גאוס בכל נקודה
  belief: >-
    אליפסואיד הוא ספרה מעוותת, ולכן $K$ שלו קבוע וחיובי כמו של ספרה; מה שגאוס-בונה שומר הוא $K$ עצמו.
  truth: >-
    עיוות חלק משנה את $K$ מנקודה לנקודה; גאוס-בונה שומר רק על האינטגרל $\iint K\,dS$. (מה שנשמר נקודתית הוא $K$ תחת
    **איזומטריה**, לפי המשפט המופלא, וזה דבר אחר.)
  remedy: { lesson: '6.5', label: 'גאוס-בונה: מה נשמר ומה לא' }

- id: MC-c6-K-sign-flips
  title: חושבים שעקמומיות גאוס מחליפה סימן כשהופכים את הנורמל
  belief: >-
    היפוך $\hat{\mathbf N}$ מחליף את הסימן של $K$, כמו של $H$, ולכן גם של העקמומיות הכוללת.
  truth: >-
    היפוך $\hat{\mathbf N}$ מחליף את הסימן של $\kappa_1$ ושל $\kappa_2$, ולכן $K=\kappa_1\kappa_2$ לא משתנה; $H$ כן מחליף
    סימן. העתקת גאוס מוחלפת בהרכבתה עם העתקת הנקודה הנגדית $p\mapsto-p$: זו שומרת על שטחים, וההיפוך שהיא גורמת לכיוון
    מתקזז עם היפוך הכיוון של המשטח עצמו. לכן גם העקמומיות הכוללת לא משתנה.
  remedy: { lesson: '6.5', label: 'מה תלוי בבחירת הנורמל' }

- id: MC-c6-H-orientation-free
  title: חושבים שגם העקמומיות הממוצעת אינה תלויה בבחירת הנורמל
  belief: >-
    כמו $K$, גם $H$ ו-$\iint_S H\,dS$ לא משתנים כשהופכים את $\hat{\mathbf N}$.
  truth: >-
    $L,M,N$ מוגדרים עם $\hat{\mathbf N}$ ומחליפים סימן כשהוא מתהפך, ואיתם $\kappa_1,\kappa_2$. לכן $H=\frac{\kappa_1+\kappa_2}2$
    מחליף סימן (בספרת היחידה $H=\pm1$ לפי הבחירה), ורק המכפלה $K=\kappa_1\kappa_2$ נשמרת.
  remedy: { lesson: '6.5', label: 'מה תלוי בבחירת הנורמל' }

- id: MC-c6-zero-total-small-image
  title: חושבים שעקמומיות כוללת אפס פירושה שתמונת העתקת גאוס קטנה
  belief: >-
    לטורוס העקמומיות הכוללת $0$, ולכן התמונה של העתקת גאוס שלו היא קבוצה בעלת שטח אפס, כמו מעגל.
  truth: >-
    העקמומיות הכוללת היא שטח **מסומן**. התמונה של העתקת גאוס של הטורוס היא כל ספרת היחידה, והיא מכוסה פעמיים: פעם בסימן
    חיובי (החצי החיצוני, $K>0$) ופעם בשלילי (החצי הפנימי, $K<0$). האפס בא מהקיזוז, לא מתמונה קטנה.
  remedy: { lesson: '6.5', label: 'העקמומיות הכוללת כשטח מסומן' }

- id: MC-c6-gauss-image-guess
  title: מנחשים את תמונת העתקת גאוס בלי לבדוק אילו נורמלים מתקבלים
  belief: >-
    התמונה של העתקת גאוס של חלק מפרבולואיד, עם הנורמל כלפי מעלה, היא חצי הספרה העליונה, כי הנורמל תמיד כלפי מעלה.
  truth: >-
    התמונה היא בדיוק קבוצת הנורמלים שמתקבלים על התחום. בפרבולואיד מעל $x^2+y^2\le1$ רכיב ה-$z$ של $\hat{\mathbf N}$ יורד
    מ-1 ל-$\frac1{\sqrt5}$ בלבד, ולכן התמונה היא הכיפה $z\ge\frac1{\sqrt5}$, לא חצי הספרה. בודקים את טווח הנורמל לפני
    שמחשבים שטח.
  remedy: { lesson: '6.5', label: 'העקמומיות הכוללת כשטח מסומן' }
