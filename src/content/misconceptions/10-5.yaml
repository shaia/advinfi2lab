# Misconceptions first detected in lesson 10.5 (mean-square convergence and Parseval's identity).
- id: MC-c10-parseval-coeff-squared
  title: מציבים בפרסבל מקדמים בלי הגורם שלהם או בלי לרבע אותו
  belief: >-
    עבור $f(x)=x$ המקדמים הם בערך $\frac1n$, ולכן פרסבל נותן $\sum\frac1{n^2}=\frac1\pi\int x^2=\frac{2\pi^2}3$.
  truth: >-
    $b_n=\frac{2(-1)^{n+1}}{n}$, ולכן $b_n^2=\frac4{n^2}$ ופרסבל נותן $4\sum\frac1{n^2}=\frac{2\pi^2}3$, כלומר
    $\sum\frac1{n^2}=\frac{\pi^2}6$. גורם במקדם נכנס לפרסבל בריבוע.
  remedy: { lesson: '10.5', label: 'פרסבל: סכום ההופכיים של הריבועים' }

- id: MC-c10-pointwise-implies-mean
  title: חושבים שהתכנסות נקודתית גוררת התכנסות בממוצע ריבועי
  belief: >-
    אם $f_n(x)\to0$ לכל $x$, אז $\int f_n^2\to0$.
  truth: >-
    $f_n=\sqrt n$ על $(0,\frac1n)$ ו-0 מחוץ לו: $f_n(x)\to0$ לכל $x$, אבל $\int f_n^2=1$ לכל $n$. מסה שנדחסת
    לקטע צר נעלמת נקודתית ולא בנורמה.
  remedy: { lesson: '10.5', label: 'שלושת סוגי ההתכנסות' }

- id: MC-c10-parseval-needs-continuity
  title: חושבים ששוויון פרסבל וההתכנסות בממוצע ריבועי דורשים פונקציה רציפה
  belief: >-
    לגל ריבועי, או לכל פונקציה עם קפיצה, $\|f-S_Nf\|$ לא שואף לאפס ופרסבל לא חל.
  truth: >-
    לכל $f\in H$ (אינטגרבילית רימן בריבוע) $\|f-S_Nf\|\to0$, ולכן פרסבל חל. מגל ריבועי, עם סכום על $n$
    אי-זוגיים בלבד: $2=\frac1\pi\int1=\sum\frac{16}{\pi^2n^2}$, כלומר $\sum\frac1{n^2}=\frac{\pi^2}8$ על האי-זוגיים.
  remedy: { lesson: '10.5', label: 'התכנסות בממוצע ריבועי לכל f ב-H' }

- id: MC-c10-h-sees-points
  title: חושבים שהנורמה של H מבחינה בין פונקציות ששונות במספר סופי של נקודות
  belief: >-
    אם $f$ ו-$g$ שונות בנקודה אחת, אז $\|f-g\|>0$ והמקדמים שלהן שונים.
  truth: >-
    $\int(f-g)^2=0$ כש-$f-g$ שונה מאפס רק במספר סופי של נקודות. לכן ב-$H$ הן אותו איבר: אותם מקדמים, אותו טור,
    ומרחק אפס.
  remedy: { lesson: '10.5', label: 'H מזהה פונקציות שמרחקן אפס' }

- id: MC-c10-wirtinger-hypotheses
  title: מפעילים את אי-שוויון וירטינגר בלי לבדוק את ההנחות, או מחמיצים את מה שהן נותנות
  belief: >-
    $\int f^2\le\int(f')^2$ לכל $f$ גזירה, בלי ממוצע אפס או בלי מחזוריות; או שהקבוע 1 הוא הטוב ביותר גם כשחסרות
    הרמוניות נמוכות.
  truth: >-
    וירטינגר דורש $f$ מחזורית ב-$2\pi$, גזירה ברציפות, ו-$\int_{-\pi}^{\pi}f=0$ ($f=1$, ו-$f=x-\pi$ על $[0,2\pi]$, מפרות
    אותו). אם חסרות כל ההרמוניות עד $m-1$, פרסבל נותן $\int(f')^2\ge m^2\int f^2$.
  remedy: { lesson: '10.5', label: 'אי-שוויון וירטינגר והנחותיו' }

- id: MC-c10-sum-over-wrong-indices
  title: מתבלבלים בין סכום על האי-זוגיים לסכום על כל הטבעיים
  belief: >-
    האיברים הזוגיים הם חצי מהטור, ולכן $\sum_{n\ge1}\frac1{n^2}=2\sum_{n\ \mathrm{odd}}\frac1{n^2}$; או שהם מתאפסים.
  truth: >-
    האיברים הזוגיים הם $\sum_m\frac1{(2m)^2}=\frac14\sum_m\frac1{m^2}$, ולכן
    $\sum_{n\ge1}\frac1{n^2}=\sum_{n\ \mathrm{odd}}\frac1{n^2}+\frac14\sum_{n\ge1}\frac1{n^2}$, כלומר הסכום המלא הוא $\frac43$
    מהסכום על האי-זוגיים.
  remedy: { lesson: '10.5', label: 'מעבר בין סכום על האי-זוגיים לסכום המלא' }

- id: MC-c10-parseval-incomplete
  title: חושבים ששוויון פרסבל מתקיים רק לפולינומים טריגונומטריים
  belief: >-
    לפונקציה כללית יש רק את אי-שוויון בסל, ושוויון מתקיים רק כש-$f$ פולינום טריגונומטרי.
  truth: >-
    בסל עם $N$ סופי הוא שוויון בדיוק כש-$f\in T_N$; אבל **בגבול** $N\to\infty$ השוויון (פרסבל) מתקיים לכל $f\in H$, כי
    $\|f-S_Nf\|\to0$. לכן פרסבל הוא כלי לכל פונקציה, ומשווים בעזרתו מקדמים של פונקציות כלליות.
  remedy: { lesson: '10.5', label: 'פרסבל לכל פונקציה ב-H' }
