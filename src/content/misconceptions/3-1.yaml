# Misconceptions first detected in lesson 3.1 (a smooth parametrized surface).
- id: MC-c3-nonzero-partials-enough
  title: חושבים שמספיק ששתי הנגזרות החלקיות שונות מאפס
  belief: >-
    אם $\sigma_u\ne0$ ו-$\sigma_v\ne0$ בנקודה, הפרמטריזציה רגולרית שם.
  truth: >-
    רגולריות פירושה ש-$\sigma_u$ ו-$\sigma_v$ **בלתי תלויים לינארית**, כלומר $\sigma_u\times\sigma_v\ne0$. שני וקטורים
    שונים מאפס יכולים להיות מקבילים: ב-$\sigma(u,v)=(u+v,\,(u+v)^2,\,0)$ שתי הנגזרות שוות ל-$(1,\,2(u+v),\,0)$, והתמונה
    היא מסילה, לא משטח.
  remedy: { lesson: '3.1', label: 'ההגדרה של פרמטריזציה רגולרית' }

- id: MC-c3-regular-means-orthogonal
  title: חושבים שרגולריות דורשת נגזרות חלקיות ניצבות
  belief: >-
    פרמטריזציה רגולרית היא כזו ש-$\sigma_u\cdot\sigma_v=0$, כמו בקואורדינטות קרטזיות.
  truth: >-
    הדרישה היא רק אי-תלות לינארית. $\sigma(u,v)=(u+v,\,v,\,0)$ רגולרית בכל מקום, ובה $\sigma_u\cdot\sigma_v=1$. הזווית בין
    הקווים הפרמטריים היא נתון של הפרמטריזציה, ונמדדת אחר כך בעזרת התבנית הראשונה (שיעור 3.4).
  remedy: { lesson: '3.1', label: 'ההגדרה של פרמטריזציה רגולרית' }

- id: MC-c3-regular-means-injective
  title: מבלבלים בין רגולריות לבין חד-חד-ערכיות
  belief: >-
    פרמטריזציה רגולרית היא פרמטריזציה חד-חד-ערכית; נקודה שבה הפרמטריזציה "נסגרת" על עצמה היא נקודה לא רגולרית.
  truth: >-
    רגולריות היא תנאי **מקומי** על הנגזרת בנקודה, וחד-חד-ערכיות היא תנאי **גלובלי** על ההעתקה. הגליל
    $(\cos u,\sin u,v)$ על $u\in\mathbb R$ רגולרי בכל מקום ואינו חד-חד-ערכי, ו-$(u^3,v,0)$ חד-חד-ערכית ואינה רגולרית
    ב-$u=0$.
  remedy: { lesson: '3.1', label: 'רגולריות מול חד-חד-ערכיות' }

- id: MC-c3-cross-minor-sign
  title: טועים בסימן של רכיב במכפלה הווקטורית או בדטרמיננטה
  belief: >-
    רכיב של מכפלה וקטורית, או דטרמיננטה של מטריצה $2\times2$, הוא סכום של שתי מכפלות.
  truth: >-
    כל רכיב הוא **הפרש**: $(a\times b)_3=a_1b_2-a_2b_1$, ו-$\det\begin{pmatrix}p&q\\r&s\end{pmatrix}=ps-qr$. כדאי לבדוק
    בסוף ש-$a\times b$ ניצב ל-$a$ ול-$b$.
  remedy: { lesson: '0.2', label: 'חזרה: מכפלה וקטורית' }

- id: MC-c3-regularity-only-generic-point
  title: בודקים רגולריות בנקודה כללית ושוכחים נקודות שבהן גורם מתאפס
  belief: >-
    אם הפרמטריזציה של משטח מוכר (ספרה, חרוט, טורוס) נראית רגולרית בנקודה כללית, היא רגולרית בכל מקום.
  truth: >-
    מחשבים את $\|\sigma_u\times\sigma_v\|$ כנוסחה ומחפשים את **כל** האפסים שלה: $r^2|\cos v|$ בספרה מתאפס בקטבים,
    $\sqrt2\,|v|$ בחרוט מתאפס בקודקוד, ו-$r(R+r\cos v)$ בטורוס מתאפס כש-$r\ge R$.
  remedy: { lesson: '3.1', label: 'נקודות לא רגולריות בפרמטריזציות המוכרות' }

- id: MC-c3-param-singular-is-surface-singular
  title: חושבים שנקודה לא רגולרית של הפרמטריזציה היא נקודה סינגולרית של המשטח
  belief: >-
    הקוטב של הספרה הוא נקודה "פגומה" של הספרה, כי הפרמטריזציה בקואורדינטות כדוריות אינה רגולרית שם.
  truth: >-
    רגולריות היא תכונה של **פרמטריזציה**. נקודה של הקבוצה היא נקודה חלקה אם יש לה **איזושהי** פרמטריזציה רגולרית
    בסביבתה. ליד הקוטב הצפוני הגרף $z=\sqrt{1-x^2-y^2}$ רגולרי, ולכן הקוטב נקודה חלקה של הספרה.
  remedy: { lesson: '3.1', label: 'קוטב הספרה: הפרמטריזציה אשמה, לא המשטח' }

- id: MC-c3-vertex-removable
  title: חושבים שכל נקודה לא רגולרית אפשר לתקן בפרמטריזציה אחרת
  belief: >-
    קודקוד החרוט הוא כמו קוטב הספרה: רק הפרמטריזציה $(v\cos u,v\sin u,v)$ אשמה, ופרמטריזציה טובה יותר תהיה רגולרית שם.
  truth: >-
    יש נקודות שהן סינגולריות של הקבוצה עצמה. ליד הקודקוד החרוט הכפול אינו גרף חלק מעל אף מישור, ואם מוציאים את
    הקודקוד מסביבה קטנה שלו היא מתפרקת לשני חלקים, מה שלא קורה לדיסק בלי נקודה.
  remedy: { lesson: '3.1', label: 'קודקוד החרוט מול קוטב הספרה' }

- id: MC-c3-independent-variables
  title: חושבים שהנגזרות החלקיות בלתי תלויות כי המשתנים בלתי תלויים
  belief: >-
    כי $u$ ו-$v$ הם שני משתנים נפרדים, הווקטורים $\sigma_u$ ו-$\sigma_v$ תמיד בלתי תלויים לינארית.
  truth: >-
    אי-תלות של המשתנים אינה אומרת דבר על הנגזרות. ב-$\sigma(u,v)=f(u+v)$ התמונה היא מסילה ו-$\sigma_u=\sigma_v$ בכל
    נקודה. את הרגולריות בודקים בחישוב.
  remedy: { lesson: '3.1', label: 'ההגדרה של פרמטריזציה רגולרית' }

- id: MC-c3-revolution-axis
  title: מחליפים את התפקידים של הרכיבים כשבונים משטח סיבוב
  belief: >-
    כדי לסובב את המסילה $(f(v),0,g(v))$ סביב ציר $z$ כופלים את $g$ ב-$\cos u$ וב-$\sin u$, או מסובבים על מעגל ברדיוס 1.
  truth: >-
    בסיבוב סביב ציר $z$ הגובה $g(v)$ נשמר, והמרחק מהציר $f(v)$ הופך לרדיוס של מעגל:
    $\sigma(u,v)=(f(v)\cos u,\ f(v)\sin u,\ g(v))$. הנוסחה $(f(v),\ g(v)\cos u,\ g(v)\sin u)$ מסובבת סביב ציר $x$.
  remedy: { lesson: '3.1', label: 'משטח סיבוב' }

- id: MC-c3-revolution-axis-point
  title: חושבים שמשטח סיבוב של מסילה רגולרית תמיד רגולרי
  belief: >-
    אם מסילת הפרופיל $(f(v),g(v))$ רגולרית, משטח הסיבוב שלה רגולרי בכל מקום.
  truth: >-
    $\|\sigma_u\times\sigma_v\|=|f(v)|\sqrt{f'(v)^2+g'(v)^2}$. גם כשהפרופיל רגולרי, בנקודה שבה $f(v)=0$ המסילה פוגעת
    בציר, מעגל הסיבוב מתכווץ לנקודה ו-$\sigma_u=0$.
  remedy: { lesson: '3.1', label: 'משטח סיבוב: מתי הוא רגולרי' }
