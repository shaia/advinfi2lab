# Misconceptions first detected in lesson 8.6 (enrichment: closed and exact forms, the Poincaré lemma).
- id: MC-c8-closed-exact-swapped
  title: מחליפים בין תבנית סגורה לתבנית מדויקת
  belief: >-
    "סגורה" פירושו שהיא $d$ של משהו, ו"מדויקת" פירושו שהנגזרת החיצונית שלה אפס.
  truth: >-
    $\omega$ **סגורה** אם $d\omega=0$, ו**מדויקת** אם $\omega=d\eta$ לתבנית $\eta$ כלשהי. מדויקת גוררת סגורה (כי
    $d^2=0$); ההפך לא תמיד.
  remedy: { lesson: '8.6', label: 'תבנית סגורה ותבנית מדויקת' }

- id: MC-c8-closed-implies-exact
  title: חושבים שכל תבנית סגורה מדויקת בכל תחום
  belief: >-
    אם $d\omega=0$ אז $\omega=df$, ולכן האינטגרל של $\omega$ על כל מסילה סגורה הוא אפס.
  truth: >-
    זה נכון בתחום כוכבי (הלמה של פואנקרה), לא בכל תחום. תבנית הזווית במישור בלי הראשית סגורה, והאינטגרל שלה על
    מעגל היחידה הוא $2\pi\ne0$, ולכן אינה מדויקת שם.
  remedy: { lesson: '8.6', label: 'תבנית הזווית: סגורה ולא מדויקת' }

- id: MC-c8-dtheta-not-closed
  title: חושבים שתבנית הזווית אינה סגורה כי היא אינה מדויקת
  belief: >-
    $d\theta=\frac{x\,dy-y\,dx}{x^2+y^2}$ אינה מדויקת במישור בלי הראשית, ולכן הנגזרת החיצונית שלה שונה מאפס.
  truth: >-
    חישוב ישיר נותן $d\big(\frac{x\,dy-y\,dx}{x^2+y^2}\big)=0$ בכל נקודה שאינה הראשית. היא סגורה; מה שחסר הוא
    פונקציה גזירה $f$ על **כל** התחום עם $df=d\theta$. הזווית $\theta$ קיימת רק מקומית.
  remedy: { lesson: '8.6', label: 'תבנית הזווית: סגורה ולא מדויקת' }

- id: MC-c8-winding-always-2pi
  title: חושבים שהאינטגרל של תבנית הזווית על כל מסילה סגורה הוא שתיים פאי
  belief: >-
    $\oint_\gamma d\theta=2\pi$ לכל מסילה סגורה פשוטה במישור בלי הראשית.
  truth: >-
    $\oint_\gamma d\theta=2\pi$ כפול מספר הסיבובים של $\gamma$ סביב הראשית. מעגל שאינו מקיף את הראשית נמצא בחצי מישור,
    שהוא תחום כוכבי בלי הראשית, ושם $d\theta$ מדויקת והאינטגרל אפס.
  remedy: { lesson: '8.6', label: 'האינטגרל של תבנית הזווית ומספר הסיבובים' }

- id: MC-c8-hole-means-not-exact
  title: חושבים שתבנית הזווית אינה מדויקת בשום תחום שאינו מכיל את הראשית
  belief: >-
    כי $d\theta$ אינה מוגדרת בראשית, היא אינה מדויקת בשום תחום שהראשית לא בו.
  truth: >-
    מה שקובע הוא הצורה של התחום, לא רק החסרה של הראשית. במישור בלי הקרן $\{(x,0):x\le0\}$, שהוא תחום כוכבי ביחס
    ל-$(1,0)$, הזווית $\theta\in(-\pi,\pi)$ היא פונקציה גזירה ו-$d\theta$ מדויקת.
  remedy: { lesson: '8.6', label: 'הלמה של פואנקרה בתחום כוכבי' }
