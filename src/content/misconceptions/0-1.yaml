# Misconceptions first detected in lesson 0.1 (how the course is studied: parametrization, definition, test objects).
- id: MC-c0-curve-is-image
  title: מזהים מסילה עם התמונה שלה
  belief: >-
    מסילה היא קבוצת הנקודות שהיא מציירת. שתי מסילות עם אותה תמונה הן אותו דבר, ולכן גם המהירות, כיוון ההליכה ומספר
    הסיבובים הם תכונות של התמונה.
  truth: >-
    מסילה היא **פונקציה** $\gamma:I\to\mathbb R^n$. ל-$(\cos t,\sin t)$ ול-$(\cos 2t,\sin 2t)$ על $[0,2\pi]$ אותה
    תמונה, מעגל היחידה, אבל השנייה מקיפה אותו פעמיים ובמהירות $2$. גודל גאומטרי אמיתי לא תלוי בבחירת הפרמטריזציה,
    ואת זה צריך לבדוק, לא להניח.
  remedy: { lesson: '0.1', label: 'המעגל בשתי פרמטריזציות' }

- id: MC-c0-param-coefficient-scale
  title: מבלבלים בין מקדם שקובע קצב לבין מקדם שקובע גודל
  belief: >-
    ב-$(\cos 2t,\sin 2t)$ המספר $2$ הוא הרדיוס, כמו ב-$(2\cos t,2\sin t)$; בסליל $(2\cos t,2\sin t,3t)$ הגובה עולה ב-$3$
    בכל סיבוב.
  truth: >-
    מקדם **מחוץ** לקוסינוס ולסינוס משנה את הרדיוס; מקדם **בתוך** הארגומנט משנה רק את הקצב שבו עוברים על המעגל.
    $\cos^2 2t+\sin^2 2t=1$, ולכן התמונה היא מעגל היחידה. באותו אופן, ב-$z=3t$ המקדם $3$ הוא העלייה ליחידת פרמטר, וסיבוב
    שלם נמשך $2\pi$ יחידות פרמטר: העלייה בסיבוב היא $6\pi$.
  remedy: { lesson: '0.1', label: 'קריאת פרמטריזציה: רדיוס מול קצב' }

- id: MC-c0-missing-parameter-range
  title: שוכחים חלק מתחום הפרמטר כשמשרטטים את התמונה
  belief: >-
    כדי לשרטט את התמונה מספיק לבדוק פרמטרים חיוביים, או לבטל את הפרמטר בלי לשים לב לסימנים ולתחום.
  truth: >-
    התמונה תלויה בתחום הפרמטר כולו. $(t^2,t^3)$ עם $t\in\mathbb R$ נותנת את שני הענפים $y=\pm x^{3/2}$, ו-$\varphi\in[0,\frac\pi2]$
    בקואורדינטות כדוריות נותנת רק את חצי הספרה העליון.
  remedy: { lesson: '0.1', label: 'המסילה עם החוד והספרה בקואורדינטות כדוריות' }

- id: MC-c0-eliminate-parameter
  title: מסלקים את הפרמטר בלי לבדוק את המשוואה שמתקבלת
  belief: >-
    כדי למצוא את התמונה של $(t^2,t^3)$ מספיק "לנחש" עקום מוכר שעובר בראשית, כמו הפרבולה $y=x^2$.
  truth: >-
    מסלקים את הפרמטר בחישוב: $x=t^2$ ו-$y=t^3$ נותנים $y^2=t^6=x^3$. בודקים בנקודה אחת לפחות: $t=2$ נותן $(4,8)$, ו-$8^2=4^3$
    בעוד ש-$4^2\ne8$.
  remedy: { lesson: '0.1', label: 'המסילה עם החוד' }

- id: MC-c0-smooth-map-smooth-image
  title: חושבים שרכיבים גזירים מבטיחים תמונה בלי פינות
  belief: >-
    אם כל רכיבי $\gamma$ גזירים אינסוף פעמים, התמונה של $\gamma$ חלקה, בלי חודים ובלי פינות.
  truth: >-
    $\gamma(t)=(t^2,t^3)$ גזירה אינסוף פעמים, ובכל זאת לתמונה $y^2=x^3$ יש חוד בראשית. שם $\gamma'(0)=0$: המסילה
    נעצרת ומסתובבת. מה שמונע חודים הוא **רגולריות**, $\gamma'(t)\ne0$, ולא רק גזירות.
  remedy: { lesson: '0.1', label: 'המסילה עם החוד' }

- id: MC-c0-one-example-proves
  title: בודקים הגדרה על דוגמה נוחה אחת ומסיקים שהיא טובה
  belief: >-
    אם הגדרה מוצעת נותנת את התשובה הצפויה על מעגל היחידה בפרמטריזציה הרגילה, היא הגדרה טובה.
  truth: >-
    דוגמה שעובדת לא מוכיחה דבר; דוגמה נגדית אחת מפילה. בודקים על **כל** אובייקטי המבחן, ובמיוחד על פרמטריזציה אחרת
    של אותה תמונה: $\|\gamma''\|$ נותן $1$ על $(\cos t,\sin t)$ אבל $4$ על $(\cos 2t,\sin 2t)$.
  remedy: { lesson: '0.1', label: 'אובייקטי המבחן: איך בודקים הגדרה' }

- id: MC-c0-curved-means-no-lines
  title: חושבים שמשטח עקום לא מכיל ישרים
  belief: >-
    משטח שדרך כל נקודה שלו עובר ישר שלם המוכל בו חייב להיות חלק ממישור.
  truth: >-
    גם הגליל וגם האוכף $z=xy$ מכילים ישר דרך כל נקודה: דרך $(a,b,ab)$ על האוכף עובר הישר $(a+t,\ b,\ ab+bt)$. הם
    בכל זאת אינם מישורים.
  remedy: { lesson: '0.1', label: 'אובייקטי המבחן: הגליל והאוכף' }

- id: MC-c0-confidence-irrelevant
  title: חושבים שהסימון בטוחים או לא בטוחים לא משנה
  belief: >-
    רק הנכון או הלא נכון של התשובה חשוב; הסימון "בטוחים / לא בטוחים" הוא קישוט.
  truth: >-
    תשובה שגויה שסומנה "בטוחים" מגלה תפיסה שגויה, אמונה יציבה שתחזור במבחן. תשובה שגויה עם "לא בטוחים" מגלה פער
    ידע. הקורס מטפל בשתיהן אחרת: התפיסה השגויה מקבלת הפניה לשיעור שמפריך אותה.
  remedy: { lesson: '0.1', label: 'מסלול הלימוד העצמי: בטוחים ולא בטוחים' }

- id: MC-c0-jump-to-exam
  title: קופצים ישר לשאלות המבחן
  belief: >-
    הדרך היעילה ללמוד פרק היא לפתור מיד את שאלות המבחן שלו, ולדלג על שאלות ההבנה, החוברת ושאלות החזרה.
  truth: >-
    כל שלב במסלול קשה מקודמו ונשען עליו: שיעור, שאלות הבנה (בסיס, בינוני, מבחן), חוברת, שאלות חזרה, שאלות מבחן,
    מבחן פרק וסיכום. שאלת מבחן שנכשלים בה בלי השלבים הקודמים לא מראה איפה הפער.
  remedy: { lesson: '0.1', label: 'מסלול הלימוד העצמי' }

- id: MC-c0-skip-review
  title: מדלגים על פרק החזרה
  belief: >-
    פרק 0 הוא חזרה על חומר שכבר נלמד, ולכן אפשר לדלג עליו ולהתחיל ישר בפרק 1.
  truth: >-
    פרק 0 הוא אבחון. פותרים קודם את שאלות הבסיס שלו, ובכל מקום שנכשלים חוזרים לחומר המתאים מאינפי מתקדם 1 או
    מאלגברה לינארית לפני שממשיכים. כל פרק בקורס נשען על הכלים שלו.
  remedy: { lesson: '0.1', label: 'סדר מומלץ ללומד עצמאי' }
