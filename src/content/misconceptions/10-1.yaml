# Misconceptions first detected in lesson 10.1 (the trigonometric system and the partial sum as a projection).
- id: MC-c10-a0-not-halved
  title: לוקחים את המקדם a0 כאיבר החופשי של הטור במקום a0 חלקי 2
  belief: >-
    האיבר הקבוע של טור פורייה הוא $a_0$, כמו שאר המקדמים, ובשוויון פרסבל מופיע $a_0^2$.
  truth: >-
    כי $\|1\|^2=2\pi$ ואילו $\|\cos nx\|^2=\pi$, ההטלה על הקבועים היא $\frac{1}{2\pi}\int f=\frac{a_0}{2}$.
    לכן הטור מתחיל ב-$\frac{a_0}2$, ובבסל ובפרסבל מופיע $\frac{a_0^2}{2}$.
  remedy: { lesson: '10.1', label: 'הסכום החלקי כהטלה: למה דווקא חצי a0' }

- id: MC-c10-forget-1-over-pi
  title: שוכחים את הגורם אחד חלקי פאי במקדמי פורייה
  belief: >-
    $a_n=\int_{-\pi}^{\pi}f(x)\cos nx\,dx$, ובאותו אופן $\int f^2$ משווים ישירות לסכום ריבועי המקדמים.
  truth: >-
    $a_n=\frac1\pi\int_{-\pi}^{\pi}f(x)\cos nx\,dx$, ובבסל ובפרסבל האגף הימני הוא $\frac1\pi\int f^2$. הגורם
    $\frac1\pi$ בא מ-$\|\cos nx\|^2=\pi$.
  remedy: { lesson: '10.1', label: 'מקדמי פורייה: הנוסחה עם אחד חלקי פאי' }

- id: MC-c10-parity-swapped
  title: מחליפים את כלל הזוגיות במקדמי פורייה
  belief: >-
    לפונקציה אי-זוגית מתאפסים מקדמי הסינוס, ולפונקציה זוגית מתאפסים מקדמי הקוסינוס; או שמכפלה של שתי
    פונקציות אי-זוגיות היא אי-זוגית.
  truth: >-
    $f$ אי-זוגית $\Rightarrow$ $f\cos nx$ אי-זוגית, ולכן $a_n=0$ לכל $n$ ונשארים רק סינוסים. $f$ זוגית
    $\Rightarrow$ $b_n=0$. מכפלה של שתי פונקציות אי-זוגיות היא זוגית ($x\sin x$ זוגית).
  remedy: { lesson: '10.1', label: 'זוגיות ואי-זוגיות במקדמי פורייה' }

- id: MC-c10-parity-factor-two
  title: עוברים לחצי הקטע בגלל זוגיות ושוכחים את הגורם 2
  belief: >-
    לפונקציה זוגית $a_n=\frac1\pi\int_0^{\pi}f(x)\cos nx\,dx$.
  truth: >-
    כשהאינטגרנד זוגי, $\int_{-\pi}^{\pi}=2\int_0^{\pi}$, ולכן $a_n=\frac2\pi\int_0^{\pi}f(x)\cos nx\,dx$.
  remedy: { lesson: '10.1', label: 'זוגיות: האינטגרל על חצי הקטע' }

- id: MC-c10-cos-n-pi
  title: מציבים קוסינוס של n פאי כאילו הוא 1
  belief: >-
    $\cos n\pi=1$ לכל $n$, כמו $\sin n\pi=0$.
  truth: >-
    $\cos n\pi=(-1)^n$. מכאן הסימנים המתחלפים במקדמים, למשל $b_n=\frac{2(-1)^{n+1}}{n}$ עבור $f(x)=x$.
  remedy: { lesson: '10.1', label: 'חישוב מקדמי פורייה של x' }

- id: MC-c10-coefficients-change-with-N
  title: חושבים שהמקדמים משתנים כשמוסיפים איברים לסכום החלקי
  belief: >-
    כשעוברים מ-$S_4f$ ל-$S_5f$ צריך לחשב מחדש את כל המקדמים, וכך הקירוב משתפר.
  truth: >-
    במערכת אורתוגונלית ההטלה על תת-מרחב גדול יותר רק מוסיפה איברים: $S_5f=S_4f+a_5\cos 5x+b_5\sin 5x$, והמקדמים
    $a_n,b_n$ אינם תלויים ב-$N$. הקירוב משתפר כי $T_4\subset T_5$.
  remedy: { lesson: '10.1', label: 'הסכום החלקי כהטלה על תת-מרחבים מקוננים' }

- id: MC-c10-projection-not-identity
  title: חושבים שהסכום החלקי תמיד רק מקרב, גם כשהפונקציה עצמה פולינום טריגונומטרי
  belief: >-
    $S_Nf$ הוא קירוב של $f$ ושונה ממנה תמיד, וגם באי-שוויון בסל אין שוויון אף פעם עבור $N$ סופי.
  truth: >-
    $S_N$ היא הטלה, ולכן $S_Nf=f$ לכל $f\in T_N$. למשל $\sin^3x=\frac34\sin x-\frac14\sin 3x$, ולכן $S_Nf=f$ לכל
    $N\ge3$. בבסל יש שוויון עבור $N$ סופי בדיוק כש-$f$ (עד כדי פונקציה שמרחקה מאפס הוא אפס) שייכת ל-$T_N$.
  remedy: { lesson: '10.1', label: 'ההטלה משאירה את תת-המרחב במקומו' }
