# Misconceptions first detected in lesson 0.4 (the inverse and implicit function theorems, regular level sets).
- id: MC-c0-ift-global
  title: חושבים שמשפט הפונקציה ההפוכה נותן הפכית גלובלית
  belief: >-
    אם $\det DF\ne0$ בכל נקודה, $F$ חד-חד-ערכית ויש לה הפכית על כל התמונה.
  truth: >-
    המשפט **מקומי**: הוא נותן הפכית בסביבה של כל נקודה. $F(x,y)=(e^x\cos y,\ e^x\sin y)$ מקיימת $\det DF=e^{2x}>0$
    בכל מקום, ובכל זאת $F(0,0)=F(0,2\pi)$.
  remedy: { lesson: '0.4', label: 'משפט הפונקציה ההפוכה: מקומי בלבד' }

- id: MC-c0-ift-converse
  title: חושבים שהעתקה הפיכה חייבת יעקוביאן הפיך
  belief: >-
    אם $F$ חד-חד-ערכית ועל, עם הפכית, אז $DF$ הפיכה בכל נקודה.
  truth: >-
    $f(x)=x^3$ הפיכה על $\mathbb R$, אבל $f'(0)=0$. המשפט נותן תנאי **מספיק**. מה שכן נכון: אם גם ההפכית גזירה
    בנקודה המתאימה, אז $DF$ הפיכה שם (לפי כלל השרשרת).
  remedy: { lesson: '0.4', label: 'משפט הפונקציה ההפוכה: תנאי מספיק' }

- id: MC-c0-ift-smooth-enough
  title: חושבים שחלקות של ההעתקה מספיקה להפכית מקומית
  belief: >-
    אם $F$ חלקה בסביבה של $p$, משפט הפונקציה ההפוכה נותן לה הפכית מקומית ליד $p$.
  truth: >-
    חלקות היא רק ההנחה הכללית; התנאי של המשפט הוא ש-$DF(p)$ **הפיכה**. ההעתקה הקוטבית חלקה בכל מקום, אבל ב-$r=0$
    היא שולחת את כל הישר $\{(0,\theta)\}$ לראשית ואינה הפיכה באף סביבה.
  remedy: { lesson: '0.4', label: 'משפט הפונקציה ההפוכה: התנאי על היעקוביאן' }

- id: MC-c0-implicit-any-variable
  title: חושבים שגרדיאנט שונה מאפס מאפשר לחלץ כל משתנה שרוצים
  belief: >-
    אם $\nabla F(p)\ne0$, אז ליד $p$ אפשר לכתוב את $\{F=0\}$ כגרף $z=g(x,y)$.
  truth: >-
    כדי לחלץ את $z$ צריך $\frac{\partial F}{\partial z}(p)\ne0$. גרדיאנט שונה מאפס מבטיח שאפשר לחלץ **משתנה כלשהו**, את זה
    שהנגזרת החלקית לפיו לא מתאפסת. על הספרה בנקודה $(1,0,0)$ אפשר לחלץ את $x$, אבל לא את $z$.
  remedy: { lesson: '0.4', label: 'משפט הפונקציה הסתומה: איזה משתנה מחלצים' }

- id: MC-c0-implicit-global
  title: חושבים שהפונקציה הסתומה מתארת את כל קבוצת הרמה
  belief: >-
    משפט הפונקציה הסתומה אומר שכל הקבוצה $\{F=0\}$ היא גרף של פונקציה אחת.
  truth: >-
    המשפט מקומי: ליד $p$ הקבוצה היא גרף. הספרה אינה גרף של פונקציה אחת $z=g(x,y)$, אבל ליד כל נקודה שבה $z\ne0$ היא
    גרף כזה (של $\sqrt{1-x^2-y^2}$ או של $-\sqrt{1-x^2-y^2}$).
  remedy: { lesson: '0.4', label: 'הספרה כגרף מקומי' }

- id: MC-c0-implicit-converse
  title: חושבים שכשתנאי משפט הפונקציה הסתומה נכשל, גם המסקנה נכשלת
  belief: >-
    אם $c$ אינו ערך רגולרי של $F$, הקבוצה $\{F=c\}$ אינה מקומית גרף; אם $\frac{\partial F}{\partial z}(p)=0$, הקבוצה אינה
    גרף מעל המישור $xy$ ליד $p$.
  truth: >-
    התנאי מספיק ואינו הכרחי. $F=z^2$: $\nabla F=(0,0,2z)$ מתאפס על כל $\{F=0\}$, והקבוצה היא המישור $z=0$, גרף של
    $g\equiv0$ ליד כל נקודה. כשהתנאי נכשל צריך לבדוק ישירות, או לתאר את הקבוצה בפונקציה אחרת.
  remedy: { lesson: '0.4', label: 'ערך רגולרי: תנאי מספיק' }

- id: MC-c0-regular-value-local
  title: מגדירים ערך רגולרי לפי נקודה אחת או לפי כל המרחב
  belief: >-
    $c$ ערך רגולרי של $F$ אם $\nabla F\ne0$ בנקודה אחת של $\{F=c\}$, או אם $\nabla F\ne0$ בכל $\mathbb R^n$.
  truth: >-
    $c$ ערך רגולרי אם $DF(p)$ על (ל-$F:\mathbb R^n\to\mathbb R$: $\nabla F(p)\ne0$) **בכל** נקודה $p$ שבה $F(p)=c$, ורק
    בהן. ל-$x^2+y^2+z^2$ הגרדיאנט מתאפס בראשית, ובכל זאת $1$ ערך רגולרי, כי הראשית לא על הספרה.
  remedy: { lesson: '0.4', label: 'ערך רגולרי' }

- id: MC-c0-tangent-is-gradient-span
  title: מבלבלים בין המרחב המשיק לבין הישר של הנורמל
  belief: >-
    המרחב המשיק לקבוצת רמה ב-$p$ הוא הישר שפורש $\nabla F(p)$.
  truth: >-
    $\nabla F(p)$ **ניצב** למרחב המשיק. המרחב המשיק הוא $\ker DF(p)=\{v:\nabla F(p)\cdot v=0\}$, המשלים האורתוגונלי של
    הגרדיאנט.
  remedy: { lesson: '0.4', label: 'המרחב המשיק כגרעין של הדיפרנציאל' }

- id: MC-c0-tangent-space-through-point
  title: מבלבלים בין המרחב המשיק לבין המישור המשיק שעובר בנקודה
  belief: >-
    המרחב המשיק לספרה ב-$(0,0,1)$ הוא המישור $z=1$.
  truth: >-
    המרחב המשיק $\ker DF(p)$ הוא **תת-מרחב לינארי** ועובר בראשית: כאן $\{z=0\}$. המישור $z=1$ הוא ההזזה שלו לנקודה,
    $p+\ker DF(p)$.
  remedy: { lesson: '0.4', label: 'המרחב המשיק כגרעין' }

- id: MC-c0-kernel-one-row
  title: מחשבים גרעין לפי שורה אחת של מטריצת יעקובי
  belief: >-
    למצוא את המרחב המשיק ל-$\{F_1=0,\ F_2=0\}$ מספיק לדרוש $\nabla F_1\cdot v=0$.
  truth: >-
    $\ker DF(p)$ דורש את **כל** השורות: $\nabla F_1(p)\cdot v=0$ וגם $\nabla F_2(p)\cdot v=0$. כל משוואה מורידה ממד אחד.
  remedy: { lesson: '0.4', label: 'המרחב המשיק לחיתוך של שתי קבוצות רמה' }

- id: MC-c0-level-set-dimension
  title: מחשבים את הממד של קבוצת רמה כמספר המשוואות
  belief: >-
    לקבוצת רמה רגולרית של $F:\mathbb R^n\to\mathbb R^k$ יש ממד $k$.
  truth: >-
    הממד הוא $n-k$: לפי משפט המימד $\dim\ker DF(p)=n-\operatorname{rank}DF(p)=n-k$. ספרה ב-$\mathbb R^3$ היא קבוצת רמה של
    פונקציה אחת ($k=1$), והממד שלה $2$.
  remedy: { lesson: '0.4', label: 'ממד של קבוצת רמה רגולרית' }

- id: MC-c0-graph-normal-sign
  title: טועים בסימן של הנורמל לגרף
  belief: >-
    הנורמל לגרף $z=h(x,y)$ הוא $(h_x,\ h_y,\ 1)$.
  truth: >-
    כותבים את הגרף כקבוצת רמה $F=h(x,y)-z=0$; אז $\nabla F=(h_x,\ h_y,\ -1)$, ובכיוון ההפוך $(-h_x,\ -h_y,\ 1)$. הרכיב
    האחרון הפוך בסימן לשני הראשונים.
  remedy: { lesson: '0.4', label: 'גרף כקבוצת רמה' }

- id: MC-c0-jacobian-entry-mixup
  title: קוראים איבר לא נכון של מטריצת יעקובי
  belief: >-
    באיבר של מטריצת יעקובי אפשר להחליף בין המשתנים: $\frac{\partial}{\partial x}(xy)=x$, או שהאיבר בשורה $i$ ובעמודה $j$ הוא
    הנגזרת לפי המשתנה $i$.
  truth: >-
    האיבר בשורה $i$ ובעמודה $j$ של $DF$ הוא $\frac{\partial F_i}{\partial x_j}$: השורה היא הרכיב, העמודה היא המשתנה. ל-$xy$:
    $\frac{\partial}{\partial x}(xy)=y$ ו-$\frac{\partial}{\partial y}(xy)=x$. בהפכית $G=F^{-1}$, $G=(x(u,v),y(u,v))$, האיבר
    $\frac{\partial x}{\partial u}$ הוא השמאלי העליון ו-$\frac{\partial x}{\partial v}$ הימני העליון.
  remedy: { lesson: '0.3', label: 'מטריצת יעקובי' }
