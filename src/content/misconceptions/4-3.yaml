# Misconceptions first detected in lesson 4.3 (geodesics).
- id: MC-c4-geodesic-straight
  title: חושבים שגאודזית היא מסילה בלי תאוצה, כלומר ישר
  belief: >-
    גאודזית היא מסילה עם $\gamma''=0$, ולכן על משטח עקום אין גאודזיות פרט לישרים שבו.
  truth: >-
    גאודזית היא מסילה עם $\kappa_g\equiv0$: התאוצה (בפרמטר אורך קשת) לא חייבת להתאפס, היא רק **ניצבת למשטח**. המעגל
    הגדול על הספרה הוא גאודזית עם $\kappa=1$. ישר שמוכל במשטח הוא אכן גאודזית, אבל רק מקרה פרטי.
  remedy: { lesson: '4.3', label: 'הגדרת הגאודזית: התאוצה ניצבת למשטח' }

- id: MC-c4-geodesic-kn-zero
  title: מבלבלים בין גאודזית לבין מסילה עם עקמומיות נורמלית אפס
  belief: >-
    במסילה גאודזית העקמומיות הנורמלית מתאפסת, כי "היא לא מתעקמת ביחס למשטח".
  truth: >-
    בגאודזית מתאפס הרכיב **הגאודזי**, ולכן $\kappa=|\kappa_n|$: כל העקמומיות שלה באה מהמשטח. על ספרת היחידה כל מעגל
    גדול הוא גאודזית עם $|\kappa_n|=1$. מסילה עם $\kappa_n\equiv0$ היא דבר אחר.
  remedy: { lesson: '4.3', label: 'גאודזית: κ_g ≡ 0, לא κₙ ≡ 0' }

- id: MC-c4-geodesic-any-speed
  title: חושבים שבכל פרמטריזציה של גאודזית התאוצה ניצבת למשטח
  belief: >-
    אם העקבה של מסילה היא מעגל גדול, אז $\gamma''$ ניצב לספרה בכל פרמטריזציה שלה.
  truth: >-
    $\gamma''=\frac{d}{dt}\|\gamma'\|\,\mathbf t+\|\gamma'\|^2\kappa\mathbf n$. אם המהירות לא קבועה יש רכיב משיק. התנאי
    $\kappa_g\equiv0$ תלוי רק בעקבה; "התאוצה ניצבת למשטח" נכון רק במהירות קבועה. ב-$(\cos t^2,\sin t^2,0)$ ב-$t=1$
    הרכיב המשיק של התאוצה הוא 2.
  remedy: { lesson: '4.3', label: 'גאודזית ופרמטריזציה במהירות קבועה' }

- id: MC-c4-plane-section-geodesic
  title: חושבים שכל חתך מישורי של משטח, כמו כל מעגל על הספרה, הוא גאודזית
  belief: >-
    מקבילי הרוחב על הספרה הם גאודזיות, כמו קו המשווה, כי הם "מעגלים על הספרה"; ובאופן כללי חיתוך של משטח עם מישור
    הוא גאודזית.
  truth: >-
    במקביל הרוחב $v=v_0$ על ספרת היחידה $|\kappa_g|=\tan|v_0|$, וזה אפס רק בקו המשווה. הגאודזיות על הספרה הן בדיוק
    המעגלים הגדולים: מעגלים שמרכזם במרכז הספרה. גם האליפסה $(\cos t,\sin t,\cos t)$ על הגליל $x^2+y^2=1$ היא חתך
    מישורי עם $|\kappa_g|=1$ ב-$t=0$. חתך מישורי הוא גאודזית כשהמישור מכיל את הנורמל בכל נקודה של החתך.
  remedy: { lesson: '4.3', label: 'גאודזיות על הספרה: רק מעגלים גדולים' }

- id: MC-c4-geodesic-shortest
  title: חושבים שכל קשת גאודזית היא הדרך הקצרה ביותר
  belief: >-
    אם קשת גאודזית מחברת את $P$ ל-$Q$, אין מסילה קצרה ממנה על המשטח בין שתי הנקודות.
  truth: >-
    גאודזית היא תנאי מקומי, $\kappa_g\equiv0$. הקשת הארוכה של מעגל גדול בין שתי נקודות היא גאודזית, והקצרה קצרה ממנה.
    על הגליל הסליל שמסתובב פעמיים ארוך מזה שמסתובב פעם אחת, ושניהם גאודזיות.
  remedy: { lesson: '4.3', label: 'גאודזיות ומסילות קצרות ביותר' }

- id: MC-c4-geodesic-unique
  title: חושבים שבין שתי נקודות עוברת גאודזית אחת בלבד, כמו ישר במישור
  belief: >-
    דרך שתי נקודות שונות של משטח עוברת בדיוק גאודזית אחת, כמו שדרך שתי נקודות במישור עובר ישר אחד.
  truth: >-
    זה נכון במישור, ועל הספרה רק לנקודות שאינן אנטיפודליות. דרך הקטבים של הספרה עוברים אינסוף מעגלים גדולים, ודרך
    $(1,0,0)$ ו-$(1,0,1)$ על הגליל $x^2+y^2=1$ עוברים הישר וכל הסלילים
    $(\cos t,\sin t,\frac{t}{2\pi k})$, $k\in\mathbb Z\setminus\{0\}$.
  remedy: { lesson: '4.3', label: 'כמה גאודזיות עוברות דרך שתי נקודות' }

- id: MC-c4-always-infinite-geodesics
  title: חושבים שעל משטח עקום דרך כל שתי נקודות עוברות אינסוף גאודזיות
  belief: >-
    על הגליל יש אינסוף סלילים ועל הספרה אינסוף מעגלים גדולים, ולכן דרך כל שתי נקודות שונות עוברות אינסוף גאודזיות.
  truth: >-
    הסליל $(\cos t,\sin t,ct)$ עם $c\neq0$ לא חוזר לאותו גובה. לכן דרך שתי נקודות **באותו גובה** של הגליל (בזוויות
    שונות) עוברת רק הגאודזית האופקית, המעגל. על הספרה, דרך שתי נקודות שאינן אנטיפודליות עובר מעגל גדול אחד בלבד: המישור
    דרך המרכז ושתי הנקודות יחיד.
  remedy: { lesson: '4.3', label: 'גאודזיות על הגליל: נקודות באותו גובה' }

- id: MC-c4-geodesic-exists
  title: חושבים שבין כל שתי נקודות במשטח עוברת גאודזית
  belief: >-
    על כל משטח, כל שתי נקודות מחוברות בגאודזית אחת לפחות.
  truth: >-
    במישור בלי הראשית, הגאודזיות הן קטעי ישרים, והישר היחיד דרך $(-1,0)$ ו-$(1,0)$ עובר בראשית החסרה. אין ביניהן
    אף גאודזית. קיום גאודזית בין כל שתי נקודות דורש תנאים גלובליים על המשטח.
  remedy: { lesson: '4.3', label: 'גאודזיות בין שתי נקודות: קיום' }

- id: MC-c4-geodesic-must-bend
  title: חושבים שגאודזית חייבת להתעקם יחד עם המשטח
  belief: >-
    גאודזית היא מסילה שהמשטח מכופף, ולכן במשטח שטוח, כמו המישור, אין גאודזיות.
  truth: >-
    גאודזית מוגדרת רק על ידי $\kappa_g\equiv0$. ישר שמוכל במשטח מקיים $\gamma''=0$, ולכן $\kappa_g=\kappa_n=0$: הוא
    גאודזית. במישור הגאודזיות הן בדיוק הישרים.
  remedy: { lesson: '4.3', label: 'גאודזיות במישור: הישרים' }
