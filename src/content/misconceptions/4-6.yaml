# Misconceptions first detected in lesson 4.6 (the Gauss map and minimal surfaces).
- id: MC-c4-gauss-map-target
  title: חושבים שהעתקת גאוס שולחת נקודה למישור המשיק או לווקטור לא מנורמל
  belief: >-
    העתקת גאוס שולחת את $p$ ל-$\sigma_u\times\sigma_v$, או למישור המשיק $T_pM$.
  truth: >-
    העתקת גאוס שולחת את $p$ לנורמל היחידה $\hat{\mathbf N}(p)$, כנקודה על ספרת היחידה $S^2$. הווקטור
    $\sigma_u\times\sigma_v$ תלוי בפרמטריזציה (באורכו), והנקודה על $S^2$ תלויה רק במשטח ובבחירת הכיוון.
  remedy: { lesson: '4.6', label: 'העתקת גאוס: מהמשטח לספרת היחידה' }

- id: MC-c4-dN-equals-S
  title: טועים בסימן בקשר בין הדיפרנציאל של הנורמל לאופרטור הצורה
  belief: >-
    הדיפרנציאל של העתקת גאוס הוא אופרטור הצורה עצמו: $d\hat{\mathbf N}=S$.
  truth: >-
    $d\hat{\mathbf N}=-S$. גוזרים את $\sigma_u\cdot\hat{\mathbf N}=0$ ומקבלים $L=\sigma_{uu}\cdot\hat{\mathbf N}=-\sigma_u\cdot\hat{\mathbf N}_u$:
    הסימן מינוס נולד כאן. בספרה ברדיוס $R$ עם הנורמל החוצה $d\hat{\mathbf N}=\frac1R\,\mathrm{id}$ ו-$\kappa_1=\kappa_2=-\frac1R$.
  remedy: { lesson: '4.6', label: 'משוואות ויינגרטן: dN̂ = −S' }

- id: MC-c4-dN-normal-part
  title: חושבים שלנגזרת של הנורמל יש רכיב בכיוון הנורמל
  belief: >-
    $\hat{\mathbf N}_u$ הוא וקטור כלשהו במרחב, ולכן הדיפרנציאל של העתקת גאוס לא שולח את המישור המשיק לעצמו.
  truth: >-
    גוזרים את $\hat{\mathbf N}\cdot\hat{\mathbf N}=1$ ומקבלים $\hat{\mathbf N}_u\cdot\hat{\mathbf N}=0$: הנגזרת ניצבת
    לנורמל, ולכן משיקה למשטח. כך $d\hat{\mathbf N}_p$ היא העתקה לינארית מ-$T_pM$ לעצמו (המישור המשיק לספרה
    ב-$\hat{\mathbf N}(p)$ מקביל ל-$T_pM$).
  remedy: { lesson: '4.6', label: 'למה dN̂ משיק למשטח' }

- id: MC-c4-area-ratio-signed
  title: חושבים שיחס השטחים של העתקת גאוס יכול להיות שלילי
  belief: >-
    יחס השטח של תמונת העתקת גאוס לשטח במשטח הוא $K$, ולכן בנקודה היפרבולית השטח שלילי.
  truth: >-
    שטח הוא אי-שלילי: היחס הוא $|K|$. הסימן של $K$ אומר אם העתקת גאוס **שומרת על הכיוון** ($K>0$) או הופכת אותו
    ($K<0$), כי $\hat{\mathbf N}_u\times\hat{\mathbf N}_v=K\,\sigma_u\times\sigma_v$.
  remedy: { lesson: '4.6', label: 'K כיחס שטחים עם סימן של כיוון' }

- id: MC-c4-minimal-flat
  title: חושבים שמשטח מינימלי הוא משטח עם עקמומיות גאוס אפס
  belief: >-
    משטח מינימלי הוא משטח "שטוח", כלומר $K\equiv0$, כמו המישור והגליל.
  truth: >-
    משטח מינימלי הוא משטח עם $H\equiv0$: $\kappa_2=-\kappa_1$. הקטנואיד מינימלי ו-$K=-\frac1{\cosh^4v}<0$; הגליל עם
    $K\equiv0$ אינו מינימלי, כי $H=\pm\frac1{2r}$.
  remedy: { lesson: '4.6', label: 'משטח מינימלי: H ≡ 0' }

- id: MC-c4-minimal-pointwise
  title: מסיקים שמשטח מינימלי מכך שעקמומיותו הממוצעת אפס בנקודה אחת
  belief: >-
    באוכף $z=xy$ בראשית $H=0$, ולכן האוכף משטח מינימלי.
  truth: >-
    מינימלי פירושו $H=0$ **בכל נקודה**. באוכף $z=xy$ בנקודה $(1,1,1)$, עם הנורמל כלפי מעלה,
    $H=-\frac{1}{3\sqrt3}\neq0$. בראשית הוא רק נראה מינימלי.
  remedy: { lesson: '4.6', label: 'משטח מינימלי: בכל נקודה' }

- id: MC-c4-minimal-no-umbilic
  title: חושבים שבמשטח מינימלי אין נקודה טבורית
  belief: >-
    במשטח מינימלי $\kappa_2=-\kappa_1$, ולכן $\kappa_1\neq\kappa_2$ ואין נקודות טבוריות.
  truth: >-
    $\kappa_1=\kappa_2$ ו-$\kappa_1+\kappa_2=0$ קורים יחד בדיוק כש-$\kappa_1=\kappa_2=0$. לכן נקודה טבורית של משטח
    מינימלי היא נקודה **מישורית**, ויכולות להיות כאלה: במישור, שהוא מינימלי, כל נקודה טבורית.
  remedy: { lesson: '4.6', label: 'נקודות טבוריות של משטח מינימלי' }

- id: MC-c4-minimal-elliptic
  title: חושבים שבמשטח מינימלי יכולה להיות נקודה אליפטית
  belief: >-
    $H=0$ הוא תנאי על הסכום, ו-$K$ הוא מכפלה, ולכן $H=0$ לא אומר דבר על הסימן של $K$.
  truth: >-
    אם $\kappa_1+\kappa_2=0$ אז $K=\kappa_1\kappa_2=-\kappa_1^2\le0$. במשטח מינימלי אין נקודה אליפטית: כל נקודה
    היפרבולית או מישורית.
  remedy: { lesson: '4.6', label: 'אין נקודה אליפטית במשטח מינימלי' }
