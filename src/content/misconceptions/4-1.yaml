# Misconceptions first detected in lesson 4.1 (the second fundamental form).
- id: MC-c4-Q1-Q2-mixup
  title: מבלבלים בין מקדמי התבנית הראשונה למקדמי התבנית השנייה
  belief: >-
    $L$ הוא $\sigma_u\cdot\sigma_u$, או גודל הנגזרת השנייה $\|\sigma_{uu}\|$: עוד דרך למדוד אורך על המשטח.
  truth: >-
    התבנית הראשונה בנויה מהנגזרות הראשונות: $E=\sigma_u\cdot\sigma_u$. התבנית השנייה בנויה מהנגזרות השניות
    **בכיוון הנורמל**: $L=\sigma_{uu}\cdot\hat{\mathbf N}$, $M=\sigma_{uv}\cdot\hat{\mathbf N}$,
    $N=\sigma_{vv}\cdot\hat{\mathbf N}$. רק הרכיב הנורמלי של $\sigma_{uu}$ נכנס, והוא יכול להיות שלילי.
  remedy: { lesson: '4.1', label: 'התבנית השנייה: הנגזרות השניות מוטלות על הנורמל' }

- id: MC-c4-coefficient-N-vs-normal
  title: מבלבלים בין המקדם N של התבנית השנייה לבין וקטור הנורמל
  belief: >-
    $N$ בנוסחה $Q_2=L\,du^2+2M\,du\,dv+N\,dv^2$ הוא וקטור הנורמל, או אורכו, ולכן הוא תמיד 1.
  truth: >-
    שני דברים שונים חולקים אות. המקדם $N=\sigma_{vv}\cdot\hat{\mathbf N}$ הוא **מספר** (יכול להיות שלילי או אפס), והנורמל
    היחידה $\hat{\mathbf N}$ הוא **וקטור** באורך 1. בקורס הנורמל נכתב תמיד עם כובע.
  remedy: { lesson: '4.1', label: 'התבנית השנייה: המקדם N והנורמל עם הכובע' }

- id: MC-c4-taylor-coefficient
  title: לוקחים את מקדם הפולינום במקום הנגזרת השנייה
  belief: >-
    לגרף $z=f(x,y)$ בראשית, עם $f=ax^2+bxy+cy^2$, המקדמים הם $L=a$, $M=\frac b2$, $N=c$.
  truth: >-
    $L=f_{xx}(0,0)=2a$, $M=f_{xy}(0,0)=b$, $N=f_{yy}(0,0)=2c$ (כשהמישור המשיק אופקי והנורמל $(0,0,1)$). המקדמים של
    הפולינום הם **חצי** מהנגזרות השניות באלכסון: זה החצי שבקירוב $\frac12Q_2$.
  remedy: { lesson: '4.1', label: 'הדוגמה z = ½(ax² + by²)' }

- id: MC-c4-2M-vs-M
  title: מבלבלים בין M לבין המקדם של du dv בתבנית השנייה
  belief: >-
    המקדם של $du\,dv$ בתבנית השנייה הוא $M$, ולכן $Q_2(h,k)=Lh^2+Mhk+Nk^2$.
  truth: >-
    $Q_2(h,k)=Lh^2+2Mhk+Nk^2$: המקדם של $hk$ הוא $2M$, כי $\sigma_{uv}$ ו-$\sigma_{vu}$ שניהם מופיעים בפיתוח
    טיילור. במטריצה $\begin{pmatrix}L&M\\M&N\end{pmatrix}$ מופיע $M$ פעמיים.
  remedy: { lesson: '4.1', label: 'התבנית השנייה כמטריצה סימטרית' }

- id: MC-c4-distance-no-half
  title: שוכחים את החצי בקירוב המרחק מהמישור המשיק
  belief: >-
    המרחק החתום מהמישור המשיק של הנקודה $\sigma(u_0+h,v_0+k)$ הוא בקירוב $Q_2(h,k)$.
  truth: >-
    לפי טיילור מסדר שני, המרחק החתום הוא $\frac12Q_2(h,k)+o(h^2+k^2)$. החצי בא מהמקדם $\frac12$ של האיבר הריבועי
    בפיתוח, בדיוק כמו ב-$f(x)\approx f(0)+f'(0)x+\frac12f''(0)x^2$.
  remedy: { lesson: '4.1', label: 'משמעות התבנית השנייה: המרחק מהמישור המשיק' }

- id: MC-c4-diagonal-only
  title: חושבים שאם L ו-N מתאפסים אז התבנית השנייה כולה מתאפסת
  belief: >-
    אם $L=N=0$ בנקודה, המשטח צמוד למישור המשיק עד סדר שני, כי "האלכסון" של $Q_2$ אפס.
  truth: >-
    $Q_2(h,k)=Lh^2+2Mhk+Nk^2$, ועם $L=N=0$ נשאר $2Mhk$, שמקבל את שני הסימנים כש-$M\neq0$. באוכף $z=xy$ בראשית $L=N=0$,
    $M=1$, והמשטח חוצה את המישור המשיק: מעליו לאורך $h=k$ ומתחתיו לאורך $h=-k$.
  remedy: { lesson: '4.1', label: 'האוכף z = xy והמקדם M' }

- id: MC-c4-first-order-distance
  title: חושבים שהאיבר מסדר ראשון קובע את המרחק מהמישור המשיק
  belief: >-
    המרחק מהמישור המשיק הוא בקירוב $(h\sigma_u+k\sigma_v)\cdot\hat{\mathbf N}$, ולכן הוא מסדר ראשון ב-$h,k$.
  truth: >-
    $\sigma_u$ ו-$\sigma_v$ שוכבים במישור המשיק, ולכן $(h\sigma_u+k\sigma_v)\cdot\hat{\mathbf N}=0$. האיבר הראשון שלא
    מתאפס הוא הריבועי, $\frac12Q_2(h,k)$: זו כל הסיבה שהתבנית השנייה קיימת.
  remedy: { lesson: '4.1', label: 'משמעות התבנית השנייה: למה האיבר הלינארי נעלם' }

- id: MC-c4-Q2-orientation-free
  title: חושבים שהתבנית השנייה לא תלויה בבחירת כיוון הנורמל
  belief: >-
    $L$, $M$, $N$ (ולכן גם העקמומיות הנורמלית, העקמומיויות הראשיות והעקמומיות הממוצעת) הם תכונות של המשטח בלבד, ולא
    משנה לאיזה צד בוחרים את הנורמל.
  truth: >-
    כל המקדמים הם מכפלות ב-$\hat{\mathbf N}$, ולכן כשהופכים את $\hat{\mathbf N}$ ל-$-\hat{\mathbf N}$ הם מחליפים
    סימן: $Q_2\mapsto -Q_2$, וכך גם $\kappa_n$, $\kappa_1,\kappa_2$ ו-$H$. רק מה שתלוי במכפלה של שניים מהם, כמו
    $K$, לא משתנה.
  remedy: { lesson: '4.1', label: 'מה קורה לתבנית השנייה כשהופכים את הנורמל' }

- id: MC-c4-reparam-keeps-normal
  title: חושבים שהחלפת סדר הפרמטרים לא משנה את הנורמל
  belief: >-
    $\tilde\sigma(u,v)=\sigma(v,u)$ היא אותו משטח, ולכן הנורמל ומקדמי התבנית השנייה הם אותם מספרים, רק בשמות אחרים.
  truth: >-
    $\tilde\sigma_u\times\tilde\sigma_v=\sigma_v\times\sigma_u=-\sigma_u\times\sigma_v$: הנורמל מתהפך. לכן
    $\tilde L=-N$, $\tilde M=-M$, $\tilde N=-L$. החלפת פרמטרים עם יעקוביאן שלילי הופכת את הכיוון.
  remedy: { lesson: '4.1', label: 'התבנית השנייה והחלפת פרמטרים' }

- id: MC-c4-side-depends-on-normal
  title: חושבים שהצד שבו המשטח נמצא ביחס למישור המשיק תלוי בבחירת הנורמל
  belief: >-
    אם הופכים את הנורמל, משטח שהיה כולו בצד אחד של המישור המשיק עלול לעבור לחצות אותו.
  truth: >-
    היפוך הנורמל הופך את $Q_2$ ל-$-Q_2$: תבנית מוגדרת חיובית נעשית מוגדרת שלילית, ותבנית שמקבלת ערכים חיוביים
    ושליליים ממשיכה לקבל את שניהם. השאלה **אם** המשטח בצד אחד לא משתנה; רק השם של הצד ("הצד של הנורמל") מתחלף.
  remedy: { lesson: '4.1', label: 'משמעות התבנית השנייה: צד אחד או שני צדדים' }

- id: MC-c4-graph-unnormalized
  title: חושבים שבגרף מקדמי התבנית השנייה הם הנגזרות השניות בכל נקודה
  belief: >-
    לגרף $z=f(x,y)$ בכל נקודה $L=f_{xx}$, $M=f_{xy}$, $N=f_{yy}$, כמו בנקודה שבה המישור המשיק אופקי.
  truth: >-
    $\sigma_{xx}=(0,0,f_{xx})$, אבל הנורמל הוא $\hat{\mathbf N}=\frac{(-f_x,-f_y,1)}{\sqrt{1+f_x^2+f_y^2}}$, ולכן
    $L=\frac{f_{xx}}{\sqrt{1+f_x^2+f_y^2}}$, וכך גם $M$ ו-$N$. רק כש-$\nabla f=0$ המכנה הוא 1.
  remedy: { lesson: '4.1', label: 'התבנית השנייה של גרף' }

- id: MC-c4-definite-crosses
  title: חושבים שמשטח שבו התבנית השנייה מוגדרת חיובית יכול לחצות את המישור המשיק
  belief: >-
    גם כש-$Q_2$ מוגדרת חיובית בנקודה $P$, השארית $o(h^2+k^2)$ בקירוב המרחק יכולה להיות שלילית ולהעביר נקודות קרובות
    לצד השני של המישור המשיק.
  truth: >-
    תבנית מוגדרת חיובית מקיימת $Q_2(h,k)\ge c(h^2+k^2)$ עם $c>0$ קבוע, והשארית קטנה מ-$\frac c2(h^2+k^2)$ קרוב מספיק
    ל-$P$. לכן המרחק החתום חיובי בסביבה מנוקבת של $P$. חציה דורשת תבנית שמקבלת ערכים חיוביים ושליליים.
  remedy: { lesson: '4.1', label: 'משמעות התבנית השנייה: צד אחד או שני צדדים' }
