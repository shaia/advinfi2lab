# Misconceptions first detected in lesson 2.4 (the existence and uniqueness theorem).
- id: MC-c2-kappa-alone-determines
  title: חושבים שהעקמומיות לבדה קובעת מסילה במרחב
  belief: >-
    כמו במישור (שיעור 1.6), שתי מסילות במרחב עם אותה עקמומיות $\kappa(s)$ שוות עד כדי תנועה קשיחה.
  truth: >-
    במישור העקמומיות המסומנת קובעת את המסילה; במרחב צריך גם את הפיתול. המעגל ברדיוס 2 והסליל $(\cos t,\sin t,t)$
    מקיימים שניהם $\kappa\equiv\frac12$, והם אינם שווים עד כדי תנועה קשיחה: לראשון $\tau\equiv0$ ולשני $\tau\equiv\frac12$.
  remedy: { lesson: '2.4', anchor: 'plane-vs-space', label: 'משפט הקיום והיחידות: מישור מול מרחב' }

- id: MC-c2-mirror-is-rigid
  title: סופרים שיקוף כתנועה קשיחה במשפט היחידות
  belief: >-
    במשפט היחידות "תנועה קשיחה" כוללת גם שיקוף, ולכן מסילה ותמונת המראה שלה תמיד מקיימות את אותן $\kappa$ ו-$\tau$.
  truth: >-
    התנועה במשפט היא $x\mapsto Ax+c$ עם $A$ אורתוגונלית ו-$\det A=1$ (סיבוב והזזה). שיקוף שומר את $\kappa$ והופך את
    $\tau$: הסליל הימני והשמאלי הם תמונות מראה זה של זה, ואין סיבוב שמעביר אחד לשני.
  remedy: { lesson: '2.4', anchor: 'mirror', label: 'שיקוף הופך את הפיתול' }

- id: MC-c2-any-parameter
  title: חושבים שהעקמומיות והפיתול בפרמטר כלשהו קובעים את המסילה
  belief: >-
    אם $\kappa(t)$ ו-$\tau(t)$ נתונות כפונקציות של פרמטר כלשהו $t$, המשפט קובע את המסילה עד כדי תנועה קשיחה.
  truth: >-
    המשפט מניח שהפרמטר הוא אורך הקשת. בפרמטר כללי המהירות לא ידועה: $\kappa(t)=t$ על $[1,2]$ במהירות 1 נותנת
    $\kappa(s)=1+s$ על $[0,1]$, ובמהירות 2 נותנת $\kappa(s)=1+\frac s2$ על $[0,2]$; האורכים שונים, ולכן המסילות אינן חופפות.
  remedy: { lesson: '2.4', anchor: 'arc-length-needed', label: 'מה המשפט אינו אומר: הפרמטר' }

- id: MC-c2-theorem-allows-zero-kappa
  title: מפעילים את משפט היחידות כשהעקמומיות מתאפסת
  belief: >-
    המשפט נכון לכל עקמומיות $\kappa\ge0$ רציפה; נקודות שבהן $\kappa=0$ לא מפריעות.
  truth: >-
    בלי $\kappa>0$ השלשה של פרנה לא מוגדרת, ו-$\tau$ לא מוגדר. אם $\kappa=0$ על קטע, המסילה ישרה שם, ואפשר לסובב את
    החלק שאחריו סביב הישר הזה: שתי מסילות עם אותה $\kappa(s)$ ועם $\tau=0$ בכל מקום שבו הוא מוגדר, אחת מישורית ואחת לא.
  remedy: { lesson: '2.4', anchor: 'kappa-positive', label: 'מה המשפט אינו אומר: עקמומיות אפס' }

- id: MC-c2-uniqueness-translation-only
  title: חושבים שהמסילה נקבעת עד כדי הזזה בלבד, או לגמרי
  belief: >-
    שתי מסילות עם אותן $\kappa(s)$ ו-$\tau(s)$ זהות, או נבדלות רק בהזזה.
  truth: >-
    $\kappa$ ו-$\tau$ לא רואים את המיקום ההתחלתי ולא את השלשה ההתחלתית. כל סיבוב והזזה של מסילה שומרים אותן, ולכן
    המשפט נותן יחידות עד כדי סיבוב והזזה, ונקבע לגמרי רק אחרי שבוחרים את $\gamma(s_0)$ ואת השלשה ב-$s_0$.
  remedy: { lesson: '2.4', anchor: 'fundamental', label: 'משפט הקיום והיחידות: הניסוח' }

- id: MC-c2-uniqueness-termwise
  title: מצדיקים את הוכחת היחידות איבר-איבר
  belief: >-
    בהוכחה, $f=\mathbf t\cdot\tilde{\mathbf t}+\mathbf n\cdot\tilde{\mathbf n}+\mathbf b\cdot\tilde{\mathbf b}$ קבועה כי
    כל מכפלה פנימית בה קבועה (השלשות אורתונורמליות); או ש-$f$ קבועה גוררת שהשלשות קבועות.
  truth: >-
    אף מכפלה לא ידועה מראש כקבועה. גוזרים את $f$ ומציבים את משוואות פרנה-סרה של שתי המסילות: ששת האיברים מתבטלים בזוגות,
    כי ל-$\kappa$ ול-$\tau$ אותם ערכים בשתיהן והמטריצה אנטי-סימטרית. מ-$f\equiv3$ וקושי-שוורץ מקבלים שהשלשות שוות זו לזו,
    לא שהן קבועות.
  remedy: { lesson: '2.4', anchor: 'uniqueness', label: 'הוכחת היחידות' }

- id: MC-c2-orthonormality-imposed
  title: חושבים שבהוכחת הקיום צריך לכפות אורתונורמליות בכל נקודה
  belief: >-
    הפתרון של מערכת פרנה-סרה הוא סתם שלושה וקטורים, ובהוכחת הקיום צריך לתקן אותם בגרם-שמידט בכל $s$ כדי לקבל שלשה.
  truth: >-
    אם השלשה ההתחלתית אורתונורמלית, הפתרון נשאר אורתונורמלי מעצמו: המטריצה אנטי-סימטרית, ולכן המכפלות הפנימיות נשמרות
    (למה 2.4.1, שמשתמשת ביחידות של שיעור 0.6). תיקון בגרם-שמידט היה משנה את הפתרון ומקלקל את המשוואות.
  remedy: { lesson: '2.4', anchor: 'existence', label: 'הוכחת הקיום' }
