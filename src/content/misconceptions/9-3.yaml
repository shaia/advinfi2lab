# Misconceptions first detected in lesson 9.3 (projection onto a finite-dimensional subspace, least squares).
- id: MC-c9-projection-any-basis
  title: מטילים בנוסחת המקדמים עם בסיס שאינו אורתונורמלי
  belief: >-
    לכל בסיס $y_1,\dots,y_n$ של $Y$: $P_Yx=\sum\langle x,y_k\rangle y_k$.
  truth: >-
    הנוסחה $P_Yx=\sum\langle x,e_k\rangle e_k$ דורשת בסיס אורתונורמלי. עם הבסיס $1,x$ על $[0,1]$ היא נותנת
    $\frac13+\frac x4$ עבור $x^2$, אבל השגיאה אינה ניצבת ל-1: $\int_0^1\left(x^2-\frac x4-\frac13\right)dx=-\frac18$.
    קודם מפעילים גרם-שמידט.
  remedy: { lesson: '9.3', label: 'ההטלה בעזרת בסיס אורתונורמלי' }

- id: MC-c9-projection-basis-dependent
  title: חושבים שההטלה תלויה בבסיס האורתונורמלי שנבחר
  belief: >-
    שני בסיסים אורתונורמליים שונים של $Y$ נותנים שתי הטלות שונות של אותו וקטור.
  truth: >-
    $P_Yx$ הוא הווקטור היחיד ב-$Y$ שההפרש $x-P_Yx$ ניצב ל-$Y$ (והוא גם הקרוב ביותר ל-$x$ ב-$Y$). זה מאפיין אותו
    בלי שום בסיס, ולכן כל בסיס אורתונורמלי נותן אותה תוצאה.
  remedy: { lesson: '9.3', label: 'ההטלה תלויה רק בתת-המרחב' }

- id: MC-c9-projection-keeps-outside
  title: משאירים בהטלה רכיב שאינו בתת-המרחב
  belief: >-
    ההטלה של $f$ על $Y$ משמיטה רק רכיבים שניצבים לכל הפונקציות, ושאר הרכיבים נשארים.
  truth: >-
    $P_Yf$ שייכת ל-$Y$. רכיב כמו $\cos x$ כשה-$Y$ נפרש על ידי $\sin x,\sin2x$ ניצב ל-$Y$ ולכן נעלם בהטלה כולו.
  remedy: { lesson: '9.3', label: 'ההטלה שייכת לתת-המרחב' }

- id: MC-c9-projection-drop-hidden
  title: מטילים לפי הצורה הכתובה של הפונקציה ולא לפי המכפלות הפנימיות
  belief: >-
    ל-$(1+\cos x)^2=1+2\cos x+\cos^2x$ יש רכיב קבוע 1, כי זה האיבר הקבוע שרואים.
  truth: >-
    הרכיב נקבע מהמכפלה הפנימית: $\cos^2x=\frac12+\frac12\cos2x$ תורם עוד $\frac12$ לקבוע. מחשבים
    $\frac{\langle f,1\rangle}{\|1\|^2}=\frac32$, או קודם כותבים את $f$ בבסיס הנכון.
  remedy: { lesson: '9.3', label: 'חישוב הטלה של פונקציה טריגונומטרית' }

- id: MC-c9-ls-is-uniform
  title: חושבים שהקירוב הטוב ביותר בממוצע ריבועי ממזער גם את השגיאה המקסימלית
  belief: >-
    הישר $x-\frac16$, הקרוב ביותר ל-$x^2$ בנורמה של $C[0,1]$ עם $\int fg$, הוא גם הישר שהשגיאה המקסימלית שלו
    הכי קטנה.
  truth: >-
    כל נורמה נותנת "קרוב ביותר" משלה. השגיאה המקסימלית של $x-\frac16$ היא $\frac16$, ושל $x-\frac18$ היא
    $\frac18$. ההטלה ממזערת את $\int(f-p)^2$ בלבד.
  remedy: { lesson: '9.3', label: 'ריבועים פחותים לעומת שגיאה מקסימלית' }

- id: MC-c9-ls-pointwise
  title: מקרבים לפי ערכים בנקודות במקום לפי האינטגרל
  belief: >-
    הקבוע הקרוב ביותר ל-$x^2$ על $[0,1]$ הוא הערך באמצע, $\frac14$, או ממוצע הערכים בקצוות, $\frac12$; והישר הקרוב
    ביותר הוא זה שעובר דרך הקצוות.
  truth: >-
    הקבוע הקרוב ביותר הוא הממוצע האינטגרלי $\frac{\langle f,1\rangle}{\|1\|^2}=\int_0^1x^2\,dx=\frac13$. הקירוב תלוי
    בכל הערכים של $f$, לא במספר נקודות.
  remedy: { lesson: '9.3', label: 'הקבוע הטוב ביותר הוא הממוצע' }

- id: MC-c9-odd-best-line-zero
  title: חושבים שהישר הטוב ביותר לפונקציה אי-זוגית הוא אפס
  belief: >-
    $x^3$ אי-זוגית על $[-1,1]$, ולכן ההטלה שלה על הישרים מתאפסת.
  truth: >-
    הזוגיות מאפסת רק את הרכיב בכיוון הפונקציה הזוגית 1. הרכיב בכיוון $x$ הוא
    $\frac{\langle x^3,x\rangle}{\|x\|^2}=\frac35$, והישר הקרוב ביותר הוא $\frac35x$.
  remedy: { lesson: '9.3', label: 'זוגיות בריבועים פחותים' }

- id: MC-c9-orthogonal-to-basis-insufficient
  title: חושבים שניצבות לאיברי בסיס אינה מספיקה לניצבות לכל תת-המרחב
  belief: >-
    כדי לבדוק ש-$x-y\perp Y$ צריך לבדוק מכפלה עם כל איבר של $Y$, לא רק עם איברי בסיס.
  truth: >-
    המכפלה הפנימית לינארית: אם $\langle z,y_k\rangle=0$ לכל איבר בסיס, אז
    $\langle z,\sum c_ky_k\rangle=\sum c_k\langle z,y_k\rangle=0$. הבסיס אפילו לא צריך להיות אורתוגונלי.
  remedy: { lesson: '9.3', label: 'בדיקת ניצבות על בסיס' }

- id: MC-c9-higher-degree-worse
  title: חושבים שהעלאת המעלה יכולה להגדיל את המרחק של הקירוב הטוב ביותר
  belief: >-
    הפולינום הטוב ביותר ממעלה 2 יכול להיות רחוק יותר מ-$f$ מהישר הטוב ביותר.
  truth: >-
    הישרים הם חלק מהפולינומים ממעלה עד 2, והמינימום על קבוצה גדולה יותר קטן או שווה. המרחק לא עולה עם המעלה.
  remedy: { lesson: '9.3', label: 'תתי-מרחבים מקוננים' }
