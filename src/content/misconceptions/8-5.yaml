# Misconceptions first detected in lesson 8.5 (the general Stokes theorem and its special cases).
- id: MC-c8-stokes-swapped
  title: מחליפים בין התבנית לנגזרת שלה במשפט סטוקס הכללי
  belief: >-
    $\int_M\omega=\int_{\partial M}d\omega$.
  truth: >-
    $\int_M d\omega=\int_{\partial M}\omega$: על התחום (הגדול) מופיעה הנגזרת, ועל השפה (הקטנה בממד אחד) התבנית
    עצמה. גם הסדרים מתאימים רק כך: $M$ מממד $k$, $\omega$ מסדר $k-1$.
  remedy: { lesson: '8.5', label: 'הניסוח של משפט סטוקס הכללי' }

- id: MC-c8-stokes-degree
  title: לא מתאימים את סדר התבנית לממד של התחום
  belief: >-
    במשפט סטוקס על משטח אפשר לקחת תבנית $\omega$ מכל סדר, למשל מסדר 2.
  truth: >-
    תבנית מסדר $j$ מתבצע עליה אינטגרל רק על עצם מממד $j$. על משטח $M$ (ממד 2) עם שפה מסילה (ממד 1) צריך $\omega$
    מסדר 1, ואז $d\omega$ מסדר 2.
  remedy: { lesson: '8.5', label: 'הניסוח של משפט סטוקס הכללי' }

- id: MC-c8-boundary-orientation
  title: חושבים שכיוון השפה קבוע מראש ולא נקבע מהכיוון של התחום
  belief: >-
    את $\partial M$ תמיד עוברים נגד כיוון השעון כשמסתכלים מלמעלה, ולכן החלפת הפרמטרים של המשטח לא משנה את
    $\int_{\partial M}\omega$.
  truth: >-
    הכיוון של $\partial M$ מושרה מהכיוון של $M$: למשטח $\varphi(D)$ זו התמונה של השפה החיובית של $D$. אם
    $\det$ של ההעתקה שלילי, התמונה עוברת בכיוון ההפוך, ושני האגפים של סטוקס מחליפים סימן יחד.
  remedy: { lesson: '8.5', label: 'הכיוון המושרה על השפה' }

- id: MC-c8-ftc-no-sign
  title: סופרים את שתי נקודות הקצה של קטע בלי סימן
  belief: >-
    במשפט היסודי כמקרה של סטוקס, $\int_{\partial[a,b]}f=f(b)+f(a)$.
  truth: >-
    השפה של $[a,b]$ המכוון היא הנקודה $b$ עם סימן פלוס והנקודה $a$ עם סימן מינוס, ולכן
    $\int_{[a,b]}df=f(b)-f(a)$. הסימן הוא הכיוון של השפה בממד אפס.
  remedy: { lesson: '8.5', label: 'המשפט היסודי כמקרה פרטי' }

- id: MC-c8-special-case-mixup
  title: משייכים את המקרה הפרטי הלא נכון של משפט סטוקס
  belief: >-
    משפט גרין הוא המקרה של תבנית מסדר 2 בתחום מרחבי, או שמשפט גאוס הוא המקרה של תבנית מסדר 1 על משטח.
  truth: >-
    תבנית מסדר 0 על קטע: המשפט היסודי. מסדר 1 על תחום במישור: גרין. מסדר 1 על משטח ב-$\mathbb R^3$: סטוקס. מסדר 2
    על תחום ב-$\mathbb R^3$: גאוס. הממד של $M$ הוא הסדר של $\omega$ ועוד אחד.
  remedy: { lesson: '8.5', label: 'ארבעת המקרים הפרטיים' }
