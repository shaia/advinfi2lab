# Misconceptions first detected in lesson 5.2 (polar, cylindrical and spherical coordinates).
- id: MC-c5-spherical-jacobian
  title: טועים ביעקוביאן הכדורי או במוסכמת הזווית
  belief: >-
    היעקוביאן של הקואורדינטות הכדוריות הוא $\rho\sin\varphi$, או $\rho^2$, או $\rho^2\cos\varphi$; ובספרה
    אפשר לכתוב $\sin$ או $\cos$ של זווית הרוחב, אין הבדל.
  truth: >-
    עם $x=\rho\sin\varphi\cos\theta$, $y=\rho\sin\varphi\sin\theta$, $z=\rho\cos\varphi$ (כש-$\varphi$ נמדדת
    מציר $z$, $0\le\varphi\le\pi$) מתקבל $\left|\frac{\partial(x,y,z)}{\partial(\rho,\varphi,\theta)}\right|=\rho^2\sin\varphi$.
    תיבה קטנה היא בקירוב $d\rho\times\rho\,d\varphi\times\rho\sin\varphi\,d\theta$. אם במקום זה משתמשים
    בזווית רוחב $v=\frac\pi2-\varphi$ (הנמדדת מקו המשווה), הגורם הוא $\rho^2\cos v$.
  remedy: { lesson: '5.2', label: 'היעקוביאן הכדורי מהתיבה הקטנה' }

- id: MC-c5-polar-off-centre
  title: חושבים שבקוטביות כל עיגול הוא רדיוס בין אפס ל-R
  belief: >-
    עיגול תמיד נכתב בקוטביות כ-$0\le r\le R$, $0\le\theta\le2\pi$, גם כשמרכזו אינו בראשית.
  truth: >-
    הקואורדינטות הקוטביות מרוכזות בראשית. העיגול $(x-1)^2+y^2\le1$ הוא $r\le2\cos\theta$ עם
    $-\frac\pi2\le\theta\le\frac\pi2$: גבול ה-$r$ תלוי ב-$\theta$. מציבים את משוואת השפה כדי למצוא אותו.
  remedy: { lesson: '5.2', label: 'עיגול שאינו מרוכז בראשית בקוטביות' }

- id: MC-c5-gauss-forget-root
  title: שוכחים שחישבנו את ריבוע אינטגרל גאוס
  belief: >-
    החישוב בקוטביות נותן $\pi$, ולכן $\int_{-\infty}^{\infty}e^{-x^2}\,dx=\pi$.
  truth: >-
    האינטגרל הכפול הוא $I^2$: $\iint_{\mathbb R^2}e^{-(x^2+y^2)}=\left(\int e^{-x^2}dx\right)^2$ לפי פוביני.
    לכן $I^2=\pi$, וכי $I>0$ מתקבל $I=\sqrt\pi$.
  remedy: { lesson: '5.2', label: 'אינטגרל גאוס: מעלים בריבוע ומוציאים שורש' }

- id: MC-c5-gauss-why-polar
  title: חושבים שקוטביות עוזרות לאינטגרל גאוס כי האינטגרנד נעשה פשוט
  belief: >-
    החישוב עובד כי ל-$e^{-r^2}$ יש פונקציה קדומה אלמנטרית, או פשוט כי האינטגרנד סימטרי.
  truth: >-
    גם ל-$e^{-r^2}$ אין פונקציה קדומה אלמנטרית. מה שעושה את העבודה הוא היעקוביאן $r$: ל-$re^{-r^2}$ יש
    פונקציה קדומה אלמנטרית, $F(r)=-\frac12e^{-r^2}$. הסימטריה רק מאפשרת להפריד את $\theta$.
  remedy: { lesson: '5.2', label: 'אינטגרל גאוס: היעקוביאן הוא הטריק' }

- id: MC-c5-improper-exhaustion
  title: לא מבחינים מתי מותר למצות את המישור בעיגולים
  belief: >-
    אינטגרל לא אמיתי על המישור שווה לגבול על כל משפחה גדלה של תחומים, לכל אינטגרנד; או להפך: כי הוא הוגדר
    על ריבועים, אסור לחשב אותו על עיגולים.
  truth: >-
    לאינטגרנד **אי-שלילי** הגבולות על ריבועים ועל עיגולים שווים, כי $D_R\subseteq Q_R\subseteq D_{R\sqrt2}$
    והאינטגרלים מונוטוניים בתחום. לאינטגרנד שמחליף סימן הגבול עלול להיות תלוי בצורת התחומים, ולכן
    החיוביות היא חלק מההוכחה.
  remedy: { lesson: '5.2', label: 'אינטגרל גאוס: ריבועים מול עיגולים' }

- id: MC-c5-distance-to-axis
  title: מבלבלים בין המרחק מהציר למרחק מהראשית
  belief: >-
    במרחב, $x^2+y^2$ הוא ריבוע המרחק מהראשית, ולכן בכדוריות הוא $\rho^2$.
  truth: >-
    $x^2+y^2$ הוא ריבוע המרחק מציר $z$; בכדוריות הוא $\rho^2\sin^2\varphi$ ובגליליות $r^2$. ריבוע המרחק
    מהראשית הוא $x^2+y^2+z^2=\rho^2$.
  remedy: { lesson: '5.2', label: 'מומנט התמד: מרחק מהציר' }

- id: MC-c5-coordinates-mismatch
  title: בוחרים מערכת קואורדינטות לפי חלק אחד של הבעיה
  belief: >-
    בוחרים קואורדינטות לפי האינטגרנד בלבד או לפי התחום בלבד, למשל כדוריות לכל דבר שמופיע בו
    $x^2+y^2$.
  truth: >-
    בוחרים את המערכת שבה **התחום** נעשה תיבה (או כמעט) **והאינטגרנד** נעשה פשוט, ושוקלים את היעקוביאן.
    גליל מתאים לגליליות, כדור לכדוריות, ותחום שבין ישרים מקבילים להחלפה לינארית.
  remedy: { lesson: '5.2', label: 'בחירת מערכת קואורדינטות' }
