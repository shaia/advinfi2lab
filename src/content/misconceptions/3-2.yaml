# Misconceptions first detected in lesson 3.2 (graphs, level sets and change of parameters).
- id: MC-c3-graph-critical-point
  title: חושבים שגרף אינו רגולרי בנקודה קריטית של הפונקציה
  belief: >-
    במקום שבו $\nabla f=0$ (מקסימום, מינימום, אוכף) הגרף $z=f(x,y)$ אינו משטח רגולרי.
  truth: >-
    לגרף $\sigma(x,y)=(x,y,f(x,y))$ יש $\sigma_x\times\sigma_y=(-f_x,-f_y,1)$, שהרכיב השלישי שלו 1 תמיד. בנקודה קריטית
    המישור המשיק אופקי, אבל הגרף רגולרי.
  remedy: { lesson: '3.2', label: 'גרף של פונקציה חלקה הוא משטח רגולרי' }

- id: MC-c3-level-set-always-surface
  title: חושבים שכל קבוצת רמה של פונקציה חלקה היא משטח חלק
  belief: >-
    לכל $c$ הקבוצה $F^{-1}(c)$ של פונקציה חלקה $F:\mathbb R^3\to\mathbb R$ היא משטח חלק.
  truth: >-
    משפט הפונקציה הסתומה נותן גרף מקומי רק ליד נקודה שבה $\nabla F\ne0$. הקבוצה $x^2+y^2-z^2=0$ היא חרוט כפול, שאינו
    משטח חלק בקודקוד, ו-$x^2+y^2+z^2=0$ היא נקודה אחת.
  remedy: { lesson: '3.2', label: 'קבוצת רמה של ערך רגולרי' }

- id: MC-c3-surface-must-be-connected
  title: חושבים שמשטח חייב להיות קשיר
  belief: >-
    ההיפרבולואיד בשתי יריעות, $x^2+y^2-z^2=-1$, אינו משטח, כי הוא מורכב משני חלקים נפרדים.
  truth: >-
    משטח חלק מוגדר **מקומית**: כל נקודה צריכה סביבה שהיא גרף חלק. שני חלקים נפרדים, כל אחד חלק, הם משטח חלק. ל-$c=-1$
    הגרדיאנט $(2x,2y,-2z)$ אינו מתאפס על הקבוצה.
  remedy: { lesson: '3.2', label: 'קבוצת רמה של ערך רגולרי' }

- id: MC-c3-always-graph-over-xy
  title: חושבים שמשטח רמה הוא תמיד גרף מעל המישור xy
  belief: >-
    ליד כל נקודה של משטח רמה פותרים את $F=c$ עבור $z$; ואם אי אפשר לפתור עבור $z$, המשטח אינו גרף בכלל.
  truth: >-
    המשפט פותר עבור משתנה **שהנגזרת החלקית לפיו אינה אפס** בנקודה. ב-$(1,0,0)$ על $x^2+y^2-z^2=1$ מתקיים $F_z=0$
    ו-$F_x=2$, ולכן ליד הנקודה המשטח הוא גרף $x=g(y,z)$, אף שאינו גרף מעל $xy$.
  remedy: { lesson: '3.2', label: 'איזה משתנה פותרים' }

- id: MC-c3-regular-value-necessary
  title: חושבים שערך רגולרי הוא תנאי הכרחי לכך שקבוצת רמה תהיה משטח
  belief: >-
    אם $c$ אינו ערך רגולרי של $F$, הקבוצה $F^{-1}(c)$ אינה משטח חלק.
  truth: >-
    ערך רגולרי הוא תנאי **מספיק**. ל-$F(x,y,z)=z^2$ הקבוצה $F^{-1}(0)$ היא המישור $z=0$, משטח חלק, אף ש-$\nabla F=(0,0,2z)$
    מתאפס בכל נקודה שלה.
  remedy: { lesson: '3.2', label: 'מספיק, לא הכרחי' }

- id: MC-c3-chain-rule-reparam
  title: מפעילים את כלל השרשרת הפוך בהחלפת פרמטרים
  belief: >-
    אם $\tilde\sigma(s,t)=\sigma(u(s,t),v(s,t))$ אז $\tilde\sigma_s=\sigma_u\frac{\partial s}{\partial u}+\sigma_v\frac{\partial s}{\partial v}$,
    או שכל אחת מ-$\tilde\sigma_s,\tilde\sigma_t$ תלויה רק באחת מ-$\sigma_u,\sigma_v$.
  truth: >-
    כלל השרשרת נותן
    $$\tilde\sigma_s=u_s\,\sigma_u+v_s\,\sigma_v,\qquad \tilde\sigma_t=u_t\,\sigma_u+v_t\,\sigma_v,$$
    ולכן $\tilde\sigma_s\times\tilde\sigma_t=\det(D\varphi)\,\sigma_u\times\sigma_v$.
  remedy: { lesson: '3.2', label: 'החלפת פרמטרים וכלל השרשרת' }

- id: MC-c3-reparam-keeps-normal-direction
  title: חושבים שהחלפת פרמטרים לא יכולה להפוך את כיוון הנורמל
  belief: >-
    הנורמל היחידה $\hat{\mathbf N}$ הוא תכונה של המשטח, ולכן כל פרמטריזציה נותנת אותו וקטור (למשל, בספרה תמיד החוצה).
  truth: >-
    $\tilde\sigma_s\times\tilde\sigma_t=\det(D\varphi)\,\sigma_u\times\sigma_v$. כש-$\det(D\varphi)<0$ (למשל כשמחליפים בין
    $u$ ל-$v$) הנורמל היחידה מתהפך. רק **הישר** הנורמלי אינו תלוי בפרמטריזציה; הכיוון עליו הוא בחירה.
  remedy: { lesson: '3.3', label: 'הנורמל בשתי פרמטריזציות של הספרה' }

- id: MC-c3-bijective-is-reparam
  title: חושבים שכל העתקה חלקה וחד-חד-ערכית ועל היא החלפת פרמטרים
  belief: >-
    אם $\varphi$ חלקה, חד-חד-ערכית ועל, אז $\sigma\circ\varphi$ היא פרמטריזציה רגולרית בכל מקום שבו $\sigma$ רגולרית.
  truth: >-
    החלפת פרמטרים צריכה הופכית **חלקה**, ואז $\det(D\varphi)\ne0$. $\varphi(s,t)=(s^3,t)$ חלקה, חד-חד-ערכית ועל, אבל
    $\det(D\varphi)=3s^2$ מתאפס ב-$s=0$, ושם $\sigma\circ\varphi$ אינה רגולרית.
  remedy: { lesson: '3.2', label: 'מהי החלפת פרמטרים' }

- id: MC-c3-canonical-parametrization
  title: חושבים שלמשטח יש פרמטריזציה טבעית אחת
  belief: >-
    לכל משטח יש פרמטריזציה "נכונה" אחת, ולכן מותר להגדיר מושג גאומטרי בעזרתה בלי לבדוק תלות בפרמטריזציה.
  truth: >-
    המשטח הוא **הקבוצה**. לאותה קבוצה יש אינסוף פרמטריזציות, וגודל שמשתנה כשמחליפים פרמטריזציה מתאר את הקואורדינטות,
    לא את המשטח. לכן כל הגדרה בקורס נבדקת מול החלפת פרמטרים.
  remedy: { lesson: '3.2', label: 'למה הכול צריך להיות בלתי תלוי בפרמטריזציה' }

- id: MC-c3-partials-are-geometric
  title: חושבים שהנגזרות החלקיות ואורך המכפלה הווקטורית הם גדלים של המשטח
  belief: >-
    הווקטור $\sigma_u$, האורך $\|\sigma_u\times\sigma_v\|$ או המקדמים $E,F,G$ בנקודה הם תכונות של המשטח באותה נקודה.
  truth: >-
    כולם משתנים בהחלפת פרמטרים: ב-$\tilde\sigma(s,t)=\sigma(2s,t)$ מתקבל $\tilde\sigma_s=2\sigma_u$, האורך
    $\|\tilde\sigma_s\times\tilde\sigma_t\|$ גדל פי 2 ו-$\tilde E=4E$. בלתי תלויים הם המישור המשיק, הישר הנורמלי, ואורכים
    וזוויות של מסילות.
  remedy: { lesson: '3.2', label: 'מה משתנה בהחלפת פרמטרים' }
