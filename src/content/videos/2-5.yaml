  why: >-
    לפי תיאור הסרטון: ארבעה תנאים שקולים לסליל (מוכלל): וקטור יחידה קבוע שיוצר זווית קבועה עם המשיק, נורמל ראשי
    שניצב לכיוון הקבוע, יחס קבוע בין העקמומיות לפיתול, ומכפלה משולשת של הנגזרות השנייה, השלישית והרביעית שמתאפסת. זה
